<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Flightglass · Connections</title>
  <meta name="description" content="Explore how Flightglass parameters shape one another.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2307060C'/%3E%3Cpath d='M13 36c10-20 23-20 38-8' fill='none' stroke='%239D8BFF' stroke-width='5' stroke-linecap='round'/%3E%3Ccircle cx='48' cy='28' r='5' fill='%23F470B8'/%3E%3C/svg%3E">
  <script src="./sa-view-transition-guard.js"></script>
  <link rel="stylesheet" href="./sa-p3.css">
  <!-- Presentation is owned by the canonical P3 sheet and the page-specific system layer. -->
  <link rel="stylesheet" href="./connections.css">
</head>
<body class="sa-depth" data-sa-route="connections">
  <main class="app" aria-label="Flightglass connections">
    <header class="topbar">
      <a class="icon-btn sa-focus" id="back" href="./index.html" aria-label="Back to home">
        <svg width="20" height="20" viewBox="0 0 20 20" aria-hidden="true"><path d="M12.8 4.2 7 10l5.8 5.8" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="title-block"><div class="eyebrow">System map</div><h1>Connections</h1></div>
      <button class="reset sa-focus" id="reset">Reset</button>
    </header>

    <div class="instruction"><span>Tap a parameter. Read its relative signal.</span><strong id="status">Causes</strong></div>

    <div class="segment" role="group" aria-label="Relationship direction">
      <button class="sa-focus" type="button" id="causes" aria-pressed="true">What shapes it</button>
      <button class="sa-focus" type="button" id="effects" aria-pressed="false">What it shapes</button>
    </div>

    <section class="network-shell" aria-label="Interactive parameter network">
      <div class="map-stage" id="stage">
        <svg class="edge-layer" id="edges" aria-hidden="true"></svg>
        <div id="labels" aria-hidden="true"></div>
        <div id="nodes"></div>
      </div>
      <div class="legend" aria-label="Connection and relative influence legend">
        <div class="legend-row">
          <span class="key direct"><i></i>Direct</span>
          <span class="key coupled"><i></i>Coupled / varies</span>
          <span class="key modeled"><i></i>Modeled</span>
        </div>
        <div class="legend-row signal-scale" aria-label="Relative influence here, from lower to higher">
          <span class="legend-title">Relative here</span>
          <span class="influence-taper" aria-hidden="true"></span>
          <span class="scale-labels"><span>Lower</span><span>Higher</span></span>
        </div>
      </div>
    </section>

    <aside class="detail" id="detail">
      <div class="detail-meta"><span class="role" id="role">Studio-derived · Range input</span><span class="direction-badge" id="direction">What shapes it</span></div>
      <h2 id="detail-title">Attack Angle</h2>
      <ul id="detail-list"></ul>
    </aside>
    <p class="sr-only" id="live-status" aria-live="polite" aria-atomic="true"></p>
  </main>

  <div class="rotate-hint" role="status" aria-live="polite">
    <span aria-hidden="true">↻</span>
    <strong>Rotate your phone to portrait</strong>
    <small>Connections is designed as a vertical map.</small>
  </div>

  <script>
    const groups = [
      {id:'geometry',label:'Geometry',nodes:['plane','direction','lowpoint','ballposition','archeight']},
      {id:'delivery',label:'Delivery',nodes:['attack','path','face','loft','speed','strike']},
      {id:'separation',label:'Separation',nodes:['spinloft','spinaxis','launchdir','launchangle','ballspeed']},
      {id:'flight',label:'Flight',nodes:['backspin','curve','apex','carry']},
      {id:'landing',label:'Landing',nodes:['landingangle','side','total']}
    ];

    const info = {
      plane:{label:'Swing Plane',role:'Geometry input · Studio',note:'The tilted surface that turns circular motion into delivery.'},
      direction:{label:'Swing Direction',role:'Geometry input · Studio',note:'The direction the swing plane points through the target frame.'},
      lowpoint:{label:'Low Point',role:'Geometry input · Studio',note:'Where the swing arc reaches its bottom relative to the ball.'},
      ballposition:{label:'Ball Position',role:'Geometry input · Studio',note:'Places the ball earlier or later along the club’s arc.'},
      archeight:{label:'Arc Height',role:'Geometry input · Studio',note:'Moves the arc vertically and changes where the club meets the ball.'},
      attack:{label:'Attack Angle',role:'Studio-derived · Range input',note:'The clubhead’s vertical direction at impact.'},
      path:{label:'Club Path',role:'Studio-derived · Range input',note:'The clubhead’s horizontal direction through impact.'},
      face:{label:'Club Face',role:'Range input · Delivery',note:'Where the face points when the ball leaves the club.'},
      loft:{label:'Dynamic Loft',role:'Range input · Delivery',note:'The loft delivered by the face at impact.'},
      speed:{label:'Club Speed',role:'Range input · Energy',note:'The clubhead’s available energy before impact.'},
      strike:{label:'Strike',role:'Derived in Studio · Contact',note:'Where and how cleanly the club meets the ball.'},
      spinloft:{label:'Spin Loft',role:'Derived · Separation',note:'The gap between the club’s motion and delivered loft.'},
      spinaxis:{label:'Spin Axis',role:'Derived · Separation',note:'The tilt created by the face and path relationship.'},
      launchdir:{label:'Launch Direction',role:'Derived · Separation',note:'The ball’s starting direction immediately after impact.'},
      launchangle:{label:'Launch Angle',role:'Derived · Separation',note:'The ball’s starting height direction after impact.'},
      ballspeed:{label:'Ball Speed',role:'Derived · Separation',note:'The speed transferred to the ball at separation.'},
      backspin:{label:'Backspin',role:'Modeled · Flight',note:'The spin that shapes lift, height and descent.'},
      curve:{label:'Curve',role:'Modeled · Flight',note:'Sideways movement created during the airborne flight.'},
      apex:{label:'Apex',role:'Modeled · Flight',note:'The highest point reached by the modeled flight.'},
      carry:{label:'Carry',role:'Modeled · Flight',note:'The airborne distance to the modeled landing point.'},
      landingangle:{label:'Landing Angle',role:'Modeled · Landing',note:'In this model, vertical Spin Loft is the primary descent input; treat that as modeled context.'},
      side:{label:'Carry Side',role:'Modeled · Landing',note:'Where the ball finishes sideways at the carry point.'},
      total:{label:'Total',role:'Modeled · Landing',note:'The modeled finish after carry and ground response.'}
    };

    const nodeColors = {
      plane:'var(--q-plane)',
      direction:'var(--q-path)',
      lowpoint:'var(--q-attack)',
      ballposition:'var(--q-ball)',
      attack:'var(--q-attack)',
      path:'var(--q-path)',
      face:'var(--q-face)',
      loft:'var(--q-loft)',
      strike:'var(--q-strike)',
      launchangle:'var(--q-launch)'
    };

    // Qualitative levels describe role prominence inside this model, not percentages.
    // Coupled geometry is explicitly variable/unranked. Keeping all levels in edge
    // metadata lets sensitivity data replace them later without changing the UI.
    const links = [
      ['ballposition','lowpoint','direct','primary'],
      ['lowpoint','attack','direct','primary'],['direction','attack','direct','contributing'],['plane','attack','direct','contextual'],['path','attack','coupled','variable'],
      ['direction','path','direct','primary'],['lowpoint','path','direct','contributing'],['plane','path','direct','contextual'],['lowpoint','strike','direct','primary'],['archeight','strike','direct','contributing'],
      ['attack','spinloft','direct','primary'],['loft','spinloft','direct','primary'],['face','spinaxis','direct','primary'],['path','spinaxis','direct','primary'],['attack','spinaxis','direct','contextual'],['loft','spinaxis','direct','contextual'],
      ['face','launchdir','direct','primary'],['path','launchdir','direct','contributing'],['loft','launchdir','direct','contextual'],['attack','launchangle','direct','contributing'],['loft','launchangle','direct','primary'],
      ['speed','ballspeed','direct','primary'],['spinloft','ballspeed','direct','contributing'],['spinloft','backspin','direct','primary'],['speed','backspin','direct','contributing'],
      ['spinaxis','curve','modeled','primary'],['launchangle','apex','modeled','primary'],['ballspeed','apex','modeled','contributing'],
      ['launchangle','carry','modeled','contextual','low-launch-only'],['ballspeed','carry','modeled','primary'],
      ['spinloft','landingangle','modeled','primary'],['launchdir','side','modeled','primary'],['curve','side','modeled','contributing'],['carry','side','modeled','contextual'],
      ['carry','total','modeled','primary'],['landingangle','total','modeled','contributing']
    ].map(([from,to,kind,strength,condition],i)=>({from,to,kind,strength,condition,id:`e${i}`}));

    const attackBullets = {
      causes:[
        'Primary: Low Point places impact on the arc.',
        'Supports: Swing Direction shapes vertical delivery.',
        'Varies: Plane is contextual; Path stays coupled.'
      ],
      effects:[
        'Primary: it changes the gap to delivered loft.',
        'Supports: it helps shape Launch Angle.',
        'Varies: Spin Axis depends on the wider delivery.'
      ]
    };

    const stage = document.getElementById('stage');
    const svg = document.getElementById('edges');
    const nodeHost = document.getElementById('nodes');
    const labelHost = document.getElementById('labels');
    const nodeEls = new Map();
    let selected = 'attack';
    let mode = 'causes';
    let routeEdges = new Set();
    let routeNodes = new Set();
    let routeNodeStrength = new Map();
    let liveTimer = 0;
    const strengthRank = {variable:0,contextual:1,contributing:2,primary:3};

    groups.forEach((group,groupIndex)=>{
      const label=document.createElement('div');label.className='layer-label';label.textContent=group.label;label.dataset.group=group.id;labelHost.append(label);
      group.nodes.forEach(id=>{
        const button=document.createElement('button');
        button.type='button';button.className='node sa-focus';button.dataset.id=id;button.dataset.group=group.id;
        button.style.setProperty('--node-color',nodeColors[id]||'var(--secondary)');
        button.setAttribute('aria-label',`${info[id].label}, ${group.label}`);
        button.setAttribute('aria-pressed','false');
        button.innerHTML=`<span>${info[id].label}</span>`;
        button.addEventListener('click',()=>selectNode(id));
        nodeHost.append(button);nodeEls.set(id,button);
      });
    });

    function layout(){
      const width=stage.clientWidth,height=stage.clientHeight;
      svg.setAttribute('viewBox',`0 0 ${width} ${height}`);
      svg.setAttribute('width',width);svg.setAttribute('height',height);
      const top=24,bottom=25,rowGap=(height-top-bottom)/(groups.length-1);
      groups.forEach((group,gi)=>{
        const y=top+gi*rowGap;
        const label=labelHost.querySelector(`[data-group="${group.id}"]`);label.style.top=`${y}px`;
        const left=76,right=width-30,span=right-left;
        group.nodes.forEach((id,index)=>{
          const count=group.nodes.length;
          const x=count===1?left+span/2:left+(span*index/(count-1));
          const el=nodeEls.get(id);el.style.left=`${x}px`;el.style.top=`${y}px`;
          const visualWidth=Math.max(44,Math.min(62,span/Math.max(count-1,1)-2));
          el.style.width=`${visualWidth}px`;el.style.setProperty('--label-w',`${Math.max(48,visualWidth+7)}px`);
        });
      });
      drawEdges();
    }

    function point(id){const el=nodeEls.get(id);return{x:el.offsetLeft,y:el.offsetTop};}
    function curve(a,b,offset=0){
      const dy=b.y-a.y, bend=Math.max(18,Math.abs(dy)*.44);
      if(Math.abs(dy)<8){const lift=20+Math.abs(b.x-a.x)*.12;return`M ${a.x} ${a.y+offset} C ${a.x} ${a.y-lift+offset}, ${b.x} ${b.y-lift+offset}, ${b.x} ${b.y+offset}`;}
      return`M ${a.x+offset} ${a.y+7} C ${a.x+offset} ${a.y+bend}, ${b.x+offset} ${b.y-bend}, ${b.x+offset} ${b.y-7}`;
    }
    function addPath(link,cls,d){const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('class',cls);p.dataset.edge=link.id;p.dataset.strength=link.strength;svg.append(p);}
    function drawEdges(){
      svg.innerHTML='';
      links.forEach((link,index)=>{
        const a=point(link.from),b=point(link.to);
        const active=routeEdges.has(link.id),faded=selected&&!active;
        const strengthClass=`strength-${link.strength}`;
        if(link.kind==='coupled'){
          addPath(link,`edge coupled ${strengthClass} ${active?'active':''} ${faded?'faded':''}`,curve(a,b,-1.7));
          addPath(link,`edge coupled ${strengthClass} ${active?'active':''} ${faded?'faded':''}`,curve(a,b,1.7));
        }else addPath(link,`edge ${link.kind} ${strengthClass} ${active?'active':''} ${faded?'faded':''}`,curve(a,b));
        const ambient=!selected&&index%6===1;
        addPath(link,`signal ${link.kind} ${strengthClass} ${active?'active':''} ${ambient?'ambient':''}`,curve(a,b));
      });
    }

    function connectionsFor(id,direction){
      return links
        .filter(link=>link.kind==='coupled'?(link.from===id||link.to===id):(direction==='causes'?link.to===id:link.from===id))
        .map(link=>({link,next:link.kind==='coupled'?(link.from===id?link.to:link.from):(direction==='causes'?link.from:link.to)}))
        .sort((a,b)=>strengthRank[b.link.strength]-strengthRank[a.link.strength]);
    }

    function buildRoute(id,direction){
      const nodes=new Set([id]),edges=new Set(),nodeStrength=new Map(),queue=[{id,depth:0}];
      while(queue.length&&nodes.size<7){
        const item=queue.shift();if(item.depth>=2)continue;
        const candidates=connectionsFor(item.id,direction);
        for(const {link,next} of candidates){
          if(nodes.size>=7&&!nodes.has(next))break;
          edges.add(link.id);
          const previous=nodeStrength.get(next);
          if(!previous||strengthRank[link.strength]>strengthRank[previous])nodeStrength.set(next,link.strength);
          if(!nodes.has(next)){nodes.add(next);queue.push({id:next,depth:item.depth+1});}
        }
      }
      return{nodes,edges,nodeStrength};
    }

    function selectNode(id){selected=id;update();}
    function setMode(next){mode=next;document.getElementById('causes').setAttribute('aria-pressed',String(mode==='causes'));document.getElementById('effects').setAttribute('aria-pressed',String(mode==='effects'));update();}
    function resetMap(){selected=null;routeNodes=new Set();routeEdges=new Set();routeNodeStrength=new Map();update();}

    function strengthSummary(id,direction){
      const candidates=connectionsFor(id,direction);
      if(!candidates.length)return'This is a starting condition in the current model.';
      const words={primary:'Primary',contributing:'Supports',contextual:'Varies',variable:'Varies'};
      const grouped=[];
      for(const {link,next} of candidates){
        const word=words[link.strength];
        let group=grouped.find(item=>item.word===word);
        if(!group){group={word,names:[]};grouped.push(group);}
        group.names.push(`${info[next].label}${link.condition==='low-launch-only'?' when launch is low':''}`);
      }
      return grouped.slice(0,2).map(group=>`${group.word}: ${group.names.slice(0,2).join(' and ')}`).join('. ')+'.';
    }
    function bulletsFor(id){
      if(id==='attack')return attackBullets[mode];
      const semantic=mode==='causes'?'Follow the lit current backward to see what shapes it.':'Follow the lit current forward to see what it shapes.';
      return[info[id].note,strengthSummary(id,mode),semantic];
    }

    function update(){
      if(selected){const route=buildRoute(selected,mode);routeNodes=route.nodes;routeEdges=route.edges;routeNodeStrength=route.nodeStrength;}else{routeNodes=new Set();routeEdges=new Set();routeNodeStrength=new Map();}
      nodeEls.forEach((el,id)=>{
        el.className='node sa-focus';el.setAttribute('aria-pressed',String(id===selected));
        if(!selected)el.classList.add('idle');
        else if(id===selected)el.classList.add('selected');
        else if(routeNodes.has(id)){el.classList.add('linked');el.classList.add(`strength-${routeNodeStrength.get(id)||'contextual'}`);}
        else el.classList.add('unrelated');
      });
      groups.forEach(group=>{const label=labelHost.querySelector(`[data-group="${group.id}"]`);label.classList.toggle('route',!selected||group.nodes.some(id=>routeNodes.has(id)));});
      document.getElementById('status').textContent=selected?`${routeNodes.size} connected`:'Full system';
      const detail=document.getElementById('detail');
      if(selected){
        detail.classList.remove('idle-card');
        document.getElementById('role').textContent=info[selected].role;
        document.getElementById('detail-title').textContent=info[selected].label;
        document.getElementById('direction').textContent=mode==='causes'?'What shapes it':'What it shapes';
        document.getElementById('detail-list').innerHTML=bulletsFor(selected).map(t=>`<li>${t}</li>`).join('');
      }else{
        detail.classList.add('idle-card');document.getElementById('role').textContent='Complete system';document.getElementById('detail-title').textContent='Everything is connected';document.getElementById('direction').textContent='Tap any node';
        document.getElementById('detail-list').innerHTML='<li>Every verified parameter stays in place.</li><li>Tap one to isolate a cause or effect chain.</li><li>Line styles separate direct, coupled and modeled links.</li>';
      }
      clearTimeout(liveTimer);
      liveTimer=setTimeout(()=>{
        const live=document.getElementById('live-status');
        live.textContent=selected
          ? `${info[selected].label}. ${mode==='causes'?'What shapes it':'What it shapes'}. ${bulletsFor(selected).join(' ')}`
          : 'Full parameter system. Tap any node to inspect its relationships.';
      },800);
      drawEdges();
    }

    document.getElementById('causes').addEventListener('click',()=>setMode('causes'));
    document.getElementById('effects').addEventListener('click',()=>setMode('effects'));
    document.getElementById('reset').addEventListener('click',resetMap);
    document.addEventListener('visibilitychange',()=>document.body.classList.toggle('is-paused',document.hidden));
    new ResizeObserver(layout).observe(stage);
    layout();update();
  </script>
  <script type="module">
    import { lockPortrait } from './sa-orientation.js';
    lockPortrait();
  </script>
</body>
</html>
