<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#07060C" />
<meta name="robots" content="noindex" />
<script src="./sa-view-transition-guard.js"></script>
<title>See the Shot — Live Outcome, Side and Top</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2052%2052'%20fill='none'%3E%3Cpath%20d='M11%2045%20C%2016%2026,%2024%2018,%2035%2015%20M21%2039%20L%2030%2024%20L%2043%2045'%20stroke='%239D8BFF'%20stroke-width='4.2'%20stroke-linecap='round'%20stroke-linejoin='round'/%3E%3Ccircle%20cx='37'%20cy='15'%20r='5.2'%20fill='%23FF8A4D'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="./sa-p3.css" />
<link rel="stylesheet" href="./sa.css" />
<link rel="stylesheet" href="./sa-paywall.css" />
<style>
  /* ══ IMPACT · KAMERA (Økt B) ══════════════════════════════════════
     Én scene, tre kamerastasjoner (design/orders/impact-kamera.md).
     Erstatter DUAL-LENS-layouten + de tre SVG-visningene — beslutning B1
     i docs/systemkontrakt.md §9. Identity-tokens konsumeres fra sa-p3.css;
     null hardkodede fargeverdier her (K4): alt går via tokens/color-mix. */
  :root{
    --panel:color-mix(in srgb, var(--surface) 82%, transparent);
    /* anatomy colours — bound to the ONE HUE · ONE MEANING dictionary */
    --c-face:var(--q-face); --c-path:var(--q-path); --c-loft:var(--q-loft);
    --c-attack:var(--q-attack); --c-launch:var(--q-launch);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;overscroll-behavior:none}
  body{
    background:var(--dusk-scene-bg);
    color:var(--ink);
    font-family:var(--font-ui);
  }
  /* sa-depth setter sin egen body-bakgrunn med høyere spesifisitet enn body{}
     — denne siden eier dusk-scenen (mock-normativ), så den vinner her.
     Grain-laget (body.sa-depth::after) beholdes: det dreper banding i gradienten. */
  body.sa-depth{
    background:var(--dusk-scene-bg);
    -webkit-tap-highlight-color:transparent;
    user-select:none;-webkit-user-select:none;
  }
  .app{position:fixed;inset:0;display:flex;flex-direction:column;overflow:hidden}

  /* ══ TOP STRIP — quiet app chrome; the instrument lives in the dock. ══ */
  .topstrip{
    flex:0 0 auto;position:relative;display:flex;align-items:center;gap:10px;
    box-sizing:border-box;min-height:calc(48px + env(safe-area-inset-top));
    padding:env(safe-area-inset-top) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
    border-bottom:1px solid var(--line);
    background:linear-gradient(180deg, color-mix(in srgb, var(--surface) 66%, transparent), transparent);
  }
  body.sa-shell-ready .topstrip{min-height:max(8px,env(safe-area-inset-top));padding-top:env(safe-area-inset-top);border-bottom-color:color-mix(in srgb,var(--line) 45%,transparent)}
  .ts-back{-webkit-tap-highlight-color:transparent;text-decoration:none;flex:0 0 auto;
    width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;
    color:var(--ink);border:1px solid var(--line);border-radius:9px;
    background:color-mix(in srgb, var(--surface) 50%, transparent);
    view-transition-name:sa-nav;transition:transform .15s,border-color .2s}
  .ts-back:hover{border-color:var(--secondary-line)}
  .ts-back:active{transform:scale(.93)}
  .ts-back:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .speedctl{margin-left:auto;display:flex;align-items:center;gap:4px;padding:2px;
    border:1px solid color-mix(in srgb,var(--secondary) 38%,transparent);border-radius:var(--radius-pill);
    background:color-mix(in srgb,var(--surface) 62%,transparent)}
  .speedctl[hidden]{display:none}
  .speedctl button{appearance:none;width:44px;height:44px;border:0;border-radius:50%;cursor:pointer;
    color:var(--secondary);background:color-mix(in srgb,var(--secondary) 12%,transparent);
    font:700 17px/1 var(--font-ui)}
  .speedctl button:active{background:color-mix(in srgb,var(--secondary) 26%,transparent)}
  .speedctl button:focus-visible,.speedctl output:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .speedctl output{min-width:76px;min-height:44px;display:grid;place-items:center;border-radius:var(--radius-control);
    color:var(--secondary);font:700 13px/1 var(--font-data);font-variant-numeric:tabular-nums}
  body.sa-shell-ready[data-range-lens="side"] .topstrip,
  body.sa-shell-ready[data-range-lens="top"] .topstrip{min-height:calc(48px + env(safe-area-inset-top));
    padding-top:env(safe-area-inset-top)}

  /* ══ SCENE — ett canvas, kamerastyrt ══ */
  .scene{flex:1 1 auto;position:relative;min-height:0;overflow:hidden;isolation:isolate}
  .scene::before{content:"";position:absolute;inset:0;z-index:-2;
    background-image:linear-gradient(180deg,color-mix(in srgb,var(--bg) 18%,transparent),color-mix(in srgb,var(--bg) 72%,transparent)),url('./assets/range-night-3d-33.png');
    background-position:center bottom;background-size:cover;opacity:0;
    transform:scale(1.025);transition:opacity .34s var(--ease),transform 1.1s var(--ease)}
  .scene::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
    background:linear-gradient(90deg,color-mix(in srgb,var(--bg) 70%,transparent) 0%,transparent 38%),
      linear-gradient(0deg,color-mix(in srgb,var(--bg) 76%,transparent) 0%,transparent 42%)}
  .scene[data-lens="outcome"]::before{opacity:.48;transform:scale(1)}
  .scene canvas{position:absolute;top:0;left:0;z-index:1;width:100%;height:var(--range-visual-height,100%);display:block;touch-action:none;cursor:grab}
  .scene canvas:active{cursor:grabbing}

  /* Details are an intentional reading state, never the default dashboard. */
  .outcomeBoard{position:absolute;left:50%;top:64px;z-index:5;width:min(760px,calc(100% - 24px));
    transform:translateX(-50%);display:none;pointer-events:none}
  /* The grouped Details pane renders the selected telemetry set; keep this
     legacy board dormant so the values never appear twice. */
  .outcomeBoardHead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 3px 14px}
  .outcomeBoardHead h1{font:700 13px/1 var(--font-ui);letter-spacing:.14em;color:var(--accent)}
  .outcomeBoardHead span{font:600 8px/1 var(--font-ui);letter-spacing:.1em;color:var(--muted-2)}
  .outcomeGroup{margin-top:11px}
  .outcomeGroup:first-of-type{margin-top:0}
  .outcomeGroupTitle{margin:0 3px 6px;color:var(--muted-2);font:700 8px/1 var(--font-ui);letter-spacing:.16em}
  .outcomeBoard .readouts{display:grid;gap:5px}
  .outcomeBoard #ogDir,.outcomeBoard #ogLaunch{grid-template-columns:repeat(4,minmax(0,1fr))}
  .outcomeBoard #ogDist{grid-template-columns:repeat(5,minmax(0,1fr))}
  .outcomeBoard .chip{min-width:0;padding:7px 7px 6px}
  .outcomeBoard .chip .k{font-size:7.5px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
  .outcomeBoard .chip .v{font-size:14px;white-space:nowrap}

  /* Carry is the permanent outcome anchor. It never yields its left edge to
     the shot; secondary scene actions move around it instead. */
  .carryHero{position:absolute;left:max(12px,env(safe-area-inset-left));top:12px;z-index:5;
    min-width:104px;pointer-events:none;color:var(--ink);font-variant-numeric:tabular-nums}
  .carryHero .num{display:flex;align-items:baseline;gap:3px;
    font:600 40px/.94 var(--font-data);letter-spacing:-.03em;
    text-shadow:0 7px 18px color-mix(in srgb,var(--bg) 78%,transparent)}
  .carryHero .unit{color:var(--muted);font:600 14px/1 var(--font-data);letter-spacing:0}
  .carryHero .label{margin-top:5px;color:var(--muted-2);
    font:600 10px/1 var(--font-data);letter-spacing:.16em}

  /* A settled shot earns the canvas: one conclusion and two supporting facts. */
  .shotBrief{position:absolute;left:max(12px,env(safe-area-inset-left));top:86px;z-index:5;
    width:min(250px,calc(100% - 112px));pointer-events:none}
  .shotBrief[hidden]{display:none}
  .shotLine{margin:0;color:var(--ink);font:650 clamp(16px,4.5vw,21px)/1.14 var(--font-ui);letter-spacing:-.025em}
  .shotLine strong{color:var(--accent);font-weight:700}
  .shotProof{display:flex;gap:12px;margin-top:10px;color:var(--muted);font:600 10px/1 var(--font-data);letter-spacing:.02em}
  .shotProof span{white-space:nowrap}
  .shotProof b{margin-left:4px;color:var(--ink);font-size:12px;font-weight:700}

  /* Lens switch: camera is independent of the active input. */
  .stations{display:grid;grid-template-columns:1fr 1fr 1px 1.28fr;gap:4px;width:100%;margin:0 0 10px;padding:3px;
    border:1px solid color-mix(in srgb,var(--line) 72%,transparent);border-radius:var(--radius-control);
    background:color-mix(in srgb,var(--surface) 36%,transparent)}
  .stdiv{width:1px;height:22px;align-self:center;background:var(--line-strong)}
  .stations button{appearance:none;border:0;background:transparent;color:var(--muted);
    font:700 9.5px/1 var(--font-ui);letter-spacing:.1em;min-height:44px;
    padding:0 10px;border-radius:var(--radius-control);cursor:pointer;position:relative;
    transition:background .25s,color .25s}
  .stations button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .stations button[aria-pressed="true"]{background:var(--secondary-soft);color:var(--secondary)}
  .stations[hidden]{display:none}

  /* Top actions use SVG and true 44 px targets. */
  .pinfab{position:absolute;top:12px;z-index:6;min-width:44px;min-height:44px;
    appearance:none;cursor:pointer;font:700 10px/1 var(--font-ui);letter-spacing:.04em;
    color:var(--secondary);background:var(--panel);border:1px solid color-mix(in srgb, var(--secondary) 45%, transparent);
    border-radius:var(--radius-control);padding:0 12px;display:flex;align-items:center;gap:7px;
    backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    transition:transform .15s,left .24s var(--ease),top .24s var(--ease)}
  .pinfab{right:max(12px,env(safe-area-inset-right))}
  .pinfab[data-side]{right:auto;left:var(--pin-x);top:var(--pin-y)}
  .pinfab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .pinfab:active{transform:scale(.95)}
  .pinfab:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

  /* Compact, centred control deck — no desktop-wide 1400 px sliders. */
  .card{position:absolute;left:50%;width:min(760px,calc(100% - 20px));z-index:6;transform:translateX(-50%);
    bottom:calc(10px + env(safe-area-inset-bottom));
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius-card);
    backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);
    box-shadow:0 18px 46px color-mix(in srgb,var(--bg) 48%,transparent);
    padding:10px 12px 12px;pointer-events:auto}
  .scene[data-range-mode="change"][data-lens="outcome"] .card{
    border-color:color-mix(in srgb,var(--secondary) 28%,var(--line));
    background:linear-gradient(180deg,color-mix(in srgb,var(--surface) 88%,transparent),color-mix(in srgb,var(--plate-solid) 94%,transparent));
    box-shadow:0 22px 54px color-mix(in srgb,var(--bg) 58%,transparent)}
  .panewrap{overflow:visible}
  .panehead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:0 3px 8px}
  .panehead .h-title{color:var(--secondary);font:700 10px/1 var(--font-ui);letter-spacing:.18em}
  .panehead .h-title.live{color:var(--accent)}
  .panelDone{min-height:30px;padding:0 9px;border:1px solid color-mix(in srgb,var(--secondary) 34%,transparent);border-radius:9px;background:transparent;color:var(--secondary);font:700 9px/1 var(--font-ui);letter-spacing:.07em;cursor:pointer}
  .panelDone[hidden]{display:none}
  .panelDone:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .pane{min-height:118px}
  .shotActions{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:stretch}
  .shotAction{min-height:48px;padding:0 16px;border-radius:var(--radius-control);font:700 11px/1 var(--font-ui);letter-spacing:.04em;cursor:pointer}
  .shotAction--primary{border:1px solid color-mix(in srgb,var(--accent) 72%,transparent);background:var(--accent);color:var(--bg);box-shadow:0 10px 24px color-mix(in srgb,var(--accent) 22%,transparent)}
  .shotAction--secondary{border:1px solid var(--line-strong);background:transparent;color:var(--ink)}
  .shotAction:focus-visible,.detailTabs button:focus-visible,.panelBack:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .shotAction:active,.panelBack:active{transform:scale(.98)}
  .detailTabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;margin-bottom:9px}
  .detailTabs button{min-height:40px;padding:0 6px;border:1px solid transparent;border-radius:var(--radius-control);background:transparent;color:var(--muted);font:700 10px/1 var(--font-ui);letter-spacing:.06em;cursor:pointer}
  .detailTabs button[aria-pressed="true"]{border-color:color-mix(in srgb,var(--secondary) 36%,transparent);background:var(--secondary-soft);color:var(--ink)}
  .detailReadouts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}
  .detailReadouts .chip{min-width:0;padding:9px 10px}
  .detailReadouts .chip.read{border-style:solid;border-color:color-mix(in srgb,var(--secondary) 30%,transparent);background:color-mix(in srgb,var(--surface) 82%,transparent)}
  .detailReadouts .chip .k{font-size:10px;letter-spacing:.06em;overflow:hidden;text-overflow:ellipsis}
  .detailReadouts .chip .v{font-size:17px}
  .detailReadouts .chip .delta{display:none}
  .panelBack{width:100%;min-height:42px;margin-top:9px;border:1px solid var(--line);border-radius:var(--radius-control);background:transparent;color:var(--muted);font:700 10px/1 var(--font-ui);letter-spacing:.08em;cursor:pointer}
  .parameterRail{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin-bottom:10px}
  .parameterRail button{--control-color:var(--secondary);appearance:none;min-width:0;min-height:52px;padding:6px 3px 5px;
    display:grid;place-items:center;align-content:center;gap:4px;border:1px solid color-mix(in srgb,var(--control-color) 18%,transparent);
    border-radius:var(--radius-control);color:var(--muted);background:transparent;cursor:pointer}
  .parameterRail button[aria-pressed="true"]{color:var(--ink);background:color-mix(in srgb,var(--control-color) 16%,transparent)}
  .parameterRail button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .paramName{display:flex;align-items:center;justify-content:center;gap:4px;min-width:0;
    font:700 7.5px/1 var(--font-ui);letter-spacing:.06em;white-space:nowrap}
  .paramName::before{content:"";width:5px;height:5px;flex:0 0 auto;border-radius:50%;background:var(--control-color)}
  .paramValue{font:700 12px/1 var(--font-data);font-variant-numeric:tabular-nums;white-space:nowrap}
  .parameterRail button[aria-pressed="true"] .paramValue{color:var(--control-color)}
  .activeControl{--control-color:var(--secondary);--value-pct:50%;--ref-pct:50%;--fill-left:50%;--fill-width:0%;--ghost-pct:50%}
  .controlHead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 4px}
  .controlName{font:700 10px/1 var(--font-ui);letter-spacing:.13em;color:var(--muted)}
  .controlValue{font:700 18px/1 var(--font-data);font-variant-numeric:tabular-nums;color:var(--control-color)}
  .controlBody{display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:7px}
  .stepControl{appearance:none;width:44px;height:44px;border:1px solid var(--line);border-radius:var(--radius-control);
    color:var(--control-color);background:color-mix(in srgb,var(--control-color) 9%,transparent);display:grid;place-items:center;cursor:pointer}
  .stepControl svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;stroke-linecap:round}
  .stepControl:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .controlMeter{position:relative;min-width:0;padding-bottom:16px}
  .railVisual{position:absolute;left:10px;right:10px;top:21px;height:5px;border-radius:var(--radius-pill);
    background:color-mix(in srgb,var(--muted) 22%,transparent);overflow:visible}
  .railVisual::before{content:"";position:absolute;inset:-4px 0;
    background:repeating-linear-gradient(90deg,transparent 0,transparent calc(10% - 1px),color-mix(in srgb,var(--muted) 27%,transparent) calc(10% - 1px),color-mix(in srgb,var(--muted) 27%,transparent) 10%);
    opacity:.5;mask:linear-gradient(transparent 0,black 35%,black 65%,transparent 100%)}
  .railFill{position:absolute;left:var(--fill-left);width:var(--fill-width);top:0;height:100%;border-radius:inherit;background:var(--control-color)}
  .railRef{position:absolute;left:var(--ref-pct);top:-6px;width:2px;height:17px;transform:translateX(-1px);background:var(--ink);opacity:.58}
  .railGhost{position:absolute;left:var(--ghost-pct);top:50%;width:7px;height:7px;border:1px solid var(--muted);border-radius:50%;transform:translate(-50%,-50%);background:var(--plate-solid)}
  .activeControl input[type="range"]{-webkit-appearance:none;appearance:none;position:relative;display:block;width:100%;height:48px;margin:0;
    background:transparent;touch-action:none;cursor:pointer}
  .activeControl input[type="range"]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--radius-control)}
  .activeControl input[type="range"]::-webkit-slider-runnable-track{height:5px;background:transparent}
  .activeControl input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;border-radius:50%;margin-top:-10.5px;
    background:var(--plate-solid);border:3px solid var(--control-color);box-shadow:0 0 0 5px color-mix(in srgb,var(--control-color) 15%,transparent),0 6px 12px color-mix(in srgb,var(--bg) 48%,transparent)}
  .activeControl input[type="range"]::-moz-range-track{height:5px;background:transparent}
  .activeControl input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--plate-solid);border:3px solid var(--control-color)}
  .controlScale{position:absolute;left:10px;right:10px;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
    color:var(--muted-2);font:500 8px/1 var(--font-data);font-variant-numeric:tabular-nums;pointer-events:none}
  .controlScale span:last-child{text-align:right}
  .controlScale #controlReference{color:var(--ink)}
  .controlCause{min-height:12px;margin:6px 4px 0;color:var(--muted-2);font:500 9.5px/1.25 var(--font-ui)}

  /* Restored analytical panes: two wide, truthful controls per camera. */
  .planeSliders{display:grid;gap:11px}
  .sl{--c:var(--secondary);--value-pct:50%;--ref-pct:50%;--fill-left:50%;--fill-width:0%}
  .sl .head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 3px 2px}
  .sl .name{display:flex;align-items:center;gap:7px;color:var(--muted);
    font:700 10px/1 var(--font-ui);letter-spacing:.12em}
  .sl .name i{width:7px;height:7px;border-radius:50%;background:var(--c)}
  .sl .val{color:var(--c);font:700 16px/1 var(--font-data);font-variant-numeric:tabular-nums}
  .slMeter{position:relative;padding-bottom:12px}
  .slMeter .railVisual{left:8px;right:8px;top:19px}
  .sl input[type="range"]{-webkit-appearance:none;appearance:none;position:relative;display:block;width:100%;height:44px;
    margin:0;background:transparent;touch-action:none;cursor:pointer}
  .sl input[type="range"]:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:var(--radius-control)}
  .sl input[type="range"]::-webkit-slider-runnable-track{height:5px;background:transparent}
  .sl input[type="range"]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:26px;height:26px;
    margin-top:-10.5px;border-radius:50%;background:var(--plate-solid);border:3px solid var(--c);
    box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 15%,transparent),0 6px 12px color-mix(in srgb,var(--bg) 48%,transparent)}
  .sl input[type="range"]::-moz-range-track{height:5px;background:transparent}
  .sl input[type="range"]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:var(--plate-solid);border:3px solid var(--c)}
  .slScale{position:absolute;left:8px;right:8px;bottom:0;display:grid;grid-template-columns:1fr auto 1fr;
    color:var(--muted-2);font:500 8px/1 var(--font-data);font-variant-numeric:tabular-nums;pointer-events:none}
  .slScale span:nth-child(2){color:var(--ink)}
  .slScale span:last-child{text-align:right}

  /* ══ READOUT-CHIPS — dashed = avlesning, ingen unntak (ordre §2) ══ */
  .readouts{display:flex;gap:8px;flex-wrap:wrap}
  .chip{border-radius:12px;padding:8px 11px;min-width:74px;flex:1;
    background:color-mix(in srgb, var(--surface) 62%, transparent);
    transition:transform .14s var(--ease),background .14s var(--ease),border-color .14s var(--ease),box-shadow .14s var(--ease)}
  .chip.read{border:1px dashed color-mix(in srgb, var(--q-measure) 40%, transparent)}
  .chip .k{font-size:9px;letter-spacing:.18em;color:var(--muted-2);white-space:nowrap}
  .chip .v{font-size:15px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
  .chip .v em{font-style:normal;font-size:10px;font-weight:500;color:var(--muted)}
  .chip .delta{display:block;min-height:8px;margin-top:3px;color:var(--muted);
    font:600 7.5px/1 var(--font-data);font-variant-numeric:tabular-nums}
  .chip[data-changed="true"]{transform:translateY(-2px);
    border-color:color-mix(in srgb,var(--accent) 78%,transparent);
    background:color-mix(in srgb,var(--accent) 13%,var(--surface));
    box-shadow:0 8px 20px color-mix(in srgb,var(--accent) 16%,transparent)}
  .chip[data-changed="true"] .v{color:var(--accent)}
  /* mini-rad og utfoldet grid trenger mindre typografi enn en generisk chip
     for å unngå avkutting ved fire-i-rad på smale skjermer (mock-presedens) */
  .sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0}

  /* ══ ANNOTASJONSLAGET — etiketter i DOM, geometri i canvas (§5.4/Økt D) ══
     Måle-etiketter i ravfamilien (ordre §3, --q-measure — A10). Laget er
     aria-hidden: #fCarryLive forblir eneste annonseringskanal (§5.4, uendret
     kontrakt) — disse er supplerende visuell detalj, ikke ny data. */
  .annoLabels{position:absolute;top:0;left:0;width:100%;height:var(--range-visual-height,100%);overflow:hidden;pointer-events:none;z-index:4}
  .annoLabel{position:absolute;top:0;left:0;transform:translate(-50%,-50%);
    padding:2px 9px;border-radius:8px;font-size:10.5px;font-weight:600;
    white-space:nowrap;font-variant-numeric:tabular-nums;
    background:color-mix(in srgb, var(--surface) 82%, transparent);
    border:1px solid color-mix(in srgb, var(--q-measure) 30%, transparent);
    color:var(--q-measure)}
  .annoLabel.hot{font-weight:700;
    box-shadow:0 0 8px color-mix(in srgb, var(--q-measure) 55%, transparent)}
  .annoLabel[data-tone="launch"]{color:var(--q-launch);border-color:color-mix(in srgb,var(--q-launch) 34%,transparent)}
  .annoLabel[data-tone="launch"].hot{box-shadow:0 0 8px color-mix(in srgb,var(--q-launch) 55%,transparent)}
  .annoLabel[hidden]{display:none}

  @media (prefers-reduced-motion:reduce){
    .stations button,.pinfab,.scene::before,.chip{transition:none}
    .chip[data-changed="true"]{transform:none;box-shadow:none}
  }
  @media (min-width:780px){.card{padding-inline:16px}}
  @media (max-width:390px){
    .pinfab{padding-inline:10px}.pinfab span{display:none}
    .card{padding-inline:9px}
    .paramName{font-size:7px;letter-spacing:.03em}.paramValue{font-size:11px}
    .shotBrief{top:82px;width:min(228px,calc(100% - 106px))}.shotLine{font-size:16px}.shotProof{gap:8px}
    .outcomeBoard{top:66px}.outcomeBoardHead{margin-bottom:11px}
    .outcomeBoard .chip{padding:6px 5px}.outcomeBoard .chip .k{font-size:6.8px;letter-spacing:.03em}
    .outcomeBoard .chip .v{font-size:12px}.outcomeBoard .chip .v em{font-size:8px}
    .controlCause{display:none}
  }
</style>
</head>
<body class="sa-depth">
  <div class="app">

    <!-- Quiet top chrome. The shared native shell hides this back affordance. -->
    <div class="topstrip">
      <a class="ts-back" href="./index.html" aria-label="Back to menu">
        <svg width="21" height="21" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M15 5 L8 12 L15 19" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <div class="speedctl" id="sideTopSpeed" hidden aria-label="Club speed">
        <button type="button" id="spMinus" aria-label="Decrease club speed">−</button>
        <output id="topSpeedVal" tabindex="0" role="slider" aria-label="Club speed" aria-valuemin="30" aria-valuemax="150" aria-valuenow="90" aria-valuetext="90 mph">90 mph</output>
        <button type="button" id="spPlus" aria-label="Increase club speed">+</button>
      </div>
    </div>

    <!-- ══ SCENE — én scene, tre kamerastasjoner ══ -->
    <main class="scene" id="stage">
      <!-- Kontrakt (docs/systemkontrakt.md §5.4): scenen er aria-hidden (den
           oppdateres hver frame); role="img"+aria-label beholdes på canvas;
           #fCarryLive under er den ENESTE live-regionen. Etiketter hører til
           DOM-laget (Økt D), aldri canvas. -->
      <canvas id="scene" aria-hidden="true" role="img"
        aria-label="Live shot outcome scene with top-down direction and side-on launch views."></canvas>

      <!-- Annotasjonsetiketter (Økt D) — DOM, ikke canvas (§5.4). Samme
           a11y-kontrakt som scenen: aria-hidden, ren visuell detalj. -->
      <div class="annoLabels" id="annoLabels" aria-hidden="true"></div>

      <section class="outcomeBoard" id="outcomeBoard" aria-label="All live shot outcomes">
        <div class="outcomeBoardHead"><h1>LIVE OUTCOME</h1><span>UPDATES INSTANTLY</span></div>
        <div class="outcomeGroup"><h2 class="outcomeGroupTitle">DIRECTION</h2><div class="readouts" id="ogDir"></div></div>
        <div class="outcomeGroup"><h2 class="outcomeGroupTitle">LAUNCH</h2><div class="readouts" id="ogLaunch"></div></div>
        <div class="outcomeGroup"><h2 class="outcomeGroupTitle">DISTANCE</h2><div class="readouts" id="ogDist"></div></div>
      </section>
      <div class="carryHero" id="fCarryStack" aria-hidden="true">
        <div class="num"><span id="fCarryNum">0</span><span class="unit">m</span></div>
        <div class="label">CARRY</div>
      </div>
      <div class="shotBrief" id="shotBrief">
        <p class="shotLine" id="shotLine"></p>
        <div class="shotProof" id="shotProof"></div>
      </div>
      <div class="sr-only" id="fCarryLive" aria-live="polite" aria-atomic="true"></div>

      <button type="button" class="pinfab" id="pinFab" aria-label="Pin comparison">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4Z"/></svg><span>Pin comparison</span>
      </button>
      <div class="sr-only" id="saveShotStatus" role="status" aria-live="polite"></div>

      <!-- Shot reads first. Change and Details are intentional depths; the
           camera is never a second source of physics. -->
      <div class="card" id="panel">
        <div class="stations" id="stseg" role="group" aria-label="Camera station">
          <button type="button" data-s="2" aria-pressed="false">TOP</button>
          <button type="button" data-s="1" aria-pressed="false">SIDE</button>
          <span class="stdiv" aria-hidden="true"></span>
          <button type="button" data-s="0" aria-pressed="false">FLIGHT</button>
        </div>
        <div class="panewrap">
          <div class="panehead"><span class="h-title" id="paneTitle">EDIT INPUT</span><button type="button" class="panelDone" id="rangeDone" hidden>Done</button></div>
          <div class="pane" id="pane"></div>
        </div>
      </div>
    </main>
  </div>

<script type="module">
import { rigAt, buildBasis, project } from './impact-camera.js';
import { RANGE_HOME_FIT, fitZoom, gridStops, lateralStops, dollyRig } from './impact-framing.js';
import { selectOutcome } from './impact-outcome.js';
import { buildAnnotations, placeLabels, cometPoint, MEASURE_KEEPOUT } from './impact-annotate.js';
import haptics from './sa-haptics.js';
import { authorize, consume } from './sa-access.js';
import * as saIap from './sa-iap.js';
import { track } from './sa-analytics.js';

const iapReady = saIap.init();
const showPaywall = async moment => (await import('./sa-paywall.js')).openPaywall(moment);

/* ══ state — docs/systemkontrakt.md §3.1. Parametrene er eneste input-
   sannhet; `station` er kamera, aldri parameter (§3.4): scrub re-solver
   aldri fysikk, parameterendring rører aldri kamera. */
const state = {
  face: 2.0, path: 0.0, attack: 3.0, dynLoft: 24, speed: 90,
  station: 0,            // kontinuerlig 0=OUTCOME · 1=SIDE · 2=TOP (§3.2)
  rangeMode: 'shot',     // shot = read, change = one controlled edit, details = grouped telemetry
  pins: [],              // maks 3, eldste ut
  allMetrics: false,
  collapsed: false,
};

// én forhåndspinnet ghost (ordre §2, default-oppsettet)
const seedParams = { face: -3.0, path: 1.2, attack: 2.5, dynLoft: 24, speed: 90 };
state.pins.push({ params: seedParams, outcome: selectOutcome(seedParams) });

const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const TAU = Math.PI * 2;

/* ══ canvas ══ */
const stage = document.getElementById('stage');
const cv = document.getElementById('scene');
const ctx = cv.getContext('2d');
const editorPanel = document.getElementById('panel');
const pinFab = document.getElementById('pinFab');
const fCarryStack = document.getElementById('fCarryStack');
const fCarryNum = document.getElementById('fCarryNum');
const shotBrief = document.getElementById('shotBrief');
const shotLine = document.getElementById('shotLine');
const shotProof = document.getElementById('shotProof');
const VISUAL_PANEL_GAP = 8;
let W = 0, H = 0;
let resizePending = false;
let overlayMetricsDirty = true;
function resize() {
  const dpr = Math.min(devicePixelRatio || 1, 2);
  const stageRect = stage.getBoundingClientRect();
  const panelRect = editorPanel.getBoundingClientRect();
  const panelSafeHeight = Math.max(1, Math.floor(panelRect.top - stageRect.top - VISUAL_PANEL_GAP));
  const visualHeight = stage.dataset.tracer === 'on' ? panelSafeHeight : stage.clientHeight;
  stage.style.setProperty('--range-visual-height', `${visualHeight}px`);
  W = cv.clientWidth; H = cv.clientHeight;
  const bitmapWidth = Math.max(1, Math.round(W * dpr));
  const bitmapHeight = Math.max(1, Math.round(H * dpr));
  // Assigning either bitmap dimension clears the canvas. Avoid a late
  // ResizeObserver callback blanking a frame whose geometry did not change.
  if (cv.width !== bitmapWidth || cv.height !== bitmapHeight) {
    cv.width = bitmapWidth;
    cv.height = bitmapHeight;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  overlayMetricsDirty = true;
}
function scheduleResize() { resizePending = true; }
addEventListener('resize', scheduleResize);
if ('ResizeObserver' in window) new ResizeObserver(scheduleResize).observe(editorPanel);
resize();

/* ══ farger — kun via tokens (K4). Leses computed én gang; alpha legges
   på programmatisk (ingen fargeverdier hardkodes her). */
const rootStyle = getComputedStyle(document.documentElement);
function tokenRGB(name) {
  const v = rootStyle.getPropertyValue(name).trim();
  let m = v.match(/^#([0-9a-f]{6})$/i);
  if (m) {
    const n = parseInt(m[1], 16);
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  m = v.match(/^#([0-9a-f]{3})$/i);
  if (m) return [...m[1]].map(c => parseInt(c + c, 16));
  m = v.match(/rgba?\(\s*(\d+)[ ,]+(\d+)[ ,]+(\d+)/i);
  if (m) return [+m[1], +m[2], +m[3]];
  return [255, 255, 255]; // ukjent format → ink-nøytral fallback
}
const COL = {
  ink: tokenRGB('--ink'),
  ghost: tokenRGB('--ghost'),
  accent: tokenRGB('--accent'),
  launch: tokenRGB('--q-launch'),
  measure: tokenRGB('--q-measure'),
  grid: tokenRGB('--grid-lav'),
  fog: tokenRGB('--dusk-fog'),
};
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;
// grid-referansetall tegnes i canvas (scenen er aria-hidden; DOM-poolen er
// forbeholdt måle-etiketter med kollisjonskaskade). Font fra typetokenet.
const GRID_FONT = `500 10px ${rootStyle.getPropertyValue('--font-display').trim() || "'Space Grotesk',sans-serif"}`;

/* ══ tegneløkke ══
   Verden er meter, Z-up: +X nedslag, +Y høyre, +Z høyde (§1.4). Alle punkter
   går gjennom impact-camera.js sin project(); å lerpe projiserte 2D-punkter
   er utenfor kontrakten (§5.1/A1). Tekst-etiketter hører til DOM-laget
   (Økt D) — canvasen tegner kun geometri. */
let basis = null;
const P = (x, y, z) => project({ x, y, z }, basis);

function line3(a, b) {
  const pa = P(a[0], a[1], a[2]), pb = P(b[0], b[1], b[2]);
  if (!pa || !pb) return;
  ctx.beginPath(); ctx.moveTo(pa.x, pa.y); ctx.lineTo(pb.x, pb.y); ctx.stroke();
}

// Avrundet rektangel-sti (canvas har ingen innebygd før roundRect bredt støttes).
function chipPath(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

// C — flat 2D distansestripe, tegnet i skjermpiksler nederst på scenen.
// Bevisst UTENFOR 3D-projeksjonen: en lineær linjal 0→siste stopp, med en
// prikk der ballen lander og en hul markør ved apex sin nedslagsposisjon.
function drawDistanceStrip(stops, extent, a) {
  const maxD = stops[stops.length - 1];
  // Legg stripa like OVER dokken, ellers okkluderer bunnpanelet den. Dokken
  // (#panel) er et DOM-overlegg; vi finner toppkanten relativt til scenen.
  const panel = document.getElementById('panel');
  let y = H - 46;
  if (panel && typeof stage !== 'undefined') {
    const st = stage.getBoundingClientRect(), pr = panel.getBoundingClientRect();
    y = Math.min(y, pr.top - st.top - 34);
  }
  const x0 = 24, x1 = W - 24, ww = x1 - x0;
  const px = d => x0 + (Math.max(0, Math.min(d, maxD)) / maxD) * ww;
  ctx.font = GRID_FONT;
  chipPath(x0 - 8, y - 16, ww + 16, 40, 10);
  ctx.fillStyle = rgba(COL.fog, 0.5 * a);
  ctx.fill();
  ctx.strokeStyle = rgba(COL.grid, 0.14 * a); ctx.lineWidth = 1;
  ctx.beginPath(); ctx.moveTo(x0, y); ctx.lineTo(x1, y); ctx.stroke();
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const d of [0, ...stops]) {
    const gx = px(d);
    ctx.strokeStyle = rgba(COL.grid, 0.3 * a);
    ctx.beginPath(); ctx.moveTo(gx, y - 4); ctx.lineTo(gx, y + 4); ctx.stroke();
    ctx.fillStyle = rgba(COL.grid, 0.55 * a);
    ctx.fillText(d === maxD ? d + ' m' : String(d), gx, y + 7);
  }
  // apex sin nedslagsposisjon (≈ halvveis) — hul markør, egen etikett.
  const ax = px(extent / 2);
  ctx.strokeStyle = rgba(COL.measure, 0.8 * a); ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.arc(ax, y, 3.5, 0, TAU); ctx.stroke();
  // landing — fylt aksent-prikk + tall.
  const lx = px(extent);
  ctx.fillStyle = rgba(COL.accent, 0.95 * a);
  ctx.beginPath(); ctx.arc(lx, y, 4.5, 0, TAU); ctx.fill();
  ctx.fillStyle = rgba(COL.accent, 0.95 * a);
  ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
  ctx.fillText(Math.round(extent) + '', lx, y - 8);
}

function drawGrid(s, extent = 200, halfWidth = 0, sideSigned = 0) {
  const topA = clamp(s - 1, 0, 1);
  const sideA = clamp(1 - Math.abs(s - 1), 0, 1);
  const perspA = clamp(1 - s, 0, 1);
  // Rutenettet følger slaget i stedet for å være låst til 50/100/150/200.
  // `span` er hvor langt linjene på tvers må rekke, og `lat` hvilke
  // breddeguider som trengs for å dekke utfallet.
  const stops = gridStops(extent);
  const lat = lateralStops(halfWidth);
  const span = Math.max(150, Math.abs(lat[0]) + 50);
  const reach = stops[stops.length - 1] + 25;
  // tåkebånd langs horisonten — finnes kun i perspektiv (mock drawGrid)
  if (perspA > 0.02) {
    const hy = H * 0.60;
    const g = ctx.createLinearGradient(0, hy - 46, 0, hy + 56);
    g.addColorStop(0, rgba(COL.fog, 0));
    g.addColorStop(0.55, rgba(COL.fog, 0.28 * perspA));
    g.addColorStop(1, rgba(COL.fog, 0));
    ctx.fillStyle = g;
    ctx.fillRect(0, hy - 46, W, 102);
  }
  ctx.lineWidth = 1;
  // nedslagslinjer på tvers (50 m-intervaller) + lengdereferanser (mock drawGrid)
  ctx.font = GRID_FONT;
  for (const x of stops) {
    // In 3D Range, full-width cross-lines read as a horizon floating above the
    // photograph. Keep only a faint depth cue there; SIDE/TOP retain the
    // analytical measurement weight.
    const crossAlpha = 0.025 * perspA + 0.10 * (1 - perspA) + 0.14 * topA;
    ctx.strokeStyle = rgba(COL.grid, crossAlpha);
    line3([x, -span, 0], [x, span, 0]);
    // Etiketten satt like innenfor bredderammen så den følger med når scenen
    // zoomer ut, i stedet for å bli stående på en fast 112 m-kolonne.
    const lp = P(x, Math.min(span - 12, 112), 0);
    if (lp) {
      ctx.fillStyle = rgba(COL.grid, 0.35 + 0.3 * topA);
      ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
      ctx.fillText(String(x), lp.x + 4, lp.y - 2);
    }
  }
  // Sideveis-guider + breddereferanser. Disse blendet tidligere til NULL i
  // FLIGHT (topA=0 der), så den stasjonen sto helt uten målestokk — man kunne
  // ikke lese av hverken lengde eller bredde. Nå holder de en synlig bunn i
  // perspektiv og forsterkes mot TOP.
  const latA = Math.max(0.55 * perspA, topA);
  if (latA > 0.05) {
    for (const y of lat) {
      ctx.strokeStyle = rgba(COL.grid, 0.09 * latA);
      line3([0, y, 0], [reach, y, 0]);
    }
    // Merk bare det ytterste paret, ellers blir TOP full av tall.
    const edge = Math.max(...lat);
    const l = P(12, -edge, 0), r = P(12, edge, 0);
    ctx.fillStyle = rgba(COL.grid, 0.5 * latA);
    ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
    if (l) ctx.fillText(edge + ' L', l.x, l.y);
    if (r) ctx.fillText(edge + ' R', r.x, r.y);
  }
  // Lengdereferanse i FLIGHT — tre kandidater eieren skal velge mellom.
  // Dybden komprimeres kraftig mot horisonten, så en naiv rad distansetall
  // langs senterlinjen stables til en uleselig grøt; derfor disse tre.
  if (perspA > 0.05) {
    if (flightRef === 'gates') {
      // B — distanseporter: en lav vertikal port ved hver stopp, tallet på
      // toppen der perspektivet gir loddrett luft mellom nære og fjerne porter.
      ctx.font = GRID_FONT;
      for (const x of stops) {
        ctx.strokeStyle = rgba(COL.grid, 0.16 * perspA);
        line3([x, 0, 0], [x, 0, 16]);
        const tp = P(x, 0, 16);
        if (tp) {
          ctx.fillStyle = rgba(COL.grid, 0.55 * perspA);
          ctx.textAlign = 'center'; ctx.textBaseline = 'bottom';
          ctx.fillText(x + ' m', tp.x, tp.y - 3);
        }
      }
    } else if (flightRef === 'strip') {
      // C — flat 2D distansestripe nederst, helt utenfor 3D-perspektivet,
      // så dybdekomprimeringen ikke rører lesbarheten.
      drawDistanceStrip(stops, extent, perspA);
    } else {
      // A (standard) — ingen egen lengde-etikett inne i scenen. Lengden bor i
      // hero-tallet øverst (281 m CARRY), og høyden leses av høydestigen.
      // FLIGHT holdes ren: én utfallsbue, én høydeskala, ett tall.
    }
  }
  // Høydeguider (20/40/60 m). Vises i SIDE, og — for variant A — også i
  // FLIGHT, som er den lesbare aksen der: høyde går rett opp på skjermen.
  // Dette er høydestigen; sammen med landingstallet over dekker den både
  // høyde og lengde uten å slåss mot dybdekomprimeringen.
  const heightA = Math.max(sideA, flightRef === 'ladder' ? 0.7 * perspA : 0);
  if (heightA > 0.05) {
    ctx.setLineDash([2, 5]);
    ctx.font = GRID_FONT;
    for (const z of [20, 40, 60]) {
      ctx.strokeStyle = rgba(COL.grid, 0.11 * heightA);
      line3([0, 0, z], [reach, 0, z]);
      // Tallet festet ved det nære enden av linja (x liten), der den er
      // lavest og lengst fra horisonten — lesbart i begge stasjoner.
      const hp = P(4, 0, z);
      if (hp) {
        ctx.fillStyle = rgba(COL.grid, 0.5 * heightA);
        ctx.textAlign = 'left'; ctx.textBaseline = 'bottom';
        ctx.fillText(z + ' m', hp.x + 3, hp.y - 2);
      }
    }
    ctx.setLineDash([]);
  }
  // target-linjen — består alltid, men strekker seg nå forbi nedslaget i
  // stedet for å stoppe på det gamle faste ankeret x≈228.
  ctx.setLineDash([4, 7]);
  ctx.strokeStyle = rgba(COL.grid, 0.32);
  line3([0, 0, 0], [reach, 0, 0]);
  ctx.setLineDash([]);
  // ballen
  const ball = P(0, 0, 0);
  if (ball) {
    ctx.beginPath(); ctx.arc(ball.x, ball.y, 3, 0, TAU);
    ctx.fillStyle = rgba(COL.ink, 0.9); ctx.fill();
  }
}

/* A perspective landing contact patch. The trajectory endpoint is already a
   truthful world-space z=0 point; this screen-space ellipse is only a depth
   cue that makes that contact legible against the photographic fairway. */
function drawLandingContact(outcome, station) {
  const alpha = clamp(1 - station * 1.35, 0, 1);
  if (alpha < 0.04) return;
  const landing = project(outcome.path[outcome.path.length - 1], basis);
  if (!landing) return;
  ctx.save();
  ctx.translate(landing.x, landing.y + 4);
  ctx.scale(1, 0.28);
  const shadow = ctx.createRadialGradient(0, 0, 1, 0, 0, 23);
  shadow.addColorStop(0, rgba(COL.accent, 0.30 * alpha));
  shadow.addColorStop(0.52, rgba(COL.accent, 0.12 * alpha));
  shadow.addColorStop(1, rgba(COL.accent, 0));
  ctx.fillStyle = shadow;
  ctx.beginPath();ctx.arc(0, 0, 23, 0, TAU);ctx.fill();
  ctx.strokeStyle = rgba(COL.accent, 0.62 * alpha);ctx.lineWidth = 1.4;
  ctx.beginPath();ctx.ellipse(0, 0, 15, 15, 0, 0, TAU);ctx.stroke();
  ctx.restore();
  ctx.strokeStyle = rgba(COL.accent, 0.72 * alpha);ctx.lineWidth = 1.3;
  ctx.beginPath();ctx.moveTo(landing.x, landing.y - 2);ctx.lineTo(landing.x, landing.y + 5);ctx.stroke();
}

function tracePath(pts) {
  ctx.beginPath();
  let started = false;
  for (const p of pts) {
    const q = project(p, basis);
    if (!q) { started = false; continue; }
    if (started) ctx.lineTo(q.x, q.y); else { ctx.moveTo(q.x, q.y); started = true; }
  }
}

function drawTraj(outcome, mode) {
  const pts = outcome.path;
  if (mode === 'ghost') {
    tracePath(pts);
    ctx.strokeStyle = rgba(COL.ghost, 0.55);
    ctx.lineWidth = 1.6; ctx.lineCap = 'round'; ctx.stroke();
    const land = project(pts[pts.length - 1], basis);
    if (land) {
      ctx.beginPath(); ctx.arc(land.x, land.y, 3.2, 0, TAU);
      ctx.fillStyle = rgba(COL.ghost, 0.8); ctx.fill();
    }
    return;
  }
  // aktiv bane = skjermens ENE oransje fokal (ordre §2, warm light rule)
  tracePath(pts);
  ctx.strokeStyle = rgba(COL.accent, 0.16);
  ctx.lineWidth = 9; ctx.lineCap = 'round'; ctx.stroke();
  const a = project(pts[0], basis), b = project(pts[pts.length - 1], basis);
  if (a && b) {
    const g = ctx.createLinearGradient(a.x, a.y, b.x, b.y);
    g.addColorStop(0, rgba(COL.ink, 0.95));
    g.addColorStop(0.42, rgba(COL.accent, 0.75));
    g.addColorStop(1, rgba(COL.accent, 1));
    tracePath(pts);
    ctx.strokeStyle = g; ctx.lineWidth = 2.6; ctx.stroke();
  }
  if (b) {
    ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, TAU);
    ctx.strokeStyle = rgba(COL.accent, 1); ctx.lineWidth = 1.6; ctx.stroke();
    ctx.beginPath(); ctx.arc(b.x, b.y, 2.4, 0, TAU);
    ctx.fillStyle = rgba(COL.ink, 1); ctx.fill();
  }
}

/* ══ ANNOTASJONSLAGET (Økt D, ordre §3) — impact-annotate.js gjør ren
   geometri/kaskade; her tegnes primitivene: linjer/buer/bånd i canvas,
   etikett-tekst i DOM (§5.4, samme mønster som geo3d/lowpoint.js#placeLabel). ══ */
function drawAnnotationPrimitives(prims) {
  for (const prim of prims) {
    const tone = prim.tone === 'launch' ? COL.launch : COL.measure;
    switch (prim.kind) {
      case 'band': {
        if (prim.points.length < 3) break;
        const pts = prim.points;
        ctx.beginPath();
        ctx.moveTo(pts[0].x, pts[0].y);
        for (let i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y);
        ctx.closePath();
        const mid = pts[Math.floor(pts.length / 2)];
        const g = ctx.createLinearGradient(pts[0].x, pts[0].y, mid.x, mid.y);
        g.addColorStop(0, rgba(tone, prim.alphaFrom));
        g.addColorStop(1, rgba(tone, prim.alphaTo));
        ctx.fillStyle = g; ctx.fill();
        break;
      }
      case 'tick':
      case 'line': {
        const [a, b] = prim.points;
        ctx.save();
        if (prim.dashed) ctx.setLineDash([5, 6]);
        ctx.strokeStyle = rgba(tone, prim.alpha);
        ctx.lineWidth = prim.hot ? 1.6 : 1;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        ctx.restore();
        break;
      }
      case 'arc': {
        ctx.save();
        if (prim.hot) { ctx.shadowColor = rgba(tone, 1); ctx.shadowBlur = 8; }
        ctx.strokeStyle = rgba(tone, prim.hot ? prim.alpha * 0.85 : prim.alpha * 0.5);
        ctx.lineWidth = prim.hot ? 1.6 : 1;
        ctx.beginPath();
        prim.points.forEach((q, i) => { if (i) ctx.lineTo(q.x, q.y); else ctx.moveTo(q.x, q.y); });
        ctx.stroke();
        if (prim.tick) {
          ctx.beginPath(); ctx.moveTo(prim.tick[0].x, prim.tick[0].y); ctx.lineTo(prim.tick[1].x, prim.tick[1].y); ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.restore();
        break;
      }
      case 'dimline': {
        const [a, b] = prim.points;
        ctx.save();
        if (prim.hot) { ctx.shadowColor = rgba(tone, 1); ctx.shadowBlur = 9; }
        ctx.strokeStyle = rgba(tone, prim.alpha);
        ctx.lineWidth = prim.hot ? 2 : 1.2;
        ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
        const ang = Math.atan2(b.y - a.y, b.x - a.x) + Math.PI / 2, t = 5;
        for (const p of [a, b]) {
          ctx.beginPath();
          ctx.moveTo(p.x - Math.cos(ang) * t, p.y - Math.sin(ang) * t);
          ctx.lineTo(p.x + Math.cos(ang) * t, p.y + Math.sin(ang) * t);
          ctx.stroke();
        }
        ctx.shadowBlur = 0;
        ctx.restore();
        break;
      }
      case 'apex': {
        const dot = prim.points[0];
        ctx.beginPath(); ctx.arc(dot.x, dot.y, 3.4, 0, TAU);
        ctx.fillStyle = rgba(tone, 1); ctx.fill();
        break;
      }
      case 'label': default: break; // ren DOM-etikett, ingen canvas-geometri
    }
  }
}

// DOM-etikett-pool — gjenbrukte noder (unngår innerHTML-churn per frame, §5.4/K6).
const annoLabelsEl = document.getElementById('annoLabels');
const annoPool = [];
function renderAnnotationLabels(placed) {
  let n = 0;
  for (const prim of placed) {
    if (!prim.label || !prim.labelPos) continue;
    let el = annoPool[n];
    if (!el) { el = document.createElement('div'); el.className = 'annoLabel'; annoLabelsEl.appendChild(el); annoPool[n] = el; }
    el.hidden = false;
    el.textContent = prim.label;
    el.style.transform = `translate(${prim.labelPos.x}px,${prim.labelPos.y}px) translate(-50%,-50%)`;
    el.style.opacity = prim.alpha != null ? String(clamp(prim.alpha, 0, 1)) : '1';
    el.classList.toggle('hot', !!prim.hot);

  for (let i = n; i < annoPool.length; i++) annoPool[i].hidden = true;
}

function drawComet(worldPt, basis) {
  const p = project(worldPt, basis);
  if (!p) return;
  const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16);
  g.addColorStop(0, rgba(COL.ink, 0.95));
  g.addColorStop(0.35, rgba(COL.accent, 0.58));
  g.addColorStop(1, rgba(COL.accent, 0));
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(p.x, p.y, 16, 0, TAU); ctx.fill();
  ctx.beginPath(); ctx.arc(p.x, p.y, 2.6, 0, TAU);
  ctx.fillStyle = rgba(COL.ink, 1); ctx.fill();
}

// ── hot-state (ordre §3 "Hot-state") — hvilken kontroll som nettopp ble

let hotKey = null;

/* ══ Camera lenses — Outcome is the default cause/effect surface. SIDE/TOP
   retain their analytical cameras. Camera never mutates impact inputs. ══ */
let stationTarget = 0;
let scrubbing = false;

const segButtons = [...document.querySelectorAll('#stseg button')];
const sideTopSpeed = document.getElementById('sideTopSpeed');
function syncSeg() {
  const snapped = Math.round(stationTarget);
  for (const b of segButtons) b.setAttribute('aria-pressed', String(+b.dataset.s === snapped && !scrubbing));
  const lens = snapped === 0 ? 'outcome' : snapped === 1 ? 'side' : 'top';
  stage.dataset.lens = lens;
  stage.dataset.rangeMode = state.rangeMode;
  // A settled shot must show the flight. Details deliberately frees the canvas
  // for reading; Change retains the camera trace as immediate visual proof.
  stage.dataset.tracer = state.rangeMode === 'details' ? 'off' : 'on';
  document.body.dataset.rangeLens = lens;
  sideTopSpeed.hidden = state.rangeMode !== 'change' || snapped === 0;
  document.getElementById('stseg').hidden = state.rangeMode !== 'change';
  scheduleResize();
}
function setStation(s, animate = true) {
  // Camera lenses belong to the focused experiment. Programmatic callers get
  // the same transition as a person who taps Change input before choosing a lens.
  if (state.rangeMode !== 'change') setRangeMode('change');
  stationTarget = clamp(s, 0, 2);
  if (!animate || reduceMotion) state.station = stationTarget;
  syncSeg();
  const snapped = Math.round(stationTarget);

  // The lens and editor footprint changed synchronously. Resize before the
  // next paint so no frame can reuse the full-height Outcome canvas behind the
  // Side/Top input panel under a busy WebKit or Chromium event loop.
  resizePending = false;

}
for (const b of segButtons) b.addEventListener('click', () => setStation(+b.dataset.s));

function pct(v, d) { return ((clamp(v, d.min, d.max) - d.min) / (d.max - d.min)) * 100; }
function syncActiveControl() {
  if (!activeControl) return;
  const d = SLDEF[activeParam];

  const valuePct = pct(value, d), refPct = pct(d.ref, d), ghostPct = pct(seedParams[activeParam], d);
  activeControl.style.setProperty('--value-pct', valuePct + '%');

  activeControl.style.setProperty('--fill-left', Math.min(valuePct, refPct) + '%');
  activeControl.style.setProperty('--fill-width', Math.abs(valuePct - refPct) + '%');
  const input = activeControl.querySelector('input');
  if (input && +input.value !== value) input.value = String(value);
  if (input) input.setAttribute('aria-valuetext', d.fmt(value));

  if (output) {
    output.textContent = d.fmt(value);
    output.setAttribute('aria-valuenow', String(value));

function syncParameterButtons() {

  output.setAttribute('aria-valuetext', `${Math.round(state.speed)} mph`);
}

function beginOutcomeInteraction() {
  if (!interactionBaselineOutcome) interactionBaselineOutcome = selectOutcome(state);
  clearTimeout(interactionSettleTimer);
}

function settleOutcomeInteraction() {
  clearTimeout(interactionSettleTimer);
  interactionSettleTimer = setTimeout(() => {
    interactionBaselineOutcome = null;
    renderMetricChips(selectOutcome(state));
  }, 650);
}

function setParamValue(key, raw) {
  const d = SLDEF[key];
  const decimals = d.step < 1 ? 1 : 0;
  const next = clamp(Number(Number(raw).toFixed(decimals)), d.min, d.max);
  const previous = state[key];
  if (next !== previous) {
    beginOutcomeInteraction();
    const detent = key === 'speed' ? 5 : 1;
    if (Math.floor((previous - d.min) / detent) !== Math.floor((next - d.min) / detent)) {
      haptics.tick(`range-${key}`);
    }
  }
  state[key] = next;
  if (key === 'speed') pulseHot('speed');
  syncAllInputUI();
  settleOutcomeInteraction();
}

function bindHold(btn, dir, fixedKey = null) {
  let delay = null, repeat = null;
  const end = () => { clearTimeout(delay); clearInterval(repeat); delay = repeat = null; };
  btn.addEventListener('pointerdown', e => {
    e.stopPropagation(); btn.setPointerCapture(e.pointerId);
    const key = fixedKey || activeParam;
    const step = SLDEF[key].step;
    setParamValue(key, state[key] + dir * step);
    delay = setTimeout(() => { repeat = setInterval(() => setParamValue(key, state[key] + dir * step), 90); }, 420);
  });
  btn.addEventListener('pointerup', end);btn.addEventListener('pointercancel', end);btn.addEventListener('lostpointercapture', end);
  // Keyboard activation dispatches click with detail=0; pointer clicks already
  // stepped on pointerdown and must not increment twice.
  btn.addEventListener('click', event => {
    if (event.detail === 0) {
      const key = fixedKey || activeParam;
      setParamValue(key, state[key] + dir * SLDEF[key].step);
    }
  });
}

const METRICS = {

  spinAxis:{ label:'SPIN AXIS', get:o=>o.deg.spinAxis, format:v=>[(v >= 0 ? '+' : '−') + Math.abs(Math.round(v)) + '°',''], decimals:0, deltaUnit:'°' },

  apex:{ label:'APEX', get:o=>o.m.apex, format:v=>[Math.round(v),'m'], decimals:0, deltaUnit:'m' },
};
const METRIC_GROUPS = {
  direction: { label:'DIRECTION', keys:['launchDir', 'spinAxis', 'curve', 'side'] },
  launch: { label:'LAUNCH & SPIN', keys:['launchAng', 'spinLoft', 'backspin', 'landingAng'] },
  distance: { label:'DISTANCE', keys:['smash', 'ballSpeed', 'carry', 'total', 'apex'] },
};
let activeDetailsGroup = 'direction';

function deltaText(def, value) {
  if (!interactionBaselineOutcome) return '';
  const delta = value - def.get(interactionBaselineOutcome);
  const threshold = def.decimals === 2 ? .005 : def.decimals === 1 ? .05 : .5;
  if (Math.abs(delta) < threshold) return '';
  const abs = Math.abs(delta).toFixed(def.decimals);
  return `${delta > 0 ? '+' : '−'}${abs}${def.deltaUnit ? ` ${def.deltaUnit}` : ''}`;
}

function metricChip(key, outcome, live = false) {
  const def = METRICS[key];
  const raw = def.get(outcome);
  const [value, unit] = def.format(raw);
  const delta = live ? deltaText(def, raw) : '';
  return `<div class="chip read" data-metric="${key}" data-changed="${delta ? 'true' : 'false'}">
    <div class="k">${def.label}</div><div class="v">${value}${unit ? ` <em>${unit}</em>` : ''}</div>
    ${live ? `<span class="delta">${delta || '&nbsp;'}</span>` : ''}</div>`;
}

function renderMetricChips(outcome) {
  const groups = {
    ogDir:METRIC_GROUPS.direction.keys,
    ogLaunch:METRIC_GROUPS.launch.keys,
    ogDist:METRIC_GROUPS.distance.keys,
  };
  for (const [id, keys] of Object.entries(groups)) {
    const group = document.getElementById(id);
    if (group) group.innerHTML = keys.map(key => metricChip(key, outcome, true)).join('');
  }
  const detailReadouts = document.getElementById('detailReadouts');
  if (detailReadouts) detailReadouts.innerHTML = METRIC_GROUPS[activeDetailsGroup].keys.map(key => metricChip(key, outcome, false)).join('');
  renderShotBrief(outcome);
}

function signedDirection(value, unit, zeroText) {
  const magnitude = Math.abs(value);
  if (magnitude < (unit === '°' ? .2 : .5)) return zeroText;
  const rounded = unit === '°' ? magnitude.toFixed(1) : Math.round(magnitude);
  return `${rounded}${unit} ${value > 0 ? 'right' : 'left'}`;
}

function renderShotBrief(outcome) {
  const start = signedDirection(outcome.deg.launchDir, '°', 'on line');
  const finish = signedDirection(outcome.m.side, 'm', 'on line');
  shotLine.innerHTML = `<strong>Starts ${start}</strong> → finishes ${finish}.`;
  shotProof.innerHTML = `<span>Ball speed <b>${Math.round(outcome.misc.ballSpeed)} mph</b></span><span>Backspin <b>${Math.round(outcome.misc.backspin)} rpm</b></span>`;
}

function renderShotPane() {
  parameterRail = null;
  activeControl = null;
  activePaneStation = null;

  paneTitleEl.className = 'h-title live';
  rangeDone.hidden = true;
  paneEl.innerHTML = `<div class="shotActions">
    <button class="shotAction shotAction--primary" id="changeInput" type="button">Change input</button>
    <button class="shotAction shotAction--secondary" id="openDetails" type="button">Details</button>
  </div>`;
  document.getElementById('changeInput').addEventListener('click', () => setRangeMode('change'));
  document.getElementById('openDetails').addEventListener('click', () => setRangeMode('details'));
}

function renderDetailsPane() {
  parameterRail = null;
  activeControl = null;
  activePaneStation = null;
  paneTitleEl.textContent = 'SHOT DETAILS';
  paneTitleEl.className = 'h-title';
  rangeDone.hidden = true;
  paneEl.innerHTML = `<div class="detailTabs" role="group" aria-label="Shot detail group">
    ${Object.entries(METRIC_GROUPS).map(([key, group]) => `<button type="button" data-detail-group="${key}" aria-pressed="${key === activeDetailsGroup}">${group.label}</button>`).join('')}
  </div><div class="detailReadouts" id="detailReadouts"></div>

}

function setRangeMode(mode) {
  if (!['shot', 'change', 'details'].includes(mode)) return;
  state.rangeMode = mode;
  shotBrief.hidden = mode !== 'shot';
  if (mode === 'shot') renderShotPane();
  else if (mode === 'details') renderDetailsPane();
  else {
    stationTarget = 0;
    state.station = 0;
    renderPane(0);
  }
  renderMetricChips(selectOutcome(state));
  syncSeg();
  resizePending = false;
  resize();
}

function outcomePaneHTML() {
  const buttons = PARAM_ORDER.map(key => {
    const d = SLDEF[key];
    return `<button type="button" data-param="${key}" aria-pressed="${key === activeParam}" style="--control-color:var(${d.token})">
      <span class="paramName">${d.short}</span><span class="paramValue" ${key === 'speed' ? 'id="spVal"' : ''}>${d.fmt(state[key])}</span></button>`;
  }).join('');

    <div class="activeControl" id="activeControl"></div>`;
}

function renderPane(station) {

    parameterRail = document.getElementById('parameterRail');

  const container = paneEl.firstElementChild;
  if (station === 1) { buildSlider(container, 'dynLoft'); buildSlider(container, 'attack'); }
  else { buildSlider(container, 'face'); buildSlider(container, 'path'); }

bindHold(document.getElementById('spMinus'), -1, 'speed');

document.getElementById('topSpeedVal').addEventListener('keydown', event => {

/* ══ Pin pill — maks 3 ghosts, eldste ut (ordre §2, S7) ══ */
const saveShotStatus = document.getElementById('saveShotStatus');
pinFab.addEventListener('click', async () => {
  const params = { face: state.face, path: state.path, attack: state.attack, dynLoft: state.dynLoft, speed: state.speed };
  const identity = `shot:${PARAM_ORDER.map(key => Number(params[key]).toFixed(2)).join(':')}`;

  const alreadyPinned = state.pins.some(pin => {
    const pinIdentity = `shot:${PARAM_ORDER.map(key => Number(pin.params[key]).toFixed(2)).join(':')}`;
    return pinIdentity === identity;
  });
  if (alreadyPinned) {
    saveShotStatus.textContent = 'This setup is already pinned. Change an input to compare a new setup.';
    return;
  }

  await iapReady;
  const access = authorize('instrument-shot', { pro: saIap.isPro(), identity });
  if (!access.allowed) {
    if (access.shouldPaywall) await showPaywall('instrument-shot');
    if (!saIap.isPro()) return;
  }

  state.pins.push({ params, outcome: selectOutcome(params) });
  if (state.pins.length > 3) state.pins.shift();
  const used = consume('instrument-shot', { pro: saIap.isPro(), identity, completed: true });
  const remaining = Number.isInteger(used.remaining) ? used.remaining : null;
  pinFab.querySelector('span').textContent = remaining !== null && remaining <= 2
    ? remaining === 0 ? 'Pro next' : `${remaining} free left`
    : 'Pin comparison';
  overlayMetricsDirty = true;
  pinFab.setAttribute('aria-label', remaining !== null
    ? remaining === 0
      ? 'Comparison pinned. Pro options open on the next new comparison'
      : `Comparison pinned. ${remaining} free comparisons remaining`
    : 'Comparison pinned');
  saveShotStatus.textContent = remaining !== null
    ? remaining === 0
      ? 'Comparison pinned. Pro options open on the next new comparison.'
      : `Comparison pinned. ${remaining} free comparisons remaining.`
    : 'Comparison pinned.';
  track('shot_saved', {
    route: 'outcome',
    count: used.used,
    limit: used.limit,
    remaining: remaining ?? 0,
  });
});

let cometEpoch = performance.now();

// vertikal drag i scenen = kontinuerlig skalar; slipp = snap til nærmeste
let pan = null;
cv.addEventListener('pointerdown', e => {
  pan = { y0: e.clientY, s0: stationTarget };
  scrubbing = true;
  cv.setPointerCapture(e.pointerId);
  syncSeg();
});
cv.addEventListener('pointermove', e => {
  if (!pan) return;
  const ds = (pan.y0 - e.clientY) * 0.0055;
  stationTarget = clamp(pan.s0 + ds, 0, 2);
  state.station = stationTarget; // følg fingeren direkte under scrub
});
function endPan() {
  if (!pan) return;
  pan = null; scrubbing = false;
  setStation(Math.round(stationTarget));
}
cv.addEventListener('pointerup', endPan);
cv.addEventListener('pointercancel', endPan);

/* Stable telemetry DOM; it updates only when the memoised Outcome changes. */
const fCarryLive = document.getElementById('fCarryLive');
let lastHud = '';
let liveAnnounceTimer = null;
function updateStats(outcome) {
  const carry = Math.round(outcome.m.carry);
  const side = Math.round(outcome.m.side);
  const hud = [carry, side, Math.round(outcome.misc.ballSpeed), Math.round(outcome.misc.backspin), outcome.deg.spinLoft.toFixed(1)].join('|');
  if (hud === lastHud) return;
  lastHud = hud;

  fCarryNum.textContent = String(carry);
  const announcement =
    `Carry ${carry} metres, spin loft ${outcome.deg.spinLoft.toFixed(1)} degrees, ` +
    `ball speed ${Math.round(outcome.misc.ballSpeed)} miles per hour, backspin ${Math.round(outcome.misc.backspin)} rpm.`;
  clearTimeout(liveAnnounceTimer);
  liveAnnounceTimer = setTimeout(() => { fCarryLive.textContent = announcement; }, 300);
}

/* Scene HUD collision: Carry owns the left anchor. Pin owns the right anchor
   until a projected active/ghost tracer or measurement label reaches it, then
   it crosses left below Carry. Right-side return is delayed to avoid chatter
   while the camera is still moving. */
const PIN_INSET = 12;
const PIN_ACTIVE_GAP = 14;
const PIN_GHOST_GAP = 8;
const PIN_LABEL_GAP = 8;
// Wait longer than the 240 ms position transition before returning to the
// canonical side, so a tracer skimming the boundary cannot make the control
// visibly bounce between anchors.
const PIN_RETURN_DELAY = 320;
let overlayMetrics = null;
let pinSide = 'right';
let pinRightClearSince = null;

function getOverlayMetrics() {
  if (!overlayMetricsDirty && overlayMetrics) return overlayMetrics;
  overlayMetrics = {
    pinW: pinFab.offsetWidth,
    pinH: pinFab.offsetHeight,
    carryBottom: fCarryStack.offsetTop + fCarryStack.offsetHeight,
  };
  overlayMetricsDirty = false;
  return overlayMetrics;
}

function pointInRect(point, rect) {
  return point.x >= rect.x && point.x <= rect.x + rect.w
    && point.y >= rect.y && point.y <= rect.y + rect.h;
}

function segmentIntersectsRect(a, b, rect) {
  if (pointInRect(a, rect) || pointInRect(b, rect)) return true;
  const dx = b.x - a.x;
  const dy = b.y - a.y;
  let lo = 0;
  let hi = 1;
  for (const [p, q] of [
    [-dx, a.x - rect.x],
    [dx, rect.x + rect.w - a.x],
    [-dy, a.y - rect.y],
    [dy, rect.y + rect.h - a.y],
  ]) {
    if (Math.abs(p) < 1e-9) {
      if (q < 0) return false;
      continue;
    }
    const t = q / p;
    if (p < 0) lo = Math.max(lo, t);
    else hi = Math.min(hi, t);
    if (lo > hi) return false;
  }
  return true;
}

function tracerIntersectsRect(projectedPath, rect, gap) {
  const expanded = {
    x: rect.x - gap, y: rect.y - gap,
    w: rect.w + gap * 2, h: rect.h + gap * 2,
  };
  let previous = null;
  for (const current of projectedPath) {
    if (!current) { previous = null; continue; }
    if (pointInRect(current, expanded)
      || (previous && segmentIntersectsRect(previous, current, expanded))) return true;
    previous = current;
  }
  return false;
}

function rectsOverlap(a, b, gap = 0) {
  return a.x < b.x + b.w + gap && a.x + a.w + gap > b.x
    && a.y < b.y + b.h + gap && a.y + a.h + gap > b.y;
}

function sceneHudBlocked(rect, projectedTraces, labelRects) {
  if (projectedTraces.some(trace => tracerIntersectsRect(trace.points, rect, trace.gap))) return true;
  return labelRects.some(labelRect => rectsOverlap(rect, labelRect, PIN_LABEL_GAP));
}

function syncSceneHud(liveOutcome, pins, placed, now, tracerVisible) {
  const metrics = getOverlayMetrics();
  // Projection is the costly part. Build each path once per render frame and
  // reuse it while evaluating the right anchor and any left fallback slots.
  const projectedTraces = tracerVisible ? [
    { points: liveOutcome.path.map(point => project(point, basis)), gap: PIN_ACTIVE_GAP },
    ...pins.map(pin => ({
      points: pin.outcome.path.map(point => project(point, basis)), gap: PIN_GHOST_GAP,
    })),
  ] : [];
  const labelRects = placed.flatMap(item => {
    if (!item.label || !item.labelPos || (item.alpha ?? 1) < .08) return [];
    const width = Math.max(30, item.label.length * 6.3 + 16);
    return [{ x: item.labelPos.x - width / 2, y: item.labelPos.y - 10, w: width, h: 20 }];
  });
  const rightRect = {
    x: W - PIN_INSET - metrics.pinW, y: PIN_INSET,
    w: metrics.pinW, h: metrics.pinH,
  };
  const rightBlocked = tracerVisible && sceneHudBlocked(rightRect, projectedTraces, labelRects);

  if (rightBlocked) {
    pinSide = 'left';
    pinRightClearSince = null;
  } else if (pinSide === 'left') {
    if (pinRightClearSince == null) pinRightClearSince = now;
    if (now - pinRightClearSince >= PIN_RETURN_DELAY) {
      pinSide = 'right';
      pinRightClearSince = null;
    }
  }

  let target = rightRect;
  if (pinSide === 'left') {
    const maxY = Math.max(PIN_INSET, H - metrics.pinH - PIN_INSET);
    const startY = Math.min(maxY, Math.ceil(metrics.carryBottom + 10));
    target = { x: PIN_INSET, y: startY, w: metrics.pinW, h: metrics.pinH };
    for (let y = startY; y <= maxY; y += 8) {
      const candidate = { ...target, y };
      target = candidate;
      if (!sceneHudBlocked(candidate, projectedTraces, labelRects)) break;
    }
  }

  pinFab.dataset.side = pinSide;
  pinFab.style.setProperty('--pin-x', `${Math.round(target.x)}px`);
  pinFab.style.setProperty('--pin-y', `${Math.round(target.y)}px`);
}

/* ══ render-løkke ══
   Kameraglidingen er TIDSBASERT (eksponentiell mot målet, τ=110 ms →
   ~0,5 s til ro over hele skalaen), ikke per-frame: en droppet frame skal
   koste bilder, aldri strekke reisen. */
const TAU_S = 0.11;
let lastT = 0;
/**
 * Skudd-tilpasset innramming (§5.5: pos/look/fov/refDist er fritt å re-tune).
 *
 * To grep, begge kontinuerlige i station-blendingen:
 *   1) sentrer blikkpunktet nedover banen — men BARE i ortho, skalert med
 *      orthoK, ellers ville FLIGHT-kameraet gli forbi ballen;
 *   2) zoom ved å dolly kameraet bakover, som skalerer både ortho og
 *      perspektiv uten å røre fov (se impact-framing.js for hvorfor fov-
 *      utvidelse ble forkastet: >100° fisheye ved 386 m).
 * Eksakt-ortografi (A2) er bevart strukturelt — zDiv = refDist ved orthoK=1
 * uansett hvilken verdi refDist får.
 */
function frameForShot(rig, outcome, aspectFix, station, pins = []) {
  const visibleOutcomes = [outcome, ...pins.map(pin => pin.outcome).filter(Boolean)];
  const carry = Math.max(1, ...visibleOutcomes.map(item => item.m.carry || 0));
  const apex = Math.max(0, ...visibleOutcomes.map(item => item.m.apex || 0));
  const side = Math.max(0, ...visibleOutcomes.map(item => Math.abs(item.m.side || 0)));
  const mid = carry / 2;
  const s = clamp(station, 0, 2);
  const segmentT = s <= 1 ? s : s - 1;
  const easedT = segmentT * segmentT * (3 - 2 * segmentT);
  const sideWeight = s <= 1 ? easedT : 1 - easedT;
  const topWeight = s <= 1 ? 0 : easedT;
  const maxDist = Math.max(mid, apex, side + 8);   // half-extent that must fit
  // The compact portrait stage uses a stock-iron home frame. Wedges and the
  // default iron stay visually stable; longer shots zoom out continuously so
  // their tracer keeps using the available canvas instead of clipping.
  const targetScale = fitZoom(Math.max(maxDist, RANGE_HOME_FIT));
  // FLIGHT is perspective and starts close to the ball. Blend the portrait
  // dolly in with orthographic weight so Outcome→Side/Top never pulls the
  // camera through impact during the animated orbit.
  const k = 1 + (targetScale - 1) * rig.orthoK;
  const homeScale = fitZoom(RANGE_HOME_FIT);
  const screenBiasCompensation = homeScale / k;
  // The shorter tracer canvas needs an off-centre camera target: SIDE keeps
  // the ground low in frame, while TOP keeps impact low and downrange above.
  // Translating pos + look together preserves the endpoint camera direction,
  // exact orthographic projection and every measured angle. Compensating the
  // world-space bias for dolly keeps the anchor fixed on screen at every speed.
  const topCentre = Math.max(mid, RANGE_HOME_FIT) + 25 * screenBiasCompensation;
  const targetX = mid + (topCentre - mid) * topWeight;
  const dx = (targetX - rig.look.x) * rig.orthoK;
  const dz = 30 * sideWeight * screenBiasCompensation;
  const look = { x: rig.look.x + dx, y: rig.look.y, z: rig.look.z + dz };
  const pos = { x: rig.pos.x + dx, y: rig.pos.y, z: rig.pos.z + dz };
  const zoomed = dollyRig({ ...rig, pos, look }, k);
  return {
    rig: { ...zoomed, xStretch: (rig.xStretch ?? 1) * aspectFix },
    extent: carry,
    halfWidth: side,
    sideSigned: outcome.m.side || 0,
  };
}

function buildVisibleBasis(rig, vbox, keepImpactVisible) {
  const initial = buildBasis(rig, vbox);
  if (!keepImpactVisible) return initial;
  const impact = project({ x: 0, y: 0, z: 0 }, initial);
  if (!impact) return initial;
  const safeY = clamp(impact.y, 32, vbox.h - 32);
  if (Math.abs(safeY - impact.y) < 0.5) return initial;
  const zDiv = impact.depth + (initial.refDist - impact.depth) * rig.orthoK;
  const shift = (safeY - impact.y) * zDiv / initial.focal;
  const offset = {
    x: initial.upVec.x * shift,
    y: initial.upVec.y * shift,
    z: initial.upVec.z * shift,
  };
  // Equal pos/look translation is a screen-space camera shift: orientation,
  // orthographic truth and measured angles stay unchanged during the orbit.
  return buildBasis({
    ...rig,
    pos: { x: rig.pos.x + offset.x, y: rig.pos.y + offset.y, z: rig.pos.z + offset.z },
    look: { x: rig.look.x + offset.x, y: rig.look.y + offset.y, z: rig.look.z + offset.z },
  }, vbox);
}

// OUTCOME-lengdereferanse: tre kandidater for støttescenen.
//   'ladder' (A) — høydestige + ett landingstall (standard-anbefaling)
//   'gates'  (B) — vertikale distanseporter inne i scenen
//   'strip'  (C) — flat 2D distansestripe nederst
let flightRef = 'gates';

function frame(now) {
  // Resize the bitmap inside the render frame, immediately before drawing it.
  // A ResizeObserver callback that resizes independently can clear the canvas
  // after paint, which caused a one-frame blank tracer during lens changes.
  if (resizePending) {
    resizePending = false;
    resize();
  }
  const dt = Math.min((now - lastT) / 1000 || 0, 0.25);
  lastT = now;
  if (!scrubbing) {
    const k = reduceMotion ? 1 : 1 - Math.exp(-dt / TAU_S);
    state.station += (stationTarget - state.station) * k;
    if (Math.abs(state.station - stationTarget) < 0.002) state.station = stationTarget;
  }
  if (api.capture && api.trace.length < 4000) api.trace.push({ t: now, station: state.station });
  // Aspekt-lås mot mocken (§5.5-tuning): mockens ortho-gridskala er bredde-
  // avhengig (projTop x = W/360 per m), riggens er høydeavhengig. STATIONS-
  // verdiene er tunet ved aspekt ≈0.4647 (mobil portrett); i bredere vinduer
  // skaleres ortho-xStretch opp så anisotropien følger mockens W/H. Persp
  // (orthoK=0) er isotrop i mocken og røres ikke; blend via orthoK holder
  // reisen kontinuerlig.
  const rig0 = rigAt(state.station);
  const aspectFix = 1 + ((W / H) / 0.4647 - 1) * rig0.orthoK;
  // Skudd-tilpasset innramming: kjenn slaget FØRST, så sentrer og zoom riggen
  // rundt det. selectOutcome er memoisert, så å hente den før basis er gratis.
  const liveOutcome = selectOutcome(state);
  const framed = frameForShot(rig0, liveOutcome, aspectFix, state.station, state.pins);
  const tracerVisible = stage.dataset.tracer === 'on';
  basis = buildVisibleBasis(framed.rig, { w: W, h: H }, tracerVisible);
  ctx.clearRect(0, 0, W, H);
  if (tracerVisible) {
    drawGrid(state.station, framed.extent, framed.halfWidth, framed.sideSigned);
    drawLandingContact(liveOutcome, state.station);
    for (const pin of state.pins) drawTraj(pin.outcome, 'ghost');
    drawTraj(liveOutcome, 'active');
  }
  updateStats(liveOutcome);

  const placed = tracerVisible
    ? placeLabels(buildAnnotations(liveOutcome, state.station, basis, hotKey), MEASURE_KEEPOUT, { w: W, h: H })
    : [];
  if (tracerVisible) drawAnnotationPrimitives(placed);
  renderAnnotationLabels(placed);
  syncSceneHud(liveOutcome, state.pins, placed, now, tracerVisible);
  if (tracerVisible && !reduceMotion) {
    const cp = cometPoint(liveOutcome, now - cometEpoch);
    if (cp) drawComet(cp, basis);
  }

  if (liveOutcome !== lastChipsOutcome) {
    renderMetricChips(liveOutcome);
    lastChipsOutcome = liveOutcome;
  }
  syncAllInputUI();
  requestAnimationFrame(frame);
}

// instrumenteringskrok for evidens (K1/K6: logget skalarverdi per frame når
// `capture` er på) og for senere økter/dommer
const api = { state, setStation, setRangeMode,
  get stationTarget() { return stationTarget; }, setFlightRef(m) { flightRef = m; },
  get flightRef() { return flightRef; },
  projectPoint(point) { return basis ? project(point, basis) : null; },
  capture: false, trace: [] };
window.__impact = api;

const initialOutcome = selectOutcome(state);
track('live_model_opened', { route: 'outcome' });
updateStats(initialOutcome);
renderMetricChips(initialOutcome);
lastChipsOutcome = initialOutcome;
syncSeg();
resizePending = false;
resize();
requestAnimationFrame(frame);
</script>
