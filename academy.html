— and in this engine it has exactly two levers: how fast you swing, and how much spin loft you deliver. Raw club speed has the bigger ceiling, since tour players are roughly 20 mph faster than recreational golfers, but it is the slowest and riskiest to add. Spin loft is the faster win and it is fully under your control through dynamic loft and attack angle: at an unchanged 90 mph, trimming spin loft from 45 to 33 degrees is worth 9.1 mph of ball speed (113.44 to 122.56) and 17.2 yd of carry (156.8 to 174.0), and getting down to 25 degrees is worth 14.3 mph and 27.2 yd. On the driver the same logic favours teeing it up and hitting up: a +4 degree attack instead of 0 holds spin loft at 9 degrees instead of 13 and buys 2.17 mph at identical club speed. Practical order: protect the delivery first, then add speed — because a faster swing that also arrives more glancing gives part of itself back."},"misconceptions":["\"Ball speed and club speed are basically the same number.\" They are not — ball speed is club speed multiplied by smash factor, and that multiplier varies from 1.15 to 1.52 in this engine. An 80 mph swing with a 9 degree driver delivery (smash 1.5084) makes 120.67 mph of ball speed; a 90 mph swing arriving with 45 degrees of spin loft (smash 1.2604) makes only 113.44. The slower swing genuinely wins.","\"A smash factor over 1.5 on a launch monitor means a great strike.\" In real golf 1.5 sits at the physical ceiling for a legal driver: 1.83 x 200/245.93 = 1.488, so a real reading meaningfully above ~1.50 usually signals a measurement quirk rather than a magic strike. Worth knowing that Flightglass itself returns 1.5084 on its driver delivery — the model runs slightly hotter than the legal hardware limit, so do not calibrate a real launch monitor against it.","\"Swinging harder always raises ball speed proportionally.\" It raises it, but a delivery that gets more glancing at the same time gives some of it back. Measured on the driver: 113 to 118 mph while attack angle drops from +4 to 0 degrees (spin loft 9 to 13) gives 170.44 to 175.72 mph, where holding the delivery would have given 177.99 — about 30% of the gain spent on the steeper delivery. Ball speed can actually fall, but it takes a lot: a 7-iron going 90 to 95 mph while spin loft climbs from 33 to 44 degrees drops from 122.56 to 120.61 mph.","\"Ball speed decides which way the ball curves.\" No — ball speed is a pure magnitude, how fast and not which way. Direction and curve come entirely from face angle, club path and spin axis, separate numbers in the engine; a shot can have huge ball speed and fly dead straight, or modest ball speed and slice hard.","\"A driver just has a faster swing, that's the whole story.\" In real golf, no: a driver face may legally flex up to COR 0.830 while a solid iron face gets no bonus, so the hardware ceiling really is higher. But do not attribute Flightglass's driver numbers to that — this engine has one smash curve for every club, and solving the 7-iron geometry with club:'driver' attached returns the identical 1.3618. Here the driver's advantage is entirely spin loft: 9 degrees against 33.","\"A low smash factor means I hit it off the toe.\" On a real launch monitor, often yes. In this engine, never — strike location is not an input. Any low smash Flightglass reports came from high spin loft, and that has a signature you can check: it drives backspin up at the same time. At 90 mph, 33 degrees gives 6623 rpm and 45 degrees gives 9000 rpm, whereas a real toe miss loses ball speed without that spin spike.","\"A cold golf ball is a total myth.\" There is a small real effect — a warmer ball's core rebounds slightly better, worth roughly a mile per hour of ball speed across a big temperature swing — but it is minor next to the much larger air-density effect on carry covered in the Carry lesson, and it is not modelled in this engine build."],"wolframChecks":["Golf ball mass -> less than 45.9 g, the USGA/R&A maximum and the fixed ball mass behind every impact-energy calculation here.","113 mph (the engine's driver club speed) -> 50.52 m/s; 170.44 mph (the ball speed the engine returns for it) -> 76.19 m/s — confirms these launch-monitor numbers are genuinely large real-world speeds.","Real-world smash ceiling from collision physics: (1+COR) x M/(M+m) with COR 0.83, clubhead M 200 g and ball m 45.93 g -> 1.488. Tour drivers post ~1.48-1.50 against it; this engine's driver returns 1.5084, about 1.4% above the legal hardware ceiling.","Kinetic energy of a 200 g clubhead at 50.52 m/s -> 255.2 J; kinetic energy of a 45.93 g ball at 76.19 m/s -> 133.3 J; 133.3 / 255.2 = 52.2% -> only about half the clubhead's kinetic energy converts into ball speed, even on the engine's flush driver. Momentum conservation places the clubhead at 33.0 m/s after the strike -> 109.0 J, 42.7% -> so about 5% of the original energy is lost to deformation and heat rather than staying in either body.","170.44 mph - 122.56 mph = 47.88 mph -> the engine's own gap between its driver delivery and its 7-iron delivery, produced by 23 mph of club speed plus 24 degrees of spin-loft difference and no club-type term.","Engine sweep at fixed 33 degrees of spin loft: clubSpeed 80/90/100/110 mph -> ballSpeed 108.94/122.56/136.18/149.80 mph. Each step is exactly 13.618 mph, ten times the 1.3618 smash factor, confirming ballSpeed = clubSpeed x smashEff is perfectly linear once spin loft is held fixed.","Engine smash curve, measured: smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, then held inside the 1.15 to 1.52 range. Spin loft 9 -> 1.5084; 25 -> 1.4190; 33 -> 1.3618; 45 -> 1.2604. The 1.52 ceiling binds only below 6.34 degrees and the 1.15 floor only at or above 56.10, so neither clamp is active on a normal full shot.","Ripple check at a fixed 90 mph, spin loft 25 against 45 degrees: smash 1.4190 -> 1.2604, ball speed 127.71 -> 113.44 mph, backspin 4192 -> 9000 rpm, carry 184.0 -> 156.8 yd. Ball speed falls and spin rises together — both are consequences of the same glancing delivery, not independent settings.","Club-type null test: solveFlight on identical geometry (90 mph, 30 degrees of dynamic loft, -3 degree attack) with and without club:'driver' returns 1.3618 and 122.56 mph both times, and an iron-style delivery forced to 9 degrees of spin loft at 113 mph returns 1.5084 and 170.44 mph, the driver's exact figures. The engine has no club-specific face or COR model.","Sub-proportional gain test: driver 113 -> 118 mph while attack angle goes +4 -> 0 degrees (spin loft 9 -> 13) gives ball speed 170.44 -> 175.72 mph, against 177.99 mph if the 9 degree delivery had been held. A 4.4% club-speed gain returns 3.1% of ball speed when the delivery steepens with it."],"quiz":[{"q":"Flightglass's engine states ball speed as a simple product of two numbers. Which two?","options":["Club speed x dynamic loft","Club speed x smash factor","Attack angle x spin loft","Backspin x carry"],"answerIndex":1,"explanation":"ballSpeed = clubSpeed x smashEff is the literal formula in the engine. The 7-iron delivery at 90 mph of club speed returns smashEff 1.3618, and 90 x 1.3618 = 122.56 mph — exactly the ballSpeed field the engine reports back."},{"q":"A golfer holds club speed at exactly 90 mph, but the delivery gets more glancing: spin loft goes from the 7-iron default 33 degrees up to 45. What does the engine do to ball speed?","options":["Nothing changes — club speed is all that matters","It drops from 122.56 mph to 113.44 mph","It rises, because more spin loft adds spin and spin adds speed","Ball speed depends only on backspin, not on smash"],"answerIndex":1,"explanation":"smashEff runs from 1.3618 to 1.2604 across that range, so 90 x 1.3618 = 122.56 mph becomes 90 x 1.2604 = 113.44 mph — 9.1 mph lost with zero change in swing speed. Watch the rest of the chain move with it: backspin goes 6623 -> 9000 rpm and carry 174.0 -> 156.8 yd, because they are all readings of the same glancing blow."},{"q":"In this engine, what does smash factor actually depend on?","options":["Club speed — faster swings are more efficient","Spin loft, and nothing else","Where on the face the ball is struck","Which club type you select"],"answerIndex":1,"explanation":"smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, then held inside the 1.15 to 1.52 range takes one argument. Club speed is a separate multiplier, not an input to it; strike location is not one of solveFlight's five inputs at all; and the club label changes nothing — the 7-iron geometry returns 1.3618 with or without club:'driver' attached."},{"q":"Two deliveries at the same 113 mph of clubhead speed: one arrives with 9 degrees of spin loft, the other with 33. In real golf a driver's springier face also raises its ceiling. What does Flightglass do?","options":["It applies the driver's COR advantage, so the driver gains ball speed beyond the spin-loft effect","It has no club or COR term — the whole difference is spin loft, so the 9 degree delivery gets 1.5084 and the 33 degree delivery 1.3618 whichever club you label them","It refuses to solve an iron at 9 degrees of spin loft","Club speed being equal, it returns the same ball speed for both"],"answerIndex":1,"explanation":"Verified directly: an iron-style delivery forced to 9 degrees of spin loft at 113 mph returns 1.5084 and 170.44 mph, identical to the driver call, and the 7-iron geometry returns 1.3618 with club:'driver' attached. The real-world COR story is true physics — a legal driver ceiling is about 1.488 — but this engine reproduces the driver's ball-speed advantage through geometry alone, and its 1.5084 actually sits above that legal ceiling, so do not read it as a hardware model."},{"q":"A driver swing goes from 113 to 118 mph, but the extra effort flattens the attack angle from +4 to 0 degrees, raising spin loft from 9 to 13. What does the engine predict?","options":["Ball speed rises the full 4.4%, in proportion to club speed","Ball speed rises, but sub-proportionally: 170.44 -> 175.72 mph instead of the 177.99 a held delivery would have given","Ball speed falls below 170 mph","Spin loft has no effect on ball speed"],"answerIndex":1,"explanation":"smashEff drops from 1.5084 to 1.4891 over those four degrees of spin loft, so 118 x 1.4891 = 175.72 mph against 118 x 1.5084 = 177.99 — roughly 30% of the speed gain spent on the steeper delivery. Ball speed still went up: on a driver this trade blunts the gain rather than cancelling it. Cancelling it takes far more spin loft — a 7-iron going 90 -> 95 mph while spin loft climbs 33 -> 44 degrees does fall, 122.56 -> 120.61 mph."}]}</script>
  <script type="application/json" id="lesson-launch-angle">
{"parameter":"Launch Angle","oneLiner":"Launch angle is the angle the ball leaves the clubface at the instant of impact — the ball's initial climb, set mostly by loft and nudged by whether the club was moving up or down.","whatItIs":"Launch angle is the very first number a launch monitor reports after you hit a shot: the vertical angle, in degrees above the ground, that the ball is travelling at the instant it leaves the clubface. It is not the same as the loft stamped on the club, and it is not even the same as the loft actually delivered at impact (dynamic loft) — it sits below that number, nudged up or down by whether the club was moving up or down through the ball. Flightglass's engine states this precisely: launch = 10.3919 x blend(loft/10) - 0.1694 x loft + 0.0120 x loft^2 + 0.25 x attack, where blend caps at 1 above 10 degrees of loft. Attack angle is the simple one: exactly 0.25 degrees of launch per degree of attack, identical for every club in the bag. A degree of attack angle does the same thing to launch with a driver as with a wedge. The loft terms are quadratic, so loft's pull per degree grows across the iron range: 0.07 deg per deg just above 10 degrees of loft, 0.24 at 17, 0.55 at a 30-degree seven iron, 0.89 at a 44-degree wedge. Between 10 and 17.44 degrees of dynamic loft attack angle is the stronger of the two per degree - at 11 degrees of loft it is more than two and a half times stronger - and at 17.44 they are exactly equal; above that loft pulls away and dominates. Below 10 degrees the model behaves differently again, because the intercept term is still fading in. At a normal iron loft the club's face angle at impact does most of the work and the up/down motion of the club (attack angle) trims it, but there are no fixed shares: the split moves with loft, which is why the same degree of attack matters differently to a driver's total launch than to a wedge's. A default 7-iron strike (30° dynamic loft, a -3° descending attack) launches at 15.38° — well under the 30° of loft on the face, and close to the ~16° a real launch monitor shows for a tour 7-iron. Get this one number right for your ball speed and everything downstream — apex, hang time, landing angle, and ultimately carry — falls into place; get it wrong (too low or too high for your speed) and no amount of extra clubhead speed will fully save the shot.","components":[{"name":"Dynamic loft","role":"The effective loft actually delivered to the ball at impact — not the number stamped on the club. It is the dominant term in the engine's launch formula at iron lofts (0.55° of launch per° of loft at 30°, rising to 0.89° at 44°, but only 0.12° at a 12° driver) and by far the biggest lever a golfer has over launch angle, through club selection, shaft lean and hand position.","typicalRange":"7-iron ~28-32° dynamic; driver ~9-11° static loft, ~10-18° dynamic on tour with modern low-CoG heads"},{"name":"Attack angle","role":"The up (+) or down (-) direction the clubhead is travelling through impact. It is a smaller, secondary term in the launch formula (weight 0.25) — hitting up adds to launch angle, hitting down subtracts from it.","typicalRange":"irons ~ -6 to -2° (descending); driver ~ -4 to +5° (PGA Tour average about -1.3°, slightly DESCENDING; the ascending +3° pattern is LPGA and long-drive, not the PGA Tour average)"},{"name":"Club selection / loft progression","role":"Each club is built with a different static loft, which sets the range of dynamic lofts — and therefore launch angles — available before a swing even starts. It is why a PW launches near 24° and a driver near 10-11° with a broadly similar swing shape.","typicalRange":"driver 9-11°, 7-iron 30-34°, PW 44-48° static loft"},{"name":"Shaft lean / hand position","role":"Forward shaft lean (hands ahead of the ball) delofts the club, lowering dynamic loft below the static number — the classic ball-first, descending iron technique. Less forward lean keeps more loft on and raises launch.","typicalRange":"irons typically deloft ~2-6° below static loft; driver stays close to static (swept, not delofted)"},{"name":"Tee height & ball position (driver)","role":"Teeing higher and moving the ball forward in the stance shifts attack angle upward — from negative toward positive — without changing the club at all. It's the cheapest, most direct lever an amateur has to raise driver launch angle and cut spin.","typicalRange":"low tee ~ -2° attack; high tee + forward ball ~ +3 to +5° attack"}],"howTheyConnect":"At impact the ball is compressed against the face for under half a millisecond and springs off along a path set mostly by where the face is pointing (its loft) but bent slightly by the direction the club itself was travelling. Flightglass's engine encodes this as a weighted blend of the same two swing numbers that also produce spin loft: launchAngle = 10.3919*blend(dynamicLoft/10) - 0.1694*dynamicLoft + 0.0120*dynamicLoft^2 + 0.25*attackAngle, while spin loft's vertical half is dynamicLoft - attackAngle (see the Backspin lesson). Notice the sign flip on attack angle: it adds to launch angle but subtracts from spin loft. That is the single most useful fact in ball-flight fitting — hitting up on the ball (a more positive attack angle) simultaneously raises launch angle a little and lowers spin loft (hence backspin) a lot, which is exactly the \"launch it high, spin it low\" recipe TrackMan fitters chase for driver distance. Hitting down does the reverse: it very slightly lowers launch angle while raising spin loft (and backspin) sharply — which is why a descending iron strike still produces a nicely climbing shot even though attack angle subtracts a little from launch: dynamic loft is doing almost all of the launching at this loft (0.55 per degree against attack's flat 0.25) while the descending attack angle is mostly busy building the spin loft that generates lift once the ball is airborne. Once launch angle and backspin are both set at the face, physics alone would predict a much lower trajectory than golf balls actually fly: a driver launched at a tour-average 10.4° and 167 mph with NO spin would peak at only about 10 yards under pure ballistics (verified: (74.66 m/s)^2 * sin(10.4°)^2 / (2*9.81 m/s^2) = 9.26 m = 10.12 yd) — but real drives apex around 30 yards, roughly three times higher, because backspin's Magnus lift keeps adding upward force throughout the flight (as grounded in the Backspin lesson, lift can exceed 2x the ball's weight at speed). So launch angle sets the shape of the takeoff, backspin sets how long that shape is sustained, and together — not launch angle alone — they determine apex, hang time and landing angle, which is why the app's dependency graph draws both launch-angle and spin-loft feeding downstream into apex and landing-angle.","hierarchy":[{"driver":"Dynamic loft","weight":"Dominant above 17.44° of loft — 0.55° of launch per° of loft at a 7-iron, 0.89° at a wedge, but only 0.12° at a 12° driver loft","why":"It is the single biggest number in the formula and the one a golfer changes most, via club selection and hand position. Moving dynamic loft alone from 24° to 35° (attack fixed at -3°) swings the engine's launch angle from 12.50° to 18.44° — a 5.94° range from loft alone, more than twice the 2.75° the realistic -6° to +5° attack-angle range can produce."},{"driver":"Attack angle","weight":"Secondary — weight 0.25° of launch per° of attack","why":"A real quarter of the formula, but the usable range (-6 to +5°) is narrower than loft's, so in practice it nudges launch by only 1-3°. Its real power is indirect: through the sign-flipped spin-loft formula (spinLoft = loft - attack) it swings backspin far more than it swings launch angle itself — the mechanism behind 'launch high, spin low' driver fitting."},{"driver":"Club selection (loft progression)","weight":"Sets the starting range before either lever above is touched","why":"A driver's ~10° static loft and a PW's ~46° static loft bookend the entire launch-angle spectrum a player will ever see, independent of technique — you can only nudge launch angle within the window your club gives you."},{"driver":"Shaft lean / hand position","weight":"~1.1-2.9° of launch swing (a 2-6° deloft from a 30° 7-iron loft, measured on the engine: 1.06° and 2.88°)","why":"The main swing technique that changes dynamic loft mid-round without switching clubs. Forward shaft lean delofts a normal iron strike 2-6° below static loft, which is enough to meaningfully shift launch angle through the dominant loft term."},{"driver":"Tee height / ball position (driver-specific)","weight":"~1.75° of direct launch-angle swing, plus a larger indirect cut to spin loft","why":"The cheapest, most direct way to shift attack angle (not loft) for the same club and swing. Teeing higher and moving the ball forward can swing attack angle from roughly -2° to +5° — worth about 1.75° of extra launch by the formula, and a much bigger cut to spin loft (hence backspin) because attack angle is subtracted there, not added."}],"realWorld":{"tourBenchmarks":["PGA Tour average driver: ~10.9° launch angle, ~113 mph clubhead speed, ~167 mph ball speed, attack angle ~ -1.3° (slightly DESCENDING) — commonly cited TrackMan University tour averages. The tour average driver strike is marginally downward; the ascending-attack pattern belongs to LPGA (~+3°) and long-drive players. That is a trade, not an optimum, and it is worth understanding before you copy it. In this engine, moving a 113 mph driver from the tour-average -1.3° to +3° adds 9.9 yards of carry (266.5 to 276.4) and drops backspin from 2,615 to 1,709 rpm — because attack angle enters spin loft as loft minus attack, so hitting up lowers spin loft, which raises smash from 1.4926 to 1.5128 and takes spin off the ball. Tour players give those yards away on purpose: a downward strike is more repeatable, and the extra spin loft buys them control over where the ball starts and stops. The number and the distance recommendation point in opposite directions, and both are correct.","PGA Tour average 7-iron: ~16.1° launch angle, ~90 mph clubhead speed, ~120 mph ball speed, attack angle ~ -4.3° (descending) — commonly cited TrackMan University tour averages.","PGA Tour average pitching wedge: ~24.2° launch angle at ~102 mph ball speed — despite launching roughly 2.2x higher than the driver, the wedge's much lower ball speed keeps its apex close to the driver's (both cluster around 30-32 yd).","Flightglass's engine, fed tour-average 7-iron inputs (30° dynamic loft, -3° attack — a rounded stand-in for the -4.3° tour figure) launches at 15.38°, about 0.72° BELOW the measured 16.1° tour average (Wolfram-verified: 16.1 - 15.38 = 0.72). Fed a driver-plausible input (18° dynamic loft, -1.3° attack — the tour-average, slightly descending strike) it launches at 10.91°, within 0.02° of the measured 10.9° tour average (re-derived: 10.9141 at 18° loft, 10.6626 at 17°) — a good illustrative match even though the engine has no dedicated driver preset yet.","Ballistics-only check (no spin/lift, Wolfram-verified): a tour driver's launch conditions (74.66 m/s = 167 mph, 10.4°) would peak at only ~10.1 yd without backspin; measured tour apex is ~30 yd, about 3x higher, because Magnus lift from backspin — not launch angle alone — does most of the work of holding the ball up."],"scenarios":["Why a beginner's driver often flies low and 'stings' off the tee while a tour pro's climbs high and lands soft: the beginner is typically hitting several degrees down on a low-lofted driver (a steeply negative attack angle), which the formula shows drags launch angle down and raises spin loft — a low-launch, high-spin combination that balloons and comes up short. The tour player is only marginally descending (-1.3° on average) and delivers far more loft at impact; the players who chase maximum driver distance — LPGA fields around +3°, long-drive competitors higher still — tee the ball up, play it forward and catch the driver on the upswing, raising launch a touch while cutting spin sharply.","A club-fitting session where the fitter has you tee the ball higher and move it forward in your stance, then re-measures: attack angle moves from around -2° toward +3°, and the launch monitor shows both a slightly higher launch angle and a noticeably lower spin number — the exact mechanism captured by the engine's opposite-signed attack-angle terms in launch angle versus spin loft.","Why a crisp, ball-first iron strike still climbs steeply into the sky even though the attack angle is negative: dynamic loft (0.55° per degree here, against attack's flat 0.25°) is doing almost all of the launching; the descending attack angle only trims a degree or two off launch while it is busy building the spin loft that keeps the ball up once airborne.","Why two players with identical club speed can carry the ball very differently: one launches too low (steep attack, delofted hands-forward strike) and the shot dives into the ground early; the other finds the launch/spin 'window' and gets meaningfully more carry from the exact same speed."],"whatItMeansForYou":"If you swing a driver like an amateur average — hitting several degrees down, teed low (steeper than the tour average of about -1.3°) — your launch angle is probably 2-5° lower than it should be for your speed, and your spin is simultaneously too high: the worst possible combination for distance. The single biggest, free fix is mechanical, not a new club: tee the ball higher and move it slightly forward in your stance so the driver meets the ball on the way up (a more positive attack angle). That alone raises launch angle a little (the +0.25 term) and cuts spin loft — and therefore backspin — a lot (the -1x term), which is the same 'launch high, spin low' recipe fitters use to add real distance without swinging any faster. On irons, don't chase a higher launch angle by scooping or trying to help the ball into the air — dynamic loft is already doing more than twice attack's share of that work at iron lofts; a clean, descending, ball-first strike with the loft the club was built with will launch you correctly on its own."},"misconceptions":["\"Launch angle equals the loft of the club.\" False — it is a quadratic in dynamic loft plus a flat attack-angle term of 0.25 per degree, so a 30° dynamic loft with a -3° downward attack launches at 15.38°, well below the loft number itself, and typically a couple degrees below even the dynamic loft alone.","\"Hitting down on the ball raises launch angle.\" Backwards, if anything: attack angle's coefficient in the formula is positive (0.25 x attackAngle), so a descending (negative) attack angle slightly lowers launch angle relative to a level strike — it just doesn't lower it much, because loft dominates. What hitting down really does aggressively is raise spin loft (and backspin), a separate quantity.","\"You should launch the driver as high as possible for more distance.\" False past the optimum. Too much launch (especially paired with too much spin) wastes forward ball speed and balloons the flight, costing carry rather than adding it. Tour players optimize launch and spin together to a window matched to their ball speed, not to maximum height.","\"Launch angle and spin loft are the same thing.\" They share the same two inputs (dynamic loft, attack angle) but combine them with opposite signs on attack angle: launch = (a quadratic in loft) + 0.25*attack (attack adds), spin loft = the 3-D angle between face and path, whose vertical part is loft - attack (attack subtracts). A steeper downward attack angle raises spin loft/backspin while it actually slightly lowers launch angle — they are siblings, not twins.","\"A slow swinger and a tour pro should aim for the same launch angle.\" No — the optimal launch angle depends on ball speed. Slower swingers need proportionally more launch angle and less spin to maximize carry, which is why fitters give different launch/spin targets to different swing speeds rather than one universal number.","\"Scooping or trying to 'help' the ball up increases launch angle.\" On a normal iron strike, dynamic loft is already doing more than twice attack's share of the launching by design; scooping mostly adds inconsistent, thin or fat contact rather than meaningfully raising launch, because it fights the descending attack angle the club was built to use."],"wolframChecks":["launchAngle: 10.3919 - 0.1694 x 30 + 0.0120247 x 900 + 0.25 x (-3) = 15.38 -> the default 7-iron engine launch (dynamic loft 30, attack -3), close to the ~16.1° a real tour 7-iron shows on a launch monitor.","16.1 - 15.38 = 0.72 -> the engine's 7-iron launch sits about 0.72° below the measured TrackMan tour-average launch, a good illustrative match.","engine launch at 18° loft with -1.3° attack = 10.91 -> a driver-plausible input (18° dynamic loft, -1.3° attack, the slightly descending tour-average strike) lands within ~0.02° of the ~10.9° driver tour average, even without a dedicated driver preset.","engine launch at 10° loft with -5° attack = 8.65 -> a low-lofted driver chopped down on launches only ~8.7°, the low-launch half of the classic low-launch/high-spin miss.","ballistics-only apex (no lift): (74.66 m/s)^2 x sin(10.4°)^2 / (2 x 9.81 m/s^2) = 9.26 m = 10.12 yd -> a spinless tour drive would peak ~10 yd, versus the measured ~30 yd, so Magnus lift from backspin (not launch angle) does most of the height.","engine check: launchAngle depends only on dynamicLoft and attackAngle, with no clubSpeed term -> dragging club speed leaves the launch readout fixed while ball speed, carry and apex all move, confirming launch is speed-independent."],"quiz":[{"q":"In Flightglass's engine, launch angle is calculated as:","options":["Dynamic loft minus attack angle","a quadratic in dynamic loft plus 0.25 x attack angle","Club speed x smash factor","Face angle x 0.75 + club path x 0.25"],"answerIndex":1,"explanation":"Launch angle blends a quadratic dynamic-loft term with a flat 0.25-per-degree attack term — loft-dominant above 17.44° of loft, with attack only nudging it. A default 7-iron strike (30° dynamic loft, -3° attack) launches at 15.38°, close to the ~16.1° a real tour 7-iron shows on a launch monitor. Dynamic loft minus attack angle is a different quantity, spin loft, which drives backspin, not launch angle."},{"q":"A player wants to raise their driver's launch angle and lower their spin at the same time — the classic 'launch high, spin low' fitting goal. Which single change to attack angle does both?","options":["Hit down more steeply (more negative attack)","Hit up more (more positive attack)","Attack angle can only affect one of the two, never both","Keep attack angle at exactly zero"],"answerIndex":1,"explanation":"Attack angle has opposite signs in the two formulas: launchAngle takes +0.25*attack (attack adds) but spinLoft takes it the other way, its vertical part being loft - attack (attack subtracts). Hitting up therefore raises launch angle a little while lowering spin loft — and backspin — a lot, exactly why fitters have players tee the ball higher and move it forward to hit up on the driver."},{"q":"Tour average launch angle for a 7-iron is about 16 degrees, while a driver averages about 11 degrees, even though the 7-iron is swung much slower. Why does the slower club launch higher?","options":["Slower swings always launch higher, regardless of loft","The 7-iron's much greater dynamic loft (~30° vs ~11-18°) dominates the formula despite its steeper, negative attack angle","Attack angle matters more than loft for irons","Launch angle is unrelated to loft or club speed"],"answerIndex":1,"explanation":"Dynamic loft carries 0.55° per degree at a 7-iron, but only 0.12° at a 12° driver loft, against attack's flat 0.25° at every loft, so the 7-iron's ~30° of loft overwhelms its negative (-3 to -4°) attack angle, while a driver's much lower dynamic loft keeps launch low even though its attack angle is far shallower (about -1.3° on tour)."},{"q":"Without any backspin, pure ballistics predicts a tour driver's launch conditions (167 mph, ~10.4°) would peak at only about 10 yards. Measured tour apex is about 30 yards. What accounts for the extra height?","options":["Launch angle alone fully explains the difference","Backspin's Magnus lift adds upward force throughout the flight, roughly tripling the peak height beyond what launch angle alone would produce","Launch monitors measure apex inconsistently","Wind always adds exactly 20 yards of height"],"answerIndex":1,"explanation":"Launch angle only sets the ball's initial direction. Once airborne, backspin creates Magnus lift (shown in the Backspin lesson to exceed 2x the ball's weight at speed) that keeps pushing the ball upward well past where simple no-spin ballistics would have it falling — which is why real apex (~30 yd) is roughly 3x the no-lift prediction (~10 yd)."},{"q":"An amateur hits their driver with a -5° (steeply descending) attack angle and only 10° of dynamic loft. Using the engine's formula, roughly what launch angle results, and what does that predict for the shot?","options":["About 15° — a well-optimized, tour-like launch","About 9° — a low launch that, combined with the steep attack's higher spin loft, tends to balloon and fall short","About 25° — far too high","Attack angle this steep makes launch angle impossible to calculate"],"answerIndex":1,"explanation":"the engine gives 8.65°, about 9° — still a low launch. Worse, that same -5° attack angle raises spin loft (loft minus attack = 15°), so the shot combines low launch with relatively high spin: the classic low-launch/high-spin miss that kills driver distance, the opposite of the tour's high-launch/low-spin recipe."}]}
  </script>
  <script type="application/json" id="lesson-start-direction">
{"parameter":"Start Direction","oneLiner":"Start direction is the initial line the ball leaves the clubface on, before any curve is added - and it is set mostly by where the face points at impact, not by the club's swing path, with the exact split shifting by club.","whatItIs":"Start direction is the initial horizontal line the ball is travelling on the instant it leaves the clubface - measured in degrees left or right of the target line, before any sideways curve has had a chance to act on it. It answers one narrow question: which way did the ball launch, not which way did it end up. For decades, golf instruction taught that this was mostly decided by the club's swing path (the classic 'path is king' rule of thumb, roughly path 80% / face 20%). TrackMan's launch-monitor research (the 'D-Plane' model) overturned that: face angle at impact is actually the dominant factor, contributing somewhere between about 60% and 85% of start direction across real club lofts, with swing path filling in the rest. Flightglass's engine encodes this exact, loft-dependent blend: startDirection = faceW*faceAngle + (1-faceW)*clubPath, where faceW tapers from ~0.85 on a low-lofted driver down to the engine's floor of ~0.60-0.625 on a high-lofted wedge. Start direction then feeds directly into Offline (the final sideways miss), together with Curve - so getting comfortable with 'face mostly, path a little, and it shifts by club' is the single most useful direction-fixing idea in the whole bag.","components":[{"name":"Face angle at impact","role":"the dominant lever. Where the clubface points at impact relative to the target line at the moment of contact. In Flightglass's engine it carries 60-85% of the start-direction weight depending on the club (faceW = clamp(0.90 - dynamicLoft*0.005, 0.60, 0.88) - the 0.88 cap would need 4° of dynamic loft, so no real club reaches it: a 10.5° driver measures 0.8475 and a 60° lob wedge sits on the 0.60 floor), which is exactly the loft-dependent split TrackMan's D-Plane research established. Face angle is mostly a hands/grip/clubface-control variable, distinct from swing direction.","typicalRange":"tour driver/iron ~ -2 to +2° (near square); amateur slicers commonly 3-6+° open"},{"name":"Club path at impact","role":"The secondary lever - the horizontal direction the club-head is actually travelling through impact (in-to-out = positive/right, out-to-in = negative/left). It only gets 15-40% of the say in where the ball starts (it matters far more for curve, a separate node). Its share grows as loft increases.","typicalRange":"tour driver ~ -1 to +3° (often in-to-out); iron/wedge ~ -2 to +2°"},{"name":"Dynamic loft / club selection","role":"Not a direction input itself - it is the dial that sets how much face vs. path matter. Lower loft (driver) -> more face-dominant (~85%); higher loft (wedge) -> path talks more (a 55° wedge is ~62% face / 38% path; a 60° lob wedge sits on the engine's 60/40 floor). This is why a driver miss 'feels like the face' and a wedge miss 'feels like the path'.","typicalRange":"driver ~9-13°; 7-iron ~28-32° dynamic; wedge ~45-60°"},{"name":"Carry / club length (the yardage amplifier)","role":"Not a cause of start direction, but the reason the same angular error matters more with longer clubs: offline-at-start = carry x sin(startDirection). A given face error is weighted more heavily on a driver and travels farther, so it compounds into more yards.","typicalRange":"wedge carry ~80-120 yd; 7-iron ~150-180 yd (engine default 174.0 yd); driver ~230-300 yd (tour avg ~275 yd carry)"},{"name":"Attack angle & club speed","role":"not factors in start direction in this model (or the standard D-Plane model) - solveFlight's startDirection formula uses only faceAngle, clubPath and dynamicLoft. Hitting up or down, or swinging faster, changes launch angle, spin loft and ball speed, but does not move the horizontal start line. A very small real-world secondary effect exists via gear effect on off-center strikes, not modelled here.","typicalRange":"0% direct weight on start direction"}],"howTheyConnect":"Contact between clubface and ball lasts roughly half a millisecond. In that instant the ball is compressed against the face and launches largely along the direction the face is pointed - not along the direction the club-head is swinging. This is the corrected physics behind TrackMan's 'D-Plane' / 'New Ball Flight Laws': for decades golf instruction taught that swing path was ~80% of start direction and face only ~20%; TrackMan's launch-monitor data flipped that, showing face dominates (roughly 60-85% across real club lofts) and path plays the smaller supporting role. Flightglass's engine encodes this directly: startDirection = faceW*faceAngle + (1-faceW)*clubPath, where faceW is not a fixed constant but tapers with dynamic loft (faceW = clamp(0.90 - dynamicLoft*0.005, 0.60, 0.88)). Physically, more loft means a more glancing, higher-friction contact where the ball skids a little further along the path direction before it releases, letting path 'talk' more (a 55° wedge: 62.5% face / 37.5% path); a nearly flat-faced driver contact is closer to a pure face-angle launch (~85% face / 15% path). Crucially, none of this depends on attack angle or club speed - those variables live entirely in the vertical/spin side of the model (spin loft, launch angle, ball speed) and never enter the startDirection formula. Once the ball leaves the face on this start line, that line becomes the baseline the rest of the flight bends away from: the graph's own dependency edge runs start-direction -> offline, and the engine's offline field is exactly carry*sin(startDirection) plus a separate curve term driven by spin axis (face-to-path gap, not face alone). So start direction answers 'which way did it launch' and spin axis/curve answers 'which way did it bend after that' - two different questions that share the same two raw inputs (face, path) but combine them completely differently.","hierarchy":[{"driver":"Face angle at impact","weight":"dominant - 60% (60° lob wedge) to 85% (driver) of start direction, formula-verified: faceW = clamp(0.90 - dynamicLoft*0.005, 0.60, 0.88) gives 0.75 (7-iron), 0.8475 (10.5° driver), 0.625 (55° wedge) and 0.60 (60° lob wedge, the clamp floor).","why":"Wolfram-verified: a 2° open face with a square path alone starts a driver 1.695° right (0.8475*2) and a 7-iron 1.5° right (0.75*2). At tour carry that is ~8.1 yd of pure start-line miss on the driver (275*sin(1.695°)=8.13 yd) vs ~4.6 yd on the 7-iron (173.93*sin(1.5°)=4.55 yd) - before any curve is added. This is the corrected, TrackMan-era finding that overturned the old '80% path' teaching."},{"driver":"Club path at impact","weight":"secondary - only 15% (driver) to 40% (60° lob wedge) of start direction; its share is the exact complement of face weight and grows as loft increases.","why":"The same 2° path error (face held square) shifts a driver's start line only 0.305° (0.1525*2) but a 55° wedge's start line 0.75° (0.375*2) - path 'talks' roughly 2.5x more, proportionally, on the most lofted clubs. Path matters far more for curve (a separate node) than for where the ball starts."},{"driver":"Dynamic loft / club selection (the blend dial)","weight":"Indirect - moves 0 yards on its own, but re-weights levers 1 and 2: driver-to-lob-wedge slides faceW from 0.8475 down to the engine's floor of 0.60-0.625.","why":"This is why a driver miss reads as 'my face was off' while a chunked wedge reads as 'my path/direction was off' - the same swing fault (a slightly open face) is diagnosed differently by feel because the underlying blend genuinely shifts with the club in your hands."},{"driver":"Carry distance / club length (the yardage amplifier)","weight":"Not a direction input, but the multiplier that turns a fixed angular error into yards: offline-at-start = carry * sin(startDirection).","why":"From the identical '2° open face, square path' scenario, the driver's combination of higher face-weight and longer carry (275 yd) yields ~8.1 yd of start-line miss, while a ~100-yd wedge shot with a comparable 1.25° start (lower face-weight, 0-path case) yields only ~2.2 yd (100*sin(1.25°)=2.18 yd) - roughly a 3.7x gap, purely from combining higher face-weight with a longer flight."},{"driver":"Attack angle & club speed","weight":"zero direct weight - absent from the startDirection formula entirely.","why":"solveFlight computes startDirection = faceW*faceAngle + (1-faceW)*clubPath only; attackAngle and clubSpeed never enter that line (they drive spin loft, launch angle and ball speed instead). Golfers who 'try to hit it more left by hitting down more' are chasing a lever that, in this model and in the standard D-Plane physics, does not exist for start line."}],"realWorld":{"tourBenchmarks":["PGA Tour averages (widely published TrackMan/launch-monitor data): driver clubhead speed ~113 mph, ball speed ~167 mph, carry ~275 yd (~296-300 yd total with roll) - used here as the reference driver carry for start-line-yardage math.","Tour players typically keep face angle within roughly a degree of square on full swings; with face carrying 75-85% of the start-direction weight for mid-iron-to-driver lofts, that sub-1-° face control is what lets tour pros start the ball on a repeatable line even when their swing paths differ from player to player (a strong in-to-out 'draw' path vs a milder 'fade' path).","Engine-true: a 2° open face with a square path alone starts a tour driver 1.695° right - at a 275-yd tour carry that is ~8.1 yd of pure start-line miss (275*sin(1.695°) = 8.13 yd, Wolfram-verified), before any curve is added on top.","Engine-true: the identical 2° open face on a 174-yd 7-iron only starts the ball 1.5° right (~4.6 yd of miss: the engine carries 173.93 yd with that open face, and 173.93*sin(1.5°) = 4.55 yd) and on a ~100-yd wedge shot just 1.25° right (~2.2 yd, 100*sin(1.25°) = 2.18 yd) - the driver amplifies the same face error by roughly 3.7x versus a wedge, from higher face-weight (84.75% vs 62.5%) compounding with 2.75x more carry.","Rule-of-thumb, trig-verified: cot(1°) = 57.30, so a golfer can estimate roughly 1 yard of start-line miss for every 57 yards of shot distance, for every degree the ball starts off target."],"scenarios":["The classic 'banana' slice: an amateur's face is open both relative to target and relative to their (often out-to-in) path. Because face dominates start direction, the ball starts right of target (the push component); because the face is also open relative to path, spin axis tilts and the ball curves further right after launch - the two-part 'starts right, curves right' shape golfers call a slice.","The mirror-image 'pull-hook': face closed relative to target and path left of target - the ball starts left and keeps curving further left.","Tour players shaping shots on purpose hold the face open or closed relative TO their path, not relative to the target - e.g. a controlled power fade is 'aim the path a few degrees right of target, hold the face just closed enough relative to that path (but still slightly open to the target) so it starts right and drifts back'.","A weak grip that leaves the clubface open at impact is one of the most common amateur swing faults, and it is the textbook cause of a push or slice off the tee - because driver is both the most face-dominant club (~85%) and the longest-flying, that same grip fault produces a bigger offline miss with driver than the identical face fault would with a wedge or short iron."],"whatItMeansForYou":"If your shots are starting off-line, check your face first - it is doing roughly 60-85% of the work, and even more so with driver in your hands. Working on swing path alone will only nudge your start line a little; its bigger job is reshaping curve, not launch direction. And because a given face error costs more yards the longer the club, tightening face control matters most with driver - the same roughly-2-degree open face that is about a 2-yard miss with a wedge is closer to an 8-yard miss off the tee."},"misconceptions":["\"Swing path is what starts the ball.\" This was the pre-TrackMan teaching. Face angle actually dominates (about 60-85% across real club lofts); path only contributes the remainder. A player can have a wildly in-to-out path and still start the ball left if the face is closed enough.","\"Attack angle (hitting up or down) changes your start line.\" It does not, in this model or in the standard D-Plane physics - attackAngle never appears in the startDirection formula. Attack angle changes launch angle and spin loft, both vertical/spin quantities, not the horizontal start line.","\"A push and a slice are the same miss.\" A push is a pure start-line issue (face-dominated, ball starts right and flies straight-ish). A slice adds curve on top, from a face-to-path gap driving the spin axis. Same starting symptom, two different causes, two different fixes.","\"Path's importance is the same for every club.\" False - the model's face weight is loft-dependent, so path has roughly 2.6x more proportional say on a 60° lob wedge (~40%) than on a driver (~15%).","\"A 2° face error is a 2° face error, full stop.\" True in degrees, but not in yards: because offline-at-start scales with carry (offline = carry * sin(startDirection)), the identical angular error is worth roughly 3-4x more yards off a driver than off a wedge, purely from flying farther on a club that also weights face more heavily.","\"Aiming your body/stance is the same as aiming the clubface.\" They are separate variables in the model (face angle vs club path) and in reality - grip and hand position control face angle largely independently of where the body/swing direction is aimed."],"wolframChecks":["faceW formula check: 0.90 - 30*0.005 = 0.75 (7-iron face weight, matches engine's sourced comment of ~75%).","faceW formula check: 0.90 - 10.5*0.005 = 0.8475 (driver face weight, matches engine's sourced comment of ~0.85, within the 0.60-0.88 clamp).","faceW formula check: 0.90 - 55*0.005 = 0.625 (55° wedge face weight, matching the engine's sourced ~0.62 comment); 0.90 - 60*0.005 = 0.60 (60° lob wedge, sitting exactly on the engine's 0.60 clamp floor).","startDirection blend check: 0.75*2 + 0.25*0 = 1.5 (7-iron, 2° open face, square path).","startDirection blend check: 0.8475*2 + (1-0.8475)*0 = 1.695 (driver, same 2° open face, square path).","startDirection blend check: 0.625*2 + 0.375*0 = 1.25 (55° wedge, same 2° open face, square path).","offline-at-start check: 173.93*sin(1.5°) = 4.553 yd (7-iron pure start-line miss; 173.93 yd is the engine's carry with the face 2° open, a shade under the 174.0 yd square-face default).","offline-at-start check: 173.54*sin(3.75°) = 11.35 yd (7-iron, larger 5° face-angle example; engine carry is 173.54 yd at that face angle).","offline-at-start check: 275*sin(1.695°) = 8.134 yd (tour driver pure start-line miss, using tour-average 275 yd carry).","offline-at-start check: 100*sin(1.25°) = 2.181 yd (short wedge shot pure start-line miss).","engine carry cross-check: the default 7-iron (90 mph, 30° dynamic loft, -3° attack) leaves the face at 122.56 mph of ball speed, and the engine's carry fit gives 0.9206*122.56 + 0.004072*122.56^2 = 174.0 yd - the 174-yd default 7-iron carry used throughout this lesson.","trig rule-of-thumb: tan(1°) = 0.017455, so cot(1°) = 57.2900 -> confirms the 'about 1 yard of miss per 57 yards of shot distance, per degree of start-line error' heuristic used in the real-world section."],"quiz":[{"q":"In the D-Plane model, what does the most to determine where the ball initially starts (before any curve)?","options":["Club path","Face angle at impact","Attack angle","Club speed"],"answerIndex":1,"explanation":"Face angle carries 60-85% of the start-direction weight depending on the club (Flightglass engine: faceW = clamp(0.90 - dynamicLoft*0.005, 0.60, 0.88); the 0.88 cap needs 4° of dynamic loft, so real clubs top out near 0.85). This is the corrected, TrackMan-era finding that replaced the older belief that swing path was ~80% of start direction."},{"q":"A 7-iron and a driver are both struck with an identical 3° open face and a perfectly square (0°) path. What happens?","options":["Both start exactly 3° right - face angle is face angle","The driver starts more right than the 7-iron, because lower-lofted clubs weight face angle more heavily","The driver starts less right, because path matters more on a driver","Neither ball moves off target since the path is square"],"answerIndex":1,"explanation":"Face weight rises as loft falls: the driver's faceW is ~0.8475 (start = 2.54° right) versus the 7-iron's 0.75 (start = 2.25° right). Lower-lofted clubs are more face-dominant, so the same face error pushes the driver further off line in degrees."},{"q":"A wedge shot has a square (0°) face but a +4° in-to-out path. Which variable, if changed, would have NO effect on this shot's start direction?","options":["Club path","Face angle","Attack angle","Dynamic loft (via the face/path blend)"],"answerIndex":2,"explanation":"Attack angle never appears in the startDirection formula - it only affects launch angle and spin loft. Changing it would alter how high the ball launches and how much it spins, but not which way it starts."},{"q":"Why does the same 2° face-angle error (path held square) cost noticeably more yards off a driver than off a wedge?","options":["It doesn't - the yardage loss is identical for every club","The driver weights face angle more heavily and flies much farther, so the angular miss compounds with distance (offline = carry x sin(startDirection))","Wedges have no measurable face angle at impact","Path fully cancels out any face error on wedges"],"answerIndex":1,"explanation":"With the driver's higher face weight (~85% vs ~60-62%) and its much longer carry (~275 yd vs ~100 yd), the same 2°-class face error works out to roughly 8 yd of start-line miss off the driver versus roughly 2 yd off a wedge - about a 3.7x gap, purely from combining a bigger blend weight with a longer flight."},{"q":"A ball starts about 3° right of target and then keeps curving further right as it flies. What is most likely happening?","options":["Only the path is off - the face is perfectly square","The face is open relative to target (pushing the start line right) and open relative to path (driving spin axis / curve further right) - a classic push-slice","This is purely a launch-angle problem","Backspin is simply too high"],"answerIndex":1,"explanation":"The initial 3° right comes from the face-dominant start-direction blend. The continued curve after launch comes from a separate mechanism - the face-to-path gap driving spin axis tilt. A shot that starts right and keeps bending right is showing both effects at once: an open face relative to target (start) and open relative to path (curve)."}]}
  </script>
  <script type="application/json" id="lesson-spin-axis">{"parameter":"Spin Axis","oneLiner":"Spin Axis is the sideways tilt of the ball's spin away from pure backspin - set by the gap between where the face points and where the club is travelling - and it decides which way, and how sharply, the shot curves.","whatItIs":"Spin Axis is the sideways tilt of a golf ball's total spin away from a pure, level backspin. Picture the ball's spin as an arrow poking out of one pole of the ball: if that arrow points straight left-to-right (perfectly horizontal), the ball spins purely backward, generates only lift, and flies straight. Tilt that arrow even a little - the top of the axis leaning right or left - and some of the same spin gets redirected into sideways curve instead of pure lift, bending the shot into a draw, fade, hook, or slice. Crucially, spin axis is not about how much the ball spins (that's backspin's job); it's about which direction that spin points. The tilt is created at impact by the gap between where the clubface is aimed and the direction the club is actually travelling (face angle minus club path) - the horizontal-plane twin of spin loft, which is the same idea in the vertical plane. Flightglass's engine takes this literally rather than by formula: spin axis is the angle by which the impact spin vector - the ball's velocity crossed with the face normal - leans away from horizontal. The face-to-path gap decides which way it leans (positive tilts the axis right, which curves the ball right for a right-handed golfer, a slice or fade; negative tilts it left, a hook or draw), while dynamic loft and attack angle decide how strongly that same gap leans it. That tilt then feeds the engine's curve field - the sideways bend in yards, integrated from the flight itself rather than read off a formula - and offline, the total sideways miss, which also folds in start direction.","components":[{"name":"Face Angle","role":"Where the clubface points at impact relative to the target line. It is the dominant input for start direction (~60-88% weight, loft-dependent: 88% at 4 deg loft, 84.5% on an 11 deg driver, 75% on a 7-iron, 65% on a 50 deg wedge), but for curve it only matters as one half of the face-to-path gap — it pulls on spin axis with exactly the same 1° = 1° weight as club path does.","typicalRange":"diagram range -8 to +8°; tour irons commonly within about +/-2° of the intended aim"},{"name":"Club Path","role":"The horizontal direction the clubhead is travelling through impact (in-to-out = positive/right, out-to-in = negative/left). It is the minor partner for start direction, but the co-equal partner (with face angle) for spin axis — path and face pull on curve with identical weight.","typicalRange":"iron path roughly -4 to +4°; tour drivers often +2 to +6° (in-to-out)"},{"name":"Face-to-path gap (faceAngle - clubPath)","role":"the quantity that actually creates spin axis tilt. A wide-open face relative to the path (or a big out-to-in path relative to the face) creates a large gap; a gap near zero means face and path are aimed the same way and the shot flies straight regardless of where either one points relative to the target.","typicalRange":"engine thresholds: <0.75° = Straight, 0.75-6° = Fade/Draw, >6° = Slice/Hook"},{"name":"Spin Axis (the output)","role":"The tilt of the ball's total spin vector away from a pure, level backspin axis. 0° = pure backspin (dead straight, all lift, no curve); as the axis tilts, some of that same spin gets redirected sideways into curve. Engine: the exact tilt of (velocity x faceNormal) from horizontal - the face-to-path gap sets its direction, loft and attack angle its strength.","typicalRange":"tour ~2-5° (small controlled fade/draw); recreational slice 15-30°; no engine ceiling at all — measured, a 10° gap on an 11° driver tilts 35.2°, a 30° gap tilts 68.8°"},{"name":"Carry distance / hang time","role":"Not a spin generator at all, but the multiplier that turns a fixed axis tilt into yards of sideways curve — within one club. Because the sideways force acts on the ball for its whole time in the air, a longer flight compounds the same tilt, and it compounds harder than multiplying the carry ratio by itself would suggest. Hold the tilt at 10.958° on a 7-iron (7° gap, loft 30, attack -3, club speed alone varying): 124.6 yd of carry bends 7.05 yd, 223.4 yd bends 27.68 yd. That is 1.79× the carry buying 3.93× the curve, where the carry ratio times itself accounts for only 3.21×. Across different clubs this does not transfer, because total spin changes too. The engine integrates the flight; it never evaluates a distance term.","typicalRange":"wedge ~113 yd carry (50°, 75 mph), 7-iron ~173 yd, driver ~272 yd - but the same axis tilt curves the driver only ~1.1x more than the iron (measured), because the driver's much lower total spin cancels most of the extra flight time"},{"name":"Gear effect / strike location (off-center hits)","role":"On real clubs - especially a large, springy driver face - hitting the toe or heel spins the ball around its own vertical axis independent of face/path, nudging the effective spin axis a few extra degrees. Real and well documented in club-fitting, but not modeled by this engine (face/path only).","typicalRange":"toe/heel misses can shift the resulting curve by several degrees beyond what face and path alone predict"},{"name":"Total spin magnitude (club-dependent)","role":"Spin axis is a tilt (a fraction), not an amount. The same axis-tilt fraction redirects a very different absolute rpm sideways depending on how much total spin the club produces in the first place (driver ~2,700 rpm vs wedge ~9,000 rpm, from the Backspin lesson).","typicalRange":"driver ~2,200-2,900 rpm total; 7-iron ~6,500-7,500 rpm; wedge ~8,000-9,000 rpm"}],"howTheyConnect":"Backspin and spin axis are the two halves of one physical quantity - the ball's total spin vector at impact - split along two different mismatches. Spin loft (dynamic loft minus attack angle) is the vertical mismatch between where the face points and where the club travels, and it sets how much the ball spins. Spin axis is the horizontal mismatch - face angle minus club path - and it sets which way that spin vector tilts: dead level (0°) means pure backspin and a straight flight; tilted right or left redirects a slice of that same spin sideways. The split is very nearly clean: the backspin the engine reports is the part of the spin vector lying along the flight, which is total spin times the cosine of the tilt, near enough at normal tilts (on this 7-iron delivery it has drifted only about 0.64% by a 15° tilt). Measured on a 7-iron at 90 mph (loft 30, attack -3): a square face gives 6,623.1 rpm total at 0° tilt, all of it backspin; a 4° open face gives 6,662.4 total at 6.322° tilt (6,614.7 backspin, 789.1 sidespin); an 8° open face gives 6,778.1 total at 12.471° tilt (6,589.5 backspin, 1,574.5 sidespin) - even at a big gap almost all of the spin is still working as lift. So these are not two independent fields with two independent formulas; they are two readings of one vector, which is why the engine measures the tilt geometrically instead of scaling the gap. The gap sets the direction of the tilt, and loft and attack angle set its strength - and that second half is where the real forgiveness lives. The same 6° face-to-path gap tilts an 11° driver's axis (113 mph, attack -3) 22.974° but a 50° wedge's (75 mph, attack -3) only 4.803°, about 4.8x more for the identical error, purely from geometry. Once the ball leaves the face, that tilted spin creates a Magnus force pointing partly sideways as well as up, and because the ball is under this steady sideways push for its entire hang time the lateral deflection keeps compounding - the engine has no closed-form curve law at all, it integrates the flight under drag and lift. Held at one fixed 10.958° tilt on the 7-iron, 124.6 yd of carry bends 7.05 yd while 223.4 yd bends 27.68 yd: 1.79x the distance, 3.93x the curve, so within a club curve outgrows carry instead of merely tracking it. One more piece keeps this whole model coherent: a golf ball's angular momentum at typical spin rates is large (a 6,600-rpm ball's spin angular momentum works out to about 0.0058 kg m^2/s from a solid-sphere moment of inertia of 8.33e-6 kg m^2), which makes the spinning ball gyroscopically stable - the tilt set in the half-millisecond of contact stays essentially fixed for the whole flight rather than drifting. That is exactly why a single \"spin axis\" number, read the instant after impact, is enough to predict the entire shape of the shot from launch to landing.","hierarchy":[{"driver":"Face-to-path gap (faceAngle minus clubPath)","weight":"sets the direction outright, but not the size. Measured on a 7-iron at 90 mph: a 2° gap tilts the axis 3.172°, 4° gives 6.322°, 6° gives 9.428°, 8° gives 12.471° - near a fixed multiple, never exactly one, and never clamped.","why":"Spin axis has exactly one geometric cause in this model: how far the face is aimed away from where the club is actually travelling. Zero gap means zero axis tilt and a dead-straight shot no matter where either number points relative to the target - this is the whole 'new ball flight laws' finding TrackMan popularized."},{"driver":"Carry distance / hang time (compounding multiplier)","weight":"No formula - curve is integrated from the flight. Measured at a fixed 10.958° tilt on a 7-iron: 124.6 yd of carry bends 7.05 yd, 223.4 yd bends 27.68 yd - 1.79x the carry for 3.93x the curve. Within one club it outgrows distance, it does not merely track it.","why":"Curve is not created at impact, it accumulates in flight from a steady sideways force acting for the whole hang time. A longer flight (more carry, more time) lets the same sideways push compound much further within a given club. Across clubs it is loft, not distance, that does the heavy lifting: measured, the same gap tilts a driver's axis 2-5x harder than a wedge's, which is why the exact same swing fault is nearly invisible on a wedge and a disaster off the tee."},{"driver":"Face angle (as the gap's larger, more-aimed-at half)","weight":"Pulls on spin axis 1:1 with club path - not weighted ~60-88% like it is for start direction.","why":"Golfers often assume the club that dominates start direction also dominates curve. It doesn't: for spin axis face and path are exactly equal partners, so 'aim the face' fixes start line but does nothing for curve unless the path also changes to match it."},{"driver":"Club path (the gap's other, equally-weighted half)","weight":"Pulls on spin axis 1:1 with face angle, despite being the minor (~12-40%) contributor to start direction.","why":"Path is the lever most golf instruction actually targets for curve (an over-the-top out-to-in path is the classic slicer's path fault) precisely because, for axis tilt, it carries the same weight as the face - closing the path closes the gap just as effectively as squaring the face."},{"driver":"Gear effect / strike location (off-center hits)","weight":"Not modeled by the engine at all; in real clubs, especially a large driver face, toe/heel contact can shift the effective curve by several degrees beyond face and path alone.","why":"It is a genuine third input to real-world spin axis (rotation imparted by the club's centre-of-gravity offset on an off-centre hit) that a face/path-only model cannot capture - flagged here as the honest limit of the engine's simplification."},{"driver":"Total spin magnitude (club-dependent)","weight":"Second-order for the axis number itself, but it sets what that tilt fraction means in absolute rpm - driver ~2,700 rpm total vs wedge ~9,000 rpm (Backspin lesson).","why":"Spin axis is a tilt/fraction, not an amount, so it interacts with - but is computed independently of - how much total spin the strike produced. The same 10° tilt redirects a very different absolute sidespin rpm by club, even though the engine treats backspin and spinAxis as separate, uncoupled fields (a known simplification vs. true physics, where axis tilt technically trims a little backspin too)."}],"realWorld":{"tourBenchmarks":["PGA Tour driver: ~113 mph clubhead speed, ~167 mph ball speed, ~275 yd carry, ~2,700 rpm backspin (Backspin lesson) - and spin axis tilt kept tight, typically in the roughly 2-5° range (a small, intentional draw or fade), because tour players manage the face-to-path gap closely.","PGA Tour 7-iron: ~120 mph ball speed, ~172 yd carry, ~7,000 rpm backspin (Carry lesson) - spin axis tilt usually even tighter than the driver's, partly because a shorter, higher-lofted shot is more forgiving of small mismatches.","Recreational slice (a very common amateur miss): face-to-path gaps of 8-15+° are common off the tee, and measured on an 11° driver at 113 mph (attack -3) those come out at 29.5° to 46.5° of axis tilt - a 4° gap is already 15.8° and a 6° gap 23.0°.","Driver, measured: a face +2° / path -5° strike (a 7° gap) on an 11° driver at 113 mph with a -3° attack tilts the axis 26.31° and curves the ball 42.90 yd - and nothing caps it, because the tilt is geometry. The same strike on a 50° wedge at 75 mph, same -3° attack, tilts only 5.60° and curves 5.76 yd."],"scenarios":["Two golfers both miss by about 27 yards off the tee (measured, 11° driver, 113 mph, attack -3). One hit a straight push: face and path both 6° right, a zero gap between them, spin axis 0.000°, curve 0.00 yd - 27.01 yd offline purely because the ball started right and flew dead straight. The other hit a fade that got away: face 2° open, path 1° left, a 3° gap, spin axis 11.976° and 20.05 yd of curve - 26.96 yd offline, starting near the target and then bending. Same miss distance, two completely different fixes: the pusher needs to change where they're aimed, the slicer needs to close the face-to-path gap.","A weekend player's 8° face-to-path gap on a 7-iron 'doesn't look that bad' (measured: 12.471° of tilt, 17.96 yd of curve), but the exact same gap with the driver becomes 29.460° of tilt and 47.56 yd of curve. It is not hang time - the driver is actually airborne less long (5.22 s against the iron's 5.67 s). Almost all of the difference is the low loft tilting the axis 2.4x harder for the identical error; the longer carry then adds only about another 1.1x on top (a driver held at the 7-iron's ~12° tilt bends 20.05 yd against the iron's 17.96).","A golfer who fixes an over-the-top, out-to-in path closes the face-to-path gap and watches their curve shrink dramatically - even if their clubface aim (and therefore their start direction) barely changes at all, because start direction and curve are governed by different blends of the same two numbers.","Wedge shots almost never look like they curve, even with an ugly face-to-path gap present - and it is not because they are in the air briefly. Measured at the same 6° gap, a 50° wedge at 75 mph hangs 5.57 s against the driver's 5.42 s, yet it curves 4.96 yd against 37.78. The high loft holds the tilt down to 4.803° instead of 22.974°, and that small tilt then acts over 113 yd of carry instead of 257. The same technical fault is nearly invisible at 113 yards and glaring at 257."],"whatItMeansForYou":"If your miss is a big sideways banana off the tee, look at the gap between where your face is pointing and where your path is actually swinging - not just where you're aimed. Because face and path pull equally on spin axis (unlike start direction, where face dominates), closing that gap by even a few degrees shrinks your curve a lot, and it shrinks it most on your longest club - mostly because low loft tilts the axis far harder for the same mistake, and secondarily because a longer flight compounds that tilt (within one club, curve grows a little faster than the square of carry). The same swing flaw that's barely visible on a wedge can cost you 45+ yards off the driver."},"misconceptions":["\"Club path is what curves the ball, face angle is just for where it starts.\" This is the old, now-debunked golf teaching. Face angle dominates start direction (~60-88% weight, loft-dependent), but for curve, face and path are equal partners - the engine tilts the spin axis off the gap faceAngle − clubPath, a straight 1:1 subtraction with no fitted gain and no clamp. Changing either one by the same amount bends the shot by the same amount.","\"A big slice means a wildly open face.\" It means a big gap between face and path. A face that is only 2° open can still slice hard if the path is 10° out-to-in (a 12° gap) - and a face that is 8° open can fly nearly straight if the path matches it closely.","\"Spin axis and backspin are the same thing / more spin always means more curve.\" They are different fields entirely. A driver can carry very little total spin (~2,700 rpm) but still slice violently if its spin axis is badly tilted; a wedge can spin 9,000 rpm and fly dead straight if its axis is near zero. Total spin sets lift; spin axis sets curve direction and share.","\"The same swing fault curves every club about the same amount.\" Within a club, curve is integrated from the flight and outgrows carry a little faster than its square; across clubs, low loft tilts the axis far harder for the identical error - so a 6° face-to-path gap (face 3° open, path 3° left) that bends a 50° wedge at 75 mph only 4.96 yd (6.74 yd offline) becomes 37.78 yd of curve and 47.06 yd offline off an 11° driver at 113 mph, both at a -3° attack. Same gap, same fault, 7.6x the curve: 4.803° of tilt on the wedge against 22.974° on the driver, and then a longer flight for it to act over. (Offline depends on how the gap splits between face and path; curve does not - face 6°/path 0°, face 0°/path -6° and face 3°/path -3° all curve a 7-iron the same 13.66 yd while landing 27.26, 9.12 and 18.19 yd offline.)","\"Spin axis drifts and changes shape mid-flight (it starts straight then curves late).\" The tilt is set almost entirely at impact and stays close to fixed - the ball is gyroscopically stable (large angular momentum vs tiny aerodynamic torques). What looks like late curve is really the same constant sideways push compounding over time: measured on the fixed-tilt series, 1.84x the hang time bought 3.93x the curve, a little past time-squared - the axis itself is not changing.","\"Toe and heel mis-hits only cost you distance.\" On a driver especially, off-center strikes also impart extra spin via gear effect, nudging the effective spin axis a few degrees beyond what face and path alone would produce - a real-world layer this face/path-only engine does not model."],"wolframChecks":["faceAngle − clubPath = 4 − 2 = 2° -> a 4° open face with a 2° in-to-out path leaves a 2° gap, which the engine's 3-D geometry turns into 3.172° of axis tilt on a 7-iron delivery (loft 30, attack -3, 90 mph) and 4.62 yd of fade. The same 2° gap off a driver (loft 11, attack -3, 113 mph): 8.050° of tilt and 13.52 yd. Same gap, different club, different tilt — that is why no single multiplier fits.","curve is integrated, not scaled from carry: at a fixed 10.958° tilt on a 7-iron, 124.6 yd of carry bends 7.05 yd and 223.4 yd bends 27.68 yd. 223.4/124.6 = 1.793 and 1.793^2 = 3.215, but 27.68/7.05 = 3.926 - about 22% past squared. This holds within one club only.","carry does not transfer across clubs: hold the tilt at ~9° and measure both. A 7-iron (loft 30, attack -3, 90 mph) at 8.997° tilt carries 173.4 yd and bends 13.04 yd; a driver (loft 11, attack 0, 113 mph) at 9.029° tilt carries 272.4 yd and bends 14.46 yd. 272.4/173.4 = 1.571 and 1.571^2 = 2.47, but the measured curve ratio is only 14.46/13.04 = 1.11x. The reason is total spin: 6,703 rpm on the iron against 2,372 on the driver, so the same tilt fraction redirects 1,127 rpm sideways against only 377 - which cancels almost all of the longer flight.","no ceiling - loft governs tilt size: the same 6° face-to-path gap at 90 mph tilts an 11° driver's axis 22.974° and a 50° wedge's 4.803°. 22.974/4.803 = 4.78x, geometry alone.","lift/curve split: cos(29.460°) = 0.871, sin(29.460°) = 0.492 -> at the steepest tilt in the measured driver set (an 11° driver, attack -3, 113 mph, 8° face-to-path gap) about 49% of the spin vector points sideways while ~87% still acts as lift. That is a delivery, not a limit — nothing in the engine restricts the tilt, and a 30° gap on the same driver measures 68.8°. Backspin is the part of the spin lying along the flight, very nearly totalSpin × cos(tilt): exact at zero tilt, drifting about 0.64% by a 15° tilt on the 7-iron.","sin(9°) = 0.1564 -> at a small 9° tilt only ~16% of the spin goes sideways, which is why modest face-to-path gaps curve gently.","gyroscopic stability: a 6,600 rpm ball (solid-sphere moment of inertia ~8.33e-6 kg m^2) carries ~0.0058 kg m^2/s of spin angular momentum, large versus aerodynamic torques -> the axis set at impact stays essentially fixed through the flight."],"quiz":[{"q":"What does Spin Axis actually control, as distinct from Backspin?","options":["How high the ball launches","Which way (and how much) the ball curves sideways - not the total amount of spin","How far the ball rolls after landing","The ball's raw speed off the face"],"answerIndex":1,"explanation":"Backspin is the amount of spin (the lift-making engine). Spin axis is the tilt of that spin vector - 0° is pure backspin (straight), and tilting it right or left redirects part of that same spin into sideways curve. They are two readings of one vector, not two independent fields: the engine measures the tilt geometrically and reports backspin as the part of that spin lying along the flight. Measured on a 7-iron (loft 30, attack -3, 90 mph), an 8° open face gives 6,778.1 rpm total at 12.471° tilt - 6,589.5 backspin, 1,574.5 sidespin."},{"q":"A golfer's face is 4° open and their path is 2° in-to-out — a 2° face-to-path gap, delivered with a 7-iron. What does the engine do with it?","options":["Axis tilt = 12°, a hard slice","Axis tilt = 3°, a mild fade to the right","Axis tilt = -3°, a mild draw to the left","The shot flies dead straight"],"answerIndex":1,"explanation":"faceToPath = 4 − 2 = 2°. There is no gain to apply: the engine measures the axis as the true 3-D tilt of the (velocity × face-normal) axis from horizontal, and on this 7-iron delivery (loft 30, attack -3, 90 mph) a 2° gap comes out at 3.172° — near enough 3°, but geometry rather than a multiplier (the same 2° gap tilts an 11° driver 8.050°). That 2° gap sits between the engine's Straight threshold (0.75°) and its Slice/Hook threshold (6°), so shapeLabel calls it a Fade - a mild rightward bend for a right-handed golfer, not a hard slice."},{"q":"The exact same ~9° spin-axis tilt is present on both a 173-yd 7-iron shot and a 272-yd drive. The engine integrates curve from the flight rather than reading it off a formula - roughly how much more does the drive curve?","options":["About the same amount","About 1.5x more","About 2.5x more","About 10x more"],"answerIndex":0,"explanation":"Curve has no closed form in the engine - it is integrated from the flight - so the only honest answer is a measured one, and the measurement says the drive barely curves more. 7-iron (loft 30, attack -3, 90 mph) at 8.997° of tilt: 173.4 yd carry, 13.04 yd of curve. Driver (loft 11, attack 0, 113 mph) at 9.029° of tilt: 272.4 yd carry, 14.46 yd of curve. That is 1.11x, not 2.5x. Extra carry does multiply curve steeply within one club - pin a 7-iron at 10.958° and change only club speed, and 124.6 yd bends 7.05 yd, 172.1 yd bends 15.61 yd, 223.4 yd bends 27.68 yd - but across clubs the total spin changes too, and the driver's much lower spin (2,372 rpm against 6,703) means the same tilt fraction sends only 377 rpm sideways against the iron's 1,127. That cancels nearly all of the longer flight. What actually makes a driver slice ugly is not its distance but its loft: the same face-to-path gap tilts its axis 2-3x harder in the first place."},{"q":"\"Club path is what curves the ball; face angle only sets where it starts.\" Is that right, per the engine and modern (TrackMan-era) ball-flight teaching?","options":["True - path alone controls curve","False - face angle dominates start direction, and curve comes from the gap between face and path, with face and path weighted equally","False - face angle alone controls both start and curve","True, but only for wedges"],"answerIndex":1,"explanation":"Face angle carries ~60-88% of the weight for start direction (loft-dependent: 84.5% on an 11° driver, 75% on a 7-iron, 65% on a 50° wedge), but the spin axis comes off a plain 1:1 subtraction, faceAngle − clubPath - face and path pull on curve with identical weight. The engine applies no gain to that gap: it measures the axis as the true 3-D tilt of (velocity × face-normal) from horizontal, so the gap sets the direction while the club's loft and attack set how hard it tilts. This reversal (face dominates start, but face and path share curve equally) is exactly the 'new ball flight laws' finding that overturned the old path-curves/face-starts teaching."},{"q":"Which pattern best matches real spin-axis tilts: PGA Tour professionals vs. a typical mid/high-handicap slicer?","options":["Tour players ~2-5° tilt (a small, controlled draw or fade); slicers commonly 15-25+°","Tour players ~20° tilt; amateurs near 0°","Both groups average close to 0°","Spin axis doesn't meaningfully differ by skill level"],"answerIndex":0,"explanation":"Tour players keep their face-to-path gap tight, producing spin-axis tilts typically in the low single digits - a deliberate small draw or fade, not dead-zero. Recreational slicers carry far bigger gaps, and a driver's low loft magnifies them: measured on an 11° driver at 113 mph with a -3° attack, a 4° gap already tilts the axis 15.789° and bends 26.31 yd, a 6° gap tilts 22.974° and bends 37.78 yd, and an 8° gap tilts 29.460° and bends 47.56 yd. So 15-25+° of tilt is an ordinary slicer's delivery, and it is worth roughly 26-48 yards of sideways curve on a full driver."}]}</script>


  <script type="application/json" id="lesson-apex">
{"parameter":"Apex","oneLiner":"Apex is the peak height the ball reaches in flight - in the engine it is driven by ball speed acting as a plain linear multiplier (no ceiling, no saturation) and by launch angle acting mostly as a low-launch cutoff (below about 10 deg the formula shrinks it toward zero); apex is purely cosmetic downstream - it never feeds landing angle or total distance in this engine.","whatItIs":"Apex is simply the highest point the ball reaches above the ground during its flight, measured in yards. In Flightglass's engine, apex is computed directly from ball speed and launch angle: apex = ballSpeed * carryLaunchEfficiency * (0.13006 + 0.007999 * launchAngle), where carryLaunchEfficiency = sqrt(clamp(launchAngle/10, 0, 1)) is the exact same low-launch guard the Carry lesson's formula uses. Measured directly (node solveFlight): a default 7-iron (90 mph club speed, 30 deg loft, -3 deg attack) produces 122.56 mph ball speed, 15.38 deg launch, and 31.02 yd of apex. This is NOT a saturating, ceiling-capped curve - doubling club speed from 60 to 120 mph at the same loft/attack exactly doubles both ball speed (81.71 -> 163.41 mph) and apex (20.68 -> 41.36 yd), confirmed by direct measurement. Apex also does not feed anything else in the engine: landingApexTerm and landingLaunchTerm are hardcoded to 0 in solveFlight() (source-verified), so raising club speed from 90 to 130 mph on the same 7-iron nearly doubles apex (31.02 -> 44.81 yd) while landingAngle and rollFrac stay bit-for-bit identical (50.7899...deg, 0.031315... both runs) - apex is a real, engine-computed number, but a purely cosmetic one once computed.","components":[{"name":"Ball speed","role":"The dominant, unbounded term. Apex scales exactly linearly with ball speed at a fixed launch angle - measured: doubling club speed 60->120 mph doubles both ball speed and apex precisely (ratio 2.00 for both). There is no ceiling constant and no saturating exponential in the real formula; apex just keeps gr
