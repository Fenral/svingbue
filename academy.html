led — solveFlight() takes no altitude input, even though the dependency graph wires altitude→curve for a future Environment-tier lesson. Directionally: thinner air (~14% less dense at Denver, per the Carry lesson's grounded figure) weakens the sideways Magnus force too, so shots curve less at altitude — the flip side of carrying farther.","why":"Curve is an aerodynamic side-force effect, so anything that changes air density changes it — but this driver is currently outside what the interactive diagram can show engine-true, and is disclosed as such rather than faked."},{"driver":"Off-center strike / gear effect (driver-specific, real-world only)","weight":"Can rival or exceed the face-to-path effect on a badly struck driver — entirely absent from this engine, which has no strike-location input among its 5 club-delivery parameters.","why":"A driver's curved, springy face imparts extra sideways spin on toe/heel strikes independent of path or face angle. It's well documented in TrackMan University material as a real curve source golfers should know about, even though this lesson's model cannot represent it — an honest scope limitation, not an error."}],"misconceptions":["\"Club path curves the ball\" (or \"face angle curves the ball\") — wrong; it's the gap between them (face-to-path) that curves it. A path of +10° with a matching +10° open face is dead straight (0° gap) despite huge individual numbers on each.","\"A slice/hook and a fade/draw are different mechanisms\" — they're the same mechanism (face-to-path gap) at different magnitudes. The engine's own threshold: <0.75° gap reads Straight, 0.75-6° reads Draw/Fade, >6° reads Hook/Slice. It's a dial, not a different phenomenon.","\"A shot curves the same amount off every club\" — false, and not by a little. The identical 6° face-to-path gap that nudges a 113.4-yd wedge just 4.96 yd bends a 272.0-yd driver 45.70 yd — 9.2× the curve for the exact same swing fault, off a carry only 2.4× longer. Two things stack: the driver's low loft tilts the spin axis 30.560° where the wedge's tilts 4.803°, and the driver's flight is long enough to turn that much bigger tilt into yards.","\"Curve and offline (total miss) are the same thing\" — curve is only the bend. offline = carry·sin(startDirection) + curve. A pull or push with zero curve can still miss badly from the start line alone; a shot that starts dead-center but curves hard misses just as far, for a completely different reason.","\"More backspin = more curve\" — no. Curve is about the spin axis (which way the backspin tilts), not the total spin rate. Two shots can carry identical backspin rpm and curve completely differently if their axis tilt differs, or curve identically with very different total spin — backspin and spin axis are separate engine fields.","\"Curve only comes from the swing (path/face)\" — true in this engine, but not in reality: a real driver adds curve from off-center strikes via gear effect, a face-design/CG effect this model's 5 inputs (path, face, attack, loft, speed) cannot represent. Worth knowing the model has a real, disclosed blind spot here."],"wolframChecks":["sin(2°)=0.0349, sin(6°)=0.1045, sin(10°)=0.1736, sin(20°)=0.3420 — the sideways (Magnus) spin component starts small and grows slowly, consistent with curve being a subtle, easy-to-miss effect at small axis tilts and an obvious one at slice-sized ones.","Engine curve check: 7-iron (loft 30, −3° attack, 90 mph), path 0°, face +2° → the engine tilts the spin axis 3.172° and the integrated flight bends 4.62 yd. Start direction is 1.50°, and 173.9·sin(1.50°) ≈ 4.55 yd of start-line push, so offline = 4.55 + 4.62 = 9.18 yd — a gentle 'tour fade/draw,' barely visible to the eye.","Engine curve check: the engine's own Slice/Hook threshold is a 6° face-to-path gap, read off the gap itself. A driver delivery just past it — loft 11, +1° attack, 113 mph, face +2 / path −5, a 7° gap — tilts the axis 34.54° and bends 51.04 yd, finishing 55.37 yd offline. That matches the real-world read that a driver curving 50+ yd is unmistakably a slice, not a fade.","Engine curve check: the same face +2 / path −5 fault on a 7-iron (loft 30, 90 mph) tilts the axis only 10.96° against the driver's 34.54°, and bends 15.83 yd against the driver's 51.04 yd — just 31% of the driver's curve from an identical face-to-path gap.","2.08 × 2.08 = 4.31 against a measured 5.31 — the 7-iron speed sweep with the axis tilt pinned at 10.958° (face +2 / path −5): carry 124.1 → 257.8 yd, curve 6.98 → 37.06 yd. Multiplying the carry ratio by itself falls 19% short of what the engine actually bends. Same club, same gap, same tilt, speed the only variable — so flight length alone did it, and no distance law reproduces it.","Engine curve check: one unchanged fault, face +2 / path −5, at each club's own delivery — a 50° wedge at 75 mph bends 5.76 yd (offline 4.87), a 7-iron at 90 mph bends 15.83 yd (offline 16.59), a driver at 113 mph bends 51.04 yd (offline 55.37). Same swing fault, 8.9× more sideways bend on the driver than on the wedge.","Engine scaling check: hold the axis tilt fixed at 10.958° (face +2 / path −5, 7-iron delivery) and vary only club speed. 70 mph carries 124.1 yd and bends 6.98 yd; 120 mph carries 257.8 yd and bends 37.06 yd. Carry rose 2.08×; multiplying that ratio by itself would predict 4.31× the curve, and the engine delivers 5.31×. Curve outgrows the flight that produced it, because a longer flight spends longer under Magnus lift. There is no curve cap in the engine to hide behind.","Engine straight-threshold check: the engine's 'Straight' band is a face-to-path gap under 0.75°, applied to the gap itself rather than to any curve number. At exactly zero gap the engine returns 0.000° of axis tilt and zero curve; right at the 0.75° edge a 7-iron tilts 1.191° and bends 1.74 yd, while a driver tilts 4.231° and bends 6.55 yd. So 'reads as straight' is under ~1.7 yd of bend at 7-iron length but up to ~6.6 yd with a driver — the band is set on the gap, and the yards it hides grow with the club.","50 yards = 45.72 m = 150 ft — a concrete real-world scale check for what a 'big slice' curve number (e.g. the 45.7-55.7 yd driver cases above) actually means walking it off on the range or fairway."],"quiz":[{"q":"What actually determines how much a shot curves sideways in the engine?","options":["Club path alone","Face angle alone","The gap between face angle and club path (face-to-path)","Ball speed alone"],"answerIndex":2,"explanation":"The engine computes spinAxis from faceToPath = faceAngle − clubPath, not from either value on its own. A +8° path with a matching +8° open face gives a 0° gap and a dead-straight shot, no matter how big each individual number is."},{"q":"A 7-iron (carry ≈173 yd) and a driver (carry ≈272 yd) are struck with the same 6° face-to-path gap — the engine's own Slice/Hook threshold. How does the curve compare?","options":["Identical in yards for both clubs","The 7-iron curves more","The driver curves roughly 3.3× more than the 7-iron","Neither club curves at all at that gap"],"answerIndex":2,"explanation":"Measured, not derived from a formula: at a matched 6° gap the 7-iron bends 13.66 yd over 173.3 yd of carry while the driver bends 45.70 yd over 272.0 yd — a ratio of 3.35×, off only 1.57× the carry. Two effects stack, and neither is carry on its own: the driver's low loft tilts the spin axis 30.560° where the 7-iron's tilts only 9.428°, and the driver's longer flight gives that bigger tilt more time to act. Same swing fault, very different result."},{"q":"In the engine, what's the difference between \"curve\" and \"offline\"?","options":["They're the same number under two names","Curve is only the sideways bend from spin axis; offline is the total miss = start-line displacement plus curve","Curve includes wind effects and offline doesn't","Offline only applies to putts, not full shots"],"answerIndex":1,"explanation":"offline = carry·sin(startDirection) + curve. A pushed or pulled shot can finish well off-target with zero curve (pure start-direction error), and a shot that starts dead-center but curves hard misses just as far for a completely different reason — two separate error sources that only offline combines."},{"q":"Per the engine's own shapeLabel thresholds, a face-to-path gap between 0.75° and 6° reads as which shot shape?","options":["Slice / Hook","Draw / Fade","Straight","Push / Pull"],"answerIndex":1,"explanation":"The engine's thresholds: under 0.75° gap = Straight, 0.75-6° = Draw/Fade (a gentle, often intentional curve — 6.55 yd of bend on a driver right at the 0.75° edge, engine-measured), and over 6° = Hook/Slice (45.70 yd of bend on a driver at exactly 6°, and 55.66 yd by 8°)."},{"q":"A golfer says their driver misses look far wilder than their iron misses, even though \"it feels like the same swing.\" What's the most likely explanation?","options":["Drivers have more loft, which curves the ball more","Curve keeps compounding for the whole flight, so a longer carry turns the identical face-to-path gap into far more bend","Driver balls spin backward less, so they curve more to compensate","It's an optical illusion — the curve in yards is actually the same"],"answerIndex":1,"explanation":"It usually IS the same face-to-path gap — the driver just punishes it far harder, and harder than 'squared' suggests. Hold the axis tilt fixed and stretch the flight with club speed alone: a 124.1-yd carry bends 6.98 yd, a 257.8-yd carry bends 37.06 yd — 2.08× the carry giving 5.31× the curve, where squaring predicts only 4.31×. Longer flight, more time under Magnus lift, disproportionately more bend. In real delivery it is worse still, because the driver's low loft also tilts the axis harder for the same gap: one face +2 / path −5 fault bends a wedge 5.76 yd and a driver 51.04 yd."}],"realWorld":{"tourBenchmarks":["PGA Tour average driver (publicly published TrackMan / PGA Tour launch-monitor figures): clubhead speed ≈113 mph, ball speed ≈167 mph, backspin ≈2,545-2,700 rpm — and the key Curve-lesson fact — face-to-path gaps that usually stay inside a couple of degrees, which is why a tour player's 'miss' still finishes in the short stuff rather than in the trees.","Engine-measured against solveFlight(): at the engine's 113-mph driver delivery (loft 11, +1° attack, 274 yd of carry), a tight 2° face-to-path gap tilts the spin axis 11.158° and curves 17.2 yd — a working 'power fade/draw', obvious on a launch monitor and easy to miss by eye.","Recreational golfer (roughly 15-20 handicap) driver slice: face-to-path gaps of 5-10°+ are common and well documented in TrackMan University teaching material — on this driver delivery that is a 26-44°+ spin-axis tilt.","Engine-measured: the same driver with a 6° gap — the engine's own Slice/Hook threshold — curves 45.7 yd over 272.0 yd of carry; at an 8° gap it's 55.7 yd over 270.5 yd. That's the 'two fairways over' miss every slicer recognises.","Engine-measured against solveFlight: the identical 6° face-to-path gap that bends a 272.0-yd driver 45.70 yd bends a 113.4-yd wedge shot only 4.96 yd — 9.2× less curve off a carry 2.4× shorter. It is hang time under Magnus lift, not the gap alone, that sets the bend, and it costs more than squaring the distance suggests.","LPGA Tour average driver (publicly published): clubhead speed ≈94 mph, ball speed ≈140 mph and a shorter carry than the PGA average — and because curve keeps compounding for as long as the ball is airborne, an identical axis-tilt mishit bends fewer yards off the tee for a shorter hitter, even at the same swing 'quality'. The engine shows it inside one club, with the tilt pinned at 30.560° and only speed changing: the same 6° gap bends a 113-mph driver 45.70 yd over 272.0 yd but a 100-mph driver only 31.10 yd over 228.8 yd — 16% less carry buying back 32% less curve, a little more than the 29% that squaring the carry ratio predicts."],"scenarios":["Your 7-iron approach starts right at the flag, drifts a touch, and finishes on the fringe — nobody in the group even calls it a miss. Feed that exact same face-to-path gap into a driver and it is 45 yards off the fairway. Same swing fault, wildly different-looking result — and two separate reasons stack it up. At an identical 6° gap the driver's low loft tilts the spin axis 30.560° against the 7-iron's 9.428°, and its 272.0-yd flight then works on that bigger tilt for longer than the 7-iron's 173.3 yd does. Measured: 45.70 yd of curve against 13.66.","The classic banana slice that finishes on the next hole's fairway isn't bad luck — it's an 8-10°+ face-to-path gap (open face relative to path) sitting on top of a 270-yard flight.","A tour pro's TV-commentator 'stock cut' looks arrow-straight to the eye but is quietly bending 9-13 yards over the flight — visible on a launch-monitor overlay, invisible in real time, because a gap of just 1-1.5° (a 5.6-8.4° axis tilt in the engine) still has 274 yards to work with.","Two golfers swear they made 'the same swing' with driver and 7-iron, but the driver misses the fairway and the 7-iron finds the green. If the face-to-path gap really was identical, the driver was always going to miss by more — it's not a worse swing, it's a longer one.","A hooking pull that starts left and keeps bending left is doubly wrong: it started off-line (start direction) and then curved further the same direction (curve) — two separate errors stacking, not one big one, which is why it can feel like a small mistake produced a huge miss."],"whatItMeansForYou":"If your driver misses look far wilder than your iron misses even though it 'feels like the same swing,' it usually IS the same swing — you're just seeing the identical face-to-path gap magnified by a longer flight, and magnified harder than squaring would suggest. At one unchanged 6° gap the 7-iron bends 13.66 yd and the driver 45.70 yd: 3.35× the curve off only 1.57× the carry, where squaring predicts 2.46×. Chasing the driver slice by fixing the driver alone (a stronger grip just for that club, aiming further left) treats the symptom; closing the same 2-4° face-to-path gap you already carry on your irons — where it costs you only 4.6-9.2 yd — is what actually straightens every club in the bag at once, driver included."}}</script>
  <script type="application/json" id="lesson-offline">{"parameter":"Offline","oneLiner":"Offline is the ball's total sideways miss from target at landing — start-line aim plus in-flight curve — and it grows fast with distance, because curve keeps compounding for the whole flight and outruns the carry that produced it.","whatItIs":"Offline is simply how far left or right of your target the ball ends up when it lands — the number that decides fairway vs. rough, or green vs. bunker. It isn't one thing; it's the sum of two separate effects. First, where the shot starts: the initial direction the ball leaves the clubface, set mostly by where the face was pointing at impact, with a smaller nudge from the swing path. Second, how much it bends after that: the sideways curve that develops in flight because the ball is spinning around a tilted axis rather than a level one, and that tilt comes from the gap between face and path — not either one alone. A shot can start dead on line and still curve badly offline (the classic 'looked perfect, ended up in the trees' slice), or it can start well off line and curve back on target. In the app's engine: offline = carry·sin(startDirection) + curve, where startDirection is a face/path blend and curve is integrated out of the flight — there is no curve formula — and it grows faster than the flight length, faster even than squaring it. That is why the exact same aim-and-path mistake gets punished far more with a driver than with a wedge.","components":[{"name":"Start direction","role":"Where the ball initially leaves the face relative to the target line — a blend of face angle and club path, engine: startDirection = faceW·faceAngle + (1−faceW)·clubPath. Converted to a start-line yardage by carry·sin(startDirection).","typicalRange":"well-struck ±1-2°; a poor strike ±4-6°+"},{"name":"Face angle","role":"Where the clubface points at impact. The dominant lever on start direction (≈75% weight at a 30° 7-iron loft, faceW = clamp(0.90−dynamicLoft·0.005, 0.60, 0.88)) and, via the face-to-path gap, half of what tilts the spin axis that creates curve. Single biggest lever on total offline.","typicalRange":"elite ball-striker ~±1° of square; recreational golfer often ±3-5°+"},{"name":"Club path","role":"The horizontal direction the head travels through impact. Only a 25% weight on start direction, but an equal partner to face angle in the gap (faceAngle−clubPath) that sets the spin axis and therefore the curve — weak on aim, full-strength on bend.","typicalRange":"tour ~±2-3°; amateur commonly ±5-8° on a real miss"},{"name":"Spin axis (the curve driver)","role":"Tilt of the spin axis away from level — the engine takes it as the true 3-D angle of the (velocity × face-normal) axis from horizontal, with no fitted gain and no clamp. The face-to-path gap sets which way it tilts; loft and attack angle set how hard. This tilt is what bends the flight sideways after launch, completely separate from where it started.","typicalRange":"0° at zero face-to-path gap; for one fixed 7° gap (face +2 / path −5) the engine gives ~5.6° on a 50° wedge, ~11.0° on a 30° 7-iron and ~34.5° on an 11° driver — same gap, no clamp, no ceiling"},{"name":"Curve (yards)","role":"The actual sideways bend in yards, integrated out of the flight under drag and Magnus lift — there is no closed-form curve formula in the engine, and no cap. It outgrows carry: hold the axis at 10.958° and change only club speed, and a 124.1-yd carry bends 6.98 yd while a 257.8-yd carry bends 37.06 yd, so 2.08× the carry buys 5.31× the curve, where multiplying the carry ratio by itself would predict only 4.31×.","typicalRange":"~6 yd on a wedge-length shot, 5-18 yd on a mid-iron miss, 11-33 yd on a driver-length miss at the face/path gaps used in this lesson"},{"name":"Carry (the amplifier)","role":"Doesn't create sideways direction by itself, but it amplifies whatever spin-axis tilt already exists — and harder than squaring. The bend accumulates like an acceleration over time (roughly flight-time squared), and the sideways force itself also grows with ball speed and spin, so the two compound. This is why club selection changes offline outcomes even for an identical swing fault.","typicalRange":"in this lesson's own engine configs: ~123 yd for the 50° wedge at 80 mph, ~173 yd for the 30° 7-iron at 90 mph, ~222 yd for the 11° driver at 98 mph (the carry formula is club-agnostic — only ballSpeed drives it)"},{"name":"Wind (crosswind)","role":"A real-world sideways push during flight that is not modeled in solveFlight (no wind input in the engine) — layered on top of whatever start direction + curve the swing already produced. Roughly proportional to crosswind speed × hang time, with only partial entrainment.","typicalRange":"order of ~10-15 yd of drift for a sustained 10 mph full crosswind on a mid/long shot (estimate, illustrative)"}],"howTheyConnect":"Offline is the last number in the chain — the total sideways distance between where the ball lands and the target line — and the engine builds it from exactly two upstream, independent effects: how the shot started and how much it bent afterward. First, face angle and club path blend into a start direction, but not equally: the clubface controls roughly 75% of the ball's initial line (the weight tapers slightly with loft — faceW = clamp(0.90 − dynamicLoft·0.005, 0.60, 0.88), landing at 0.75 for a 30° 7-iron — sourced from launch-monitor literature) while path supplies only 25%. That start-line angle becomes a real sideways yardage once multiplied by how far the ball actually flies: carry·sin(startDirection). Second, and completely separately, the gap between face and path (faceAngle − clubPath) tilts the spin axis — the engine measures that tilt as the true 3-D angle of the (velocity × face-normal) axis from horizontal, with no fitted gain and no clamp, so the gap sets the direction while the club's loft and attack angle set how hard the same gap tilts it — and that axis tilt is what makes the ball curve sideways in flight, independent of where it started. Crucially, curve is not linear in carry, and it does not track the flight length multiplied by itself either: the engine integrates it out of the flight under drag and Magnus lift rather than evaluating any formula. Hold the axis tilt fixed at 10.958° and stretch the flight by club speed alone — a 124.1-yd carry bends 6.98 yd, a 173.1-yd carry 15.83 yd, a 257.8-yd carry 37.06 yd: 2.08× the carry buys 5.31× the curve, where multiplying the carry ratio by itself would predict only 4.31×. Two things stack to produce that surplus, and the engine lets you separate them: the flight time grows almost exactly in step with carry (3.894 s → 8.034 s, 2.06×) and a sideways deflection accumulated at a steady rate goes as time squared, which alone would give 4.26× — and on top of that the sideways force itself grows, because ball speed rises 95.0 → 162.8 mph and the sideways spin component 1072 → 1838 rpm across the same range. Time-squared does most of the work; the growing force supplies the last ~25%. The engine then simply adds the two independent terms — offline = carry·sin(startDirection) + curve — and that addition is exactly what lets a shot start almost perfectly on line and still finish well offline: with face +2 / path −5 on a 7-iron the start term is a mere 0.755 yd, because path (which caused most of the curve) barely moved the aim line, while the curve term, built from that very same face-to-path gap, keeps compounding for the whole flight to 15.83 yd — offline 16.59 yd. It is also why club selection changes accuracy outcomes for an identical swing fault: hit that same face +2 / path −5 with a 50° wedge at 80 mph and it curves 6.80 yd; hit it with an 11° driver at 98 mph and it curves 32.50 yd, nearly five times farther — and note that this is not a hang-time story across clubs, because the driver is actually in the air for less time (4.16 s vs the wedge's 5.96 s at the same 6° gap). Across clubs the axis tilt and the ball speed do the work; within one club, added speed buys both distance and time. In the real world, wind adds one more, genuinely independent layer on top of all this — pushing the ball sideways for as long as it is airborne — but it is not modeled in solveFlight at all (there is no wind input), so it has to be estimated separately from basic physics (crosswind speed × hang time, scaled down because a golf ball only partially rides the airflow), and it usually adds less to the miss than a meaningful face-to-path fault does.","hierarchy":[{"driver":"Face-to-path gap → spin axis → curve (the bend)","weight":"often the largest single piece of offline, and it outgrows the carry that produced it — hold the axis tilt at 10.958° and that one unchanged tilt bends 6.98 yd at a 124.1-yd carry, 15.83 yd at 173.1 yd and 37.06 yd at 257.8 yd, so 2.08× the carry buys 5.31× the curve, where multiplying the carry ratio by itself predicts only 4.31×","why":"Curve is integrated out of the flight in the engine, not evaluated from a formula, and it outgrows the carry that produced it because a sideways deflection accumulates like an acceleration — roughly as flight time squared — while the sideways force itself also grows with ball speed and spin. A shot can start almost perfectly on line — face +2 / path −5 is a 7° gap but only a 0.25° start direction, worth 0.755 yd of push — and still finish 16.6 yards offline on a 7-iron, or 37 on a driver at a 6° gap, almost entirely from curve. That is why 'it started on line' is a poor predictor of the final miss."},{"driver":"Face angle (via start direction)","weight":"weighted ≈75% vs path's 25% in the start-line blend — about 2.3 yd of start-line push per degree of face angle at a 173-yd 7-iron carry, because 1° of face is only 0.75° of start direction (173.9·sin(0.75°) = 2.28 yd; 2° of face → 1.5° → 4.55 yd)","why":"faceW = clamp(0.90−dynamicLoft·0.005, 0.60, 0.88) is sourced from launch-monitor literature: the clubface is the dominant, nearly-3:1 driver of where the ball initially points, and (via the face-to-path gap) it also supplies half of the curve term — making it the single biggest lever on total offline."},{"driver":"Carry / club length (the amplifier, not a direction cause)","weight":"stretch the same 10.958° tilt from a 173.1-yd carry to a 257.8-yd carry — 49% more distance — and the curve goes from 15.83 to 37.06 yd, 134% more, where multiplying the carry ratio by itself would predict only 122%. There is no curve formula and no square law in the engine: the bend is integrated out of the flight, and it beats squaring","why":"distance itself doesn't steer the ball, but it mercilessly amplifies whatever steering error (spin-axis tilt) already exists. The bend accumulates like an acceleration over the flight, so it goes roughly as time squared, and the sideways force is not constant either — across that same speed range ball speed rises 95.0 → 162.8 mph and the sideways spin component 1072 → 1838 rpm, which is what pushes the growth past a plain square. Across clubs the story is different and you should not mix them up: at a 6° gap a 50° wedge bends 5.85 yd at 123 yd of carry and 15.79 yd when driven out to 212 yd, while the 11° driver bends 29.14 yd at 222 yd — so roughly half the driver's extra bend is distance and half is the far harder axis tilt (30.560° vs 4.803°). It is not hang time: the driver is airborne 4.16 s against the wedge's 5.96 s."},{"driver":"Club path (via the face-to-path gap only)","weight":"contributes just ~0.76 yd of start-line push per degree of path at a 173-yd 7-iron carry (1° of path is only 0.25° of start direction, and 172.8·sin(0.25°) = 0.754 yd) but pulls full weight (1:1) alongside face in the gap that sets spin axis and curve","why":"faceToPath = faceAngle − clubPath feeds spinAxis directly; a path-only error is nearly invisible in the initial aim line but shows up entirely in the curve, which is why 'path' alone is a misleading way to talk about a slice or hook."},{"driver":"Crosswind (environmental, estimate — not in solveFlight)","weight":"order of ~1 yd of drift per mph of crosswind per ~100-150 yd of hang carry; physical ceiling for a 10 mph crosswind over a ~4.3 s mid-iron hang time is ~21 yd (full wind-speed×time), but real drift is a fraction of that since a golf ball only partially entrains with the air — commonly cited around 10-15 yd for a strong, sustained crosswind on a mid/long shot","why":"the base engine has no wind input at all — this is a real, additive downstream physical effect layered on top of whatever start direction + curve the swing already created, usually secondary to a meaningful face-to-path gap but not negligible in blustery conditions."}],"misconceptions":["\"If my ball starts on line, it will finish on line.\" False — curve, driven by the face-to-path gap, keeps bending the ball after launch no matter how good the start line looks. The grounded amateur-slice example (face +2°, path −5° on a 30° 7-iron at 90 mph) starts within a yard of target (0.755 yd push) and still finishes 16.6 yd right.","\"Offline is caused mostly by a bad swing path (in-to-out or out-to-in).\" Path carries only 25% weight on the start line — face angle is the dominant lever there. Path's real power is in the face-to-path gap that drives curve, and it only matters there in combination with face, never alone.","\"A good, accurate swing with a wedge on the range means I'll be similarly accurate with a driver on the course.\" False — and not by a small margin. The identical 6° face-to-path gap (face +3°, path −3°) that leaves a 50° wedge at 80 mph 7.79 yd offline puts an 11° driver at 98 mph 37.17 yd offline: the driver's low loft tilts the spin axis 30.560° where the wedge's tilts 4.803°, and that tilt plus a far faster, longer flight turns into 29.14 yd of bend against the wedge's 5.85 yd. Note it is not extra hang time — the driver is airborne 4.16 s, the wedge 5.96 s.","\"Wind is the main reason golfers miss fairways.\" Real, but usually secondary — a sustained 10 mph crosswind adds on the order of 10-15 yd of drift, typically smaller than the curve from a genuine face-to-path gap on a mis-hit (which on the driver examples here runs 11-33 yd).","\"Any curve (draw or fade) means the shot is 'offline' and therefore bad.\" A controlled, modest spin-axis tilt that the player starts aimed to allow for is a deliberate, repeatable shot shape tour pros use on purpose. The dangerous case is an uncontrolled face-to-path gap that's bigger than the player accounted for when aiming.","\"Face angle and club path matter equally for direction.\" They don't — face is weighted 3:1 over path for the start line (75/25), but they are equal partners (a simple subtraction, face − path) in the gap that sets the spin axis and curve. That asymmetry is the central idea in the TrackMan D-Plane model of ball flight."],"wolframChecks":["sin(1.5°) = 0.02618, sin(1°) = 0.01745, sin(0.25°) = 0.004363 — the trig terms that convert a start-direction angle into a start-line yardage via carry·sin(startDirection).","Offline identity check — the one formula the engine really does evaluate: offline = carry·sin(startDirection) + curve. 7-iron (loft 30, attack −3°, 90 mph) at face +2 / path −5 → carry 173.105 yd, so 173.105·sin(0.25°) = 0.755 yd of start-line push, plus 15.830 yd of curve, gives 16.585 yd — exactly the engine's own offline. The identity is exact and uncapped.","Open-face example (face +2°, path 0°, 7-iron loft 30, attack −3°, 90 mph, carry 173.926 yd): startDirection = 0.75×2 = 1.5° -> start-line push 173.926·sin(1.5°) = 4.553 yd; the 2° gap tilts the spin axis 3.172° and the integrated flight bends 4.624 yd; total offline = 4.553+4.624 = 9.177 yd right.","Square-face, path-only example (face 0°, path −8°, 7-iron loft 30, attack −3°, 90 mph, carry 172.833 yd): startDirection = 0.25×(−8) = −2.0° -> start push 172.833·sin(−2°) = −6.032 yd, so it starts 6 yd LEFT; the 8° face-to-path gap tilts the axis 12.471° and bends the ball 17.959 yd RIGHT; total offline = −6.032+17.959 = 11.927 yd right — a square face with a path fault still curves hard, and here the start line and the curve fight each other.","Amateur-slice example (face +2°, path −5°, 7-iron loft 30, attack −3°, 90 mph): startDirection = 0.75×2+0.25×(−5) = 0.25° -> start push 173.105·sin(0.25°) = 0.755 yd (starts almost dead on line); the 7° gap tilts the spin axis 10.958° and the flight bends 15.830 yd; total offline = 16.585 yd right — the ball starts on target and still misses the fairway by nearly 17 yards.","Same-tilt, shorter-flight check: hold the spin axis at 10.958° and change only club speed. A 124.145-yd carry (70 mph) bends 6.979 yd; a 173.105-yd carry (90 mph) bends 15.830 yd. Carry rose 1.394×, and a carry-squared law predicts 1.944× the curve — the engine gives 2.268×. An identical face-to-path fault matters far less on short clubs than on long ones, and the gap between them is wider than squaring suggests.","Driver-length check at the same 10.958° axis: a 257.787-yd carry (120 mph) bends 37.056 yd against 15.830 yd at a 173.105-yd carry. That is a 49% longer carry producing a 134% bigger curve, where multiplying the carry ratio by itself predicts only 122% — same club, same gap, same tilt, speed the only variable. The mechanism is visible in the engine's own flight time: 5.701 s → 8.034 s, and a deflection that accumulates like an acceleration goes as time squared (1.409² = 1.985×), with the remainder coming from the sideways force itself growing as ball speed rises 122.1 → 162.8 mph.","10 mph = 4.470 m/s; over an illustrative 4.3 s mid-iron hang time that is 4.470×4.3 ≈ 19.2 m ≈ 21 yd — the physical ceiling for crosswind drift if the ball fully rode the wind (real drift is a fraction of this, since a golf ball only partially entrains with the airflow).","Hang-time cross-check: a 30-yd (27.43 m) apex under gravity alone takes sqrt(2×27.4/9.81) ≈ 2.36 s to fall from the top; doubling for a roughly symmetric up/down flight gives an order-of-magnitude ~4.3-4.7 s total hang time for a 7-iron, the figure used in the crosswind estimate above."],"quiz":[{"q":"What two components does the engine add together to make \"Offline\"?","options":["Carry and apex","Start direction and curve","Backspin and sidespin","Club speed and smash factor"],"answerIndex":1,"explanation":"Offline = the ball's total sideways miss = the initial start-line direction (dominated ~75% by face angle) plus the curve it develops in flight (from the tilt of the spin axis, driven by the face-to-path gap). In the engine: offline = carry·sin(startDirection) + curve."},{"q":"A 7-iron (loft 30°, attack −3°, 90 mph) is struck with face angle 2° open and club path square (0°), carrying 173.9 yd. The total offline works out to about 9.2 yd right. How does that split between the start line and the curve?","options":["All ~9.2 yd from the start line, none from curve","About 4.6 yd from the start line and about 4.6 yd from curve","All ~9.2 yd from curve, none from the start line","About 1.5 yd from the start line and about 7.7 yd from curve"],"answerIndex":1,"explanation":"With faceW ≈ 0.75 at a 30° dynamic loft, startDirection = 0.75×2 = 1.5°, so the start-line push is 173.926·sin(1.5°) = 4.553 yd. Separately, the 2° face-to-path gap tilts the spin axis 3.172° and the integrated flight bends 4.624 yd. The engine adds the two independent terms: offline = 4.553 + 4.624 = 9.177 yd right. Off a mid-iron a small gap splits its miss almost exactly evenly — curve edges the start line by about seven hundredths of a yard — which is why the near-even option beats both the all-one-source options and the lopsided 1.5/7.7 split. The split runs away on the long clubs: the identical face +2 / path 0 delivered by an 11° driver at 98 mph carries 223.9 yd, pushes 6.604 yd off the start line and bends 11.037 yd, for 17.641 yd offline — curve now clearly the larger term (1.7× the start line), because the driver's low loft tilts the axis 11.158° against the 7-iron's 3.172° and its faster, longer flight cashes that tilt in, while the start-line term only tracks carry and faceW."},{"q":"A golfer's shot starts almost dead on the target line (about 0.75 yd off) but still finishes about 17 yards right of target. What's the most likely cause?","options":["A large face-to-path gap creating heavy spin-axis curve, even though the start line looks fine","The ball speed was too low","The club path was exactly zero","There is no possible physical explanation — a ball that starts on line always finishes on line"],"answerIndex":0,"explanation":"This is the classic 'starts straight, ends in the trees' slice. With face +2° and path −5° on a 30° 7-iron at 90 mph, the face-path gap is 7°: it barely moves the start line (path is only 25% weighted there, so startDirection = 0.25°, worth 0.755 yd) but it tilts the spin axis 10.958°, and the flight bends 15.830 yd — offline 16.585 yd. Because path barely steers the start but drives the curve just as strongly as face does, a shot can look perfect off the face and still miss badly. Hit the identical fault with an 11° driver at 98 mph and it bends 32.498 yd."},{"q":"Why does the exact same face-to-path mismatch send a driver-length shot much farther offline than a wedge-length shot?","options":["Because the lower-lofted club tilts the spin axis far harder for the same gap, and its faster, longer flight compounds that tilt into far more bend","Because the driver spins backwards faster than a wedge","Because wedges use a completely different spin-axis formula","Because driver shots are always hit with a steeper attack angle"],"answerIndex":0,"explanation":"Curve is integrated out of the flight in the engine, not read off a formula, and two separate things make the driver worse. First, distance: hold the spin axis at 10.958° and change only club speed — a 124.1-yd carry bends 6.98 yd, a 173.1-yd carry 15.83 yd, a 257.8-yd carry 37.06 yd. Carry rose 2.08× across that range while curve rose 5.31×, where multiplying the carry ratio by itself would predict only 4.31×, because the bend accumulates like an acceleration (roughly time squared) while the sideways force also grows with ball speed and spin. Second, and just as large across clubs: the same 6° gap tilts an 11° driver's axis 30.560° but a 50° wedge's only 4.803°. Together they take the wedge's 5.85 yd of bend to the driver's 29.14 yd. What does not explain it is hang time — the driver is airborne only 4.16 s against the wedge's 5.96 s."},{"q":"How does a 10 mph crosswind typically affect where a shot finishes, compared to the offline created by the swing itself (face and path)?","options":["It's usually the single biggest factor, dwarfing face and path","It adds a real but secondary sideways push — very roughly a yard or so per mph of crosswind for every 100-150 yards of carry, on top of whatever the swing already created","It has zero effect on direction, only on distance","It only matters on wedge shots, not longer clubs"],"answerIndex":1,"explanation":"Wind isn't in the engine's offline formula at all (solveFlight has no wind input) — it's a downstream physical effect layered on top of the swing-created start line and curve. A 10 mph crosswind (4.47 m/s) blowing for a ~4.3 s mid-iron hang time gives a physical ceiling of about 21 yd of drift if the ball moved entirely with the wind, but a golf ball only partially entrains, so real drift is a fraction of that — commonly cited around 10-15 yd for a strong, sustained crosswind. It's real and additive, but a meaningful face-to-path gap is usually still the bigger factor."}],"realWorld":{"tourBenchmarks":["PGA Tour average driving distance is roughly 299 yd total (carry ~275-280 yd), yet average driving accuracy (fairways hit) is only about 60% — proof that even elite face/path control still produces meaningful offline miss once carry is that long, because curve amplifies with carry faster than squaring it would suggest.","Tour-level players deliver face angle within roughly 1° of square and club path within roughly 2-3° on a stock full swing — both far tighter windows than a mid-to-high-handicap amateur's typical 3-6°+ face and path errors, which is the main reason tour dispersion patterns stay narrow while amateur patterns balloon.","The app's own shapeLabel() thresholds mirror widely used TrackMan-style teaching bands: under about 0.75° of face-to-path gap reads as Straight, up to about 6° reads as a Fade/Draw (a controlled shot shape), and beyond about 6° reads as a Slice/Hook (an uncontrolled miss) — the same gap that drives the curve term in offline.","A recreational golfer's face-to-path gap (the number that sets the spin-axis tilt, which the flight then turns into curve) is commonly several times larger than a tour pro's on a full swing, which is why amateur offline misses are often reported as multiples of tour-level dispersion rather than just 'a bit worse.'"],"scenarios":["The 'looks-great, ends-in-the-trees' slice: the ball starts within a yard of the flag, keeps drifting right the entire flight, and finishes about 17 yards offline — this lesson's grounded amateur-slice example (face +2°, path −5° on a 30° 7-iron at 90 mph: 0.755 yd start push, 15.83 yd of curve, 16.59 yd offline).","A genuinely curve-free push: face +4° with path also +4° on that same 7-iron. Zero gap means zero axis tilt and exactly 0.00 yd of curve, so the ball flies dead straight and lands 12.14 yd right of the pin — a pure start-line miss. Note that opening the face while keeping the path square is not this shot: face +4 / path 0 pushes 9.09 yd off the start line and then adds 9.19 yd of curve on top, for 18.29 yd offline. A face that is open relative to the path always curves.","The exact same swing fault on two different clubs in the same round: a 7-iron misses the green by a forgivable 9.18 yards at a 2° face-to-path gap, while the driver carrying that identical gap finishes 17.64 yards offline — and at a 6° gap it is 37.17 yards, deep in the trees. The lower-lofted club tilts the axis harder for the same gap and then flies faster and farther to cash that tilt in, so the longer club always pays the bigger penalty for the same mistake.","A calm-morning shot that would land pin-high center drifts into a bunker on a blustery afternoon — the crosswind adding an extra, physics-independent sideways push on top of whatever the swing itself already created."],"whatItMeansForYou":"If you're missing fairways or greens sideways, fix face angle first — it's roughly 75% of your start line and half of the face-to-path gap that creates curve, so it's the single biggest lever on total offline. If your start line already looks fine but you still miss badly, the problem is the gap between face and path (not path in isolation) — that's what's curving you offline, and because a longer, lower-lofted club both tilts the axis harder and keeps bending for longer, it will punish your driver far harder than your wedges for the identical swing flaw. On windy days, expect an extra, genuine sideways push layered on top of your normal miss pattern, and aim with a bit more room on the downwind side of the target."},"whatItMeansForYou":"If you're missing fairways or greens sideways, fix face angle first — it's roughly 75% of your start line and half of the face-to-path gap that creates curve, so it's the single biggest lever on total offline. If your start line already looks fine but you still miss badly, the problem is the gap between face and path (not path in isolation) — that's what's curving you offline, and because a longer, lower-lofted club both tilts the axis harder for the same gap and flies faster and farther to compound that tilt, it will punish your driver far harder than your wedges for the identical swing flaw. On windy days, expect an extra, genuine sideways push layered on top of your normal miss pattern, and aim with a bit more room on the downwind side of the target."}</script>
  <script type="application/json" id="lesson-altitude">{"parameter":"Altitude","oneLiner":"Altitude is the thinning of the air itself as elevation rises — with the exact same swing, same spin, same ball speed off the face, the shot carries meaningfully farther and curves a little less, simply because there is less air in its way.","whatItIs":"Altitude is simply how high above sea level you're playing — and the only thing it changes is the air the ball flies through. Climb in elevation and the atmosphere thins out: there are fewer air molecules per cubic meter to push against the ball. That thinner air means less aerodynamic drag holding the ball back, so a shot hit at 5,000+ ft carries noticeably farther than the identical swing at sea level — golfers in Denver or at a Mexico City PGA Tour event routinely see drives that would be exceptional anywhere else, purely from thin air, not extra speed. But it isn't a free lunch: the same thinner air also weakens the Magnus lift that backspin generates to hold the ball up, so the carry gain is always less than the raw drop in air density — the app models it as roughly 70% of the density change converting into extra yards. Nothing about the strike itself changes: club speed, ball speed, spin loft and backspin are all identical at altitude for the same swing, because they're set at the clubface before the ball ever touches any air. Altitude is purely a post-impact, in-flight effect — the one this app's engine deliberately keeps separate from the swing-and-strike physics, layering it on afterward as a documented, Wolfram-grounded estimate.","components":[{"name":"Elevation (ft above sea level)","role":"The only real input. Everything else in this lesson is downstream of it — it sets air density via the app's fAlt = 1 − 0.03·(alt/1000) approximation, which runs about 1.3 percentage points below the real ISA density ratio at Denver and about 2.6 points below at the app's 8,000 ft slider maximum (measured: ISA 0.8544 vs the model's 0.8416 at 5,280 ft; 0.7860 vs 0.7600 at 8,000 ft — the model always reads the air slightly thinner than ISA, and the gap widens with elevation).","typicalRange":"sea level 0 ft; Denver 5,280 ft; Mexico City (Club de Golf Chapultepec) 7,359 ft; mountain resorts commonly 6,000–9,000 ft"},{"name":"Air density","role":"What elevation actually changes. Falls in a near-linear ~3% per 1,000 ft. This single number is the hidden variable behind every other effect in this lesson.","typicalRange":"sea level 1.225 kg/m3; Denver ISA ≈1.047 kg/m3 (14.6% thinner — the app's linear model says 1.031, 15.8% thinner); Mexico City ISA ≈0.982 kg/m3 (19.8% thinner — app model 0.954, 22.1%)"},{"name":"Aerodynamic drag","role":"The forward-flight brake. Scales directly (linearly) with air density, so thinner air = less drag = the ball keeps more of its launch speed for longer, i.e. more carry.","typicalRange":"driver ball at 167 mph feels 1.216 N of drag at sea-level 1.225 kg/m3 and 1.039 N at Denver's ISA 1.0466 — a 14.56% cut against a 14.56% density drop, matching to the decimal, which is what 'linear in ρ' means"},{"name":"Magnus lift (the self-limiter)","role":"The same backspin-driven force that holds the ball up also scales with air density, so thin air weakens it too. This is why carry gains less than the raw density drop — the app models the net translation as ~70% of the density change.","typicalRange":"in the app's model Denver's 15.8% density drop becomes +11.1% carry, not +15.8%, and Mexico City's 22.1% drop becomes +15.5%. The engine's RK4 aerodynamics is stingier still: measured +4.8% (7-iron) and +4.9% (driver) at Denver's ISA density"},{"name":"Backspin, ball speed, spin loft, launch angle (the swing side)","role":"The contrast group. All set at the clubface, ~half a millisecond before the ball meets any air. Altitude changes none of them — not by one rpm or one mph. Only what happens after launch changes.","typicalRange":"identical for the same swing at sea level and at 8,000 ft"},{"name":"Curve / shot-shape dampening","role":"A secondary, often-missed effect: sideways Magnus force (what bends a hook or slice) is driven by the same density-dependent aerodynamics as vertical lift, so shot shapes visibly flatten out at altitude — spin hasn't changed, the air's grip on it has.","typicalRange":"measured in the engine's RK4 aerodynamics: a driver slice (2° out-to-in path, 4° open face) curves 49.4 yd from its launch line at sea-level density, 45.0 yd at Denver's 1.0466 (−9%) and 42.9 yd at Mexico City's 0.9821 (−13%). The shipped environment layer applies no curve multiplier, so the app's own trajectory readout will not show this (EST)"}],"howTheyConnect":"Altitude's whole effect runs through one physical quantity: air density. Climb from sea level and the atmosphere thins — roughly 3% less dense per 1,000 ft (the app's linear fAlt = 1 − 0.03·(alt/1000) approximation, which sits about 1.3 percentage points below the real ISA density ratio at Denver, ~2.3 at Mexico City and ~2.6 at 8,000 ft — it under-reads density everywhere, not only up high, and the gap widens with elevation). That thinner air acts on the ball in two opposing ways at once. First, it cuts aerodynamic drag — the force resisting forward flight — so the ball keeps more of its launch speed for longer, which by itself would add distance one-for-one with the density drop. Second, it cuts Magnus lift — the same backspin-driven force that holds the ball up against gravity — so the ball gets slightly less support to stay airborne. These two effects partly cancel: the app models the net translation as about 70% of the raw density change (a calibrated rule of thumb, not a lab-measured constant, and not something the ρ-proportionality derives: that both forces scale with density explains only why the conversion must be below 1, never why it is 0.70. It is chosen to reproduce golf's familiar ~2% carry per 1,000 ft. The engine's own aerodynamic RK4 module — which integrates exactly those proportional forces — is more conservative: measured, the default 7-iron carries 204.0 yd at 1.225 kg/m3 and 213.8 yd at Denver's ISA density of 1.0466, i.e. +4.8%, a conversion of about 0.33. The driver measures the same way, +4.9%. The shipped 0.70 is the more generous figure and it is the one the app displays), so Denver's ~16% thinner air (the app's linear model at 5,280 ft) becomes about +11% extra carry, not +16%. On a 172-yard 7-iron that is roughly +19 yards; at Mexico City's ~7,360 ft it is closer to +15% and +27 yards. Crucially, none of this touches the swing side of the equation. Backspin, ball speed, spin loft and launch angle are all set half a millisecond after clubface meets ball — before the shot has flown a single inch through any air — so they read identically whether you are at sea level or on a mountaintop. Only what happens after launch changes: the ball carries farther. Note what the shipped environment layer does and does not do: apex is scaled by the exact same carryEnvMult as carry, so the drawn trajectory keeps its shape and simply grows — the app does not flatten the flight. Real aerodynamics do: in the engine's RK4 module the 7-iron gains 4.8% carry while its flight time falls from 6.45 s to 6.19 s at Denver density, which is a genuinely flatter, more penetrating flight — but that flattening is outside the environment layer (EST). And — by the same density-scaling logic that weakens lift — the sideways Magnus force behind a hook or slice is weakened too, so shot shapes that look severe at sea level visibly straighten out at altitude.","hierarchy":[{"driver":"Elevation (feet above sea level)","weight":"the only real input — a near-linear ~+2.1% carry per 1,000 ft in this app's model (0.70 × the ~3%/1,000ft density drop); Denver (5,280 ft) ≈ +11% carry, Mexico City (7,359 ft) ≈ +15%","why":"Every other number in this lesson is downstream of elevation via fAlt = 1 − 0.03·(alt/1000). Grounded: ISA density falls to ~1.04 kg/m3 (0.85×) at 5,280 ft and ~0.98 kg/m3 (0.80×) at 7,359 ft — measured 1.3 points above the app's linear approximation at Denver and 2.3 above it at Mexico City, so the linear model is consistently on the thinner-air, longer-carry side of ISA."},{"driver":"The drag-vs-lift self-limiter","weight":"turns a ~16% density drop into an ~11% carry gain at Denver, not a full 16% — the single biggest reason 'thinner air = same % more distance' is a myth","why":"Both drag and Magnus lift are proportional to air density (F ∝ ρ), so thinning the air helps forward flight (less drag) and hurts the thing holding the ball up (less lift) simultaneously. Grounded: at a 167-mph driver ball speed, drag falls from 1.216 N (sea level) to 1.039 N at Denver's ISA density — 14.56%, identical to the density drop, confirming the linear ρ-scaling behind the self-limiter."},{"driver":"Curve / shot-shape dampening","weight":"real and measurable — the engine's RK4 aerodynamics bends a driver slice 49.4 yd at sea level, 45.0 yd (−9%) at Denver density and 42.9 yd (−13%) at Mexico City density; note the effect is smaller in percent than the carry gain is, and the shipped environment layer does not apply it to the on-screen curve (EST)","why":"Sideways Magnus force (what bends a spin-axis-tilted shot) is driven by the identical ρ-dependent aerodynamics as vertical lift. It is the most-missed part of the altitude story — golfers notice the extra carry immediately but rarely connect it to their slice looking straighter."},{"driver":"Interaction with heat (a sibling Environment node)","weight":"compounds the elevation gain — many high-altitude rounds are also hot, and warm air is independently thinner (~3.3% per +10°C), stacking on top of the elevation effect","why":"Altitude and temperature both act through the same air-density channel, so a hot day at 5,000 ft thins the air more than either effect alone. The dedicated breakdown lives in the Temperature lesson, so this one stays focused on elevation."},{"driver":"Backspin, ball speed, spin loft, launch angle (the swing side)","weight":"zero — completely unchanged by altitude, by design","why":"These are set at the clubface, half a millisecond before the ball meets any air (the engine builds spin from club speed and spin loft alone — there is no air-density term anywhere in the impact model). Ranking this last is the point: altitude is a downstream, in-flight effect, and confusing it with the strike itself is the most common mistake golfers make."}],"misconceptions":["\"The ball goes exactly as much farther as the air is thinner.\" False — Denver's air is ~15-16% thinner but carry only gains ~11%, because the same thin air that cuts drag also weakens the Magnus lift holding the ball up.","\"Altitude makes you swing faster or hit the ball harder.\" False — club speed and ball speed are swing outputs, completely unaffected by elevation. Only the flight through the air changes.","\"Altitude changes your backspin rate.\" False — spin is set at the face, out of club speed and spin loft, before the ball ever meets the air. A launch monitor reading high in thin mountain air is identical to one at sea level for the same swing.","\"Only the driver / tee shots are affected.\" False — the effect is proportional (~+10-15%), so it scales every club including approach irons and wedges. Clubbing normally into a mountain-resort green is a classic way to fly it over.","\"Humidity is the big altitude factor.\" False — muggy air barely changes density (<1%, and actually makes air slightly lighter, not heavier). Elevation's ~3%-per-1,000-ft density change dwarfs humidity's effect by more than an order of magnitude.","\"Hooks and slices curve more in thin air because there's more spin to grab.\" Backwards — the spin rate (rpm) doesn't change at all; the sideways aerodynamic force that turns spin into curve is weaker in thin air, so shot shapes flatten out, not sharpen."],"wolframChecks":["ISA air density at sea level (15 °C) = 1.225 kg/m3 (Wolfram-confirmed reference used throughout the app).","ISA air density at 5,280 ft (Denver) ≈ 1.04 kg/m3 = 0.85× sea level → ~15% thinner (Wolfram: 'air density standard atmosphere at 5280 ft' → 1 kg/m3 ≈ 0.85× the 1.225 kg/m3 ISA reference).","Elevation of Mexico City = 7,359 ft / 2,243 m (Wolfram); ISA air density there ≈ 0.98 kg/m3 = 0.80× sea level → ~20% thinner.","Elevation of Denver, CO = 5,280 ft exactly (Wolfram) — confirms the 'Mile High City' figure used as a real-world benchmark.","App's linear model fAlt = 1 − 0.03·(alt/1000) at 5,280 ft = 0.8416 vs the ISA-derived ratio 0.8544 — 1.3 points low. Measured across the slider range: 0.7792 vs 0.8017 at 7,359 ft (2.3 points), 0.7600 vs 0.7860 at 8,000 ft (2.6 points), 0.700 vs 0.7385 at 10,000 ft (3.9 points). The linear model always under-predicts density, so it always over-predicts carry relative to ISA, and the error grows roughly linearly with elevation.","Drag force on a driver ball (167 mph = 74.66 m/s, Wolfram-converted) at sea-level density: 0.5×1.225×74.66²×0.25×π×0.0213² ≈ 1.217 N; at Denver's ISA density 1.0466 kg/m3: 1.039 N — a 14.56% drag reduction, identical to the 14.56% density drop, confirming drag scales linearly with air density (ρ).","carryEnvMult = 1 + 0.70·(1 − fAlt): Denver (fAlt = 0.842) → 1.111 (+11.1%); Mexico City (fAlt = 0.779) → 1.155 (+15.5%) (Wolfram-computed, reusing the exact constant already shipped in the Carry Ledger).","Applied to a 172-yd 7-iron baseline: Denver → 191.1 yd (+19 yd); Mexico City → 198.6 yd (+27 yd). Applied to a 150-yd approach shot at 6,500 ft: → 170.5 yd (+20.5 yd, +13.6%) (Wolfram-computed)."],"quiz":[{"q":"Roughly how much extra carry does a shot gain playing at Denver's elevation (5,280 ft) versus sea level, all else equal?","options":["About 2%","About 11%","About 30%","About 50%"],"answerIndex":1,"explanation":"Denver's air is about 15-16% thinner than sea level, but only roughly 70% of that density drop converts into extra carry — the same thin air that cuts drag also weakens the Magnus lift holding the ball up. Net result: about +11% carry (≈+19 yd on a 172-yd 7-iron), which is why 'the ball flies noticeably farther in Denver' is well known among golfers, but 'exactly as much farther as the air is thin' is not."},{"q":"What happens to your backspin rate (rpm off the clubface) when you take the same swing from sea level to 7,000 ft?","options":["It increases, because thin air lets the ball skid and grip more","It decreases, because thin air can't support as much spin","It stays exactly the same — spin is set at the face before the ball meets any air","It becomes unpredictable above 5,000 ft"],"answerIndex":2,"explanation":"Backspin is produced in about half a millisecond of contact (the engine builds it from club speed × sin(spin loft) alone — no ball-speed term, no air-density term), entirely before the ball has flown an inch through any air. Altitude only changes what that same spin does after launch — how much lift and curve it produces — never the rpm number itself."},{"q":"Denver sits at 5,280 ft; Club de Golf Chapultepec in Mexico City sits at about 7,360 ft. Which venue gives the bigger carry boost, and why?","options":["Denver — it's the more famous 'thin air' city","Mexico City — it's higher, so the air is thinner still (~20% vs ~15%)","They're identical — altitude caps out below 5,000 ft","Neither — carry gain only depends on temperature, not elevation"],"answerIndex":1,"explanation":"Air keeps thinning as you climb: about 15% thinner at Denver's 5,280 ft versus about 20% thinner at Mexico City's ~7,360 ft. Run through the same drag/lift model, that's roughly +11% carry at Denver and +15% at Mexico City — exactly why PGA Tour pros at the Mexico City event routinely post drives that would be exceptional anywhere else."},{"q":"A hooked or sliced shot at altitude, compared to the identical swing at sea level, tends to...","options":["Curve more sideways, because thin air grips the spin harder","Curve about the same — curve is unrelated to air density","Curve less sideways, because the same thin air that boosts carry also weakens the sideways aerodynamic force","Curve less only above 10,000 ft"],"answerIndex":2,"explanation":"The sideways bend of a hook or slice comes from a Magnus force that is just as density-dependent as the vertical lift that holds the ball up. Thin air weakens both, so a shot shape that looks severe at sea level visibly straightens out at altitude — the spin (rpm) hasn't changed, only how hard the air can act on it."},{"q":"You normally hit a 150-yard 8-iron at sea level. On a golf trip to a 6,500-ft mountain resort, with the identical swing, that shot will fly about...","options":["150 yd — altitude doesn't affect approach shots","170 yd — take one club less or you'll fly the green","135 yd — thin air can't hold the ball up as well","Impossible to predict without a launch monitor"],"answerIndex":1,"explanation":"The altitude effect is proportional, so it scales every club, not just the driver. At 6,500 ft the app's model gives about +13.6% carry — a 150-yard shot becomes roughly 170 yards. Clubbing down (or aiming shorter) is the practical fix; the swing itself needs no adjustment."}],"realWorld":{"tourBenchmarks":["Club de Golf Chapultepec / Vista Vallarta area, Mexico City (~7,359 ft / 2,243 m elevation, Wolfram-confirmed) hosts a PGA Tour event where routine 330-350+ yd drives are common — a direct product of ~20% thinner air, not extra swing speed.","PGA Tour's Barracuda Championship (Tahoe/Reno-area courses, ~6,300 ft, ~17% thinner air per the ISA data) is famous as one of the Tour's longest-hitting weeks, and uses Modified Stableford scoring partly because thin-air birdies pile up so fast.","Denver, CO sits at exactly 5,280 ft — one mile, Wolfram-confirmed — the 'Mile High City.' Cherry Hills Country Club (host of the 1960 U.S. Open, Arnold Palmer's famous final-round charge) plays meaningfully shorter on the card than its stated yardage suggests.","PGA Tour average driver ball speed is roughly 167-171 mph at sea-level events; the same ball speed at Mexico City's elevation carries roughly 15% farther purely because of the air it's flying through, not because the player swung harder."],"scenarios":["A golfer's home-course 150-yard 8-iron becomes roughly a 170-yard shot on a Rockies golf trip (~6,500 ft) — the exact same swing sails the green if you don't club down.","TV commentators at the Mexico City PGA Tour event routinely note drives that would be tour-leading anywhere else, attributing it to 'the altitude' rather than a hot streak of speed.","Golf GPS and rangefinder apps (Arccos, Golfshot, and similar) offer 'altitude-adjusted' or 'plays-like' yardages specifically to correct for this effect on mountain and high-desert courses.","A slice that leaks badly right at a sea-level home course often looks a touch straighter on a high-altitude course — same swing, less air for the spin to grab."],"whatItMeansForYou":"Rule of thumb from this app's model: roughly +2% carry per 1,000 ft of elevation gain (about +11% a mile up in Denver, +15% around 7,000 ft in Mexico City) — take a club or two less than the flat number on the card, and expect any hook or slice to show up a little less severely, because the ball isn't behaving differently off the face, there's just less air for it to fight (or curve) through."}}</script>
  <script type="application/json" id="lesson-wind">
{"parameter":"Wind","oneLiner":"Wind is moving air, and to a flying golf ball it is really two separate effects in one: head/tailwind reshapes how far the ball carries, while crosswind steadily pushes it sideways off the target line.","whatItIs":"Wind is simply moving air, but a flying golf ball feels it as two almost-independent problems depending on which way it blows relative to your target line. Blowing straight down the line (head or tail) it changes the drag and lift the ball feels, which changes carry distance. Blowing across the line it pushes the ball sideways for as long as it's airborne, which changes where the ball finishes relative to the target, with barely any effect on distance. Real wind is almost always a mix of both — a gust from the front-left is part headwind, part crosswind — so the first job in reading wind is resolving it into those two components before deciding what to do about either one. Flightglass's physics engine (solveFlight) does not model wind at all: club speed, face angle, path, dynamic loft and attack angle still set backspin, launch angle, spin loft and the ball's engine-true carry exactly as if there were no wind. Everything wind does happens after the ball leaves the face, as a documented, clearly EST-flagged air-and-drift layer applied on top of that engine-true flight — the same honest layering the app already uses for altitude and temperature in the Carry lesson.","components":[{"name":"Wind speed (magnitude)","role":"The raw strength of the wind before it's resolved into head/tail or crosswind. Everything below scales off this number.","typicalRange":"calm 0-5 mph; playable breeze 5-15 mph; tour caution 15-25 mph; suspended-play gusts 40+ mph (2015 Open Championship, St Andrews)"},{"name":"Wind angle relative to the target line","role":"The direction the wind blows measured against your target line. This single angle decides the split between the two components below (0° = pure tailwind, 90°/270° = pure crosswind, 180° = pure headwind).","typicalRange":"resolved via head/tail = speed × cos(angle), crosswind = speed × sin(angle)"},{"name":"Head/tailwind component","role":"The along-the-line part of the wind. Drives the distance effect: headwind adds drag and (less obviously) extra Magnus lift, shrinking carry; tailwind does the reverse but by a smaller margin.","typicalRange":"10 mph headwind ≈ -10% carry; 20 mph ≈ -22%; 10 mph tailwind ≈ +7%; 20 mph ≈ +12% (Flightglass EST wind coefficients — head 1−(0.0001h²+0.009h), tail 1+(0.008t−0.0001t²) — calibrated to published orders of magnitude, not TrackMan measurements)"},{"name":"Crosswind component","role":"The across-the-line part of the wind. Drives the direction effect: pushes the ball steadily off the target line for as long as it's in the air, with almost no effect on carry distance.","typicalRange":"caddie rule of thumb ≈ 1 ft of drift per 100 yd of carry per mph of crosswind; 10 mph ≈ 5 yd off on a 150-yd shot, ≈ 9 yd on a 275-yd drive"},{"name":"Trajectory height / hang time (via launch angle & spin loft)","role":"An amplifier, not a wind input itself: the higher and spinnier the shot, the longer it is exposed to the wind per yard of carry, so both the carry effect and the crosswind drift get bigger for a lofted, high-spin shot than for a low, piercing one at the identical wind speed.","typicalRange":"ballistic (no-drag) hang-time floor ≈ 3.13 s for the engine-true 7-iron baseline (129.3 mph ball, 15.38° launch) but only ≈ 2.80 s for an engine-true tour driver (168.8 mph ball, 10.47° launch) — launch angle, not ball speed, sets the floor. What wind actually acts on is exposure per yard: that floor per 100 yd of carry runs ≈ 1.03 s (driver), ≈ 1.67 s (7-iron), ≈ 3.52 s (wedge), and real, lift-inclusive time runs longer than all three."},{"name":"Backspin / spin loft (interaction only)","role":"Wind does not change backspin rpm — spin is fixed the instant the ball leaves the face, before wind matters. What changes is how much lift that same spin produces, because Magnus lift depends on speed relative to the air, and that relative speed rises into a headwind — this is why shots balloon.","typicalRange":"7-iron ≈ 6,500-7,500 rpm, driver ≈ 2,200-2,900 rpm — unchanged by wind itself"},{"name":"Gusts & swirl (real-course variability)","role":"The gap between a forecast's steady number and what actually happens at the ball, especially near trees, grandstands and dunes. Not modelled numerically here, but the reason pros distrust a single wind number.","typicalRange":"gusts commonly run 1.5-2x the sustained speed (2015 Open: sustained ~20-25 mph, gusts 40+ mph)"}],"howTheyConnect":"Start by resolving the wind vector: split its speed into a component along the target line (head if it blows at you, tail if it blows with you = windSpeed × cos of the angle off the line) and a component across the target line (crosswind = windSpeed × sin of that angle). Those two components then do almost entirely separate jobs. The along-line component changes the ball's speed relative to the air, and that matters twice over. First, drag: it always slows the ball, and it scales with the square of relative airspeed, so a headwind's extra drag grows faster than a tailwind's relief shrinks it. A grounded check at a representative mid-flight speed shows a 10 mph headwind adding about +21% drag while an equal tailwind removes only about -19%; at 20 mph that gap widens to roughly +44%/-36% — the asymmetry itself grows with wind speed. Flightglass’s EST wind layer carries the same asymmetry through to final distance: about 1%/mph into a 10 mph headwind (≈10% lost) growing to ≈22% at 20 mph — more than double, not simply double — while a tailwind gives back only ≈0.7%/mph (≈7% at 10 mph, ≈12% at 20 mph). Second, and less obvious: backspin rpm itself does not change in the wind — it is fixed the instant the club leaves the ball, long before the wind can touch it. But Magnus lift depends on the ball's speed relative to the air, not the ground, and that relative speed is higher into a headwind. So the identical spin rate produces more lift, the ball fights gravity harder and longer than usual, and the flight balloons — often costing more distance than the raw drag number alone would suggest, and it's exactly why a high-spin wedge or a slice punishes you more in the wind than a flighted-down stinger does. The across-line (crosswind) component does something almost entirely separate: it steadily pushes the ball off the target line for as long as it's airborne, and because that push accumulates the longer the ball is exposed, both time (hang time — driven by launch angle and trajectory height) and carry distance make it worse. The widely used caddie rule of thumb — about 1 foot of sideways drift per 100 yards of carry for every mph of crosswind — captures this: a 275-yard drive drifts roughly twice as far off a given crosswind as a 150-yard iron, and a high, spinny, slow-falling shot drifts more per yard of carry than a low, piercing one, because it simply hangs in the wind's path longer. Flightglass's engine (solveFlight) never sees any of this — clubPath, faceAngle, attackAngle, dynamicLoft and clubSpeed produce the exact same launchAngle, spinLoft, backspin and baseline carry whether the flag is limp or snapping sideways; wind is applied as a separate, clearly EST-flagged layer on top, the same pattern already used for altitude and temperature.","hierarchy":[{"driver":"Head/tailwind component (resolved wind × cos of the angle off the line)","weight":"dominant for distance — Flightglass EST: 10 mph headwind ≈ -10% carry (-15 yd on a 150-yd shot, -27.5 yd on a 275-yd drive); 20 mph ≈ -22% (-33 yd / -60.5 yd) — more than double the 10 mph loss. Tailwind gives back less: 10 mph ≈ +7% (+10.5 yd / +19.25 yd), 20 mph ≈ +12% (+18 yd / +33 yd).","why":"Drag scales with the square of the ball's speed relative to the air, so a headwind's extra drag always outweighs an equal tailwind's relief, and — because backspin's Magnus lift also scales up with that same higher relative airspeed into a headwind — the shot balloons on top of the raw drag penalty. Nothing else here moves total distance this much."},{"driver":"Crosswind component (resolved wind × sin of the angle off the line)","weight":"dominant for direction, negligible for distance — caddie rule of thumb ≈1 ft of drift per 100 yd of carry per mph of crosswind: 10 mph ≈ 5 yd off on a 150-yd shot, ≈9 yd on a 275-yd drive; 20 mph ≈10 yd / ≈18 yd.","why":"A pure 90° crosswind barely touches the ball's forward (relative-airspeed) component, so drag and lift are almost unchanged — but it steadily accumulates a sideways push for the whole flight, which is why crosswind is a targeting problem, not a club-selection problem."},{"driver":"Trajectory height & hang time (spin loft, launch angle)","weight":"amplifier on both effects above — a high, spinny shot is exposed to the wind longer per yard of carry than a low, piercing one, at the identical wind speed","why":"Both the head/tail ballooning and the crosswind drift accumulate over time in the air, not just over distance covered — so what matters is hang time per yard of carry, not hang time alone. Measured on engine-true deliveries, the no-drag hang-time floor per 100 yd of carry runs ≈ 1.03 s for a tour driver, ≈ 1.67 s for the 7-iron baseline and ≈ 3.52 s for a wedge; flighting that same 7-iron down (24° dynamic loft, -6° attack) drops it to ≈ 1.27 s — about a quarter less wind exposure from the same club. Absolute hang time is a trap here: the driver’s floor (≈ 2.80 s) is actually shorter than the 7-iron’s (≈ 3.13 s), because its much lower launch angle outweighs its much higher speed — the driver simply covers far more ground while it is up there."},{"driver":"Wind direction angle relative to the target line","weight":"the split lever — determines how much of a given wind speed lands in the head/tail bucket vs the crosswind bucket via the cos/sin decomposition","why":"The exact same 15 mph wind is either almost entirely a distance problem (blowing straight down the line) or almost entirely a direction problem (blowing straight across it), or some mix of both — reading the angle correctly matters as much as reading the speed."},{"driver":"Gusts & swirl (real-course variability)","weight":"situational but can dominate everything else — gusts commonly run 1.5-2x a forecast's sustained speed, and wind swirls unpredictably near trees, dunes and grandstands","why":"This is why tour pros distrust a single wind number and often choose to 'flight it down' (lower launch, less spin) to shrink all of wind's effects at once rather than trying to calculate an exact drift — the extreme case being the 2015 Open Championship at St Andrews, where gusts over 40 mph physically moved golf balls resting on the greens and suspended play for 10.5 hours."}],"misconceptions":["\"Headwind and tailwind cancel out over a round.\" False — a headwind hurts noticeably more than an equal tailwind helps (Flightglass EST: 10 mph = -10%/+7%, 20 mph = -22%/+12%), and the gap widens as the wind gets stronger, not stays fixed.","\"A headwind puts more spin on the ball.\" False — backspin rpm is set the instant the ball leaves the face, before the wind can touch it. What increases is the lift that same spin produces, because Magnus lift depends on speed relative to the air, and that's higher into a headwind — that's why shots balloon, not because rpm went up.","\"10 mph of wind is always worth about 10 yards.\" Not fixed — the relationship is non-linear (doubling the wind from 10 to 20 mph headwind isn't just double the yardage loss, it's more than double: 10% -> 22%) and it scales with the shot's own carry distance and trajectory height, so a 150-yd iron and a 275-yd drive lose very different yardages to the identical wind.","\"Crosswind mainly costs you distance.\" Its primary effect is directional, not distance — a pure 90° crosswind barely changes carry at all because it does almost nothing to the ball's forward (relative-airspeed) component; it's the head/tail component that changes distance.","\"You should calculate the exact wind drift and aim for it precisely.\" Real course wind swirls and gusts, especially near trees, dunes and grandstands, and gusts commonly run 1.5-2x the sustained/forecast speed — which is why pros mostly try to 'flight it down' (lower launch, less spin) to shrink wind's effect on the whole shot rather than aim for one precise number.","\"Wind only really matters on famously windy links courses.\" Even an ordinary 10-15 mph day — common almost everywhere — can be worth a full club on an approach shot and several yards of sideways drift, and most amateurs under-adjust for it because the headwind/tailwind asymmetry isn't intuitive."],"wolframChecks":["convert 10 mph -> 4.47 m/s; convert 20 mph -> 8.94 m/s — unit conversions grounding every wind-speed input used below.","ballistic (no-drag) hang-time floor for the engine-true 7-iron baseline — solveFlight(clubSpeed 95, dynamicLoft 30°, attackAngle -3°, face 1°, path -2°) returns 129.3 mph ball speed and 15.38° launch: t = 2×57.8×sin(15.38°)/9.81 ≈ 3.13 s. A floor only — the same engine call reports a 32.7 yd apex against a 13.1 yd no-drag apex, so lift holds this shot about 2.5× higher than the floor assumes.","same floor for an engine-true tour driver — solveFlight(clubSpeed 113, dynamicLoft 13°, attackAngle +1°) returns 168.8 mph ball, 10.47° launch, 2,552 rpm, 271 yd carry, all inside the TrackMan tour ranges cited below: t = 2×75.5×sin(10.47°)/9.81 ≈ 2.80 s. That is SHORTER than the 7-iron’s 3.13 s despite 39 mph more ball speed, because the floor scales with ball speed × sin(launch) and the driver’s ~31% smaller sin(launch) beats its ~30% higher speed.","drag-force asymmetry at a representative 45 m/s mid-flight speed: +10 mph headwind -> ((45+4.47)²-45²)/45² = +20.85%; -10 mph tailwind -> ((45-4.47)²-45²)/45² = -18.88% — headwind's extra drag exceeds tailwind's relief, confirming the v² asymmetry.","same check at 20 mph: +43.68% / -35.79% — the asymmetry widens with wind speed (ratio ≈1.10x at 10 mph vs ≈1.22x at 20 mph), matching the Flightglass EST head/tail multipliers below, whose penalty/relief gap likewise grows non-linearly, not linearly, with wind speed.","Flightglass EST head/tail multipliers (0.90 / 0.78 / 1.07 / 1.12 at head 10, head 20, tail 10, tail 20 mph) read as carry percentages and converted to yards: 150 × {0.10, 0.22, 0.07, 0.12} = {15, 33, 10.5, 18} yd; 275 × {0.10, 0.22, 0.07, 0.12} = {27.5, 60.5, 19.25, 33} yd — the head 10mph/head 20mph/tail 10mph/tail 20mph yardage deltas cited throughout.","crosswind rule of thumb (≈10 ft drift per 100 yd of carry per 10 mph of crosswind) converted to a general formula driftYd = crosswindMph×carryYd/300: 10×275/300 ≈ 9.17 yd, 20×275/300 ≈ 18.33 yd, 10×150/300 = 5 yd, 20×150/300 = 10 yd.","exposure per 100 yd of carry, from engine-true deliveries (no-drag floor hang time ÷ carry × 100): wedge (85 mph, 50° dynamic loft, -5° attack → 98.7 mph ball, 30.7° launch, 130.6 yd) ≈ 3.52 s; 7-iron baseline ≈ 1.67 s; the same 7-iron flighted down (24° dynamic loft, -6° attack → 11.75° launch, 191.5 yd) ≈ 1.27 s; tour driver ≈ 1.03 s — this per-yard exposure, not absolute hang time, is the amplifier the wind acts on."],"quiz":[{"q":"Wind does two separate things to a golf shot. What are they?","options":["It only changes carry distance, never direction","It changes carry distance via the head/tailwind component and pushes the ball sideways off target via the crosswind component — two separate effects from one wind","It only changes direction, never distance","It adds backspin (rpm) to the ball"],"answerIndex":1,"explanation":"Resolving the wind into a component along the target line (head/tail) and a component across it (crosswind) shows the two jobs are almost independent: head/tail reshapes carry, crosswind pushes the ball off line. Flightglass's engine itself never sees wind — clubSpeed, faceAngle, clubPath, dynamicLoft and attackAngle still produce the same backspin and baseline carry; wind is a separate EST layer applied afterward."},{"q":"Compare a 20 mph headwind to a 20 mph tailwind on the same hole. Which is true?","options":["They cancel out exactly","The headwind costs about 22% of carry while the tailwind only gives back about 12% — the headwind hurts almost twice as much","The tailwind helps more than the headwind hurts","Both change carry by the same amount, just in opposite directions"],"answerIndex":1,"explanation":"Flightglass’s EST wind layer puts a 20 mph headwind at about 22% of carry (e.g. -60.5 yd on a 275-yd drive) while an equal 20 mph tailwind gives back only about 12% (+33 yd) — the headwind's penalty is roughly 1.8x the tailwind's benefit, and that gap widens as the wind gets stronger."},{"q":"Why does a shot balloon in a headwind even though the golfer swung exactly the same way?","options":["The headwind physically adds backspin (rpm) to the ball at impact","Backspin rpm is unchanged — it's fixed the instant the ball leaves the face, before the wind matters — but the ball's speed relative to the air is higher into a headwind, so the same spin produces more Magnus lift","The golf ball gets lighter in strong wind","A headwind slows the clubhead, which raises spin loft"],"answerIndex":1,"explanation":"Spin rate is set entirely at impact and the wind can't touch it afterward. What the wind changes is the ball's speed relative TO the air — higher into a headwind — and Magnus lift depends on that relative speed, so the identical spin generates more lift, holding the ball up longer and steeper than usual. That's ballooning."},{"q":"A low, piercing knock-down iron and a high, spinny wedge both carry roughly 130 yards in an identical 15 mph pure crosswind (blowing straight across the target line). Which one drifts farther off line, and why?","options":["The knock-down iron, because it's a longer clu
