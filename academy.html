 path. A golfer with an 8° out-to-in path who closes their face from 0° to -2° (to target) is still 6° open relative to path — engine check: total offline collapses from 11.93 yd to 3.07 yd, but the curve itself only shrinks 17.96 -> 13.66 yd. The ball still bends nearly 14 yards; the closed face has simply aimed the start line 3.5° left so the bend lands back near target. That is a compensation, not a fix — the flight is still a slice shape, and the miss reappears the moment face timing wanders, until the path itself moves too.","\"Aiming your body/shoulders further right increases club path by the same amount.\" In Flightglass's own swing-plane geometry, rotating swing direction by 5° only shifted measured club path by about 3.35° in one worked example (and also moved attack angle) — the relationship isn't 1:1, because path also depends on exactly where along the circular swing arc contact happens and how upright the plane is.","\"The same swing fault shows up the same in every club.\" It doesn't. The identical 6° face-to-path gap curves a 113-mph driver 45.70 yd against a 7-iron's 13.66 yd - 3.35x, far past the 2.46x you would get by squaring the 1.569x carry ratio - because the driver's low loft tilts the axis much harder (30.560° vs 9.428°). And the loft-dependent face weight means path itself also matters more for where a wedge starts (35% of start direction) than where a driver starts (15.5%)."],"wolframChecks":["167 / 113 = 1.478 -> the tour driver smash factor from TrackMan's own PGA Tour Averages chart (1.48). Flightglass's engine runs a shade hotter than the tour table at the same inputs (11° loft, attack +1°, 113 mph -> 169.9 mph ball, 1.504 smash, 274.0 yd carry, against TrackMan's 167 / 1.48 / 275), so the tour row is context, not engine output.","Single-variable check - same club, same gap, identical 30.560° tilt, driver at 100 vs 113 mph: carry 228.84 -> 271.97 yd (1.188x) while curve goes 31.10 -> 45.70 yd (1.469x). Multiplying the carry ratio by itself predicts 1.412x, so the measured bend runs 4.0% past it — an effective exponent of about 2.23 on carry, with the tilt held still. There is no closed-form curve formula in the engine to quote; curve is integrated from the flight.","17.96 / 4.62 = 3.888 against a gap ratio of 8 / 2 = 4 -> on a 7-iron (30° loft, attack -3°, 90 mph) the engine's curve is very nearly proportional to the face-to-path gap: 2°, 4°, 6° and 8° bend 4.62, 9.19, 13.66 and 17.96 yd, i.e. 2.31, 2.30, 2.28 and 2.25 yd per degree. Nearly, not exactly — and on a driver (11°, attack +1°, 113 mph) the per-degree rate falls further, from 8.61 yd/° at a 2° gap to 6.96 at 8°, because the axis tilt itself stops keeping pace (11.158° rising to only 38.160°). Geometry, not a limiter, and no fixed gain to quote.","55.66 / 6.55 = 8.50 against a gap ratio of 8 / 0.75 = 10.67 -> across the driver's full measured ladder at 113 mph (0.75°, 2°, 4°, 6° and 8° gaps bending 6.55, 17.22, 32.80, 45.70 and 55.66 yd) curve climbs steeply but less than proportionally with the gap, because the tilt it comes from flattens too: 4.231°, 11.158°, 21.513°, 30.560°, 38.160°. The engine reads that tilt as exact geometry, so the flattening is real geometry rather than any ceiling.","6.55 / 0.75 = 8.73 yd of curve per degree -> the engine's Straight/Fade boundary sits at exactly a 0.75° gap (anything under it reads 'Straight'), and the very first gap that earns a shape name already costs a 113-mph driver 6.55 yd of bend and 7.79 yd of total offline. A 7-iron at a 2° gap charges 4.62 / 2 = 2.31 yd per degree, so the driver bills close to four times the yardage (3.8x) for the same degree of carelessness.","274 yd x tan(1°) = 4.783 yd and 174 yd x tan(1°) = 3.037 yd -> the pure geometric 'where it starts' contribution of 1° of start-direction error over the engine's own driver vs 7-iron carries, isolating the (much smaller) start-line effect from the (much larger) curve effect on total offline.","engine check: faceW = 0.90 - 0.005 x dynamicLoft at dynLoft 11 / 30 / 50 -> 0.845 / 0.750 / 0.650, i.e. club path contributes 15.5% / 25% / 35% to start direction -> matches the independently-published TrackMan-derived rule that 'face angle drives ~85% of start direction with driver, ~75% with a mid-iron' almost exactly (85% vs the engine's 84.5%, 75% vs the engine's 75.0%).","engine check: 7-iron (dynamicLoft 30°, attack -3°, 90 mph) at path -8° / face 0° -> faceToPath +8°, spin-axis tilt 12.471°, startDirection -2.00°, curve +17.96 yd; offline = carry x sin(startDirection) + curve = 172.83 x sin(-2.00°) + 17.96 = -6.03 + 17.96 = 11.93 yd (Pull Slice) -- demonstrates a face that is square relative to the target still slices badly once it is 8° open relative to path, grounding the #1 real-world slice misconception."],"quiz":[{"q":"What does \"club path\" actually measure?","options":["Where the clubface is pointing at impact","The horizontal direction the clubhead is traveling through impact, relative to the target line","The vertical angle of the clubhead's approach (up or down)","How far inside or outside the ball the club is positioned at address"],"answerIndex":1,"explanation":"Club path is purely about the direction of clubhead travel through impact — in-to-out (positive) or out-to-in (negative) relative to the target line. Where the face points is a separate number (face angle); up/down motion is attack angle. Mixing up path and face is the single most common launch-monitor reading mistake."},{"q":"A 7-iron is struck with the clubface pointing exactly at the target (0° face angle) but the club path is 8° out-to-in. What happens to the shot?","options":["It flies dead straight, since the face is square","It starts slightly left and curves hard back to the right — a big slice","It starts slightly right and curves left — a big hook","A square face means path has no effect on curve at all"],"answerIndex":1,"explanation":"In Flightglass's engine this exact input (path -8°, face 0°, 30° loft, attack -3°, 90 mph) produces a 'Pull Slice': the ball starts 2.00° left (path still contributes 25% of start direction for a 7-iron, so the start line pushes it 6.03 yd left) and then curves 17.96 yd back right, landing 11.93 yards offline — because the face is 8° open relative to the path, even though it's perfectly square to the target. This is the #1 real-world misconception about slicing."},{"q":"With a driver, roughly what share of the ball's initial start direction comes from club path rather than face angle?","options":["About 15%","About 50%","About 75%","About 100%"],"answerIndex":0,"explanation":"Flightglass's engine gives an 11° driver strike a face weight of 0.845 — meaning path contributes only about 15.5% to start direction, the rest is face angle. That closely matches the independently-published, TrackMan-derived rule that face angle owns roughly 85% of start direction with a driver (about 75% with a mid-iron, since a lofted club lets path matter more)."},{"q":"A driver (275-yard carry) and a 6-iron (183-yard carry) each have a similarly sized face-to-path gap. Which curves more, in actual yards?","options":["The 6-iron, because it's more lofted","They curve the same number of yards — only the gap size matters","The driver, by more than three times, because its lower loft tilts the spin axis far harder and its longer flight compounds that tilt","Neither curves — only face angle relative to the target matters"],"answerIndex":2,"explanation":"TrackMan's own published numbers point the same way: a driver curves about 19 yards at a 2° face-to-path gap while a 6-iron curves only about 8 yards at a similar gap — roughly 2.4x more yards off the tee for essentially the same degree of mismatch. Flightglass's engine reproduces the effect from geometry rather than from any distance law: at a matched 6° gap it bends a driver 45.70 yd against a 7-iron's 13.66 yd, a 3.35x ratio, because the driver's axis tilts 30.560° against the iron's 9.428°. Distance alone cannot explain it — pinned at a matched tilt, the driver's 2.25x carry over a wedge buys only 1.30x the curve."},{"q":"Two golfers both aim their swing direction dead at the target (0°). Golfer A's low point (where the swing arc bottoms out) sits well ahead of the ball; Golfer B's sits behind the ball. Whose club path is more in-to-out?","options":["Golfer A (low point ahead of the ball)","Golfer B (low point behind the ball)","They're identical — path only depends on aim, not low point","Neither has a measurable path since both aimed at the target"],"answerIndex":0,"explanation":"In Flightglass's swing-plane geometry engine, moving the low point 3 cm ahead of the ball (a good, descending, ball-first strike) added about +0.8° of in-to-out path even with swing direction held at a dead-square 0°. The same offset behind the ball produced about -0.8° (out-to-in) instead. Club path isn't purely a matter of where you aim — it also depends on exactly when, along the circular swing arc, contact happens."}]}</script>

  <script type="application/json" id="lesson-spin-loft">{"parameter":"Spin Loft","oneLiner":"Spin loft is the true three-dimensional angle between where the clubface points and where the club is actually travelling at impact — set by dynamic loft and attack angle vertically, and by face angle and club path horizontally — and it is the single geometric dial that decides how glancing (spinny) or square (efficient) every strike is.","whatItIs":"Spin loft is the angle between two directions that almost never quite line up at impact: where the clubface points, and where the clubhead is travelling. It is a three-dimensional angle, not a side-on one. Vertically it is set by dynamic loft against attack angle; horizontally by face angle against club path. Both halves count. The bigger that mismatch, the more the strike glances across the ball instead of squarely compressing it — and a glancing strike is exactly what turns clubhead speed into backspin. Launch-monitor literature usually quotes the simplification spin loft = dynamic loft − attack angle, and this app's engine computes something stricter: the full included angle between the club's velocity vector and the face normal, atan2 of their cross product over their dot product. The simplification is the vertical component alone. It is exactly right when the face points where the club is travelling, and it under-reads as soon as they diverge: on a 7-iron a 4° face-to-path gap adds 0.22°, an 8° gap adds 0.88°, a 12° gap adds 1.94°. On a driver it matters far more, because the vertical component is small to begin with — a 10° gap on a 10° vertical spin loft gives 14.09°, not 10°, a 41% under-read. That is the slicer's delivery, and the slicer is who this lesson is for. It is a purely geometric quantity — it doesn't care how fast you're swinging, only about the shape of the strike — which is why it sits in the 'Derived' tier of this app's dependency graph, built entirely from two Fundamentals-tier numbers (Dynamic Loft and Attack Angle) and in turn feeding two more Derived-tier outcomes (Smash Factor and Backspin) plus a term in Landing Angle. It is genuinely one of the most useful single numbers in golf instruction because it explains, with one subtraction, both why a driver should be low-spin and why a wedge should be high-spin — they're not different rules, they're the same formula run at opposite ends of its range.","components":[{"name":"Dynamic loft","role":"The effective loft the face actually presents at impact — not the number stamped on the club. It is the larger, additive half of spin loft and the widest-ranging lever: club selection alone swings it more than 40 degrees across a bag.","typicalRange":"driver ~9-13°; 7-iron delivered ~24-30° (often several° less than the stamped static loft due to forward shaft lean); wedge ~30-46°"},{"name":"Attack angle","role":"The vertical direction the clubhead is moving at impact — up or down. It subtracts from dynamic loft, so a more negative (steeper down) attack angle makes spin loft bigger, and a more positive (upward) attack angle makes it smaller. It is the only lever that lowers spin loft without taking loft off the face — but it is not free of side effects: engine check at 113 mph with 11 degrees of dynamic loft, -5 degrees attack launches the ball at 8.7 degrees and +4 degrees attack launches it at 11.0 degrees, so attack angle moves launch too.","typicalRange":"driver -5 to +5° (tour average close to level/-1 to -1.5°; optimized/low-spin fittings +3 to +5°); mid-iron -6 to -2°; wedge -6 to -3°"},{"name":"Face angle","role":"Where the clubface points left or right at impact. Together with club path it sets the horizontal half of spin loft — the half the side-on simplification leaves out. On its own it does nothing to spin loft; what counts is how far it diverges from the path.","typicalRange":"tour driver within ~1-2° of path; a recreational slice commonly runs 6-15° open to path"},{"name":"Club path","role":"The horizontal direction the clubhead is travelling through impact. The gap between face angle and club path is the horizontal mismatch, and it enters spin loft the same way dynamic loft minus attack angle enters it vertically. A 10° gap on a driver raises spin loft from 10° to 14.09°.","typicalRange":"tour ~-2 to +2°; recreational slicers often -4 to -8° (out-to-in)"},{"name":"Club / loft selection","role":"The single biggest real-world decision that resets dynamic loft in one move. Golfers rarely think 'I'm changing spin loft' — they think 'I'm changing clubs' — but every club swap directly resets the dominant half of the equation.","typicalRange":"driver ~10° to lob wedge ~58-64° static loft — a >45° span across a full bag"},{"name":"Shaft lean / hand position (forward press)","role":"Fine, golfer- or fitter-controllable adjustment to dynamic loft on top of a single club's stamped loft. Leaning the shaft forward at impact de-lofts the face a few degrees, which is why measured dynamic loft on tour irons runs meaningfully below the printed number.","typicalRange":"can shift dynamic loft several degrees (illustrative; shaft-lean-dependent, not a fixed constant)"},{"name":"Smash factor (downstream consequence)","role":"Ball speed / club speed — the strike-efficiency payoff. In the engine it falls along a curved, non-linear falloff as spin loft rises (smashEff = (1.544 − 0.00338×spinLoft − 0.000065×spinLoft² — clamped to 1.15-1.52)). A bigger spin loft is a more glancing hit, so less of the strike goes into forward compression — but the engine's curve is a fitted falloff, not the raw geometric energy split: measured, smash falls 20% from 9° to 51° spin loft (1.5084 to 1.2027) where cos² of the same angles falls 59% (0.976 to 0.396).","typicalRange":"engine measured at 90 mph: 1.5084 at 9° spin loft, 1.4891 at 13°, 1.3618 at 33°, 1.2027 at 51°; clamp 1.15-1.52, and the same curve for every club — the 1.52 ceiling only binds below 6.34° spin loft, the 1.15 floor not until 56.1°"},{"name":"Backspin (downstream consequence)","role":"The rev rate spin loft feeds. The engine does not multiply spin loft by ball speed and a per-club constant — it solves rolling-at-separation spin from the true 3-D spin loft (omega = V·sin(theta) / [R·(1 + k·(1 + m_ball/m_head))]), scales that by a calibration sigmoid read off the vertical spin loft (0.81 rising toward 1.13, centred at 32°), and caps the readout at 9,000 rpm. Measured consequences: spin is exactly linear in club speed (51° spin loft gives raw 10,600 rpm at 90 mph and 10,011 at 85 — the same 1.0588 ratio as the speeds), and steeper than linear in spin loft, because the sigmoid steepens straight through the mid-iron band.","typicalRange":"engine at 90 mph clubspeed: 1,530 rpm at 9° spin loft, 2,200 at 13°, 4,968 at 28.5°, 6,623 at 33°, 8,711 at 40°; raw spin crosses the 9,000 rpm readout ceiling at about 41.5° and reads a flat 9,000 above that (raw 10,600 at 51°)"}],"howTheyConnect":"Contact between clubface and ball lasts under a millisecond, and in that instant the ball's compression against the face can be resolved into two directions: the direction the face is pointing (which drives spin loft's dynamic-loft half) and the direction the club is travelling (attack angle, the half that subtracts). When those two directions coincide — attack angle equals dynamic loft — spin loft would be zero and the strike would be as square/compressive as geometry allows. In practice they never coincide by more than a few degrees at best, and the gap between them (spin loft) determines how much of the strike is a clean compression versus a glancing skid. A bigger spin loft geometrically means more of the impact's relative velocity runs along the face (the skid/spin-producing direction, scaling like sin of the angle) rather than into the face (the compression/ball-speed-producing direction, scaling like cos of the angle). Both engine outputs follow that direction, but neither is the bare geometry. Smash comes from a fitted curve (smashEff = 1.544 − 0.00338×spinLoft − 0.000065×spinLoft², clamped 1.15-1.52) whose falloff is much gentler than a pure cos² energy split: measured 1.5084 at 9° down to 1.2027 at 51°, a 20% drop, where cos² falls 59% over the same span. Backspin comes from a rolling-at-separation solve that carries the sin(spin loft) term and a calibration sigmoid on top, so it climbs faster than proportionally: at 90 mph, 1,530 rpm at 9°, 2,200 at 13°, 6,623 at 33°, and a ceiling-capped 9,000 at 51°. Two readings of one trade-off, measured on the same deliveries, not two unrelated dials. Spin loft itself is built from exactly two Fundamentals-tier numbers with equal, opposite-signed weight — dynamic loft adds, attack angle subtracts — so a golfer can reach the identical spin loft through very different deliveries (steep attack + low loft, or shallow attack + high loft). It then feeds forward into Landing Angle too — engine check at 90 mph: 34.6° descent at 9° spin loft, 50.8° at 33°, 52.4° at 51°, so the effect is real but saturates once the strike is already very glancing — which is why a big-spin-loft wedge doesn't just spin more, it also comes down noticeably steeper and holds the green better than a low-spin-loft chip-and-run.","hierarchy":[{"driver":"Dynamic loft","weight":"1:1 direct addition to spin loft, and by far the widest practical range of any single lever — roughly 9° (driver) to 50+° (lob wedge), a >40° span across the bag","why":"Every degree of dynamic loft adds exactly one degree of spin loft (it's a direct subtraction in the formula). Because loft varies enormously just from picking a different club, it explains most of the spin-loft spread golfers see shot to shot — it is the biggest lever mainly because it has the biggest room to move, not because it is weighted more heavily in the math."},{"driver":"Attack angle","weight":"mathematically identical weight to dynamic loft (each degree subtracts one degree of spin loft), but a much narrower golfer-controllable window — roughly -6° to +5°, an ~11° span","why":"It carries the exact same per-degree pull as loft, but because real swings vary attack angle far less than loft varies across the bag, it moves the total less in absolute terms shot-to-shot. It is, however, the only lever that lowers spin loft without removing loft from the face — engine check: an 11° driver loft at -5° attack gives 16° spin loft, the same loft at +4° attack gives 7° — swinging up instead of down more than halves it. It is not neutral on launch, though: that same pair launches at 8.7° and 11.0° at 113 mph."},{"driver":"Face angle and club path (the gap between them)","weight":"Adds the horizontal component. Negligible when face and path agree, decisive when they do not — 41% of the total on a 10° driver gap.","why":"Spin loft is a 3-D included angle, so the horizontal mismatch adds in quadrature with the vertical one rather than simply summing. That is why a small face-to-path gap barely moves a lofted iron's spin loft but transforms a driver's: the driver's vertical component is small, so the horizontal one dominates the total."},{"driver":"Club / loft selection","weight":"the single biggest real-world decision — swapping a wedge (46°) for a 7-iron (30°) resets dynamic loft ~16° in one choice, more than most swing changes could ever move it","why":"Golfers experience this lever as 'which club am I hitting', not as a spin-loft adjustment, but every club change directly resets the dominant half of the formula. It is why spin loft naturally clusters into bands by club (driver ~9-12°, mid-iron ~28-33°, wedge ~37-51°) before a golfer does anything else differently."},{"driver":"Shaft lean / hand position (forward press)","weight":"a fine-tuning knob worth several degrees of dynamic loft on top of one club's stamped number","why":"Tour players deliver notably less loft at impact than the number stamped on the iron by leaning the shaft forward through the ball; it is the precision adjustment within a single club, which is why 'dynamic' loft (delivered) and 'static' loft (stamped) are never quite the same number."},{"driver":"Strike centeredness / gear effect","weight":"does not move the geometric spin-loft number at all, but distorts how faithfully that number becomes real, measured spin","why":"An off-center hit can under- or over-deliver the spin a 'clean' spin-loft geometry would predict via gear effect. It is ranked last because on a centered strike it's invisible — but it's the reason two swings with an identical measured spin loft can still produce visibly different real-world spin."}],"realWorld":{"tourBenchmarks":["PGA Tour driver (widely cited TrackMan tour-average figures, the same 2,700 rpm ballpark already used elsewhere in this app's Backspin lesson): dynamic loft ~10.9°, attack angle ~-1.3° (near level), spin loft ~12.2°, backspin ~2,686 rpm, ball speed ~167 mph, carry ~275 yd. Engine check on that exact delivery at 113 mph club speed: spin loft 12.2°, 2,594 rpm, ball speed 168.7 mph, carry 266.5 yd — close on speed and spin, a little short on carry.","PGA Tour 7-iron: dynamic loft ~24.2°, attack angle ~-4.3° (clearly descending), spin loft ~28.5°, backspin ~7,097 rpm, carry ~172 yd. Engine check on that delivery at 90 mph reads 4,968 rpm and 179.8 yd — the engine is markedly more conservative on iron spin than the tour-average figure, so treat its iron rpm as directionally right, not calibrated to tour numbers.","PGA Tour pitching wedge: dynamic loft ~32.6°, attack angle ~-4.5°, spin loft ~37.1°, backspin ~9,304 rpm, carry ~136 yd — the steepest spin loft and highest spin of the three. Engine check at 90 mph: 8,033 rpm; at 85 mph: 7,586 rpm — closer here than on the 7-iron, and still under the 9,000 rpm readout ceiling.","Modern 'low-spin driver' / long-drive-style fitting: pairing a low static loft (~9-11°) with a strongly upward attack angle (+3 to +5°) can push spin loft down to ~6-8° — below even the tour average — chasing the low-spin, low-drag launch window that maximizes carry at high ball speed. Note where that lands in the engine: below 6.34° spin loft the smash curve hits its 1.52 ceiling and stops rewarding you for going flatter still."],"scenarios":["Why a mid-handicap's driver comes up short: chopping down on the ball (attack angle -4°) on top of ordinary driver loft (11°) creates a 15° spin loft. Engine at 113 mph: smash 1.4787, 3,178 rpm, carry 253.6 yd, descent 42.3° — against 1.5172, 1,496 rpm, 277.5 yd and 32.0° for the same club delivered at +4° attack. Note what the engine does NOT show: apex actually goes DOWN, 32.0 yd against 37.4 yd, so the loss here is ball speed and a steeper landing, not the 'ballooning' the shot is usually described as.","Why 'hit up on the driver' is the single most repeated modern fitting tip: engine check, same 11° loft driver at 113 mph, attack angle -1° to +4° cuts spin loft 12° to 7°, spin 2,552 to 1,496 rpm, and adds 9.6 yd of carry (267.9 to 277.5) — a real, measured reason the advice works, not just a feel cue.","Why a well-struck wedge shot 'sits down' on a firm green: 46° loft delivered with a -5° descending blow makes a 51° spin loft — more than four times the driver's. At full speed (85 mph) the engine's raw spin for that strike is 10,011 rpm, so the readout simply pins at its 9,000 ceiling; the shot is working as designed, not mishit. On a partial wedge the same lever shows up unclamped: 60 mph, 46° loft, -5° attack reads 7,067 rpm and 87.6 yd against 6,649 rpm and 91.2 yd at -1° — the steeper strike buys about 6% more spin and gives back 3.6 yd.","Why two golfers with the same 7-iron flight it completely differently: one delivers 24° loft with a -3° attack (27° spin loft) and the engine gives 1.4054 smash, 4,595 rpm, 181.6 yd, 49.3° descent; the other delivers 33° with a -7° chop (40° spin loft) and gets 1.3049 smash, 8,711 rpm, 164.3 yd, 51.7° descent. Same club, same 90 mph — and note the carries are NOT the same: 17 yd separates them, so the steep delivery is not a free trade of distance for stopping power, it costs both ball speed and yardage."],"whatItMeansForYou":"You don't set spin loft directly with a knob — you set it through two decisions: which club you pick (that sets your baseline dynamic loft) and how steep or shallow your attack angle is with it. If the driver spins too much and runs out of gas, fix it with attack angle rather than by taking loft off the face. Engine check at 113 mph, both routes taken to the same 9° spin loft: 8° dynamic loft at -1° attack carries 238.0 yd, while 11° loft at +2° attack carries 275.2 yd. Identical spin loft, identical 1.5084 smash and 1,920 rpm — 37 yd apart, because de-lofting also throws the launch angle away (7.5° against 10.5°). If wedge shots aren't stopping, you want spin loft to stay large: engine at 60 mph with a 46° wedge, a -5° strike reads 7,067 rpm against 6,649 rpm at -1°. On a full wedge you will not see that in the rpm number at all — it is already pinned at the 9,000 ceiling — so judge it by landing angle and carry instead."},"misconceptions":["\"Spin loft and dynamic loft are the same thing.\" They aren't — dynamic loft is just where the face points; spin loft is the gap between where the face points and where the club is travelling (dynamic loft minus attack angle). A club can have plenty of dynamic loft and still a small spin loft if attack angle is matched to it.","\"Hitting up on the ball kills spin loft entirely.\" It shrinks spin loft, it doesn't zero it out. Engine check: an 11° driver loft at a strongly upward +4° attack angle still leaves 7° of spin loft — small, not nothing, because dynamic loft is still doing most of the work.","\"You should minimize spin loft on every club.\" False — the right spin loft is club- and shot-dependent. A driver wants a small spin loft (less spin, more distance); a wedge needs a large spin loft (high spin, stopping power on the green). There is no universal 'smaller is better' rule.","\"The loft stamped on the clubhead is what goes into the spin-loft formula.\" It's the delivered (dynamic) loft that counts, which is often several degrees less than the static number for irons because tour players lean the shaft forward through impact.","\"Dynamic loft matters more than attack angle because it's the bigger number.\" Inside the spin-loft formula they carry identical 1:1 weight — each degree of either moves spin loft by exactly one degree. Loft only looks more important because golfers vary it over a much wider range (club selection) than they vary attack angle. Downstream of spin loft they are not interchangeable, though: engine check at 113 mph, reaching 9° spin loft by de-lofting (8°/-1°) carries 238.0 yd while reaching it by hitting up (11°/+2°) carries 275.2 yd — same spin loft, same smash, same spin, very different shot.","\"A big spin loft means a bad, mishit strike.\" Spin loft is pure geometry (an angle), not a strike-quality score. A perfectly centered, well-struck wedge naturally runs 40+ degrees of spin loft by design — that's not a mishit, that's the shot working as intended."],"wolframChecks":["Engine check (solveFlight, 90 mph, clubPath 0, faceAngle 0), backspin against spin loft: 9° -> 1,530 rpm; 13° -> 2,200; 28.5° -> 4,968; 33° -> 6,623; 40° -> 8,711; 51° -> raw 10,600 rpm reported as the clamped 9,000. Raw spin first crosses the 9,000 rpm ceiling at about 41.5° spin loft at this club speed, so every wedge-band reading above that is the ceiling talking, not the strike.","Engine check, spin scaling: at 51° spin loft the raw spin is 10,600 rpm at 90 mph and 10,011 rpm at 85 mph -> ratio 1.0588, exactly the club-speed ratio 90/85. Spin is exactly linear in club speed, but distinctly non-linear in spin loft: the measured marginal rate is 166 rpm per degree at 13° spin loft, 409 per degree at 33°, and back to 207 at 40°, because the engine's calibration sigmoid is centred at 32° — a degree of spin loft is worth most in the mid-iron band and much less at either end.","10.9 - (-1.3) = 12.2 -> driver-average dynamic loft minus attack angle reproduces the commonly cited tour driver spin loft exactly, confirming the identity holds on real launch-monitor-style figures, not just round numbers.","24.2 - (-4.3) = 28.5 -> 7-iron dynamic loft minus attack angle reproduces the cited 7-iron spin loft exactly.","32.6 - (-4.5) = 37.1 -> pitching-wedge dynamic loft minus attack angle reproduces the cited wedge spin loft exactly.","cos^2(12.2°) = 0.9553, cos^2(28.5°) = 0.7723, cos^2(37.1°) = 0.6361 -> the fraction of impact-velocity energy resolved along the compressive, ball-speed-producing direction falls from ~96% (driver-level spin loft) to ~64% (wedge-level spin loft) as spin loft grows -- the direction in which smash factor moves. It is NOT the engine's magnitude: over 9° to 51° spin loft, cos^2 falls 59% (0.976 -> 0.396) while the engine's measured smash falls only 20% (1.5084 -> 1.2027). The geometry sets the sign of the effect; the engine's fitted curve sets its size.","sin(37.1°)/sin(12.2°) = 2.854 -> the glancing/skid velocity component (the geometric seed of spin) is nearly 3x larger at wedge-level spin loft than at driver-level spin loft, before friction or ball speed are even factored in.","Engine check (solveFlight, clubSpeed 90 mph): dynamicLoft 13/attackAngle +4 -> spinLoft 9°, smashEff 1.5084 (measured, not clamped -- the 1.52 ceiling only bites at or below 6.34° spin loft); dynamicLoft 30/attackAngle -3 -> spinLoft 33°, smashEff 1.3618; dynamicLoft 48/attackAngle -3 -> spinLoft 51°, smashEff 1.2027 -- confirms the engine's smash-vs-spin-loft tradeoff (a curved, non-linear falloff, not a fixed per-degree rate) runs consistently across the full realistic range, and that the same formula now applies to every club.","Engine check, dynamic loft 10 / 30 / 48° at 90 mph and -3° attack (spin loft 13 / 33 / 51°), backspin: 2,200 / 6,623 / 9,000 rpm -> spin loft alone, at one club speed, spans the app's whole backspin readout. The 9,000 is that readout's ceiling and not a real top (raw spin there is 10,600 rpm), and there is no floor under it: 0° spin loft measures 0 rpm.","Amateur-vs-optimized driver check: dynamicLoft 11/attackAngle -5 -> spinLoft 16°; dynamicLoft 11/attackAngle +4 -> spinLoft 7° -> swinging up instead of down on the same 11° driver loft more than halves spin loft (16 -> 7°, ratio 2.29x), the arithmetic behind the 'hit up on the driver' fitting advice."],"quiz":[{"q":"A driver is delivered with 11° of dynamic loft. Which attack angle gives the smallest spin loft?","options":["-3° (slightly down)","0° (level)","+3° (slightly up)","+6° (strongly up)"],"answerIndex":3,"explanation":"Vertically, spin loft = dynamic loft − attack angle, so the most positive (most upward) attack angle subtracts the most. At +6°: 11 − 6 = 5°, the smallest of the four options. This is exactly why 'hit up on the driver' is repeated so often in modern fitting — it shrinks spin loft without touching loft at all."},{"q":"Why does smash factor (ball speed / club speed) tend to fall as spin loft rises, even at the exact same clubhead speed?","options":["The club physically decelerates before a glancing strike","A bigger spin loft is a more glancing hit, so more of the impact's energy resolves into skid/spin rather than forward compression, leaving less to become ball speed","Backspin slows the ball down mid-flight, which the engine miscounts as a speed loss","Spin loft has no real effect on smash factor — it's a coincidence in the model"],"answerIndex":1,"explanation":"At impact, the compressive (ball-speed-producing) component of the strike scales with cos(spin loft) and the tangential/skid (spin-producing) component with sin(spin loft). Grounded check: cos^2(12.2°) = 0.955 (driver-level spin loft keeps ~96% of impact energy pointed forward) vs cos^2(37.1°) = 0.636 (wedge-level keeps only ~64%). The geometry sets the direction; the engine's actual falloff is much gentler — measured smash 1.5084 at 9° spin loft down to 1.2027 at 51°, a 20% drop where cos^2 drops 59%."},{"q":"An amateur chops down on the driver (11° loft, -5° attack angle) while a tour-optimized swing uses the same 11° loft but a +4° attack angle. Roughly how much bigger is the amateur's spin loft?","options":["About the same","About 50% bigger","About double","About 10x bigger"],"answerIndex":2,"explanation":"Amateur: 11 − (−5) = 16°. Optimized: 11 − 4 = 7°. 16/7 ≈ 2.3 — roughly double. Same club, same loft, only the attack angle changed, and it more than doubled the spin loft. Engine at 113 mph, that is the difference between 1.4733 smash / 3,385 rpm / 248.7 yd and 1.5172 smash / 1,496 rpm / 277.5 yd — the drive comes up short on ball speed and lands steeper, and note the engine's apex goes down rather than up, so 'ballooning' is not what costs the yardage here."},{"q":"Because spin loft is defined as dynamic loft minus attack angle, could it ever be zero or negative?","options":["No — spin loft is always a positive number by definition","Yes — if attack angle exceeds dynamic loft (an unusually upward strike with very little loft), spin loft can shrink toward zero or go negative, an unusual 'topspin-style' geometry","Only mathematically, it can never happen on a real golf shot","Only on wedges, never on a driver"],"answerIndex":1,"explanation":"It's just subtraction — if attack angle ever exceeds dynamic loft, the result goes negative. It's rare (most real swings keep loft comfortably above attack angle), but the engine handles it: at 5° dynamic loft with a +10° attack angle (spin loft -5°) it returns signedBackspinRpm -852 and reports backspin 852 — the sign survives internally as the topspin case, and the displayed number is its magnitude."},{"q":"Comparing a wedge (spin loft ~37-51°) to a driver (spin loft ~9-12°), what's the main real-world consequence for a golfer?","options":["The wedge has higher smash factor and more ball speed than the driver","The wedge spins far more and launches much higher, trading distance for a steep, controllable descent — while the driver stays low-spin to maximize carry","Spin loft has no real consequence on ball flight, only club selection does","They behave identically because club path is zero on both"],"answerIndex":1,"explanation":"A big spin loft (wedge) is BY design. Engine at 85 mph, 46° loft, -5° attack: 51° spin loft, smash 1.2027, raw spin 10,011 rpm (readout pinned at the 9,000 ceiling), 52.4° descent, 136.7 yd. A small spin loft (driver) is also by design. Engine at 113 mph, 13° loft, +4° attack: 9° spin loft, smash 1.5084 (within 0.012 of the 1.52 ceiling), 1,920 rpm, 34.6° descent, 275.2 yd. Same formula, opposite goals depending on the club."}]}</script>
  <script type="application/json" id="lesson-smash">
{"parameter":"Smash Factor","oneLiner":"Smash factor is ball speed divided by club speed — a pure strike-quality score that tells you how efficiently your swing's speed became ball speed, independent of how hard you actually swung.","whatItIs":"Smash factor is the simplest ratio on a launch monitor: ball speed / club speed. A 7-iron swung at 90 mph that sends the ball off at 120 mph has a smash factor of 1.33 (120 / 90); a driver swung at 113 mph that produces 167 mph of ball speed is 1.48. It should be read as a strike-quality number, not a power number — it measures how much of your swing's energy actually made it into the ball, not how fast you swung. A slow, perfectly centered strike can post a great smash factor at modest ball speed; a fast but mishit swing can post a poor smash factor despite plenty of speed. Two things move it: how square the hit is (a flush, low-loft, minimal-glancing strike sends energy almost directly into ball speed) versus how glancing it is (a lofted, oblique strike diverts real energy into spinning the ball instead of launching it — which is exactly what a wedge is designed to do on purpose). Flightglass's engine models this with one curve: smashEff = 1.544034 − 0.00337882 × spinLoft − 0.000064966 × spinLoft², clamped to the 1.15-1.52 band, where spinLoft is the full 3-D angle between where the face points and where the club is travelling — and ball speed = club speed × smashEff. The curve is not a straight line: it bends downward, so each extra degree of spin loft costs more smash the more lofted the strike already is. The 1.52 ceiling is only touched at or below 6.34° of spin loft (deep driver territory) and the 1.15 floor needs about 56° (a full lob wedge). Be aware of one honesty note: at a tour driver delivery (113 mph, 13° dynamic loft, +4° attack → 9° spin loft) the engine returns smash 1.5084 and 170.4 mph of ball speed. That is above the ~1.48 TrackMan tour average and above the ~1.49 physical ceiling a conforming driver allows, so the model reads slightly optimistic at the low-spin-loft end. Read it as a teaching model, not a conformance test.","components":[{"name":"Ball speed / club speed ratio (the definition)","role":"Smash factor IS ballSpeed ÷ clubSpeed — one number answering 'how efficiently did this swing's speed turn into ball speed.'","typicalRange":"real launch monitors: driver ~1.45-1.50, 7-iron ~1.30-1.38, pitching wedge ~1.15-1.25. The engine sits a touch above that at driver lofts (1.5084 at 9° spin loft) and lands on it through the irons and wedges."},{"name":"3-D spin loft (the angle between face normal and club-velocity direction)","role":"The only quantity that enters smashEff at all. A tighter spin loft (more square, less glancing) pushes smash up toward the 1.52 ceiling; a wider spin loft pushes it down toward the 1.15 floor. Note it is the FULL 3-D angle, not just dynamic loft minus attack angle: a face-to-path miss adds a horizontal component that widens spin loft and costs smash too.","typicalRange":"7-iron spin loft ~28-38° -> smash 1.3985 to 1.3218 (engine-measured); driver spin loft ~8-16° -> smash 1.5128 to 1.4733 (engine-measured). Vertically 33.0° of spin loft returns 1.3618; adding 6° of club path away from a square face widens it to 33.5° and drops smash to 1.3580."},{"name":"Strike location on the face (center vs toe/heel/high/low)","role":"The biggest real-world lever for a given club and swing. Off-center hits ('gear effect') twist the clubhead instead of driving through the ball, bleeding ball speed even with perfect delivery angles. NOT modeled here: solveFlight always returns centeredStrike: true and gearEffectApplied: false, so every number this lesson quotes from the engine assumes a dead-center strike.","typicalRange":"dead-center strike = full smash; ~3/4 in (19mm) off-center can cost several mph of ball speed / roughly 0.05-0.15 off smash factor"},{"name":"Club/face COR (coefficient of restitution) and club category","role":"Sets the theoretical ceiling per club in the real world. Drivers are built with a springy, thin, USGA/R&A-limited face; irons and wedges are more rigid and are struck with far more loft, which matters more than face stiffness. Inside this engine, though, club identity is inert — the same delivery labelled 'driver' and labelled '7iron' returns the identical smash, because only spin loft feeds the formula.","typicalRange":"driver COR legal max ~0.83; iron/wedge real-world smash sits well below its own theoretical square-hit ceiling because of loft-driven spin loss"},{"name":"Club-to-ball mass ratio","role":"A heavier clubhead relative to the ball transfers momentum more efficiently in a head-on collision. Iron heads (~255-265g) are actually proportionally heavier vs the 45.93g ball than driver heads (~195-200g) — a square iron strike computes to an even higher theoretical ceiling than a driver's; it is loft, not mass ratio, that pulls real iron smash back down.","typicalRange":"driver head ~195-200g vs ball 45.93g gives a momentum-transfer fraction m/(m+m_ball) of ~0.81 (200/245.93); 7-iron head ~255-265g gives ~0.85 (258/303.93). These are the fractions used in the restitution formula, not the raw head-to-ball ratio (200/45.93 = 4.35)."},{"name":"Ball construction & temperature","role":"A ball's core and cover set its own COR; a colder or lower-compression ball springs off the face slightly less efficiently. Small compared to strike location and spin loft, and not modeled in this engine.","typicalRange":"roughly 0.01-0.03 smash-factor swing between ball models or a cold vs warm ball"}],"howTheyConnect":"At impact the club and ball are in contact for well under a millisecond. A simple restitution-collision model says the ball's exit speed depends on the club-to-ball mass ratio and the face's coefficient of restitution (COR — its 'springiness', capped by the USGA/R&A at about 0.83 for drivers): v_ball = v_club x (1+COR) x m_club/(m_club+m_ball). Plugging in a representative 200g driver head, the 45.93g USGA-maximum ball, and COR 0.83 gives a theoretical ceiling of about 1.49 — matching the real-world driver smash-factor ceiling almost exactly. Here is the twist: running the same formula for a 258g 7-iron head at a lower COR (~0.78) gives an even higher theoretical number, about 1.51 — because the heavier iron head is proportionally closer in mass to the ball. A square, dead-flush collision would actually favor the iron. What really happens is that irons are never struck square: the face carries loft, so every iron strike is a glancing blow BY design, and that obliqueness — spin loft, the gap between where the face points and where the club is travelling — diverts a real slice of the collision's energy into spinning the ball rather than launching it forward. The bigger the spin loft, the more glancing the hit, the more energy goes to spin instead of speed, and the lower smash factor falls. That is exactly what the app's engine encodes, and it encodes it as a downward-bending curve rather than a straight line: from 9° to 10° of spin loft costs 0.0046 of smash, from 25° to 26° costs 0.0067, and from 40° to 41° costs 0.0086. Each degree is more expensive than the last, which is why the smash penalty accelerates as you walk down the bag from driver to lob wedge instead of dripping away evenly. Two further consequences follow from the same line of code. First, club identity never enters it: pass the identical delivery with club 'driver' and club '7iron' and the engine returns the same smash, because only the spin-loft angle is read. Second, spin loft is a 3-D angle, so it is not only dynamic loft minus attack angle — swinging 6° of path away from a square face widens the true spin loft from 33.0° to 33.5° and quietly shaves smash from 1.3618 to 1.3580. On top of that clean geometric story sits one more real-world layer this diagram cannot model: where on the face you strike it. A hit toward the toe, heel, or off the vertical center makes the whole clubhead twist around its own center of mass at impact instead of driving straight through, so energy bleeds into head rotation rather than ball speed. That is why, on a real launch monitor, smash factor is treated as the single best on-screen number for 'did you find the center of the face,' even though it began life as nothing more than an energy-transfer ratio.","hierarchy":[{"driver":"Strike location on the face (center vs toe/heel/high/low — 'gear effect')","weight":"Largest real-world swing-to-swing lever — a strike ~3/4 in (19mm) off-center can cost several mph of ball speed and roughly 0.05-0.15+ off smash factor even with perfect delivery angles","why":"Off-center contact makes the clubhead twist around its own center of mass at impact instead of driving straight through, so energy bleeds into head rotation rather than ball speed. It is why TrackMan treats smash factor as the best on-screen proxy for 'did you find the middle of the face.' Not modeled in this app (solveFlight reports centeredStrike: true and gearEffectApplied: false on every solve), but it is the #1 real-world separator between a tour player's and an amateur's smash factor at the same clubhead speed."},{"driver":"3-D spin loft (face normal vs club-velocity direction)","weight":"The engine's only modeled lever, and it bites harder the wider it gets — 0.0046 of smash per degree near a driver's 9°, 0.0067 per degree at 25°, 0.0086 per degree at 40°. Moving spin loft from 25° to 40° on the identical strike drops smash 1.4190 -> 1.3049, a loss of 0.114.","why":"Spin loft is how glancing the blow is. A bigger gap between where the face points and where the club travels diverts more of the collision's energy into spinning the ball rather than launching it forward — the same tradeoff that makes backspin rise as smash falls. The curve bends downward, so the cost per degree accelerates; the penalty for a sloppy extra degree is roughly twice as large for a wedge as for a driver. This is the one quantity solveFlight actually uses to compute smash factor, and because the angle is measured in 3-D, face-to-path adds to it as well as loft-minus-attack."},{"driver":"Club/face technology and category (driver vs iron vs wedge)","weight":"Real-world: sets the ceiling for the whole range — driver ~1.45-1.50, mid-iron ~1.30-1.38, wedge ~1.15-1.25. In the engine: zero direct effect; the club label is carried through the solve untouched by the math.","why":"Every club category is built around a different intended spin loft (a wedge needs a big glancing blow to work) and the USGA/R&A spring-like-effect limit (COR <= ~0.83) puts a hard ceiling near 1.49-1.50 on any conforming driver. The engine reproduces the ladder without ever naming a club: it gets there purely through the spin loft each club is delivered with — 9° for a tour driver (1.5084), 33° for a stock 7-iron (1.3618), 46° for a pitching wedge (1.2511), 56° for a lob wedge (1.1511, effectively sitting on the 1.15 floor). Change the label but not the angles and nothing moves."},{"driver":"Ball construction & temperature (the ball's own COR)","weight":"Small — on the order of 0.01-0.03 of smash factor between ball models, or between a cold and a warm ball. Not modeled.","why":"A ball's core compression and cover material set its own coefficient of restitution; a warm, higher-compression premium ball springs off the face marginally more efficiently than a cold or low-compression one. Real, but far smaller than strike location or spin loft."},{"driver":"Club speed itself","weight":"Exactly zero direct effect on the ratio — at 33° of spin loft the engine returns smash 1.3618 at 70 mph, at 90 mph and at 110 mph alike; only ball speed and carry move (95.3 / 122.6 / 149.8 mph and 125 / 174 / 229 yd)","why":"Because ballSpeed = clubSpeed x smashEff and smashEff reads only spin loft, club speed cancels out of the ratio entirely. Swinging harder raises ball speed, backspin and carry; it does not, by itself, raise smash factor — the most common misread of the number."}],"realWorld":{"tourBenchmarks":["PGA Tour driver: ~113 mph clubhead speed -> ~167 mph ball speed -> smash factor ~1.48 (TrackMan Tour averages). Flightglass's engine, given that delivery (13° dynamic loft, +4° attack, 9° spin loft), returns 1.5084 and 170.4 mph — slightly above tour, worth knowing before you compare your app number to a broadcast one.","PGA Tour 7-iron: ~90 mph clubhead speed -> ~120 mph ball speed -> smash factor ~1.33. The engine at a stock 7-iron delivery (30° dynamic loft, -3° attack, 33° spin loft) returns 1.3618 and 122.6 mph — close.","PGA Tour pitching wedge: ~83 mph clubhead speed -> ~102 mph ball speed -> smash factor ~1.23. The engine at a PW delivery (42° dynamic loft, -4° attack, 46° spin loft) returns 1.2511 and 103.8 mph — smash factor drops steadily as loft climbs, club by club, in both the real bag and the model.","LPGA Tour driver: ~94 mph clubhead speed -> ~140 mph ball speed -> smash factor ~1.49 — LPGA pros swing ~19 mph slower than PGA Tour pros off the tee yet match or slightly beat their smash factor, proof the number rewards strike quality, not raw speed.","Physical ceiling: with the USGA/R&A spring-like-effect limit (COR <= ~0.83) and standard masses (~200g driver head, 45.93g ball — the USGA maximum), the theoretical maximum smash factor is about 1.49, and essentially no one exceeds ~1.50 on a conforming driver. The engine's own clamp sits higher, at 1.52, and is only reached at or below 6.34° of spin loft — that clamp is a numerical domain guard, not a claim about legal equipment."],"scenarios":["Two golfers both swing the driver at 95 mph. One flushes it dead center: the engine gives smash 1.5084, ball speed 143.3 mph and 215.5 yd of carry. The other catches it off the toe and loses about 0.13 of smash — roughly 130.9 mph of ball speed. Feed that same ball speed back through the engine and the carry falls to 190.3 yd. Same swing speed, 25 yards gone purely to strike quality. (The engine cannot generate the toe hit itself — it always solves a centered strike — but it can price the ball speed you lose to one.)","A 7-iron dug out with a steep -7° attack behind 36° of dynamic loft carries 43° of spin loft: the engine returns smash 1.2786, 115.1 mph of ball speed, 9000 rpm of backspin (pinned at the model's spin ceiling) and 159.9 yd of carry. The same 90 mph swing delivered shallower — -2° attack, 26° dynamic loft, 28° spin loft — gives smash 1.3985, 125.9 mph, 4835 rpm and 180.4 yd. Twenty yards and nearly half the spin, from the same effort: the heavy ballooning shot versus the piercing one.","Range-ball smash factor often reads lower than course-ball smash factor: cheap, harder range balls have a lower COR ('less spring') than premium urethane tour balls, so the identical swing shows a smaller number on the mat than it would on the course. The engine does not model ball construction, so this one never shows up in the app.","In a fitting session, a golfer's smash factor creeps up after switching to a lighter, more speed-friendly shaft even though clubhead speed barely changes — a sign that improved timing and center-face contact, not extra power, improved the strike.","A junior or senior golfer with a modest 80 mph driver swing but a beautifully centered strike can post a smash factor (~1.46-1.48) that rivals a much faster amateur swinger who mishits — proof smash factor is not a speed contest. In the model this is literal: club speed cancels out of the ratio, so 70, 90 and 110 mph at the same 33° spin loft all return smash 1.3618."],"whatItMeansForYou":"On your own launch monitor, read smash factor as your strike-quality gauge, not a speed gauge: if it sits below your club's typical band (roughly 1.30+ for a 7-iron, 1.45+ for a driver), the fix is almost always contact — find the center of the face and tighten up spin loft — before you reach for more swing speed. And tighten it where it pays: the penalty per degree of spin loft accelerates, so a stray degree costs a wedge (0.0086 at 40°) nearly twice what it costs a driver (0.0046 at 9°). Two swings at the exact same clubhead speed can carry 20-25 yards apart purely because one has a better smash factor; that gap is 'free' distance you can recover without swinging any harder."},"misconceptions":["\"A higher smash factor always means you hit it farther.\" Not on its own — smash factor is ball speed divided by club speed, so a slow, perfectly struck swing can post a great smash factor (a 25° spin-loft strike returns 1.4190 in the engine) with modest actual ball speed and carry. Distance needs both a good smash factor and enough club speed: at a stock 7-iron's 33° spin loft, 70 mph carries 125 yd and 110 mph carries 229 yd on an identical 1.3618.","\"Swinging harder increases your smash factor.\" False, and in the model it is exactly false: at 33° of spin loft the engine returns 1.3618 at 70, 90 and 110 mph. Smash factor is a ratio of ball speed to club speed and tracks strike quality, not power. A harder swing with the same spin loft and same center-face contact leaves smash factor unchanged — it just scales ball speed up along with the extra club speed.","\"Irons are inherently less 'springy'/efficient than drivers, and that's why their smash factor is lower.\" Mostly backward. A square, zero-loft collision using typical iron-head mass actually computes to a higher theoretical smash ceiling than a driver's (the iron head is proportionally heavier relative to the ball). Real iron smash factor is lower because of loft/spin loft — the strike is deliberately glancing to launch the ball with spin — not because the club transfers energy worse. The engine takes the same position to an extreme: it does not know which club you swung at all, only the spin loft you delivered.","\"You should try to maximize smash factor on every club.\" No — a wedge needs a big spin loft (a glancing blow) to work; chasing driver-like smash numbers with a 60° wedge would mean de-lofting it into a different club entirely. Each club has its own healthy smash-factor band, and in the model that band is set entirely by the spin loft the club is designed to be delivered with.","\"Smash factor above 1.5 is achievable with a good enough strike.\" Not on a conforming driver in the real world: physics puts a hard ceiling near 1.49-1.50, set by the USGA/R&A spring-like-effect limit (COR <= ~0.83) and standard head/ball masses. Nobody, tour pro or robot, meaningfully exceeds this on a legal club. Flightglass's fitted curve does print numbers above it — 1.5084 at a tour driver delivery, up to a 1.52 clamp at or below 6.34° of spin loft — so treat readings above 1.50 in the app as the model running slightly hot at low spin loft, not as a strike you could actually produce.","\"A cold ball or cold day mainly hurts smash factor.\" The temperature effect on smash factor itself (ball COR/compression) is small (roughly 0.01-0.03) and is not modeled here at all. Most of a cold-weather distance loss comes from denser air adding drag after the ball leaves the face, not from a big change in the strike's smash factor."],"wolframChecks":["smash factor definition check: 90 mph x 1.33 = 119.7 mph (matches TrackMan 7-iron tour-average ball speed ~120 mph) and 113 mph x 1.48 = 167.24 mph (matches TrackMan driver tour-average ball speed ~167 mph).","USGA maximum golf ball mass 1.620 oz -> Wolfram-confirmed 45.926 g; Wolfram Alpha's own knowledge base independently labels this figure '~maximum allowed mass of a golf ball', anchoring the ball-mass constant used throughout.","theoretical driver smash ceiling from a restitution collision: (1+0.83) x 200/(200+45.93) = 1.488 -- using the USGA/R&A spring-like-effect COR limit (0.83) and a representative 200 g driver head vs the 45.93 g ball; matches the real-world driver smash-factor ceiling of ~1.48-1.50.","the same restitution formula for a 258 g 7-iron head at a lower COR (0.78) gives (1+0.78) x 258/(258+45.93) = 1.511 -- higher than the driver's theoretical ceiling, proving mass ratio favors the iron; real iron smash (~1.33) sits far below this because of loft/spin loft, not an inferior collision.","engine formula check: 1.544034 - 0.00337882x25 - 0.000064966x25^2 = 1.4190 (inside the 1.15-1.52 band) and the same formula at spin loft 40 = 1.3049 -- confirms the app's smashEff falls by 0.114 as spin loft widens from 25° to 40°, the exact mechanism the diagram lets a user drag. Engine-verified: solveFlight returns smash 1.4190 and 1.3049 at those spin lofts.","engine curvature check: the same formula gives 1.5084 / 1.5037 at spin loft 9 / 10 (a 0.0046 step), 1.4190 / 1.4123 at 25 / 26 (0.0067) and 1.3049 / 1.2963 at 40 / 41 (0.0086) -- the per-degree cost of spin loft nearly doubles from driver lofts to wedge lofts, which a straight line cannot produce.","engine clamp check: the curve equals its 1.52 maximum at spin loft 6.34° and below (1.5200 at 6.00° and 6.34°, 1.5172 at 7°), and reaches its 1.15 minimum at 56.1° (1.1511 at 56°, 1.1500 at 56.1° and 57°) -- the ceiling is driver-only territory and the floor is full-lob-wedge territory.","energy-transfer efficiency at tour-average driver smash: (45.93/200) x 1.48^2 = 0.503 -- only about 50% of the clubhead's kinetic energy converts into the ball's kinetic energy at even a great strike; the rest stays with the decelerating club head or is lost to vibration/heat.","energy-transfer efficiency at tour-average 7-iron smash: (45.93/258) x 1.33^2 = 0.315 -- only about 31% of the iron head's kinetic energy converts to ball speed, lower than the driver despite the iron's more favorable mass ratio -- again pointing at spin loft as the energy sink.","tour-average smash factors are self-consistent ratios: 167/113 = 1.478 (driver), 120/90 = 1.333 (7-iron), 102/83 = 1.229 (pitching wedge) -- confirms smash factor falls steadily as the club gets more lofted, club by club.","cross-checks for LPGA and wedge references: 94 mph x 1.49 = 140.06 mph (matches LPGA driver tour-average ball speed ~140 mph) and 83 mph x 1.23 = 102.09 mph (matches PGA Tour pitching-wedge tour-average ball speed ~102 mph).","engine ball-speed chain check: 113 mph x the engine's own smash of 1.508362 = 170.44 mph, which is what solveFlight returns for a 113 mph / 13° dynamic loft / +4° attack driver (170.4450 mph) -- and 170.44 mph is 3.4 mph ABOVE the ~167 mph TrackMan tour average, so the engine's driver smash sits outside, not inside, the real 1.48-1.50 tour band. (Rounding note: 113 x the rounded 1.5084 gives 170.45; the extra digits are why the engine prints 170.44.)"],"quiz":[{"q":"What does smash factor actually measure?","options":["Clubhead speed alone","Ball speed divided by club speed","Backspin rate","How far the ball carries"],"answerIndex":1,"explanation":"Smash factor = ball speed / club speed — e.g. a 90 mph 7-iron swing that produces 120 mph of ball speed has a smash factor of 1.33 (120/90). It measures strike efficiency, not raw power or distance."},{"q":"Why doesn't simply swinging harder raise your smash factor?","options":["It always does raise smash factor","Smash factor is a ratio; ball speed scales with club speed at a fixed spin loft, so the ratio stays identical","Faster swings always mishit the ball","Ball speed can never exceed club speed"],"answerIndex":1,"explanation":"In the engine ballSpeed = clubSpeed x smashEff, and smashEff reads only spin loft — so club speed cancels out of the ratio exactly. At 33° of spin loft the engine returns smash 1.3618 at 70 mph, 90 mph and 110 mph alike; only ball speed (95.3 / 122.6 / 149.8 mph) and carry (125 / 174 / 229 yd) move. Smash factor tracks strike quality, not effort — the most common misread of the number."},{"q":"Two identical 90 mph 7-iron swings differ only in spin loft: Swing A is 25°, Swing B is 40°. Using the app's engine (smashEff = 1.544034 - 0.00337882 x spinLoft - 0.000064966 x spinLoft^2, clamped to 1.15-1.52), which has the higher smash factor, and by about how much?","options":["Swing B is higher, by about 0.11","Swing A is higher, by about 0.11 (1.4190 vs 1.3049)","They are identical","Swing B is higher, by about 0.30"],"answerIndex":1,"explanation":"At 25° spin loft the engine gives 1.4190; at 40° it gives 1.3049 — Swing A (the tighter, more square strike) is 0.114 higher, and carries 127.7 mph of ball speed against 117.4 mph. A bigger spin loft is a more glancing hit that diverts more energy into spin instead of ball speed. Because the curve bends downward, the loss is not spread evenly: the step from 25° to 26° costs 0.0067 while the step from 40° to 41° costs 0.0086."},{"q":"You solve the same delivery twice in this engine — 113 mph, 13° dynamic loft, +4° attack — once labelled as a driver and once as a 7-iron. What happens to smash factor?","options":["The driver reads higher, because driver faces have a higher COR","The 7-iron reads higher, because iron heads are heavier relative to the ball","Both return exactly 1.5084 — the club label never enters the smash math, only spin loft does","The engine refuses to solve a 7-iron at 13° of dynamic loft"],"answerIndex":2,"explanation":"smashEff is a function of spin loft alone, so the club field is carried through the solve untouched by the math: both labels return smash 1.5084 and 170.44 mph of ball speed at 9° of spin loft. In the real world club category does matter (COR limits, face design), but the model reproduces the whole driver-to-wedge ladder purely through the spin loft each club is delivered with — 9° for a driver, 33° for a 7-iron (1.3618), 46° for a pitching wedge (1.2511), 56° for a lob wedge (1.1511)."},{"q":"Beyond loft-minus-attack-angle, what else can widen spin loft in this engine and quietly cost you smash factor?","options":["Swinging faster","A face-to-path mismatch — spin loft is a 3-D angle, so sideways face/path separation adds to it","Playing at high altitude","Nothing; spin loft is exactly dynamic loft minus attack angle"],"answerIndex":1,"explanation":"Spin loft is the full 3-D angle between the face normal and the club-velocity direction, so a horizontal mismatch counts too. A 7-iron at 30° dynamic loft and -3° attack with a square face and path has 33.00° of spin loft and smash 1.3618; swing 6° of path away from that same square face and the true spin loft opens to 33.50°, dropping smash to 1.3580 and ball speed from 122.56 to 122.22 mph. Small, but it is a real cost of crooked delivery that never shows up in loft minus attack."},{"q":"Which of these will most quickly show up as a lower smash factor on a real launch monitor, even with perfect attack angle and dynamic loft?","options":["Playing at high altitude","A mishit toward the toe or heel instead of the center of the face","Playing on a cold day","Increasing swing speed"],"answerIndex":1,"explanation":"Off-center strikes ('gear effect') twist the clubhead around its own center of mass instead of driving straight through the ball, bleeding energy into head rotation rather than ball speed. A strike roughly 3/4 in (19mm) off-center can cost several mph of ball speed and 0.05-0.15+ of smash factor even with technically perfect delivery angles — exactly why TrackMan treats smash factor as the best on-screen proxy for center-face contact. This app's engine does not model it: solveFlight always solves a centered strike (centeredStrike: true, gearEffectApplied: false), so every smash number it prints assumes you found the middle."}]}

  <script type="application/json" id="lesson-ball-speed">{"parameter":"Ball Speed","oneLiner":"Ball speed is how fast the ball is travelling the instant it leaves the clubface — club speed multiplied by smash factor — and it is the single biggest lever on how far every shot flies.","whatItIs":"Ball speed is exactly what it sounds like: how fast the ball is travelling in the instant it leaves the clubface, in mph. It is not the same thing as club speed — club speed is how fast the club itself was moving, and ball speed is always some multiple of that, because a struck ball briefly compresses against the face and springs back faster than the club that hit it. That multiplier is called smash factor (ball speed / club speed), and Flightglass's engine states the whole relationship as literally as possible: ballSpeed = clubSpeed x smashEff. In the engine, a 7-iron delivery at 90 mph of club speed with 30 degrees of dynamic loft and a -3 degree attack angle (33 degrees of spin loft) returns smash 1.3618 and 122.56 mph of ball speed; a driver delivery at 113 mph with 13 degrees of dynamic loft and a +4 degree attack angle (9 degrees of spin loft) returns smash 1.5084 and 170.44 mph. Note what actually differs between those two: only the spin loft. This engine has no club-type term at all — the optional club label is a compatibility echo, and passing club:'driver' with the 7-iron geometry returns the identical 1.3618. Ball speed is a magnitude only — it says nothing about direction (that is face angle, club path and spin axis' job) — but it is the single biggest input to how far the ball goes: 122.56 mph carries 174.0 yd and 170.44 mph carries 275.2 yd in that same engine, which is why every serious speed-training plan targets this number first.","components":[{"name":"Club speed","role":"The raw energy input — how fast the clubhead is moving at impact. This is the widest-ranging number in the whole equation and the one a golfer trains for directly. It is also the only strictly linear term in ballSpeed = clubSpeed x smashEff: hold the delivery geometry fixed and ball speed tracks club speed exactly.","typicalRange":"7-iron: recreational ~75-85 mph, PGA Tour ~90 mph. Driver: high-handicap ~80-90 mph, recreational average ~93-94 mph, PGA Tour ~113-114 mph, LPGA Tour ~94 mph, World Long Drive 150+ mph."},{"name":"Smash factor (strike efficiency)","role":"The multiplier: ball speed / club speed. In this engine it is a function of spin loft and of nothing else: smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, then held inside the 1.15 to 1.52 range. Each extra degree of spin loft costs a little more than the one before it — measured, 25 to 33 degrees takes 0.0572 off smash while the next eight, 33 to 41, take 0.0655 — and the same relationship serves every club.","typicalRange":"Engine, measured: 1.5084 at 9 degrees of spin loft (driver delivery), 1.4190 at 25, 1.3618 at 33 (7-iron default), 1.2604 at 45. The 1.52 ceiling only binds below 6.34 degrees; the 1.15 floor is not reached until 56.10 degrees, which is flop-shot geometry rather than a full swing."},{"name":"Spin loft (dynamic loft minus attack angle on a square strike)","role":"The only lever behind smash factor in this engine — it is the full 3-D angle between the face and the club's direction of travel, which equals dynamic loft minus attack angle whenever club path and face angle are square, as in every example in this lesson. It does not appear in the ballSpeed formula directly, but smashEff is a function of it alone — raise spin loft and smash, and therefore ball speed, falls even at unchanged club speed.","typicalRange":"7-iron ~30-35 degrees, driver ~9-15 degrees. Measured at a fixed 90 mph: 25 degrees gives 127.71 mph of ball speed, 33 gives 122.56, 45 gives 113.44."},{"name":"Club and ball construction, the COR limit (real world, not modelled here)","role":"In real golf this sets the smash ceiling per club category, fixed by the legal coefficient-of-restitution limit rather than by anything a single swing does. Flag it clearly: this engine does not model it. Solving the same geometry with and without club:'driver' returns identical output, and an iron-style delivery forced to 9 degrees of spin loft returns the driver's 1.5084 and 170.44 mph. Every smash difference the engine produces is a spin-loft difference.","typicalRange":"Real world: USGA/R&A COR limit 0.830 for drivers, no COR bonus for a solid iron face; collision physics gives a ~1.488 ceiling for a ~200 g head against a ~45.93 g ball. The engine's driver value of 1.5084 sits above that ceiling and above the real 1.48-1.50 tour band — a modelling liberty, not a match."},{"name":"Strike location on the face (real world, not an engine input)","role":"A toe or heel miss genuinely costs real-world smash factor. It cannot be entered here: solveFlight takes exactly five inputs — club path, face angle, attack angle, dynamic loft and club speed — and reports centeredStrike. To make the engine show a low smash you have to raise spin loft, which is a different physical cause with a different signature: it also raises backspin and launch angle.","typicalRange":"Real-world launch monitors commonly read ~1.0-1.2 driver smash on a bad off-centre strike. Not reproducible in this engine at any input."},{"name":"Temperature and ball warmth","role":"A small real-world modifier not wired into this engine build — solveFlight takes no temperature input. A warmer ball's core rebounds slightly more efficiently, a higher ball-side COR.","typicalRange":"Roughly +1 mph of ball speed across a large ball-temperature swing (estimate, real-world equipment testing) — far smaller than club-speed or spin-loft effects, and separate from air density's much larger effect on carry, covered in the Carry lesson."}],"howTheyConnect":"Contact between clubface and ball lasts under half a millisecond, and in that instant only part of the clubhead's kinetic energy can physically transfer to the ball. On the engine's own driver delivery (113 mph, 13 degrees of dynamic loft, +4 degree attack) the ball leaves at 170.44 mph, so with a ~200 g head and a ~45.93 g ball the ball carries about 52% of the clubhead's kinetic energy — roughly half. The rest does not all stay in the club: conserving momentum through that same collision leaves the clubhead moving at about 33.0 m/s afterwards, so about 43% of the original energy travels on with the head and the remaining ~5% is lost to deformation and heat, an implied coefficient of restitution of about 0.855. How much of that available energy reaches the ball is exactly what smash factor measures. Real golf caps it with hardware: for a two-body collision with coefficient of restitution e and masses M (club) and m (ball), ballSpeed = clubSpeed x (1+e) x M/(M+m), and the USGA/R&A driver limit of e <= 0.830 with 200 g and 45.93 g gives 1.83 x 200/245.93 = 1.488, close to the 1.48-1.50 tour pros actually post. Be precise about what that means here: the engine does not implement that ceiling. Its driver number, 1.5084, is above 1.488 and above the real tour band, and its single smash curve is shared by every club — solve the 7-iron geometry with club:'driver' attached and you still get 1.3618. So inside Flightglass there is only one mechanism: smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, then held inside the 1.15 to 1.52 range. The reason a driver beats a 7-iron in this model is not a springier face — it is that a teed driver delivered with a positive attack angle presents about 9 degrees of spin loft where the 7-iron presents about 33, and that gap alone is worth 1.5084 against 1.3618. Once the multiplier is set, everything downstream follows the ball speed. At a fixed 90 mph, walking spin loft from 25 to 45 degrees takes smash 1.4190 to 1.2604, ball speed 127.71 to 113.44 mph, backspin 4192 to 9000 rpm and carry 184.0 to 156.8 yd: less speed and more spin arrive together, because they are two readings of the same glancing blow. Hold spin loft fixed instead and the whole chain is linear in club speed — 80/90/100/110 mph at 33 degrees gives 108.94/122.56/136.18/149.80 mph. Club speed supplies the energy, spin loft decides through smash what fraction of it survives the hit, and ball speed is what backspin, carry and apex all inherit, which is why it sits at the hub of the Derived tier.","hierarchy":[{"driver":"Club speed (the swing itself)","weight":"Dominant and exactly linear at fixed spin loft — the engine's 80/90/100/110 mph sweep on the 7-iron delivery (33 degrees of spin loft) gives ball speed 108.94/122.56/136.18/149.80 mph, i.e. +1 mph of club speed buys +1.3618 mph of ball speed, the smash factor itself. Real-world range is enormous: ~80 mph high-handicap driver to ~113-114 mph PGA Tour to 150+ mph World Long Drive.","why":"Club speed is the kinetic-energy source: ballSpeed = clubSpeed x smashEff, and smashEff only ever varies inside a 1.15-1.52 band while club speed varies twofold or more across the golfing population. Nothing else moves ball speed this much."},{"driver":"Spin loft — the whole of smash factor in this engine","weight":"Second in the formula but large per shot. Measured at 90 mph: 25 degrees gives 127.71 mph, 33 gives 122.56, 45 gives 113.44, and at the 56.10 degree floor 103.50 mph. A realistic 12 degrees of extra spin loft (33 to 45) costs 9.1 mph of ball speed at unchanged swing speed.","why":"smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, then held inside the 1.15 to 1.52 range takes spin loft as its only argument, so in this model every smash-factor change is a spin-loft change. The penalty also steepens as loft rises: measured, 25 to 33 degrees costs 0.0572 of smash while the next eight degrees, 33 to 41, cost 0.0655."},{"driver":"Dynamic loft and attack angle — the two inputs that set spin loft","weight":"The only levers a golfer actually has over smash here, because on an on-plane strike spinLoft = dynamicLoft - attackAngle and both are Fundamentals-tier inputs. (The engine actually reads the full 3-D spin loft, which is identical to that subtraction only when club path and face angle are square; open either and it widens slightly — 33.0 to 33.5 degrees at 6 degrees of path — costing a little more smash.) Measured on the driver: holding 13 degrees of dynamic loft and moving attack angle from +4 to 0 raises spin loft from 9 to 13 degrees, and at 113 mph ball speed falls from 170.44 to 168.27 mph.","why":"They do not appear in clubSpeed x smashEff directly, but they are literally the subtraction that produces spin loft. Teeing the ball up and hitting up is the standard real-world way to protect driver ball speed, and the engine agrees: that +4 degree delivery is worth 2.17 mph of ball speed over the 0 degree one at identical club speed and loft."},{"driver":"Club and ball construction, the COR limit","weight":"Real and important in golf, zero in this engine. Verified: solveFlight with club:'driver' on the 7-iron geometry returns 1.3618, identical to the unlabelled call, and an iron-style delivery forced to 9 degrees of spin loft returns 1.5084 and 170.44 mph — the driver's exact numbers.","why":"Physically a driver face may flex up to COR 0.830 while a solid iron face gets no such bonus, so real driver smash ceilings really are higher. Flightglass reproduces the driver's ball-speed advantage through geometry alone rather than through a face model, so read its driver figures as a spin-loft result and treat 1.488 as real-world context — the engine's 1.5084 is above it, not calibrated to it."},{"driver":"Strike location, temperature and ball construction","weight":"Marginal to unmodelled. Face location is not an input at all; ball warmth is worth roughly +1 mph across a big temperature swing in real-world testing.","why":"Both are real effects a launch monitor will show you on the range and neither exists in this five-input engine, so a real reading that disagrees with Flightglass on a mishit or a freezing morning is not a bug in either — it is a missing term."}],"realWorld":{"tourBenchmarks":["PGA Tour driver, real world: clubhead speed ~113-114 mph gives ball speed ~167 mph, smash factor ~1.48.","The same driver delivery in this engine — 113 mph, 13 degrees of dynamic loft, +4 degree attack, 9 degrees of spin loft — returns smash 1.5084, ball speed 170.44 mph, backspin 1920 rpm and carry 275.2 yd. That is about 3 mph faster than the tour average, because the engine's smash curve peaks above the real COR ceiling.","LPGA Tour driver, real world: clubhead speed ~94 mph gives ball speed ~140 mph, smash ~1.49. The engine at 94 mph on the same 9 degree driver delivery gives 141.79 mph — within about 2 mph.","PGA Tour 7-iron, real world: clubhead speed ~90 mph gives ball speed ~120 mph, smash ~1.33. Flightglass's 7-iron delivery at the same 90 mph (30 degrees of dynamic loft, -3 degree attack, 33 degrees of spin loft) returns smash 1.3618 and 122.56 mph — a little hotter than tour average, the same upward bias the driver shows.","Recreational average driver: clubhead speed ~93-94 mph gives ball speed ~131-136 mph, smash ~1.41-1.45 — similar clubhead speed to LPGA Tour but 5-9 mph less ball speed from a less efficient delivery.","World Long Drive competitors: clubhead speeds of 150+ mph and ball speeds regularly above 200 mph, into the ~220-225 mph range. Grounded: 225 mph is 100.6 m/s, about 29% of the speed of sound at 20 C.","Theoretical smash ceiling for a legal driver: ~1.488, from the 0.830 COR limit with a ~200 g head and a ~45.93 g ball. Useful as a reality check on a launch monitor; note that this engine's 1.5084 exceeds it rather than matching it.","Energy transfer at impact: on the engine's own flush driver — 113 mph clubhead, 170.44 mph ball — the ball leaves with about 52% of the clubhead's kinetic energy, roughly half. Of the rest, about 43% stays with the clubhead — momentum conservation puts it at 33.0 m/s after the hit — and about 5% is lost to deformation and heat.","The engine's gap between its driver delivery (170.44 mph) and its 7-iron delivery (122.56 mph) is 47.9 mph of ball speed, and in this model all of it comes from club speed plus the 24 degrees of spin-loft difference, with no club-type term involved."],"scenarios":["Your playing partner swings noticeably slower than you but still outdrives you — usually an efficiency story rather than a speed story. In engine terms: at 80 mph on the 9 degree driver delivery the ball leaves at 120.67 mph, while a 90 mph swing arriving with 45 degrees of spin loft leaves at only 113.44 mph. The slower swing wins by 7.2 mph.","Beating range balls all afternoon feels different from playing your gamer ball on the course — range balls are typically harder and lower-compression by design, built to survive thousands of hits rather than to perform, which slightly lowers real-world smash. There is no ball-construction input here, so Flightglass will not show it.","A tour pro's driver swing looks smooth and effortless yet produces 167+ mph of ball speed — it comes from a genuinely fast clubhead, 113+ mph, plus a shallow teed-up delivery that keeps spin loft near 9 degrees. Amateurs at similar club speed usually lose their ball speed to the second half, not the first.","The same golfer's 7-iron ball speed feels far slower than their driver — the engine puts the gap at 47.9 mph, 122.56 against 170.44. Part of that is the 23 mph of extra club speed and the rest is the smash difference created by 24 degrees less spin loft. In real golf a springier driver face adds to this; the engine does not model that part.","A toe or heel miss that felt fine at address comes up dramatically short — real, and worth 15-25 mph of ball speed on a launch monitor. Flightglass cannot show it: strike location is not one of its five inputs, so any low smash here means high spin loft instead."],"whatItMeansForYou":"If you want more distance, ball speed is the metric to chase
