f missing the middle.","why":"Driver faces are curved top-to-bottom ('roll'), so the loft actually presented to the ball depends a little on where on the face it's struck, not just on setup and swing positions."}],"realWorld":{"tourBenchmarks":["PGA Tour driver: dynamic loft commonly ~10-13° with attack angle slightly positive (+1° to +5°, 'hitting up'), giving a small spin loft (~7-10°) — grounded in the app: its Driver preset (13°/+4°) computes spin loft 9.0° and engine launch 11.22°.","PGA Tour 7-iron: dynamic loft ~28-32°, attack angle ~-3° to -5° (hitting down), spin loft ~30-37° — the app's own default 7-iron preset (30°/-3°) computes spin loft 33.0° and engine launch 15.38° — the ball leaves at roughly half the delivered loft, not at the loft number itself.","Full-swing wedges commonly deliver less dynamic loft than the number stamped on the sole because tour players lean the shaft forward through impact — a 56° sand wedge can present closer to ~50-52° at the moment of the strike on a full shot.","Amateur contrast: many mid/high-handicap players deliver a flatter (less negative, sometimes positive) attack angle with irons than a tour player's ~-4° to -5°, while a cupped lead wrist often adds loft back rather than removing it — the combination shrinks spin loft less than a tour delivery and, paired with lower ball speed, is a big reason amateur iron shots often fly higher, shorter and spinnier than a pro's with the 'same' club."],"scenarios":["Why 'hit up on the driver' is repeated in every fitting session: raising attack angle doesn't touch dynamic loft at all, but it shrinks spin loft by lowering its vertical half. Measured with dynamic loft pinned at 13° and club speed at 113 mph, the same head produces 4,000 rpm hitting 6° down, 3,178 rpm at −2°, 1,920 rpm at +4° and 1,709 rpm at +5° — a 2,300 rpm spread from attack angle alone, with the loft never moving.","Why a tour pro's 7-iron flight looks lower and more compressed than an amateur's with the identical stamped loft: forward shaft lean plus a bowed/flat lead wrist at impact deloft the tour strike by several degrees below the number on the sole, while a cupped, 'scoopy' amateur wrist adds loft back in — same club, different dynamic loft, very different flight.","Why fitters put you on a launch monitor instead of just reading the loft off the sole: the stamped number is only the starting point. In the app's own model, an 8° swing in dynamic loft (26°→34° at a fixed −3° attack, 90 mph) moves launch from 13.37° to 17.78° and backspin from 5,113 to 8,006 rpm — numbers a spec sheet can never show.","Why 'delofting' feels like a swing change, not an equipment change: the exact same 7-iron head can be delivered anywhere from roughly 20° to 34°+ of dynamic loft purely from shaft lean and wrist condition — a bigger single-club swing than most players realize."],"whatItMeansForYou":"If your ball flies too low or too high, don't reach for a different-lofted club first — check your hands and wrists at impact. But how much a degree of loft is worth depends on the club in your hands: in this engine one extra degree of dynamic loft adds about 0.11° of launch at a 11° driver delivery and about 0.56° at a 30° 7-iron, while attack angle is worth a flat 0.25° per degree at every loft. So with a wedge or a mid-iron, hands and wrists are the dominant launch lever; with a driver, tee height and ball position (attack angle) genuinely have the bigger per-degree grip on launch. And remember loft is a trade, not a free lunch: adding dynamic loft raises backspin and launch, but it also quietly costs ball speed — at 90 mph and −3° attack, carry in this engine peaks near 16° of dynamic loft and falls away above it, so more loft does not automatically mean more carry, only a different-shaped shot."},"misconceptions":["\"Dynamic loft is just the loft stamped on the club.\" It's the loft the face actually delivers at impact — shaft lean and wrist condition can shift it several degrees off the stamped number in either direction; a launch monitor measures the delivered number, never the spec sheet.","\"A bigger-numbered club (more static loft) always launches higher.\" Only if the delivered loft rises to match. A strong, bowed-wrist strike with a 56° wedge can deliver less effective loft than a lazy, cupped strike with a 46° wedge.","\"Dynamic loft always beats attack angle for launch.\" Not at driver lofts. The engine's loft term carries a loft² piece, so its per-degree bite grows with loft: +1° of loft is worth 0.11° of launch at 11°, 0.56° at 30° and 0.95° at 46°, while +1° of attack angle is worth 0.25° everywhere. The two cross near 17.4° of dynamic loft — below it, attack angle is the stronger per-degree lever.","\"Hitting down 'adds' loft or spin.\" Hitting down (a more negative attack angle) never changes dynamic loft at all — they are independent inputs. It raises spin loft, because the vertical half is dynamicLoft − attackAngle, and subtracting a more negative number is the same as adding.","\"A strong/bowed wrist just closes the face, it has nothing to do with loft.\" Bowing the lead wrist primarily DE-lofts the club (rotates the face down toward the ground), independent of face-angle closure — it's the main reason tour irons deliver a lower, more compressed flight than the stamped loft suggests.","\"Dynamic loft changes with altitude, temperature or wind.\" No — it's a Fundamentals-tier, swing-mechanics quantity fixed entirely at the moment of impact by the club, shaft and wrists. Altitude/wind/temperature are Environment-tier factors that only reshape the flight after the ball leaves the face."],"wolframChecks":["launchAngle = 10.3919·min(dynamicLoft/10,1) − 0.16938·dynamicLoft + 0.012025·dynamicLoft² + 0.25·attackAngle. Driver preset (13°/+4°): 10.3919 − 2.2019 + 2.0322 + 1.00 = 11.22° -> matches the engine exactly.","Same formula, 7-iron preset (30°/−3°): 10.3919 − 5.0814 + 10.8222 − 0.75 = 15.38° -> engine launch angle for the app's default delivery. Wedge preset (46°/−5°): 10.3919 − 7.7914 + 25.4443 − 1.25 = 26.79°.","Marginal launch per degree, measured by stepping the engine (attack −3°, 90 mph): loft 11°→12° gives +0.107°, 13°→14° +0.155°, 30°→31° +0.564°, 46°→47° +0.949°. Attack angle, measured the same way, gives exactly +0.250° at loft 9°, 30° and 46° — flat everywhere.","Crossover: the loft derivative −0.16938 + 2×0.012025·L equals 0.25 at L = 0.41938/0.024049 = 17.44°, matching the stepped measurements above (0.2515 at 17°). Below ~17.4° of dynamic loft, one degree of attack angle moves launch more than one degree of loft.","vertical spin loft = dynamicLoft − attackAngle at attack −3°: dynamic loft 26° -> 29.0°; dynamic loft 34° -> 37.0° (engine-reported spinLoft, square face).","smashEff = 1.544034 − 0.0033788·spinLoft − 0.000064966·spinLoft², held inside a 1.15-1.52 band: 29° -> 1.3914, 37° -> 1.3301 -> raising dynamic loft alone (same attack) measurably lowers smash factor.","ball speed at 90 mph club speed: 90×1.3914 = 125.23 mph vs 90×1.3301 = 119.71 mph -> a 5.5 mph ball-speed cost for +8° of dynamic loft at fixed club speed.","engine backspin, 90 mph, spin loft 28° vs 36°: 4,835 vs 7,716 rpm = 360.1 rpm/deg over those 8°; smash 1.3985 vs 1.3382, so ball speed 125.86 vs 120.44 mph and carry 180.4 vs 169.9 yd.","engine carry = 0.9205937574 x ballSpeed + 0.004072298666 x ballSpeed²: at 125.23 mph -> 179.1 yd, at 119.71 mph -> 168.6 yd -> raising dynamic loft 26°→34° (same swing) costs 10.5 yd of carry despite adding 2,893 rpm of backspin, grounding 'more loft ≠ more carry'.","Carry turning point: sweeping dynamic loft at 90 mph / attack −3°, engine carry runs 177.2 yd at 9°, 189.1 at 14°, 190.6 at 16° (the peak), 189.6 at 17°, 180.4 at 25° and 174.0 at 30° -> below ~16° extra loft still buys distance; above it, loft only buys height.","No drag saturation: holding the 7-iron delivery at 30°/−3° and raising club speed, engine carry is 174.0 / 200.9 / 229.3 / 259.2 yd at 90 / 100 / 110 / 120 mph — gains of 26.9, 28.4 and 29.9 yd per 10 mph. Each extra 10 mph buys MORE than the last; the curve never flattens.","Driver case: dynamic loft 9°→17° at attack +4°, club speed 113 mph -> ball speed 171.76→168.27 mph (smash 1.5200, clamped at the ceiling at 5° of spin loft, down to 1.4891 at 13°), carry 275.5→270.2 yd (−5.3 yd) while apex climbs 35.45→38.02 yd (+7%) -> at driver speeds, loft trims carry a little while still adding real height.","No spin floor: the engine has no lower spin bound. At 90 mph with attack 0°, spin loft 0° -> 0 rpm exactly, 0.5° -> 85.3, 1° -> 170.6, 2° -> 341.2, 4° -> 682.0; 85.3/0.5 = 170.6, 341.2/2 = 170.6, 682.0/4 = 170.5 — a straight run through the origin, nothing clamping the bottom. The 9,000 rpm top end is only a readout ceiling: 13,821 rpm raw at 48° loft / −8° attack / 110 mph.","startFaceW = clamp(0.90 − 0.005·dynamicLoft, 0.60, 0.88): 0.855 at 9°, 0.835 at 13°, 0.75 at 30°, 0.67 at 46°. A 2° open face on a 0° path starts the ball 1.710° right at 9° of loft but only 1.340° right at 46° -> low loft lets the face govern start line more."],"quiz":[{"q":"What does \"dynamic loft\" actually mean, in the engine and on a real launch monitor?","options":["The loft number stamped on the sole of the club","The effective loft the clubface delivers at the moment of impact, shaped by shaft lean and wrist condition","The average loft over the whole swing","The loft measured after the ball has already left the face"],"answerIndex":1,"explanation":"Dynamic loft is what the face is doing AT impact — not the static number stamped on the club. Shaft lean (forward press) and wrist condition (bowed vs cupped) can shift it several degrees off the stamped loft, which is why two players with the 'same' 9° driver can deliver very different dynamic lofts."},{"q":"In this engine the launch-angle contribution of dynamic loft is a curve, while attack angle contributes a flat 0.25° per degree. Where does one extra degree of dynamic loft raise launch by MORE than one extra degree of attack angle?","options":["At every loft — dynamic loft always wins","Only above roughly 17° of dynamic loft (irons and wedges); below that, attack angle is the stronger per-degree lever","Only at driver lofts","Never — attack angle always wins"],"answerIndex":1,"explanation":"Stepping the engine one degree at a time at −3° attack: +1° of loft adds 0.107° of launch at 11°, 0.155° at 13°, 0.564° at 30° and 0.949° at 46°. Attack angle adds exactly 0.250° at every loft. The two cross at 17.44°, so a driver delivery sits on the side where attack angle has the bigger per-degree grip — and a 7-iron or wedge sits firmly on the loft side."},{"q":"On a square strike, spin loft = dynamicLoft − attackAngle. A golfer hits down harder (attack angle goes from -3° to -6°) but their dynamic loft doesn't change at all. What happens to spin loft?","options":["It falls","It rises","It's unaffected — only dynamic loft matters","Dynamic loft rises to compensate"],"answerIndex":1,"explanation":"Subtracting a more negative number is the same as adding: at dynamic loft 30°, attack -3° gives spin loft 33°, but attack -6° gives spin loft 36°. Hitting down harder raises spin loft even though dynamic loft — a completely separate engine input — never moved. The engine pays for it: backspin goes 6,623 -> 7,716 rpm and carry 174.0 -> 169.9 yd."},{"q":"At a 90 mph 7-iron swing (attack -3°), raising dynamic loft from 26° to 34° raises backspin from 5,113 to 8,006 rpm in the engine. What happens to carry?","options":["Carry rises by a similar amount","Carry stays exactly the same","Carry actually falls slightly, from about 179 yd to about 169 yd","Carry roughly doubles"],"answerIndex":2,"explanation":"More dynamic loft raises spin loft, which lowers the engine's smash factor (1.3914→1.3301) and trims ball speed (125.23→119.71 mph). The extra backspin and launch don't make up for the lost ball speed, so carry drops about 10.5 yards (179.1→168.6 yd) — a concrete case of 'more loft ≠ more carry'. It is only true above the carry peak, which sits near 16° of dynamic loft at this delivery."},{"q":"Does altitude, temperature or wind change a golfer's dynamic loft?","options":["Yes — thinner air reduces effective loft","Yes, but only above 5,000 ft","No — dynamic loft is fixed at impact by the club and swing, before the ball ever meets the air","Only for drivers"],"answerIndex":2,"explanation":"Dynamic loft lives entirely in the Fundamentals tier — set by the club, shaft lean and wrist condition at the moment of the strike. Altitude, wind and temperature are Environment-tier factors that only reshape the flight after the ball leaves the face; they never reach back and change the loft that was delivered."}]}</script>
  <script type="application/json" id="lesson-attack-angle">{"parameter":"Attack Angle","oneLiner":"Attack angle is whether the clubhead is still falling or already climbing the instant it meets the ball - the up/down geometry that decides whether a shot is compressed like an iron or launched like a driver.","whatItIs":"Attack angle is the up-or-down direction the clubhead is travelling in the split second it meets the ball - measured in degrees from horizontal. A negative number means the club is still descending (moving down) at contact; a positive number means it's already ascending (moving up). It has nothing to do with loft, face angle or swing speed - it is purely the vertical component of the clubhead's velocity vector at impact. Every well-taught iron or wedge shot is struck with a mildly negative attack angle (the club is still falling toward the bottom of its arc, which is what produces the ball-then-turf divot pattern), while a well-taught driver shot off a tee is struck with a neutral-to-positive attack angle (the club has already passed the bottom of its arc and is climbing). In the app's engine this number is a pure input to the ball-flight model (impact-flight.js), where it has exactly two doors into the rest of the flight. The big door is spin loft: the engine builds a full 3-D spin loft from the club's velocity vector and the face normal, which on a centred, square strike (club path = face angle = 0) reduces exactly to spinLoft = dynamicLoft - attackAngle - measured: 30° of dynamic loft with a -4° attack angle returns spinLoft 34.000. The small door is launch angle, where attack angle carries a flat weight of 0.25° of launch per degree of attack (LAUNCH_ATTACK_WEIGHT, impact-flight.js) while dynamic loft enters through a curved term whose own per-degree pull grows as loft rises. But attack angle is not itself arbitrary: the companion swing-geometry engine (swing-parameters-and-impact.js) derives it from where the ball sits relative to the low point of the swing's arc and how steep the swing plane is, so 'attack angle' is really the visible fingerprint of a golfer's setup and swing shape, not a dial anyone turns directly at the ball.","components":[{"name":"Low-point position (ball vs. swing bottom)","role":"The direct geometric cause of attack angle. The engine derives it literally: effectiveLpx()/thetaAtImpact() in swing-parameters-and-impact.js compute where the ball sits relative to the low point of the swing arc (xLP, + = low point ahead/target-side of the ball), then deriveImpact() turns that offset into attackAngle = atan2(sinθ·sinφ, hypot(cosθ,−sinθ·cosφ)). If the low point is still ahead of the ball when the club arrives, the club is still descending (negative AA); if the ball is ahead of (forward of) the low point, the club is already climbing (positive AA).","typicalRange":"iron 'Pure'-strike window (the app's own strikeQuality() constants): low point 2-15cm / 0.8-5.9in ahead of the ball, ideal centre ~10.5cm/4.1in; driver: ball at or slightly behind the low point"},{"name":"Swing plane angle (steepness)","role":"A secondary multiplier on the low-point effect. The same low-point offset produces a bigger attack-angle magnitude on a steep plane than a flat one, because vz = sinθ·sinφ scales directly with sin(φ). Measured in the geometry engine: at the identical 10.5cm-ahead ball position, a 40° (flat) plane gives -3.22° AA, the engine default 55° plane gives -4.11°, and a 70° (steep) plane gives -4.72° - about 0.05° of attack angle per degree of plane, roughly a twentieth of what an inch of ball position does.","typicalRange":"~40° (flat, sweepers/rotary swingers) to ~70° (steep, upright/vertical swingers); engine default 55°"},{"name":"Ball position & tee height (the practical setup lever)","role":"What a golfer or fitter actually changes to move the low-point relationship above. Playing the ball back (or on the ground) shifts it toward 'low point ahead' (descending); teeing it up and playing it forward shifts it toward 'low point behind' (ascending). This is the real-world dial behind the geometry.","typicalRange":"driver: teed 1-2in above the ground, ball off the lead heel; irons: ball played center-to-back of stance, off the turf"},{"name":"Spin loft (the dominant downstream consequence)","role":"On a centred, square strike the engine's 3-D spin loft reduces to spinLoft = dynamicLoft − attackAngle (impact-flight.js) - a 1:1 relationship. This is attack angle's single biggest 'reach' into the rest of the ball-flight model: every +1° of attack angle removes exactly 1° of spin loft, which is the master lever on backspin (see the Backspin lesson) and, through the engine's smash curve, on ball speed too.","typicalRange":"1° of attack angle change = 1° of spin loft change on a centred, square strike, regardless of club"},{"name":"Launch angle (the smaller downstream consequence)","role":"Attack angle enters the engine's launch law with a flat weight of 0.25 (LAUNCH_ATTACK_WEIGHT). Measured by sweeping one degree of attack at 13°, 25°, 30°, 40° and 50° of dynamic loft, launch moves 0.250° every single time - attack angle's launch effect does not change with the club. Dynamic loft's own per-degree pull, by contrast, is a curve that grows with loft: 0.155°/° at 13°, 0.564°/° at 30°, 1.045°/° at 50°. So through a 7-iron, loft outvotes attack roughly 2.3 to 1 on launch.","typicalRange":"1° of attack angle change = 0.25° of launch-angle change, at every loft"},{"name":"Club & shot intent","role":"Not a physics driver but the reason the 'correct' attack angle flips sign by club: irons/wedges are designed and taught to be struck descending (for compression, control and a divot after the ball); a teed driver is designed to be struck ascending (to cut spin loft and protect ball speed). The engine's longitudinal model is club-agnostic - solveFlight() treats a 'club' label as a compatibility echo only and derives everything from the five delivery numbers - so driver deliveries are just as reproducible as iron ones: feed it 113mph, 13° dynamic loft and +5° attack and it returns spin loft 8°, ball speed 170.95mph, backspin 1,709rpm.","typicalRange":"driver target ≈ 0° to +5° ascending; mid-iron target ≈ -3° to -5° descending; wedge ≈ -4° to -6° descending"}],"howTheyConnect":"Attack angle is not something a golfer sets with their hands at the ball - it falls out of geometry that is decided well before impact. The swing traces an arc with a low point (its bottom); where the ball sits relative to that low point, combined with how steep the swing plane is, together determine whether the clubhead is still travelling down or already travelling up when it reaches the ball. The engine states this literally in swing-parameters-and-impact.js: theta = asin(-xLP/radius) locates the ball on the arc relative to the low point (xLP, positive = low point still ahead/target-side of the ball), and attackAngle = atan2(sinθ·sinφ, hypot(cosθ,-sinθ·cosφ)) converts that position - combined with the plane angle φ - into the vertical-vs-horizontal split of the clubhead's velocity at contact. Play the ball back of the low point (as irons are taught to) and the club is still falling toward the bottom of its arc when it strikes - a descending, negative attack angle, and the club continues down into the turf just after the ball (the divot). Play the ball forward of the low point (as a teed driver is taught to) and the club has already passed the bottom and is climbing - an ascending, positive attack angle, with nothing below it to strike. Once that number exists, it has exactly two doors into the rest of the flight model, and they are unequal in size. The big door is spin loft: on a centred, square strike spinLoft = dynamicLoft - attackAngle, a full 1:1 relationship, so attack angle is the other half of the same lever that sets backspin (see the Backspin lesson) - hit down and spin loft rises, hit up and it falls. The small door is launch angle, where attack angle contributes a flat 0.25° per degree while dynamic loft contributes a curve that is worth 0.564° per degree at 7-iron loft (both measured by single-degree sweeps of the engine). That asymmetry is the whole story of why golf instruction treats attack angle as a spin control, not a launch or a distance control. Measured across an 8° attack-angle sweep at a fixed 30° dynamic loft and 90mph club speed (path and face square), attack -3° to +5°: spin loft falls 33° to 25°, backspin collapses 6,623 to 4,192rpm (-36.7%), launch creeps 15.38° to 17.38° (exactly 0.25° per degree), and carry gains 174.0 to 184.0yd (+10.0yd, +5.7%). Real, but modest: hold that same delivery and add 10mph of club speed instead and carry goes 174.0 to 200.9yd - +26.9yd, nearly three times as much from one change (see the Carry lesson). There is a self-reinforcing coupling on the way, though. Because the engine's smash curve is a function of spin loft alone - smashEff = 1.5440344 - 0.0033788·spinLoft - 0.000064966·spinLoft², clamped to the range 1.15 to 1.52 - a lower spin loft is a less glancing, more efficient strike, and smash rises with attack angle: 1.3618 at -3° to 1.4190 at +5° across that same sweep, lifting ball speed 122.56 to 127.71mph. Hitting up doesn't just cut spin, it feeds ball speed too, which is exactly why driver fitters chase a positive attack angle instead of treating it as a curiosity.","hierarchy":[{"driver":"Ball position relative to the swing's low point","weight":"dominant geometric driver - measured at 0.996° of attack angle per inch of ball position (sweeping the app's own 'Pure'-strike window in swing-parameters-and-impact.js, 2cm to 15cm/0.8-5.9in ahead of the ball at the default 55° plane, moves attack angle from -0.78° to -5.88°: a 5.1° swing across ~5.1 inches)","why":"This is the literal mechanism in swing-parameters-and-impact.js: theta = asin(-xLP/R) feeds directly into attackAngle = atan2(sinθ·sinφ, hypot(cosθ,-sinθ·cosφ)). Nothing else moves attack angle this much for a realistic amount of change, and it is exactly the '1 inch of ball position ≈ 1 degree of attack angle' rule taught on every driving range - now grounded in the app's own geometry rather than folklore."},{"driver":"Swing plane steepness (plane angle)","weight":"secondary multiplier - measured at 0.050° of attack angle per degree of plane (same 10.5cm-ahead ball position gives -3.22° at a 40° plane, -4.11° at the 55° default, -4.72° at a 70° plane)","why":"vz = sinθ·sinφ in deriveImpact() scales directly with sin(plane angle), so a steeper plane converts the same ball-position offset into a bigger vertical velocity component. It explains why an upright, steep swinger digs a deeper divot than a flat, rotary swinger even with identical ball position - though it takes a full 20° of plane change to match one inch of ball position."},{"driver":"Ball position & tee height (the setup lever)","weight":"the practical, always-available control - a golfer cannot dial theta or phi directly, but can move the ball 1-2 inches in the stance or change tee height in seconds","why":"This is where driver 1 (low-point offset) becomes actionable. Every TrackMan driver fitting that changes measured attack angle does it by moving ball position and tee height, not by asking the player to consciously 'swing up' with their hands."},{"driver":"Club & shot-specific target","weight":"not a physics lever, but it flips the sign of the target - driver wants ≈0° to +5° (ascending), mid-irons want ≈-3° to -5° (descending), wedges ≈-4° to -6° (descending)","why":"Attack angle only 'matters' relative to what the shot needs. A -4° attack angle is a great iron number and a distance-costing driver number on the exact same swing - so ranking attack angle in isolation is meaningless without knowing which club is in the golfer's hands."},{"driver":"Downstream reach: spin loft (1:1) vs. launch angle (0.25 flat)","weight":"attack angle's own direct pull on the rest of the model - full 1:1 into spin loft on a centred strike, only 0.25° of launch per degree (and that 0.25 is the same at every loft, measured at 13°/25°/30°/40°/50°). Its pull on carry is real but second-order: measured, an 8° attack sweep at fixed 30° loft and 90mph moves carry 174.0→184.0yd (+10.0yd, +5.7%) while backspin swings -36.7% (6,623→4,192rpm)","why":"This ranks last deliberately: attack angle is a spin and strike-quality parameter first, a distance parameter second. Ten more yards for eight degrees of attack is real, but the same engine hands over 26.9yd for ten more mph of club speed at the identical delivery - see the Carry lesson, where ball speed dominates."}],"realWorld":{"tourBenchmarks":["PGA Tour average driver attack angle ≈ -1.3° (near neutral, slightly descending) - TrackMan University's widely cited tour-average table","Distance-optimized/longer hitters swing up on the driver, commonly +3° to +5°; some long-drive competitors reach +8° or more","Recreational amateurs average a noticeably steeper driver attack angle than tour pros, commonly cited around -2° to -5° - the classic 'chopping down' miss that spins the ball too much and shortens the drive","Tour mid-iron (6-7 iron) attack angle averages roughly -4° to -5° descending; wedges steeper still, roughly -4° to -6°, by design","Engine cross-check: this app's own 'Pure'-strike geometry (strikeQuality()'s low-point-ahead window, 2-15cm/0.8-5.9in ahead of the ball at the default 55° swing plane) computes to an attack angle of -0.78° to -5.88°, centred at -4.11° - landing almost exactly on the tour mid-iron benchmark above, an internal-consistency check between the app's swing geometry and real launch-monitor data"],"scenarios":["Why an iron shot takes a divot after the ball but a teed-up driver shouldn't take one at all - the sign of the attack angle","The 'tee it higher, play it forward' driver-fitting tip - fitters change attack angle by moving ball position and tee height, not by asking a player to swing differently","The low, spinny, short 'worm-burner' drive - almost always a steep negative attack angle off the tee, ballooning spin loft on a low-loft club","A thin, bladed iron shot that traces back not to a speed problem but to a low point that isn't far enough ahead of the ball (attack angle too shallow, not steep enough)","Long-drive competitors deliberately swinging up at +8° or more with very low-lofted drivers to push spin loft near zero and maximise carry-plus-roll"],"whatItMeansForYou":"For irons and wedges, don't fight the descending strike - a modest -3° to -5° attack angle (ball back of centre, a shallow divot after the ball) is correct and is what a launch monitor should show; trying to 'help' the ball into the air by scooping just adds inconsistency, not carry. For your driver, the single biggest free-distance change most amateurs can make is the opposite instinct: tee it higher, play it forward in your stance, and let the club catch the ball on the way up. In the engine, taking a 113mph / 13°-dynamic-loft driver delivery from -2° to +5° of attack angle drops spin loft 15° to 8°, cuts backspin 3,178 to 1,709rpm, lifts ball speed 167.10 to 170.95mph and carry 263.8 to 276.4yd - real yards, with no extra swing speed required."},"misconceptions":["\"You create power/compression by hitting down hard on the ball.\" Compression comes from ball speed and a clean, centred strike - and in this engine ball speed actually falls as the strike steepens, because smash is a function of spin loft alone. Measured at 30° dynamic loft and 90mph, going from +5° to -3° of attack angle takes smash 1.4190 down to 1.3618 and ball speed 127.71 down to 122.56mph. A great iron strike needs only a modest descending angle (roughly -3° to -5°; the app's own 'Pure'-strike window computes to about -4°); an aggressively steep chop just raises spin loft, spikes backspin and costs ball speed.","\"Attack angle is something you do with your hands or wrists right at impact.\" It is a geometric consequence, set well before the club ever nears the ball, of where the ball sits relative to the low point of your swing's arc and how steep your swing plane is (measured in the geometry engine: 0.996° per inch of ball position, 0.050° per degree of plane steepness). By the time you're consciously reacting at impact, it has already been decided by your setup.","\"You should hit down on a driver too, like you do with an iron - that's how the pros look on TV.\" Backwards for a teed ball. Because the driver sits on a tee, ball forward in the stance, the correct target is an ascending strike (PGA Tour average ≈ -1.3°, but distance-optimized players and long-drive competitors are often +3° to +8°). Chopping down on a teed driver is one of the most common amateur distance leaks.","\"More negative attack angle always means more useful backspin.\" Only up to the spin window a shot needs - and the engine has a hard 9,000rpm spin ceiling that wedges sit against. Measured at 52° dynamic loft and 85mph, steepening attack angle from -4° to -6° to -8° leaves backspin pinned at 9,000rpm every time and carry essentially flat (129.1 → 128.9 → 128.9yd). All the extra steepness buys there is a deeper divot - see the Backspin lesson's 'balloon past the optimum' point.","\"Attack angle and launch angle are basically the same knob.\" They're related but very different in weight: attack angle adds a flat 0.25° of launch per degree, while dynamic loft's per-degree pull is 0.564° through a 7-iron (both measured by single-degree engine sweeps). Attack angle's real lever is spin loft, a full 1:1 relationship. Changing it moves spin a lot and launch only a little.","\"At driver loft a degree of loft moves launch less than a degree of attack angle, so attack angle matters more for launch on a driver than on a wedge.\" The first half is measured fact (0.155°/° of loft at 13° dynamic loft versus attack's 0.25°/°); the conclusion does not follow. Sweeping one degree of attack angle at 13°, 25°, 30°, 40° and 50° of dynamic loft returns 0.250° of launch every single time - attack angle's effect on launch is identical on a driver and on a wedge. What changes across the bag is loft's effect, not attack's.","\"Every golfer should aim for a positive attack angle - it's just objectively better.\" Only true for the driver (and arguably fairway woods off a tee). Irons and wedges are struck off the ground and need a negative, descending attack angle to compress the ball correctly, take a divot after it, and control trajectory and spin. The 'right' attack angle is club- and shot-dependent, not a single universal target."],"wolframChecks":["swing-geometry check: low point 10.5cm/4.1in ahead of the ball (xLP=0.105m, the app's own LP_IDEAL constant), radius 1.2m, plane 55° -> theta=arcsin(-0.0875)=-5.02°, then attackAngle = arctan(vz/vh) = -4.11° (descending) - matches the tour mid-iron AoA benchmark almost exactly","same low-point offset (10.5cm ahead) at a flatter 40° plane -> -3.22°; at a steeper 70° plane -> -4.72°: 0.050° per degree of plane, confirming a steeper swing plane turns the same ball position into a bigger attack-angle magnitude","sweeping the app's own 'Pure'-strike window at the default 55° plane: xLP=0.02m (0.8in ahead) -> -0.78°; xLP=0.15m (5.9in ahead) -> -5.88° - a 5.1° swing in attack angle across ~5.1 inches of ball position, i.e. 0.996° per inch, grounding the classic 'ball position = 1 degree per inch' golf-instruction rule of thumb in the app's own geometry engine","engine delivery A (7-iron, dynamicLoft=30°, clubSpeed=90mph, clubPath=faceAngle=0), attackAngle=-3° -> spinLoft 33.000° (the centred-strike identity 30-(-3)); measured smashEff 1.3618 so ballSpeed = 90 x 1.3618 = 122.56mph, backspin 6,623rpm, launch 15.38°, carry 174.0yd. Spin is generated at the face from club speed and true 3-D spin loft alone - there is no multiplier left to multiply out, so the check is the measured tuple, not a product.","engine delivery B, same setup struck 5° less steeply, attackAngle=+2° -> spinLoft 28.000°; measured smashEff 1.3985, ballSpeed = 90 x 1.3985 = 125.86mph, backspin 4,835rpm, launch 16.63°, carry 180.4yd. Independently checkable ratios: 4835/6623 = 0.730 and 125.86/122.56 = 1.0269; the launch step 16.63-15.38 = 1.25° is exactly 5 x the 0.25 attack weight.","net across those 5° of attack angle: backspin falls 6,623 -> 4,835rpm (-27.0%) while ball speed rises only 122.56 -> 125.86mph (+2.7%) and carry 174.0 -> 180.4yd (+3.7%), so attack angle's direct pull on distance is modest next to its pull on spin. Cross-check on what does move distance: hold that delivery and raise club speed 90 -> 100mph and carry goes 174.0 -> 200.9yd (+26.9yd).","launch-weight sweep (clubPath=faceAngle=0, 90mph): +1° of attack angle moves launch by exactly 0.250° at dynamicLoft 13°, 25°, 30°, 40° and 50° - the attack weight is flat across the bag. +1° of dynamic loft moves launch by 0.155° at 13°, 0.444° at 25°, 0.564° at 30°, 0.805° at 40° and 1.045° at 50° - loft's pull is a curve that steepens with loft, which is what changes across the bag, not attack angle's.","driver delivery (dynamicLoft=13°, clubSpeed=113mph, clubPath=faceAngle=0; the engine's longitudinal model is club-agnostic, so this is fully reproducible): attackAngle=-2° -> spinLoft 15°, launch 9.72°, smashEff 1.4787, ballSpeed 167.10mph, backspin 3,178rpm, carry 263.8yd. attackAngle=+5° -> spinLoft 8°, launch 11.47°, smashEff 1.5128, ballSpeed 170.95mph, backspin 1,709rpm, carry 276.4yd. A 7° attack-angle swing removes exactly 7° of spin loft, adds 1.75° of launch (7 x 0.25), halves backspin and adds 12.6yd of carry - the mechanism behind the 'hit up on your driver' distance tip."],"quiz":[{"q":"In the app's engine, a negative attack angle means:","options":["The clubhead is moving upward through impact","The clubhead is moving downward through impact (descending)","The clubface is closed relative to the path","The ball is curving left"],"answerIndex":1,"explanation":"impact-flight.js states the convention directly: attackAngle is '+ = up, - = down (descending)'. A negative number means the clubhead is still falling toward the bottom of its swing arc when it strikes the ball - the normal, correct picture for a ball-first iron strike."},{"q":"On a centred, square strike the engine's spin loft reduces to dynamicLoft - attackAngle. A 7-iron delivers 30° of dynamic loft with a -4° attack angle. What is the spin loft?","options":["26°","30°","34°","-4°"],"answerIndex":2,"explanation":"30 - (-4) = 34°, and the engine returns exactly 34.000° for that delivery with club path and face angle at zero. Subtracting a negative attack angle adds to spin loft - which is why a steeper, more descending strike raises spin loft (and therefore backspin, and therefore lowers smash), while hitting up subtracts from it."},{"q":"Roughly what is the PGA Tour average driver attack angle?","options":["About -1° (slightly descending, near neutral)","About -10° (steeply descending, like a wedge)","About +15° (very steeply ascending)","Exactly 0° for every player, no variation"],"answerIndex":0,"explanation":"TrackMan University's widely cited tour-average table puts driver attack angle around -1.3° - only slightly descending. Distance-optimized players and long-drive competitors push it more positive (often +3° to +8°+), while recreational amateurs tend to average noticeably more negative (roughly -2° to -5°), the classic steep 'chop' that spins the ball too much and costs carry."},{"q":"According to the app's swing-geometry engine (swing-parameters-and-impact.js), what mainly determines whether a swing strikes down or up on the ball?","options":["How hard the golfer grips the club","Where the ball sits relative to the low point of the swing's arc","The colour or flex of the shaft","How fast the golfer swings"],"answerIndex":1,"explanation":"deriveImpact()/effectiveLpx()/thetaAtImpact() compute attack angle purely from the ball's position relative to the arc's low point and the swing-plane angle - measured at 0.996° of attack angle per inch of ball position, versus only 0.050° per degree of plane. Grip and swing speed don't enter this calculation at all."},{"q":"Holding dynamic loft and club speed fixed, moving attack angle from -3° to +5° changes the engine's ball speed how?","options":["Ball speed falls, because hitting up wastes energy","Ball speed is unchanged, because smash depends only on club speed","Ball speed rises, from 122.56 to 127.71mph, because the lower spin loft is a less glancing strike","Ball speed rises, but only because launch angle went up"],"answerIndex":2,"explanation":"The engine's smash factor is a function of spin loft alone. Hitting up removes spin loft 1:1, so smashEff climbs 1.3618 to 1.4190 across that 8° sweep and ball speed follows, 122.56 to 127.71mph at 90mph of club speed. Launch angle plays no part in ball speed - it only enters later, in the carry model."},{"q":"Why does a well-struck iron shot take a divot after the ball, while a well-struck teed driver ideally takes no divot at all?","options":["Irons are simply heavier clubs","The driver has no grooves so it can't dig into turf","Irons are struck with a negative (descending) attack angle, so the low point of the swing is still ahead of the ball at contact; a teed driver should be struck with a positive (ascending) attack angle, so the club is already climbing","It is random and unrelated to attack angle"],"answerIndex":2,"explanation":"With irons, the ball is played back of the swing's low point, so the club is still descending when it strikes - it keeps travelling down into the turf just past the ball, making the divot. A teed driver is played forward of the low point, so the club has already bottomed out and is climbing (positive attack angle) by the time it meets the ball, well above the turf."}]}</script>
  <script type="application/json" id="lesson-face-angle">{"parameter":"Face Angle","oneLiner":"Face angle - where the clubface points at impact - is the single biggest lever on where your shot starts, and together with club path it also drives almost all of the sideways curve, which is why teachers now say \"when in doubt, blame the face.\"","whatItIs":"Face angle is simply which way the clubface is pointing - left or right of the target line - at the exact instant it strikes the ball, measured in degrees. Open (positive, for a right-handed golfer) means the face aims right of target at impact; closed (negative) means it aims left; square (0°) means it aims exactly at the target. It has nothing to do with how the club is swinging - that's club path - so you can swing perfectly down the target line and still send the ball way offline if the face itself isn't square when it meets the ball. Of every number a launch monitor reports, face angle is the single biggest lever on where your shot starts, and, together with club path, it is also the entire reason the ball curves in flight.","components":[{"name":"Face angle (the parameter itself)","role":"Where the clubface is aimed — left or right of the target line — at the exact instant it strikes the ball. Open (+) aims right of target for a right-handed golfer, closed (-) aims left, square (0) aims dead at it. It is a snapshot of the face only, independent of how the club is swinging.","typicalRange":"tour driver roughly ±1-2° of square; mid-handicap commonly 2-5° open (slice-prone); high-handicap 5-8°+ open"},{"name":"Club path","role":"The horizontal direction the clubHEAD is travelling at impact (in-to-out or out-to-in). Needed only as the reference for the face — the engine cares about the gap between the two, not path on its own.","typicalRange":"tour driver +1 to +3° in-to-out; iron closer to neutral, -2 to +2°"},{"name":"Face-to-path gap (faceAngle - clubPath)","role":"The true curvature lever. The engine derives spin-axis tilt directly from this gap, not from face angle relative to the target — so a face that is square to the target can still curve hard if the path is off, and vice-versa.","typicalRange":"tour players commonly inside 1-2°; a recreational slice is often 5-10°"},{"name":"Dynamic loft (sets the face-weight taper)","role":"Controls how much of face angle (vs path) reaches the start line. Engine: faceW = clamp(0.90 - dynamicLoft*0.005, 0.60, 0.88) - lower loft (driver) leans harder on the face, higher loft (wedge) lets path in more.","typicalRange":"faceW = 0.65 for a 50° wedge, exactly 0.75 for a 30° 7-iron, 0.835 for a 13° driver. The 0.60 and 0.88 clamp ends would need dynamic loft above 60° or below 4°, so no real club ever reaches them."},{"name":"Carry distance (amplifies the curve)","role":"Curve is not made at impact - it accumulates in flight, so a longer carry gives the same axis tilt far more time to bend the ball, and it grows much faster than the carry does. Measured on one 7-iron delivery held at a fixed 10.958° spin-axis tilt (face +7°, path 0, club speed varied): 124.5 yd of carry bends 7.03 yd, 223.0 yd bends 27.57 yd - 1.79x the carry, 3.92x the curve.","typicalRange":"7-iron 172.4 yd carry vs driver 275.2 yd carry -> 4.53 yd vs 18.50 yd of bend for the same 2° face-to-path gap, a 4.08x amplification"},{"name":"Strike location / gear effect (not modeled here)","role":"A real, separate mechanism: an off-center hit (toe/heel, especially on a large driver head) can curve the ball opposite to what face angle alone predicts. Flightglass's engine assumes a centered strike, so this lesson covers face-to-path curvature only.","typicalRange":"can rival or exceed face-to-path curvature on a bad mis-hit; not quantified in this engine"}],"howTheyConnect":"At impact the ball's initial direction is a weighted blend of where the face points and where the club is travelling - never purely one or the other, and never a flat 50/50. Flightglass's engine states this literally: startDirection = faceW*faceAngle + (1-faceW)*clubPath, where faceW itself tapers with dynamic loft - clamp(0.90 - dynamicLoft*0.005, 0.60, 0.88) - giving 0.65 for a 50° wedge, exactly 0.75 for a stock 30° 7-iron and 0.835 for a 13° driver. This loft-taper is a sourced refinement of the older flat \"75/25 rule\": a driver's low loft sends the ball more directly off the face (path matters less), while a wedge's high loft lets path \"grab\" a bigger share. Separately - and this is the part most golfers have backwards - the face also supplies almost all of the ball's sideways curve. The engine derives spin-axis tilt from the gap between face and path (faceToPath = faceAngle - clubPath), not from face angle relative to the target, and it derives it geometrically: the tilt is the angle by which the impact spin vector leans away from horizontal. The gap sets which way it leans; dynamic loft and attack angle set how hard it leans. Three deliveries are locked for every number in this lesson: 7-iron 89.4 mph / attack -3° / dynamic loft 30° (172.4 yd carry), driver 113 mph / attack +4° / dynamic loft 13° (275.2 yd carry), and 50° wedge 80 mph / attack -5° (120.7 yd carry). The same 6° face-to-path gap tilts the driver's axis 32.914° against the wedge's 4.673° - about 7x - before either ball has flown a yard. But the tilt on its own does not predict the curve, and this is exactly where the usual teaching goes wrong: at a matched 2° gap the engine's actual sideways spin is 304 rpm on the wedge, 392 on the 7-iron and 425 on the driver - nearly identical - because the driver's much bigger tilt is almost entirely cancelled by its much lower total spin (1,966 rpm against the wedge's 9,000). What separates the clubs is the flight. Those near-equal side-spins get 120.7, 172.4 and 275.0 yd of carry to work in, and come out as 1.81, 4.53 and 18.50 yd of bend. Curve has no closed form in the engine at all - it is integrated from the flight under drag and Magnus lift - and it outgrows carry steeply: hold one 7-iron delivery at a fixed 10.958° tilt and 1.79x the carry buys 3.92x the bend. Put the two mechanisms together and the asymmetry between face and path becomes obvious: when face angle moves, it pushes the start line and the curve axis in the same direction, so the effects reinforce each other. When only path moves (face held square), the start line nudges one way but the curve pulls the other way - an in-to-out path starts the ball slightly right but curves it back left, toward a draw - so path's effects partly cancel themselves. Engine-verified on the 7-iron: a 6° face-only error (path 0) finishes 26.85 yd offline, its 13.48 yd start push and 13.37 yd of curve both pointing right, while a 6° path-only error (face 0, path -6°) produces the identical 13.37 yd of curve but manages only 8.88 yd total, because a 4.50 yd start push to the left is subtracted instead of added. The entire 17.98-yd spread between the two is that one start push, counted once each way. Finally, both channels scale with the club: at the identical face +2° / path -5° delivery the 50° wedge finishes 5.31 yd offline and the driver 57.67 yd.","hierarchy":[{"driver":"Face angle's weight on start direction (faceW, loft-tapered)","weight":"dominant - 0.75° of start-line shift per 1° of face angle on a 7-iron (faceW=0.75), rising to 0.835° per° on a driver; path only contributes the leftover (1-faceW)","why":"Directly coded in the engine (startDirection = faceW*faceAngle + (1-faceW)*clubPath) and matches TrackMan's widely-cited finding that face angle governs roughly 75-85% of starting direction depending on club - the research that overturned the old path-first teaching."},{"driver":"Face-to-path gap -> spin axis -> curve (compounds with the driver above)","weight":"dominant for curve: the gap tilts the spin axis by exact 3-D geometry — no gain, no clamp — and the club's loft sets how hard. On the 172.4-yd 7-iron a 2° gap tilts 3.172° and bends 4.53 yd; the same 2° tilts the 275.2-yd driver 12.230° and bends 18.50 yd.","why":"Because face angle changes push both the start line and the curve axis the same direction, the two effects reinforce. Engine-verified: sweeping face alone (path=0) moves total offline about 4.5 yd/° on the 7-iron (±3° -> ±13.54 yd, ±6° -> ±26.85 yd) - about three times the 1.48 yd/° you get sweeping path alone (face=0, ±6° -> ∓8.88 yd), because path's start-line push and its curve pull subtract from each other instead of adding."},{"driver":"Club path's own (smaller, self-cancelling) contribution","weight":"Only (1-faceW) of start direction - 0.25°/° on a 7-iron, 0.165°/° on a driver - and its curve contribution runs opposite to that start push","why":"An in-to-out path alone starts the ball slightly right but curves it back left (a draw), so path partially self-corrects. That is the mechanical reason teachers say 'when in doubt, blame the face, not the path.'"},{"driver":"Club/loft amplification (driver vs 7-iron for an identical error)","weight":"4.08x more curve on the driver than on the 7-iron for the same 2° face-to-path gap (18.50 yd against 4.53 yd), stacked on top of the higher faceW","why":"Not for the reason usually given. The driver's axis does tilt 3.86x harder (12.230° against 3.172°), but its far lower total spin cancels almost all of that: the sideways spin actually driving the curve is 425 rpm on the driver against 392 rpm on the 7-iron. Detune the driver to 80 mph so it carries 170.2 yd - the 7-iron's distance - and the 4.08x collapses to 1.36x (6.15 yd against 4.53). Flight length buys most of the amplification, and curve outgrows carry steeply (same 7-iron held at a fixed 10.958° tilt: 1.79x carry -> 3.92x bend). The higher faceW then adds more start-line error on top. That is why the exact same felt mis-hit looks catastrophic off the tee and barely noticeable with a wedge."},{"driver":"Strike location / gear effect (not modeled, real-world caveat)","weight":"Unquantified here, but can rival face-to-path curvature on a bad toe/heel driver miss","why":"A separate physical mechanism from face-to-path spin-axis tilt; Flightglass's engine assumes a centered strike, so this lesson (and its diagram) isolates face angle and path cleanly, but a real fitting session must also check strike location."}],"realWorld":{"tourBenchmarks":["TrackMan's \"New Ball Flight Laws\" research (the radar data that overturned decades of golf teaching around 2012) found face angle governs roughly 75-85% of a shot's starting direction, club path the rest - a split that shifts by club. Flightglass's engine mirrors this with a loft-tapered face weight, clamp(0.90 - dynamicLoft*0.005, 0.60, 0.88). The 0.60 and 0.88 clamp ends are never reached by a real club; in practice it runs 0.65 for a 50° wedge up to 0.835 for a 13° driver, landing at exactly 0.75 for a stock 30° 7-iron.","PGA Tour players deliver a famously tight face-to-path window off the driver - commonly described in TrackMan-based coaching as within a degree or two of matched - which is why ~113-mph clubhead speeds still produce a repeatable, controlled shot shape rather than a wild miss. Flightglass's own 'tour window' test (face +0.5°, path +1.5°, driver preset at 113 mph) nets just a 6.2-yard draw on a 275.2-yard carry.","Teaching-industry material (TrackMan University, major golf publications) widely reports that a large majority of recreational golfers battle a slice - an open face relative to an out-to-in path. Flightglass's modeled 'banana slice' (face +4° open, path -4°, an 8-degree gap on a driver swung at 95 mph) computes to 43.7 yards offline on a 212.7-yard carry - a real 'lost it in the trees' number.","This lesson's ball speeds come straight out of the engine's smash model, not from any rule of thumb: the stock 7-iron (89.4 mph, dynamic loft 30°, attack -3°) returns 121.7 mph of ball speed and 172.4 yd of carry, right at the PGA-average 7-iron band, and the driver preset (113 mph, dynamic loft 13°, attack +4°) returns 170.4 mph and 275.2 yd - the tour driver band."],"scenarios":["The banana slice: the ball starts a touch right of target, then keeps bending further right until it's in the trees. Mechanically: an open face relative to an out-to-in path, both errors reinforcing each other - modeled here as 43.7 yards offline on a driver swung at 95 mph.","The 'that felt fine' miss: a 7-iron approach that misses the green by roughly 13-14 yards even though the swing path felt perfectly down the line - because a 3-degree open face with a square path is nearly invisible in the swing but adds up to real yards (13.54 yd in this lesson's model, 6.78 of it pure curve).","The push (no curve): face and path are open by the same amount, so there is zero face-to-path gap - the ball starts right of target but flies dead straight instead of curving further, because a pure start-direction error and pure curve are two different mistakes that only look similar at first glance.","The pull-hook: a closed face plus a mismatched path sends the ball left immediately and keeps bending left - the mirror image of the slice, and just as costly. Modeled as a 4° closed face with a +4° in-to-out path on the same 95-mph driver, it returns 43.7 yards offline: the slice's number with the sign flipped, because the engine's geometry is symmetric about square.","Why the driver 'exposes' your face angle more than your irons: at an identical 6° face-to-path gap (face open, path 0) the 50° wedge finishes 13.57 yd offline while the driver finishes 72.13 yd — about 5.3x — and it is purely geometric. A higher faceW (0.835 against 0.65) puts more of the error straight onto the start line, and a 273-yd flight has vastly longer to cash the curve in than a 120-yd one. Nothing to do with swinging the driver 'worse'."],"whatItMeansForYou":"Because face angle carries roughly three times the total leverage of path on where your ball ends up - about 4.5 yards per degree against path's 1.5 on a 7-iron - and drives essentially all of the curve on top of that, the single highest-value fix for a wayward shot is almost always the face (a grip check, alignment-stick drill, or impact tape), not a swing-path overhaul; and because that same face error costs far more off a driver than a wedge (72.1 yd against 13.6 at a matched 6° gap), don't judge your ball-striking by the tee shot alone - the geometry, not just your swing, is working against you more with the longer clubs."},"misconceptions":["\"The ball goes wherever the path points\" (the old ball-flight law). Reversed: face angle governs roughly 75-85% of starting direction depending on club (engine faceW runs 0.65 on a 50° wedge to 0.835 on a driver), path only the rest. This is exactly the finding that overturned decades of teaching once TrackMan's radar data went public.","\"Face angle relative to the target is what curves the ball.\" No - curvature comes from the gap between face and path (faceToPath), not face-vs-target. A face perfectly square to target can still curve hard if the path is off: engine test face=0/path=+5° (in-to-out) on the 7-iron bends the ball 11.21 yd left and finishes 7.45 yd left of target, with zero start-line contribution from the face.","\"A square face at address means a square face at impact.\" Dynamic face angle (the number that actually matters) can differ hugely from address due to grip, wrist rotation and release timing through the swing - that's precisely why this whole discipline calls it 'dynamic', mirroring 'dynamic loft'.","\"Path is the bigger problem behind my slice.\" Mechanically, face moves both start line and curve the same way (reinforcing, about 4.5 yd/° on a 7-iron) while path's two effects partly cancel (1.48 yd/°) - so degree for degree the face is roughly three times as costly. Fix the face first.","\"My driver just naturally goes more offline because it's harder to hit.\" Partly true swing-wise, but there is a hard geometric reason too: the driver's faceW is higher, so more of the error lands straight on the start line, and its far longer flight has much more time to turn sideways spin into yards. An identical 6° face-to-path error finishes 72.13 yd offline on a driver against 26.85 yd on a 7-iron — about 2.7x — before swing consistency even enters it.","\"Gear effect explains all curved driver shots.\" Gear effect (curving opposite to strike location on an off-center hit) is real but a separate mechanism from face-to-path spin-axis tilt. This lesson's engine assumes a centered strike; a toe/heel miss adds another layer not modeled here."],"wolframChecks":["tan(1 degree) x 100 -> 1.7455 yd (Wolfram-verified): a 1-degree aiming error drifts about 1.75 yards sideways per 100 yards of shot from simple trigonometry alone - why the same degree of face-angle error costs far more yards off a 275-yard drive than a 120-yard wedge.","172.4 x sin(0.75 degree) -> 2.2566 yd (Wolfram-verified): confirms the engine's start-line component of offline for the 7-iron with 1° of open face (faceW=0.75 -> startDirection=0.75°), matching solveFlight()'s carry*sin(startDirection) term exactly - the engine returns 4.52 yd of offline, 2.26 of it this start push and 2.27 of it curve.","18.50 / 4.53 = 4.084 (Wolfram-verified): at a matched 2° face-to-path gap the engine bends the 275.2-yd driver 18.50 yd against the 172.4-yd 7-iron's 4.53 yd. Nothing simple predicts that ratio. The carry ratio squared gives (275.2/172.4)^2 = 2.548, and the axis-tilt ratio gives 12.230/3.172 = 3.856; neither is 4.08. The sideways spin is nearly equal on the two clubs (425 rpm against 392 rpm), so the amplification is bought in flight - it has to be measured, not derived.","1 degree = pi/180 rad (Wolfram-verified, ~0.01745 rad): the radian conversion underlying every sin()/tan() call in the engine's start-direction and curve math.","Engine sweep, 7-iron (89.4 mph, dynamic loft 30°, attack -3°), path held at 0: face -6/-3/-1/0/+1/+3/+6° -> offline -26.85/-13.54/-4.52/0/+4.52/+13.54/+26.85 yd - symmetric about square and very close to linear at about 4.5 yd per degree of face angle (4.52 yd/° at 1°, 4.51 at 3°, 4.48 at 6°, the slight droop coming from the small carry loss at higher spin loft).","Engine sweep, same 7-iron, face held at 0: path -6/-3/0/+3/+6° -> offline +8.88/+4.52/0/-4.52/-8.88 yd - only 1.48 yd per degree, roughly a third of face's leverage. The curve term is identical to the face sweep's (13.37 yd at a 6° gap either way); the whole difference is the start push, which adds 13.48 yd on the face sweep and subtracts 4.50 yd on the path sweep - 17.98 yd of spread from that single term.","Engine scenario check - amateur banana slice (driver, face +4° open, path -4° out-to-in, an 8-degree face-to-path gap, club speed 95 mph): offline = 43.7 yd right on a 212.7-yd carry. Tour-tight window (driver preset, 113 mph, face +0.5°, path +1.5° in-to-out, a 1-degree gap): offline = only 6.2 yd (a gentle draw) on a 275.2-yd carry."],"quiz":[{"q":"On a stock 7-iron (dynamic loft 30°), Flightglass's engine splits start direction between face angle and club path roughly...","options":["50% face, 50% path","25% face, 75% path","75% face, 25% path","100% face, path has zero effect"],"answerIndex":2,"explanation":"The engine computes faceW = clamp(0.90 - dynamicLoft*0.005, 0.60, 0.88), which lands at exactly 0.75 at a 30-degree dynamic loft - so start direction is about 75% face, 25% path. This matches TrackMan's widely cited research finding, which is loft-dependent: the split shifts toward more face on a driver (0.835 at 13° of loft) and less on a wedge (0.65 at 50°)."},{"q":"What actually determines how much a shot curves sideways in flight?","options":["Face angle measured against the target line","The gap between face angle and club path","Dynamic loft alone","Ball speed alone"],"answerIndex":1,"explanation":"The engine derives spin-axis tilt from faceToPath = faceAngle - clubPath, not from face angle relative to the target. Proof: with the face square to the target (0°) but an 8° out-to-in path, the engine still bends the 7-iron 17.59 yd right - and the ball finishes 11.61 yd right even though the start line moved 2° LEFT. That leftward push came from path; the face, aimed dead at the flag, contributed nothing to the start line and all of the bend came from the gap."},{"q":"An identical 2-degree face-to-path gap is applied to both the driver preset (275 yd carry) and the 7-iron (172 yd carry), path=0 in both cases. What happens to the curve?","options":["Exactly the same number of yards on both clubs","The driver curves far more - about 4x","The driver curves less because it launches lower","Curve doesn't apply to drivers"],"answerIndex":1,"explanation":"The second option is the only one that gets the direction right, and its number is the measured one: 18.50 yd of bend on the driver against 4.53 yd on the 7-iron, a ratio of 4.08. The usual explanation - 'the driver tilts the spin axis harder' - is only half the story. It does tilt 12.230° against 3.172°, but its far lower total spin cancels most of that, leaving nearly the same sideways spin on both clubs (425 rpm against 392). Detune the driver to 80 mph so it carries the 7-iron's ~170 yd and its advantage collapses to 1.36x. Flight length buys the rest, and since curve is integrated from the flight rather than read off a formula, no ratio of carries or tilts predicts it."},{"q":"A player's face is 5 degrees open and their path is 5 degrees open (matched, so face is square TO the path). What ball flight results?","options":["A big slice that keeps curving further right","A straight push - starts right of target, flies straight, no curve","A big hook to the left","The ball goes dead at the target"],"answerIndex":1,"explanation":"With faceToPath = 5 - 5 = 0, the engine's spinAxis and curve are both zero - there is no curvature lever engaged. But start direction still moves: face and path both sit at +5°, so the 75/25 blend lands on a full 5° whatever the weighting, and the ball starts right of target and flies dead straight from there: a 'push', not a slice. Engine test: offline = 172.4·sin(5°) = +15.03 yd, curve = 0."},{"q":"Why does a small, barely-felt face-angle error cost far more yardage with a driver than with a wedge?","options":["Driver swings are inherently less accurate as a rule","The driver's lower dynamic loft gives face angle a bigger share of start direction (higher faceW), and its far longer carry gives the same sideways spin much more flight to bend in - compounding, purely geometric reasons","Wedges have no measurable face angle","Drivers produce no backspin, so nothing corrects the miss"],"answerIndex":1,"explanation":"Two engine mechanisms stack for the driver. faceW rises from 0.65 (50° wedge) to 0.835 (13° driver), so more of the face error reaches the start line; and the flight is far longer, which is what actually cashes the curve in. Measured at a matched 2° gap with path 0, the driver bends 18.50 yd against the 7-iron's 4.53 and the wedge's 1.81 - while the sideways spin driving all three is nearly identical (425 / 392 / 304 rpm). It is the 275 / 172 / 121 yd of carry that separates them, not the spin. Neither mechanism has anything to do with swing quality: it's geometry."}]}</script>
  <script type="application/json" id="lesson-club-path">{"parameter":"Club Path","oneLiner":"Club path is the horizontal direction the clubhead is actually traveling through impact — in-to-out or out-to-in, relative to the target line — and together with face angle it decides both where a shot starts and, through the gap between the two, how hard it curves.","whatItIs":"Club path is the horizontal direction the clubhead is moving as it passes through the ball — not where the face is pointing, not up-or-down, just left-right travel relative to the target line. Positive (in Flightglass's convention) means in-to-out (the clubhead is moving to the right of the target line for a right-handed golfer, on its way from \"inside\" the line to \"outside\" it); negative means out-to-in (moving left, the classic \"over the top\" move). Every shot has both a club path and a face angle at the same instant, and they are genuinely different numbers measuring different things — a launch monitor reports them separately because a golfer can have almost any combination of the two. Path matters in two distinct ways: first, it contributes (along with face angle) to where the ball starts, though face angle usually does most of that work; second, and often more importantly, the gap between face angle and club path is what makes the ball curve sideways in flight. A club path number on its own, without knowing the face angle alongside it, doesn't tell you whether a shot will draw, fade, hook, or slice — it only tells you the swing's raw horizontal direction. Path itself isn't something dialed in directly either: it's the product of where a golfer's swing plane is aimed and, subtly, exactly when along the circular arc of the swing the club meets the ball.","components":[{"name":"Face-to-path gap (face angle minus club path)","role":"The number that actually curves the ball. Flightglass's engine reads the spin axis as the true 3-D tilt of the (velocity × face-normal) axis from horizontal — no fitted gain, no clamp — so faceAngle − clubPath sets which way it tilts while loft and attack set how hard; the ball curves toward the face and away from the path. Path on its own only sets part of where the shot starts — this gap is what bends it sideways in flight.","typicalRange":"tour players inside ~1-2° for driver-length consistency; recreational slicers commonly 6-10+°"},{"name":"Face angle (relative to target)","role":"Club path's partner. Face angle alone is the single biggest driver of start direction (75-85% of it, club-dependent) and, via its gap to path, the other half of what curves the shot.","typicalRange":"square is 0°; tour players rarely stray more than 1-2° at impact"},{"name":"Start-direction face weight (loft-dependent taper)","role":"How much of the start line comes from face vs path — not fixed, it changes with the club. Lower loft (driver) is more face-dominant; higher loft (wedge) lets path matter more. sourced in the engine as startFaceW = clamp(0.90 - dynamicLoft x 0.005, 0.60, 0.88).","typicalRange":"driver (11° dynamic loft) faceW 0.845 (path 15.5% of start line); 7-iron (30°) 0.750 (path 25%); 50° wedge 0.650 (path 35%)"},{"name":"Swing direction (body/arm aim)","role":"The horizontal direction the whole swing plane is rotated toward — the thing a golfer actually feels themselves aiming. It is the biggest single input to path in Flightglass's geometry engine, but path is not numerically identical to it.","typicalRange":"engine input, degrees relative to target line (geometry model, swing-parameters-and-impact.js)"},{"name":"Low-point timing (where on the arc contact happens)","role":"Whether the club meets the ball before (descending) or after (ascending) the bottom of the swing arc. In Flightglass's geometry engine this alone shifts measured path even with swing direction held perfectly on line.","typicalRange":"Flightglass 'Pure' strike window: low point ~0.08-0.13 m ahead of the ball"},{"name":"Swing-plane steepness (plane angle)","role":"How upright vs flat the swing plane is. A flatter plane amplifies how much a mistimed low point turns into path error; a steeper plane is more forgiving of the same timing miss.","typicalRange":"Flightglass default 55°; flat ~35-45°, steep ~65-75°"},{"name":"Carry distance","role":"Not a cause of curve — a secondary amplifier of it. Within one club, flying the ball further bends it more than proportionally (measured: +18.9% carry bought +46.9% curve, a ~2.2 power of carry). Across clubs it is the weaker lever: hold the spin axis at a matched 10.958° and a 113-mph driver flying 273.8 yd curves 16.91 yd against an 80-mph wedge's 12.96 yd at 121.7 yd — 2.25x the carry buys only 1.30x the curve. What really separates driver from wedge is the axis tilt the same gap creates, not the flight length.","typicalRange":"wedge ~110-135 yd, mid-iron ~160-185 yd, driver ~225-290 yd"}],"howTheyConnect":"Club path shows up twice in the flight model, and understanding both is the whole lesson. First, at the moment of impact, path and face angle blend to decide where the ball starts: startDirection = faceW x faceAngle + (1-faceW) x clubPath. The blend weight (faceW) is not fixed — it tapers with loft (faceW = clamp(0.90 - dynamicLoft x 0.005, 0.60, 0.88)), so face angle owns 84.5% of the start line with an 11° driver, 75% with a 7-iron, and 65% with a 50° wedge, leaving path a bigger say on shorter, more lofted clubs. Second, and usually more importantly, path and face combine differently to decide how the ball curves: what matters is not path alone but the gap between face and path (faceToPath = faceAngle - clubPath). That gap tilts the ball's spin axis, and the engine measures that tilt rather than scaling it — it is the angle the impact spin vector leans away from horizontal, no gain applied, no ceiling imposed. The ball curves toward the face and away from the path, so a square-to-target face with a wildly out-to-in path still slices hard, because it is open relative TO the path even though it looks square relative to the target. The gap fixes which way the axis leans; loft and attack angle fix how hard — the same 6° gap tilts an 11° driver's axis (attack +1°) 30.560° but a 50° wedge's (attack -3°) only 4.803°, about 6.4x, purely from geometry — and tilt is speed-independent: that driver reads 30.560° at 90 mph and at 113 mph alike. Distance then amplifies whatever tilt the geometry produced, and there is no closed-form curve law in the engine — it integrates the flight under drag and Magnus lift. Hold the tilt and lengthen the flight within one club and curve outgrows carry: same driver, same 30.560° tilt, 100 vs 113 mph, carry goes 228.84 -> 271.97 yd (1.188x) while curve goes 31.10 -> 45.70 yd (1.469x). Across clubs, though, distance is the junior partner: at a matched 10.958° tilt the driver's 2.25x carry advantage over a wedge buys only 1.30x the curve (16.91 vs 12.96 yd). Gap-times-loft tilt is what makes a driver ruinous, not the yardage. So the identical gap that barely moves a wedge shot can wreck a drive — at a face +2 / path -5 delivery the wedge finishes 5.83 yd offline, the driver 55.37 yd. Finally, offline (the total sideways miss) simply adds the start-line push (carry x sin(startDirection)) to that much larger curve term — exactly, and uncapped — which is why, once the gap passes a degree or two, curve dominates the story and start direction becomes the minor character. Zoom out one more level and ask where path itself comes from: it is not something a golfer directly dials, it emerges from the 3D swing-plane geometry in Flightglass's companion engine (swing-parameters-and-impact.js). There, clubPath = swingDirection + a correction term driven by exactly where on the circular swing arc contact happens (theta, relative to the arc's low point) and how steep the plane is. Concretely: holding swing direction dead square at 0°, shifting the low point just 3 cm ahead of the ball (the \"compressed, ball-then-turf\" strike every coach wants) quietly adds about 0.8° of in-to-out path and 1.2° of extra downward attack angle — with zero change in where the golfer is aiming. Shift the low point behind the ball instead (the fat/scoop tendency) and path drifts out-to-in by the same amount, the opposite direction. A flatter swing plane makes this timing-to-path coupling roughly twice as strong as a steep one. So the full chain is: swing-plane aim + arc timing + plane steepness produce the club path number a launch monitor reports; that path then blends with face angle (loft-weighted) to set the start line, and subtracts from face angle to set the face-to-path gap that — tilted weakly or savagely depending on the club's own loft, then compounded through the whole flight — actually curves the shot.","hierarchy":[{"driver":"Face-to-path gap -> spin axis -> curve (the sideways bend)","weight":"Usually the dominant effect on total offline once the gap passes ~1-2°, because the same gap tilts a low-lofted club's axis far harder and a longer flight then compounds that tilt. Engine check: a -8° path / 0° face 7-iron gap curves +17.96 yd right, overwhelming the -6.03 yd start-line push in the opposite direction and still finishing 11.93 yd offline; off the tee the same lesson is louder still - a driver at a 6° gap (face +3 / path -3, 11° loft, attack +1°, 113 mph) curves 45.70 yd and finishes 55.53 yd offline.","why":"Spin axis is the real geometric tilt the face-to-path gap creates — no gain, no clamp — and curve has no closed form at all: it is integrated from the flight. A lower-lofted club turns the same gap into far more tilt (at a matched 6° gap: 30.560° for an 11° driver, 9.428° for a 7-iron, 4.803° for a 50° wedge), and within a club a longer flight then bends that tilt further than proportionally (1.188x carry -> 1.469x curve at a pinned 30.560° tilt). Both push the same way: forgiving on a wedge, ruinous on a driver."},{"driver":"Club path's share of start direction (loft-dependent face weight)","weight":"15.5% of start direction with an 11° driver, 25% with a 7-iron, 35% with a 50° wedge (engine faceW taper 0.845 / 0.750 / 0.650) — closely matching the independently-published, TrackMan-derived rule that face angle owns ~85%/~75% of start line for driver/mid-iron respectively.","why":"sourced in the engine (startDirection = faceW·face + (1-faceW)·path). It is why the identical path fault matters more for aim with a wedge (path counts for more of where it starts) than off the tee, where face nearly owns the start line."},{"driver":"Swing-plane geometry: swing direction + low-point timing + plane steepness","weight":"The upstream cause of path. Engine check (deriveImpact): with swing direction held at a dead-square 0°, moving the low point 3 cm ahead of the ball (a good, compressed strike) added +0.82° of in-to-out path (and -1.17° of attack angle) with zero change in aim. The identical 3 cm timing error on a flatter plane (35°) roughly doubled that path shift (+1.17°) versus a steep plane (70°, +0.49°).","why":"This is the deepest layer: path is not something a golfer consciously 'aims' the way they aim their feet — it emerges from the shape of the swing arc and exactly when contact happens on it. It also explains why flatter swingers are more path-sensitive to mistimed strikes than upright swingers."},{"driver":"Carry distance (amplifier, not a cause)","weight":"Curve is set by how hard the axis tilts and, secondarily, by how long the ball flies. Measured at a matched 6° face-to-path gap: a 7-iron bends 13.66 yd, a driver 45.70 yd — 3.35x more, far past the 2.46x you would get by squaring the 1.569x carry ratio, because the driver's low loft tilts the axis 30.560° against the 7-iron's 9.428°. Isolate carry from tilt and it is clear which lever is bigger: at a matched 10.958° tilt the driver's 2.25x carry over a wedge yields only 1.30x the curve.","why":"Confirms it is flight physics, not a house style: the engine integrates curve out of the flight under drag and Magnus lift, so there is no formula to quote — only behaviour to measure. Pin the axis tilt at 30.560° and change nothing but driver speed: 228.84 yd of carry bends 31.10 yd, 271.97 yd bends 45.70 yd. Carry rose 18.9%, curve rose 46.9% — about a 2.2 power of carry, so extra hang time does more than scale the miss in step with distance. It just cannot, on its own, explain the driver-vs-wedge gulf; loft-driven tilt does that."},{"driver":"Attack angle / low-point (correlated, not causal)","weight":"Doesn't enter the flight engine's path formula directly (clubPath is an independent input there), but shares its geometric origin with attack angle in the swing-plane engine — the same low-point-ahead move that nudges path in-to-out also makes the strike more descending.","why":"Explains a real-world pattern golfers notice: cleaning up ball-first contact (attack angle) often comes with path getting a little more neutral too — not because one causes the other, but because both trace back to the same low-point fix."}],"realWorld":{"tourBenchmarks":["TrackMan's own PGA Tour Averages chart, the table Flightglass's 7-iron preset is loosely calibrated against (90 mph club speed -> 120 mph ball -> 1.33 smash -> 172 yd carry; the engine itself runs that preset a touch hotter, at 122.6 mph ball, 1.362 smash, 174.0 yd): driver 113 mph club speed, 167 mph ball speed, 1.48 smash factor, 2,686 rpm spin, 275 yd carry — the baseline context every club-path number below sits on top of.","Face angle governs roughly 85% of start direction with a driver and about 75% with a mid-iron; club path is the remaining 15%/25% (TrackMan-derived rule cited by TrackMan-certified fitters). Flightglass's engine encodes this almost exactly: faceW = 0.845 for an 11° driver strike, 0.750 for a 7-iron.","PGA Tour average driver club path sits around +2 to +3° in-to-out; the average amateur driver path is commonly cited around -2 to -5° out-to-in — opposite signs, and the single most repeated explanation for why most tour pros draw the ball and most amateurs slice it.","TrackMan's own published face-to-path worked examples: a driver at 275 yd carry curves about 19 yd left at a -2° face-to-path gap and about 44 yd right at +5°; a 6-iron at 183 yd carry curves about 8 yd right at +2° and 20 yd left at -5°. Elite tour players hitting 300+ yd drives keep face-to-path inside roughly 1° for consistency, since even 1° is about 12 yd of curve at that distance."],"scenarios":["The banana slice off the tee: an out-to-in ('over the top') path pulls the start line left of target, and because the face ends up open relative to that leftward path — even if it looks 'square', aimed right at the target — the ball curves hard back right, often 30-40+ yards offline with a driver.","The 'I fixed my grip but still slice' plateau: closing the face to the target line only shrinks the slice if the path also gets more neutral. A golfer can close the face 2° and still be several degrees open relative to an 8° out-to-in path — the miss softens but doesn't disappear.","The overcorrected hook: a golfer told to 'swing more in-to-out' sometimes swings so far in-to-out that even a slightly closed-to-target face becomes badly closed relative to the new path, and the old slice flips into a low, diving pull-hook.","Why the driver slices worse than the wedges on the very same day: an identical 6° face-to-path gap curves a 113-mph driver 45.70 yd but an 80-mph 50°-lofted wedge only 5.85 yd - about 7.8x - with a 7-iron at 13.66 yd in between. The driver's low loft turns the same gap into far more axis tilt (30.560° against the wedge's 4.803°), and its longer, faster flight lets that tilt keep working; tilt is the main lever here, flight length the amplifier stacked on top of it.","Tour pros deliberately playing a small 'controlled fade' or 'controlled draw' off the tee: both are small, repeatable face-to-path gaps (often under 2°) held the same way every time — the shot shape isn't the goal, the consistency of the gap is."],"whatItMeansForYou":"If you slice or hook, club path is usually the more productive number to chase first — not face angle alone, and not 'keep your head down.' What curves the ball is the gap between face and path, and for most amateurs that gap starts with an out-to-in path (a body/arm move), not a hands/face problem. Working your path toward neutral does two things at once: it straightens your start line (path is 15-35% of that, more with shorter clubs) and, more importantly, it shrinks the face-to-path gap that's actually bending the ball sideways — a fix that pays off hardest with the driver, since the same gap curves a tee shot more than three times as many yards as it curves a mid-iron (45.70 yd against 13.66 yd at a 6° gap)."},"misconceptions":["\"Club path is what curves the ball.\" Not by itself — path mostly decides where the shot starts (15-35% of it, club-dependent; the rest is face angle). What actually curves the ball is the gap between face and path: a path of -8° with a perfectly target-square face (0°) still produces a 'Pull Slice' in the engine — 11.93 yards offline on a 7-iron, from 17.96 yd of curve fighting a 6.03 yd start-line push the other way — because the face is 8° open relative TO the path, even though it looks square to the target.","\"An in-to-out path always produces a draw.\" Only if the face is closed relative to that path, not to the target. Engine check: path +8° with face +6° (closed relative to path) draws; path +8° with face +10° (even more open than the path) fades — the same in-to-out path, opposite curve, because the gap's sign flipped.","\"0° club path is the goal for a straight shot.\" A straight shot needs face-to-path ≈ 0, not path = 0. Engine check: path +5° with face +5° (matched) flies dead straight with zero curve — it just starts 5° right of the original target line.","\"Closing the clubface fixes a slice.\" Closing the face relative to the target only helps if it also closes relative to the
