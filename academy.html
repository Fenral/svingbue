owing with ball speed the way carry does, at whatever slope the current launch angle sets.","typicalRange":"7-iron ball ~105-125 mph; driver ~135-200 mph"},{"name":"Launch angle","role":"Two separate real effects, neither of which is a clamped 0.45x-1.35x multiplier. Below about 10 deg launch, carryLaunchEfficiency = sqrt(launchAngle/10) collapses apex toward zero (measured: a 90 mph, 5 deg loft, -3 deg attack swing launches at 3.90 deg, efficiency 0.6245, apex only 13.71 yd - even though its ball speed, 136.16 mph, is HIGHER than the 7-iron default's 122.56). Above 10 deg, efficiency is fully 1 and launch angle only nudges the ball-speed coefficient upward (0.13006 + 0.007999*launchAngle) - a real but much milder lever than ball speed's raw linear pull.","typicalRange":"7-iron ~14-18 deg; driver ~9-13 deg"},{"name":"Dynamic loft","role":"The practical control behind launch angle and, through smash factor, behind ball speed too. It is the club-selection lever that moves both real apex inputs at once.","typicalRange":"7-iron ~28-32 deg; driver ~9-13 deg (modern low-spin fitting)"},{"name":"Attack angle","role":"Moves launch angle a little and moves ball speed a little (via spin loft's small smash-factor discount) - both channels are real but modest next to loft. In the diagram, changing attack angle alone confounds ball speed and launch angle together, so isolating its effect on apex from slider moves alone is misleading; the clean partials come from the formula, not from a single slider drag.","typicalRange":"iron -4 to -2 deg (down); driver 0 to +5 deg (up)"},{"name":"apexLaunchFactor (a real engine variable, different math than it sounds)","role":"The engine does compute a value literally named apexLaunchFactor (impact-flight.js line 263) - but it is an unclamped diagnostic ratio, apex / apexBallSpeedTerm = 1 + 0.061507*launchAngle, that keeps growing with launch angle rather than sitting in a fixed band. Measured across this diagram's own sliders: 1.352 at the flattest corner (60 mph, 8 deg loft, -8 deg attack -> 5.73 deg launch), 1.946 at the 7-iron default's 15.38 deg launch, and 3.769 at the steepest corner (130 mph, 60 deg loft, +6 deg attack -> 45.02 deg launch). It never caps.","typicalRange":"1.35x at this diagram's flattest settings up to 3.77x at its steepest"},{"name":"Altitude / air density (EST, app layer)","role":"Not modeled inside solveFlight() - it is a post-solve multiplier applied in the academy UI, the same carryEnvMult used for carry (apexFinal = apex * carryEnvMult). The altitude slider steps in 100 ft, so Denver's 5,280 ft is not a reachable stop - 5,300 ft is the nearest. At 5,300 ft with the default 15C and 50% humidity, densityRatio = 0.8410 * 1.0000 * 0.9995 = 0.840580 and carryEnvMult = 1 + 0.70*(1 - 0.840580) = 1.1116, so the real 31.02 yd default-7-iron apex is drawn at 34.48 yd (+11.2%). Note humidity barely moves this: fHum = 1 - 0.001*(hum/100), which at 50% is 0.9995, a 0.05% effect - altitude does essentially all the work.","typicalRange":"sea level baseline; Denver-height slider stop (5,300 ft) ~+11% on both carry and apex in the app's model"},{"name":"Backspin (parallel, not a direct input)","role":"solveFlight()'s apex formula reads only ballSpeed and launchAngle - never backspin. Apex and backspin move together because they share upstream levers (spin loft, ball speed), not because one causes the other in the code.","typicalRange":"7-iron ~6,500-7,500 rpm; driver ~2,200-2,900 rpm"}],"howTheyConnect":"Apex is computed from exactly two upstream numbers - ball speed and launch angle - through apex = ballSpeed * carryLaunchEfficiency * (0.13006 + 0.007999*launchAngle). This is a plain linear-in-ball-speed formula, not a saturating one: at a fixed launch angle, apex tracks ball speed with a constant slope all the way up, which is why doubling club speed from 60 to 120 mph on the same loft/attack doubles apex exactly (measured 20.68 -> 41.36 yd, a clean 2.00x alongside ball speed's own clean 2.00x). Launch angle's real job is split in two. Below 10 deg it is a cutoff: carryLaunchEfficiency = sqrt(clamp(launchAngle/10, 0, 1)) drags apex toward zero for very low, driven trajectories - the same guard the Carry lesson's own formula uses, reused here rather than invented separately. Above 10 deg that guard is fully open (efficiency = 1) and launch angle's only remaining job is a mild linear nudge to the ball-speed coefficient (from a floor of 0.13006 up by 0.007999 per degree of launch) - real, but far from the dominant lever. The engine does expose a value named apexLaunchFactor (source line 263), and the name is genuine, but it is an unclamped diagnostic ratio - apex divided by the ball-speed-only term - that keeps climbing with launch angle (1 + 0.061507*launchAngle: 1.352 at this diagram's flattest corner, 1.946 for the 7-iron default's 15.38 deg launch, 3.769 at its steepest corner) rather than sitting inside any fixed band. Finally, and most importantly for how a user should read the diagram: apex feeds forward into nothing. landingApexTerm and landingLaunchTerm are both hardcoded to 0 inside solveFlight() (source-verified at lines 441-442), so landing angle is decided entirely by vertical spin loft - measured directly: raising club speed from 90 to 130 mph on the same 7-iron loft/attack nearly doubles apex (31.02 -> 44.81 yd) while landingAngle and rollFrac stay bit-for-bit identical across both runs. Apex correlates with a taller-looking shot on the diagram, but it does not cause a steeper landing in this engine - that is a separate lesson (Landing Angle) driven by a completely different input. In the academy UI (outside solveFlight itself), altitude/wind/temperature/humidity apply one shared EST multiplier, apexFinal = apex * carryEnvMult, identical to the one already used for carry - a documented simplification, and one where altitude does nearly all the work (humidity's fHum is only 0.9995 at the default 50%).","hierarchy":[{"driver":"Ball speed","weight":"Dominant and unbounded - apex scales exactly linearly with ball speed at fixed launch angle. Measured on a 7-iron-style sweep (club speed 80/90/100/110/120 mph -> ball speed 108.94/122.56/136.18/149.80/163.41 mph): apex runs 27.57/31.02/34.47/37.91/41.36 yd, a full +50% across the sweep, tracking ball speed's own +50% exactly.","why":"The formula has no ceiling constant and no exponential saturation term - apex = ballSpeed * carryLaunchEfficiency * (0.13006 + 0.007999*launchAngle) is linear in ballSpeed once launch angle (and therefore carryLaunchEfficiency and the coefficient) is fixed, so there is nothing in the math to flatten the climb at higher speed."},{"driver":"Launch angle, mainly through the sub-10-degree cutoff","weight":"The steepest real swing comes from very low launch angles, where carryLaunchEfficiency collapses toward zero - measured: at 3.90 deg launch (a low-loft, downward-attack test swing) efficiency is only 0.6245 and apex is 13.71 yd despite a ball speed of 136.16 mph, well above the 7-iron default's 122.56. Above 10 deg the lever is much milder, moving the ball-speed coefficient from about 0.13 toward 0.13 + 0.008*launch.","why":"carryLaunchEfficiency = sqrt(clamp(launchAngle/10, 0, 1)) is a hard, engine-verified guard against granting airborne-shot apex to a shot that barely gets off the ground; above the 10 deg threshold, the guard is fully open and launch angle only nudges a coefficient, it does not rescale the whole result."},{"driver":"Dynamic loft and attack angle (the raw levers behind ball speed and launch)","weight":"Indirect - they set launch angle and (via smash factor) ball speed, so their effect on apex runs entirely through the two terms above.","why":"These are the sliders a user actually touches in the diagram; loft and attack do not appear in the apex formula directly."},{"driver":"Altitude / air density (EST air layer)","weight":"App-level, not engine-level - the 5,300 ft altitude setting (the nearest slider stop to Denver's 5,280 ft; 15C, 50% humidity) gives carryEnvMult 1.1116, so the real 31.02-yd default 7-iron apex is drawn at 34.48 yd (+11.2%).","why":"This is the identical carryEnvMult already used for carry (apexFinal = apex * carryEnvMult), and inside it altitude dominates: fAlt drops to 0.8410 at 5,300 ft while fHum is only 0.9995 at 50% humidity."},{"driver":"Backspin","weight":"Zero - not a direct lever at all. solveFlight()'s apex formula never reads the backspin value.","why":"Backspin and apex are parallel outputs of the same upstream chain (spin loft, ball speed), not cause-and-effect in the code - they correlate because they share inputs, not because either computes the other."}],"misconceptions":["\"Apex is a saturating, diminishing-returns function of ball speed, like carry.\" False in this engine - measured directly, doubling club speed from 60 to 120 mph (same loft/attack) exactly doubles both ball speed and apex (81.71->163.41 mph, 20.68->41.36 yd, both x2.00). The formula has no ceiling and no exponential term; it is plain linear scaling.","\"Launch angle scales apex by a clamped 0.45x-1.35x factor.\" False as a closed form - the engine's real apexLaunchFactor (impact-flight.js line 263) is an unclamped ratio, 1 + 0.061507*launchAngle, that keeps growing with launch angle rather than sitting in a fixed band (measured 1.352 at this diagram's flattest corner, 1.946 at the 7-iron default's 15.38 deg launch, 3.769 at its steepest corner).","\"A low, driven shot loses apex mainly because ball speed is lower.\" Backwards in this engine - low loft usually RAISES ball speed (less spin loft, higher smash), and the launch-angle cutoff still crushes apex. Measured: a 90 mph, 5 deg loft, -3 deg attack swing makes 136.16 mph of ball speed (more than the 7-iron default's 122.56) but launches at 3.90 deg, so carryLaunchEfficiency = sqrt(3.90/10) = 0.6245 and apex lands at just 13.71 yd against the 7-iron's 31.02.","\"More backspin directly makes the ball climb higher, in this app.\" Not in the code - solveFlight()'s apex formula takes only ballSpeed and launchAngle as inputs; backspin is a separate, parallel output of the same upstream levers (spin loft, ball speed).","\"Humidity is what thins the air and adds height at altitude.\" Not in this app's air layer - fHum = 1 - 0.001*(hum/100) is 0.9995 at the default 50%, a 0.05% nudge, while fAlt falls to 0.8410 at the 5,300 ft slider stop (Denver height, rounded to the slider's 100 ft step). Altitude does essentially all of the +11.2% the diagram shows.","\"Apex is just a spectator number - only carry/total distance matters.\" This is actually TRUE in the current engine, confirmed by direct measurement: raising club speed from 90 to 130 mph on the same 7-iron nearly doubles apex (31.02 -> 44.81 yd) while landingAngle and rollFrac come back bit-for-bit identical (50.7899...deg / 0.031315... both runs), and total changes only because carry changed, not because apex fed back into it. landingApexTerm and landingLaunchTerm are hardcoded to 0 in the source. Apex is computed and displayed, but nothing downstream in this engine reads it."],"wolframChecks":["Engine formula, verified against live solveFlight() output: apex = ballSpeed * sqrt(clamp(launchAngle/10,0,1)) * (0.1300557732 + 0.0079993922*launchAngle). Default 7-iron (90 mph club speed, 30 deg loft, -3 deg attack) -> ball speed 122.561 mph, launch 15.383 deg -> 122.561 * 1 * (0.1300558 + 0.0079994*15.383) = 31.021 yd, matching solveFlight()'s live output.","Club-speed sweep at fixed 7-iron loft/attack (30 deg / -3 deg): 80/90/100/110/120 mph club speed -> ball speed 108.94/122.56/136.18/149.80/163.41 mph -> apex 27.57/31.02/34.47/37.91/41.36 yd, a clean +50.0% across the sweep, tracking ball speed's own +50.0% exactly - the opposite of a saturating curve.","Doubling test: club speed 60 -> 120 mph, same loft/attack -> ball speed 81.71 -> 163.41 mph (exactly x2.00), apex 20.68 -> 41.36 yd (exactly x2.00) - direct proof the formula is linear in ball speed, not exponential-saturating.","apexLaunchFactor = apex / apexBallSpeedTerm = 1 + 0.061507*launchAngle, measured live: 1.3523 at 5.73 deg launch (this diagram's flattest corner: 60 mph, 8 deg loft, -8 deg attack), 1.9462 at the 7-iron default's 15.383 deg launch, 3.7689 at 45.02 deg launch (its steepest corner: 130 mph, 60 deg loft, +6 deg attack). Unclamped and still climbing at the top of the slider range.","Low-launch cutoff, measured: a 90 mph, 5 deg loft, -3 deg attack swing launches at 3.90 deg -> carryLaunchEfficiency = sqrt(3.90/10) = 0.6245 -> apex only 13.71 yd, even though that swing's ball speed is 136.16 mph, higher than the 122.56 mph 7-iron default that reaches 31.02 yd. The sqrt cutoff, not a lack of speed, is what flattens driven shots.","Diagram slider extremes, measured live: min corner (60 mph club speed, 8 deg loft, -8 deg attack) -> ball speed 88.40 mph, launch 5.73 deg, carryLaunchEfficiency 0.7568, apex 11.77 yd; max corner (130 mph club speed, 60 deg loft, +6 deg attack) -> ball speed 152.38 mph, launch 45.02 deg, efficiency 1, apex 74.69 yd. Note the max corner does NOT have the highest ball speed on the board - 130 mph at 8 deg loft, -8 deg attack makes 191.53 mph of ball speed but only 25.50 yd of apex, because its 5.73 deg launch is stuck behind the same cutoff.","Denver-height slider stop (5,300 ft - the slider's step is 100 ft, so 5,280 is not selectable - at 15C, 50% humidity) via the app's shared air multiplier (academy.html: fAlt = 1 - 0.030*(alt/1000), fTemp = 288.15/(273.15+C), fHum = 1 - 0.001*(hum/100)): fAlt = 0.8410, fTemp = 1.0000, fHum = 0.9995 -> densityRatio = 0.840580, carryEnvMult = 1 + 0.70*(1 - 0.840580) = 1.111594 -> apexFinal = 31.021 * 1.111594 = 34.483 yd (+11.2%).","Downstream-effect test, measured live: club speed 90 mph -> apex 31.021 yd, landing 50.789928...deg, roll fraction 0.03131510...; club speed 130 mph -> apex 44.808 yd, landing 50.789928...deg, roll fraction 0.03131510... (bit-for-bit identical to the 90 mph run). Nearly doubling apex changes nothing about landing angle or roll fraction - confirming landingApexTerm and landingLaunchTerm are hardcoded to 0 in the source, not merely small.","30 yd = 90 ft; a rough gut-check on typical apex magnitude only, not an engine claim: a free-falling object dropped from 90 ft with no air resistance takes sqrt(2*27.4/9.81) = 2.36 s to hit the ground - a lower bound on hang time, since real flight (up and down, with lift and drag) takes longer."],"quiz":[{"q":"In the engine, is apex a saturating (diminishing-returns) function of ball speed, the way carry is?","options":["Yes, it approaches a hard 44-yard ceiling","No - measured directly, apex scales exactly linearly with ball speed at a fixed launch angle (doubling ball speed doubles apex)","Yes, but only above 150 mph ball speed","Apex does not depend on ball speed at all"],"answerIndex":1,"explanation":"Measured: doubling club speed from 60 to 120 mph on the same loft/attack exactly doubles both ball speed (81.71->163.41 mph) and apex (20.68->41.36 yd). The formula apex = ballSpeed * carryLaunchEfficiency * (0.13006 + 0.007999*launchAngle) is linear in ball speed once launch angle is fixed - there is no ceiling constant in the code."},{"q":"What actually crushes apex toward zero on a very low, driven trajectory?","options":["A clamped launch-angle multiplier running from 0.45x to 1.35x","A sqrt-shaped cutoff (carryLaunchEfficiency) that only fully opens above 10 deg launch angle","Ball speed collapsing on low-loft strikes","Nothing - apex cannot go below about 15 yards"],"answerIndex":1,"explanation":"carryLaunchEfficiency = sqrt(clamp(launchAngle/10, 0, 1)) - the same guard the Carry lesson's formula uses - is what damps apex at low launch. Measured: a 90 mph, 5 deg loft, -3 deg attack swing launches at 3.90 deg, efficiency 0.6245, apex 13.71 yd - and its ball speed is actually HIGHER (136.16 mph) than the 7-iron default's 122.56, so speed is not the culprit."},{"q":"The engine really does compute a variable named apexLaunchFactor (impact-flight.js line 263). What is it?","options":["A clamped closed form running from 0.45x to 1.35x","An unclamped diagnostic ratio (apex / apexBallSpeedTerm) that keeps growing with launch angle, reaching 3.77x at this diagram's steepest setting","The same thing as carryLaunchEfficiency","A constant, always equal to 1"],"answerIndex":1,"explanation":"Measured: apexLaunchFactor is 1.3523 at the diagram's flattest corner (5.73 deg launch), 1.9462 at the 7-iron default (15.38 deg), and 3.7689 at the steepest corner (45.02 deg). It is exactly 1 + 0.061507*launchAngle and it never clamps."},{"q":"Does a taller apex compute a steeper landing angle in this engine?","options":["Yes, one degree of landing angle per extra yard of apex","No - landingApexTerm and landingLaunchTerm are hardcoded to 0; landing angle depends only on vertical spin loft","Yes, but only for drivers","Apex and landing angle are the same number"],"answerIndex":1,"explanation":"Measured directly: raising club speed from 90 to 130 mph on the same 7-iron loft/attack nearly doubles apex (31.02->44.81 yd) while landingAngle and rollFrac come back bit-for-bit identical across both runs. The source hardcodes landingApexTerm = 0 and landingLaunchTerm = 0 - apex has zero downstream effect in this engine."},{"q":"\"Apex is just a spectator number - only carry/total distance matters.\" Is that true in the current Flightglass engine?","options":["False - apex directly sets landing angle","True - apex is computed and displayed, but nothing else in solveFlight() reads it; landing angle and total distance are unaffected by it","False - apex directly sets total distance","True, but only because the engine has a bug that will be fixed"],"answerIndex":1,"explanation":"Measured: changing club speed changes apex substantially (31.02->44.81 yd) with zero effect on landingAngle or rollFrac (and total only moves because carry itself moved, not because of apex). In this engine, apex really is presentational only once computed."}],"realWorld":{"tourBenchmarks":["Commonly published TrackMan PGA Tour average figures (driver through wedge): Driver ~167 mph ball speed, ~10.9 deg launch, ~2,700 rpm spin, apex ~32 yd, descent ~38 deg, carry ~275 yd.","7-iron tour average: ~120 mph ball speed, ~16.3 deg launch, ~7,100 rpm spin, apex ~32 yd, descent ~50 deg, carry ~172 yd - published apex lands close to the driver's despite a far slower ball.","Pitching wedge tour average: ~102 mph ball speed, ~24.2 deg launch, ~9,300 rpm spin, apex ~29 yd, descent ~54 deg, carry ~136 yd - the highest launch angle in the bag but not the highest published apex.","This engine's own default 7-iron computes 31.02 yd of apex - in the right neighbourhood of the ~32 yd tour figure. Note the engine does NOT reproduce the flat driver-vs-iron apex the published tables show: fed a tour-like driver (113 mph club speed, 13 deg loft, +4 deg attack -> 170.44 mph ball, 11.22 deg launch) it returns 37.47 yd, about 21% ABOVE its 7-iron. In the formula, ball speed's 39% advantage (170.44/122.56) beats the launch coefficient's 13% penalty (0.2198 vs 0.2531), and 1.391 * 0.868 = 1.208. A compact fit, not a full trajectory integration."],"scenarios":["A 'stinger' or low knockdown shot deliberately keeps launch angle under about 10 deg on purpose - in this engine that is exactly where carryLaunchEfficiency's sqrt cutoff lives, so a stinger's low apex comes from the same guard that protects a mis-hit grounder from getting phantom airborne height.","Push the diagram to 130 mph club speed with 8 deg loft and -8 deg attack and it makes the highest ball speed on the whole board, 191.53 mph - and only 25.50 yd of apex, less than the default 7-iron's 31.02. Its 5.73 deg launch sits under the cutoff, and no amount of speed buys the height back.","A mid-handicap golfer's low 'worm-burner' tee shot that never gets above head height is a launch-angle problem, not a swing-speed problem in this model - a shot launching under 10 deg loses most of its apex to the sqrt cutoff regardless of how fast the club was moving.","Because apex has zero downstream effect on landing angle or total distance in this engine, two very different-looking trajectories on the diagram (one towering, one modest) can share the exact same landing angle and rollout if their vertical spin loft is the same - a genuinely useful thing to notice while exploring the diagram."],"whatItMeansForYou":"In this engine, don't expect ball speed's effect on apex to taper off the way it does for carry - it's a straight line, so a faster swing keeps buying real height with no diminishing returns built into the apex formula. Below about a 10 deg launch angle, expect apex to fall off a cliff regardless of speed - that sqrt cutoff is the real reason low, driven shots stay low, and it can beat a 191 mph ball speed down to 25 yd of height. And when you're reading the diagram, remember that a taller apex on screen does not mean a steeper landing or a different rollout - those come entirely from the separate Landing Angle lesson's vertical-spin-loft formula, not from anything apex computes here."}}
  </script>
  <script type="application/json" id="lesson-landing-angle">{"parameter":"Landing Angle","oneLiner":"Landing angle is how steeply the ball is falling when it hits the ground - the difference between a shot that checks and stops near the pin and one that releases and rolls on.","whatItIs":"Landing angle (also called descent angle) is how steep the ball's flight path is relative to the ground at the instant it touches down - a shallow angle means the ball is still travelling mostly forward when it lands (so it releases and rolls), while a steep angle means it is falling almost straight down (so it lands soft and can even spin back). It isn't a number a golfer swings 'at' directly, and unlike a lot of the app's other outputs it doesn't come from a sum of independent terms - it comes from exactly one input, vertical spin loft (the vertical component of spin loft, which for a centered strike reduces to dynamic loft minus attack angle). In the app's engine, landingAngle = 52.8 - 41.5*exp(-|verticalSpinLoft|/10.9), clamped to a physically sane 32-60 window - a single saturating curve, not three additive nudges. More vertical spin loft always pushes landing steeper, but with strongly diminishing returns: the curve climbs fast down in driver territory and goes nearly flat once you're deep into wedge territory, which is exactly why a low, flat driver runs out down the fairway while a high, spinny wedge sits down on the green.","components":[{"name":"Vertical spin loft (dynamic loft minus attack angle)","role":"The only direct input the formula reads. landingAngle = 52.8 - 41.5*exp(-|verticalSpinLoft|/10.9): every extra degree of vertical spin loft pushes landing steeper, but by a shrinking amount as spin loft grows (engine-measured: about +0.18 degrees of landing angle per +1 degree of vertical spin loft near the 7-iron baseline of 33 degrees, about +1.45 degrees per degree down near a driver-like 10.5 degrees, and under +0.02 degrees per degree once you're up around a 64-degree wedge).","typicalRange":"7-iron ~30-35°, driver ~5-15°, wedge ~55-65°"},{"name":"Launch angle","role":"Not a direct input to landing angle - it moves together with vertical spin loft because both come from the same dynamic loft and attack angle, but it carries zero causal weight of its own. Changing launch angle without changing vertical spin loft (which is exactly what a club-speed change does) leaves landing angle completely unchanged (engine-measured: 0.00 degrees of change).","typicalRange":"driver ~9-13°, 7-iron ~16-19°, wedge ~24-34°"},{"name":"Apex (peak height)","role":"Not a direct input either, despite looking like the steepest lever in an older reading of this model. Apex rises a lot with ball/club speed, but landing angle does not - the formula never reads apex, ball speed or club speed at all (engine-measured: +20 mph of club speed on the same 7-iron changes apex by about +6.9 yd and backspin by over 1,400 rpm, while landing angle stays at 50.79 degrees to the decimal).","typicalRange":"~25-40 yd depending on club and speed"},{"name":"Dynamic loft (the real-world lever)","role":"The dominant practical control, because it is one of only two quantities the engine reads for landing angle (the other is attack angle) - it feeds vertical spin loft directly. Engine-measured: about +0.18 degrees of landing steepening per +1 degree of dynamic loft at the 7-iron baseline, but the same +1 degree is worth roughly +1.45 degrees down near a driver's low loft and worth barely +0.01 degrees once you're up in wedge territory - the curve saturates.","typicalRange":"wedge ~50-60°, 7-iron ~28-32°, driver ~9-13°"},{"name":"Ball speed / club speed","role":"Zero effect, full stop. Ball and club speed change carry and apex a great deal, but the landing-angle formula never reads either of them - only vertical spin loft. Engine-measured: +20 mph of club speed on an unchanged 7-iron loft/attack leaves landing angle unchanged (50.79 degrees at both 90 and 110 mph).","typicalRange":"7-iron ball ~105-125 mph, driver ~150-185 mph - irrelevant to landing angle either way"},{"name":"Attack angle","role":"A real, first-order lever - not a wash. Attack angle subtracts directly from dynamic loft inside vertical spin loft, so a more negative (steeper down) attack angle steepens landing at essentially the same rate dynamic loft does: about -0.18 degrees of landing angle per +1 degree of attack angle at the 7-iron baseline (engine-measured), i.e. roughly +0.18 degrees steeper for every degree MORE downward you swing. Over a full -3 to +3 degree swing that is about a 1.5-degree flattening, not a cancellation.","typicalRange":"iron -4 to -2° (down), driver 0 to +5° (up)"},{"name":"Face angle & club path","role":"Not involved at all - there is no edge from face-angle or club-path to landing-angle in the app's dependency graph. They set start direction and curve/offline instead, never how steeply the ball comes down.","typicalRange":"n/a - zero weight on landing angle"}],"howTheyConnect":"Landing angle is the last thing the flight-solve computes, and it is a single saturating exponential in one input - vertical spin loft, the signed vertical component of spin loft, which reduces to dynamic loft minus attack angle for a centered strike: landingAngle = 52.8 - 41.5*exp(-|verticalSpinLoft|/10.9), then clamped to a physically sane 32-60 window (source-verified: the app's plugged-in default 7-iron - clubSpeed 90 mph, attack angle -3 degrees, dynamic loft 30 degrees, giving verticalSpinLoft 33.00 degrees - computes to 50.79 degrees, matching solveFlight()'s live output exactly). 52.8 degrees is the curve's ceiling as vertical spin loft grows without bound (approached but never quite reached before the clamp's 60-degree cap takes over at extreme wedge lofts), and 10.9 degrees is the decay scale that sets how fast the curve climbs toward that ceiling. Physically, more vertical spin loft means a more glancing strike on a curvier, higher-lift path, which lands steeper - but each extra degree buys progressively less as the ball gets closer to the steepest descent this model allows. Only two swing inputs reach landing angle at all: dynamic loft (steepens it) and attack angle (a MORE downward attack angle also steepens it, at the same rate, because verticalSpinLoft = dynamicLoft - attackAngle) - and both are far more sensitive down in driver territory (about +1.45 degrees per degree near a 10.5-degree vertical spin loft) than up in wedge territory (about +0.01 degrees per degree near 64 degrees), where the curve has already nearly saturated. Club speed, ball speed, launch angle, apex, face angle and club path all have ZERO direct effect on landing angle in this engine, even though several of them (apex and launch angle especially) move in step with spin loft in a normal swing and can look like they are driving it. Once the ball lands, the geometry keeps mattering: at a 50.5 degree landing the ratio of vertical to horizontal velocity (tan) is about 1.21, versus about 0.78 at 38 degrees - roughly 55% steeper into the ground - and the vertical share of total speed (sin) is about 25% higher (0.77 vs 0.62, both Wolfram-verified). That is mechanically why a steep landing 'checks' (more energy goes into the bounce, less survives as forward roll) while a shallow one releases and runs, and it is exactly what the engine's own roll fraction encodes downstream: rollFrac = clamp(0.04 - (landingAngle-45)*0.0015, 0.012, 0.055), i.e. about 5.5% of carry rolls out at the 32 degree clamp floor versus only about 1.75% at the 60 degree ceiling.","hierarchy":[{"driver":"Vertical spin loft (dynamic loft minus attack angle) - the only causal input","weight":"The sole channel: landingAngle = 52.8 - 41.5*exp(-|verticalSpinLoft|/10.9). Sensitivity is steep near the driver end (about +1.45 degrees per degree near a 10.5-degree vertical spin loft, engine-measured) and nearly flat near the wedge end (about +0.01 degrees per degree near 64 degrees), which is how this single curve walks the model all the way from its 32-degree floor to its 60-degree ceiling.","why":"Every other swing input - ball speed, club speed, launch angle, apex, face angle, club path - has zero edge into landing angle in this engine. Vertical spin loft is not merely the dominant lever, it is the only one."},{"driver":"Dynamic loft","weight":"About +0.18 degrees of landing angle per +1 degree of dynamic loft at the 7-iron baseline (engine-measured partial), rising toward +1.45 degrees per degree near driver-region spin lofts and fading toward +0.01 degrees per degree near wedge-region spin lofts.","why":"Dynamic loft feeds vertical spin loft directly and is the practical club-selection/delivery lever a golfer actually controls."},{"driver":"Attack angle","weight":"The same magnitude and curve-position-dependence as dynamic loft, opposite in sign: about -0.18 degrees of landing angle per +1 degree of attack angle at the 7-iron baseline (engine-measured), because verticalSpinLoft = dynamicLoft - attackAngle - a more downward attack steepens landing, a more upward one flattens it.","why":"Attack angle sits inside the exact same single term as dynamic loft with a flipped sign. It is a real, first-order lever on landing angle, not the near-cancellation an earlier reading of this model claimed."},{"driver":"Ball speed, club speed, launch angle, apex, face angle, club path, and the environment nodes (altitude/wind/temperature)","weight":"Zero, every one of them - none appears in the landing-angle formula (engine-measured: +20 mph of club speed changes apex by yards and backspin by over 1,000 rpm while landing angle moves by exactly 0.00 degrees).","why":"These all move together with vertical spin loft in a normal golf swing, which makes them look causal, but the engine only ever reads verticalSpinLoft. Face angle and club path set start direction and curve instead; wind, altitude and temperature only reach carry, apex and curve."}],"misconceptions":["\"Landing angle is basically the same thing as launch angle.\" No - launch angle is the take-off angle at impact; landing angle is the descent angle at the end of the flight, and it is steeper than launch angle for almost every real shot (baseline 7-iron: 15.38° launch vs 50.79° landing) because gravity keeps bending the path downward the whole way.","\"You create a steep landing angle by hitting down harder (more negative attack angle).\" This one is actually true in the engine, and more strongly than an earlier reading of this model suggested: verticalSpinLoft = dynamicLoft - attackAngle, so a more negative attack angle directly raises vertical spin loft and steepens landing - about the same rate as adding dynamic loft (roughly 0.18°/° at the 7-iron baseline, not a near-zero wash). What attack angle does NOT do is reach landing angle through ball speed, apex or launch angle - those channels simply don't exist in this engine.","\"More backspin always means a steeper landing.\" Backspin and landing angle share an upstream driver (spin loft) but are computed independently - a shot can carry huge backspin with a middling apex (a thin, low wedge shot) and land far shallower than a high, soft-landing 3-wood with much less spin.","\"Curve (draw/fade/slice/hook) affects how steeply a ball comes down.\" It doesn't, in this model or in reality to a meaningful degree - face angle and club path (which create curve) have zero edges into landing angle in the app's dependency graph. Curve changes where the ball ends up sideways, not how steeply it falls.","\"A driver lands shallow because drivers are just built differently.\" It lands shallow because of what the swing delivers to it - low dynamic loft and a level-to-upward attack angle, which together produce a low vertical spin loft. Tee a driver up and swing steeply down into it and, numerically, vertical spin loft (and so landing angle) would climb - just also lose a lot of the driver's usual distance advantage.","\"Landing angle only matters for wedge shots into greens.\" It also explains why a low punch shot under branches releases 20-30 yards after landing, why links approaches run out on firm turf, and why a full driver keeps rolling down the fairway - it is the single number behind 'how much does this shot run out after it lands' for every club, not just scoring clubs."],"wolframChecks":["tan(38°) = 0.7813, tan(50.5°) = 1.2131 (Wolfram) -> ratio 1.2131/0.7813 = 1.553, so a 7-iron's ~50.5° tour-average landing carries about 55% more vertical-to-horizontal velocity ratio than a driver's ~38° landing - the trig reason steep shots check and shallow ones release.","sin(38°) = 0.6157, sin(50.5°) = 0.7716 (Wolfram) -> ratio 0.7716/0.6157 = 1.253, confirming a steeper landing puts about 25% more of the ball's total speed into the vertical, into-the-ground direction.","Idealized no-drag free-fall speed from a 32-yd apex: 32 yd = 29.26 m (Wolfram), v = sqrt(2 x 9.8 m/s^2 x 29 m) = 23.8 m/s = 53.3 mph (Wolfram) - roughly highway speed, giving a feel for how hard a steeply-falling ball is actually moving before spin and bounce take over.","167 mph -> 74.66 m/s, 120 mph -> 53.64 m/s, 102 mph -> 45.6 m/s (Wolfram unit conversions) - the driver/7-iron/wedge ball-speed inputs behind the tour landing-angle benchmarks.","Engine formula check, computed directly from solveFlight(): 52.8 - 41.5*exp(-33/10.9) = 50.79°, matching the default 7-iron's live output exactly (clubSpeed 90 mph, attack -3°, dynamic loft 30° -> verticalSpinLoft 33.00° -> landingAngle 50.79°).","Engine partials around the default 7-iron (90 mph, 30° loft, -3° attack), computed directly from solveFlight(): +1° dynamic loft -> landing angle +0.18°; +1 mph club speed -> +0.00° (zero edge into landing angle); +1° attack angle -> -0.18° (a real, first-order effect, not a wash) - dynamic loft and attack angle move the same single vertical-spin-loft input with opposite sign.","Engine roll-fraction range, directly from solveFlight(): rollFrac = clamp(0.04 - (landingAngle-45)*0.0015, 0.012, 0.055) -> 5.5% of carry at the 32° clamp floor (driver-like) down to 1.75% at the 60° clamp ceiling (wedge-like) - the mechanism linking landing angle to how far a shot releases after it lands."],"quiz":[{"q":"In the app's engine, landing angle is driven by exactly one input. Which one?","options":["Vertical spin loft","Launch angle","Apex (peak height)","Ball speed"],"answerIndex":0,"explanation":"landingAngle = 52.8 - 41.5*exp(-|verticalSpinLoft|/10.9), then clamped to 32-60°. One driver, no others: the engine exposes landingLaunchTerm and landingApexTerm as exactly 0, and ball speed never enters. Launch, apex and speed all move together with spin loft in a real shot, which is why they look like causes - but change spin loft alone and the landing angle moves; hold it and nothing else touches it. In real golf all three do matter, so treat this as a model simplification worth knowing rather than a fact about ball flight."},{"q":"Two shots share the same dynamic loft and attack angle, but Shot A has a taller apex than Shot B (say, from faster club speed). Which lands steeper?","options":["Shot A, the taller one","Shot B, the shorter one","They land at exactly the same angle","Apex has no effect on landing angle"],"answerIndex":2,"explanation":"Landing angle is built purely from vertical spin loft (dynamic loft minus attack angle) - apex never enters the formula. Engine-measured: raising club speed from 90 to 110 mph on the same 7-iron loft/attack raises apex from 31.0 to 37.9 yd, but landing angle does not move at all (50.79° at both speeds). A taller apex changes carry and hang time, not descent angle."},{"q":"You increase attack angle from -3° to +3° on the same 7-iron, same loft, same speed. What happens to landing angle?","options":["It steepens sharply, by several degrees","It snaps straight to the 60° ceiling","It flattens moderately, by roughly a degree and a half","It stays exactly the same"],"answerIndex":2,"explanation":"verticalSpinLoft = dynamicLoft - attackAngle, so raising attack angle from -3° to +3° lowers vertical spin loft from 33° to 27° and flattens landing from 50.79° to 49.31° - about 1.5° flatter (engine-measured, solveFlight()). That's a real, moderate effect, not the near-total cancellation an earlier reading of this model claimed, and not a swing to either extreme."},{"q":"Real tour data shows landing angles of roughly 34-40° for a driver and 48-52° for a 7-iron. What mainly explains that ~15° gap?","options":["Wind resistance differs by club","The driver's much lower dynamic loft and flatter attack angle give it a far lower vertical spin loft than the 7-iron","Drivers carry more backspin than irons","Landing angle is essentially random and unrelated to club choice"],"answerIndex":1,"explanation":"A driver's low loft (~10-12°) and near-level-to-upward attack angle produce a vertical spin loft of roughly 7-10°, versus roughly 30-35° for a 7-iron's downward strike into more loft - and landing angle rises with vertical spin loft through the engine's single saturating curve. That's the mechanism behind 'the driver runs out, the 7-iron sits down' - ball speed and apex play no direct part in it."},{"q":"A steep landing (wedge, ~50-55°) tends to check and stop; a shallow landing (driver, ~38°) tends to release and roll. Physically, why?","options":["Steep shots simply carry less backspin","Steep shots put more of the ball's velocity into the vertical, into-the-ground direction relative to the horizontal, leaving less forward speed to survive the bounce","Shallow shots are always slower overall","Landing angle and rollout are unrelated - it's a myth"],"answerIndex":1,"explanation":"At 50.5° the vertical-to-horizontal velocity ratio (tan) is about 1.21 versus about 0.78 at 38° - roughly 55% more 'straight down' relative to 'forward' - so less forward speed survives the landing. The engine encodes exactly this: its roll fraction shrinks from about 5.5% of carry at the 32° clamp floor to about 1.75% at the 60° ceiling."}],"realWorld":{"tourBenchmarks":["PGA Tour average descent (landing) angles by club, widely published TrackMan University tour-average ranges: driver ~34-40°, 6/7-iron ~48-52°, pitching/short wedges ~50-56° or steeper - roughly a 15-20° spread from the bottom of the bag to the top.","Flightglass's own default 7-iron (30° loft, -3° attack, 90 mph club speed) computes to 50.79° landing (solveFlight()) - squarely inside the real ~48-52° tour 7-iron range, even though the file itself flags the model as illustrative, not lab-calibrated.","A 50.5° landing carries about 55% more vertical-to-horizontal velocity ratio than a 38° landing (tan 50.5° = 1.213 vs tan 38° = 0.781, Wolfram-verified) and about 25% more of its total speed pointed straight down (sin 50.5° = 0.772 vs sin 38° = 0.616) - the trig behind why a wedge 'sits down' and a driver 'runs out.'","Idealized (no-drag) free-fall from a 32-yd (29.26 m) apex hits the ground at about 23.8 m/s, roughly 53 mph (Wolfram) - close to highway speed - which is why a steeply-landing ball can plug in a soft bunker or leave a real pitch mark on a green.","Ball speeds behind these numbers: driver ~167 mph = 74.7 m/s, 7-iron ~120 mph = 53.6 m/s, wedge ~102 mph = 45.6 m/s (Wolfram unit conversions) - context only, since none of them feed the landing-angle formula directly."],"scenarios":["A tour pro spins a wedge back off a firm green - the steep landing angle (high vertical spin loft from a lofted, downward strike) means most of the impact energy goes into the bounce and the spin can 'grab,' rather than into forward roll.","A links-style knock-down 2-iron or 'stinger' flown low under the wind deliberately keeps dynamic loft down and attack angle level to upward; it lands shallow on purpose and releases 20-30 yards after touching down - the shallow landing angle is the point of the shot, not a mishit.","On firm, fast links turf (British Open-style setups, a drought-firm municipal course) a mid-iron approach that would check on a soft green instead skips and runs well past the flag - the shot's landing angle didn't change, the ground just couldn't absorb it.","An amateur's accidental 'balloon' with a hybrid or 3-wood surprises everyone by stopping dead on the green - not skill, but a steep, handsy strike that pushed dynamic loft and a downward attack angle up together, raising vertical spin loft and steepening the landing at the direct cost of carry distance (the same ballooning covered in the Carry lesson).","Wind, altitude and temperature in this app reshape how far a shot carries and drifts offline, but none of them touch landing angle - only the club you hit and how you deliver it (loft, attack) decide whether a shot checks or releases; ball speed changes distance, not descent angle."],"whatItMeansForYou":"If you need a shot to stop near a tucked pin, the fix is a genuinely different delivery - more loft, which raises vertical spin loft directly - not just swinging harder or faster; club/ball speed alone never moves landing angle at all. If you need a shot to release and run (a links approach, a punch under branches, chasing extra roll on a par-5 second), take less loft, and know that swinging more level or upward through impact genuinely helps too - attack angle is a real lever here, not a wash."}}</script>
  <script type="application/json" id="lesson-total">
{"parameter":"Total Distance","oneLiner":"Total distance is how far the ball travels overall -- carry (the flight) plus roll (the bounce-and-run after it lands) -- and because this engine's roll is only ~2.8-5.5% of carry, whatever wins the carry battle (ball speed) wins the total-distance battle too.","whatItIs":"Total distance is the full length of the shot as it would show up on a GPS watch or a course yardage marker: how far the ball travelled through the air (carry) plus how far it continued to bounce and roll along the ground once it landed (roll), up to the point it finally stops. It's the number golfers usually mean when they brag about a \"280-yard drive\" -- but it's really two very different distances stacked together. Carry is almost the whole story: it is set by ball speed (club speed x smash factor) through the exact same ball-speed fit used in the Carry lesson, and nothing else in this app moves the needle nearly as much -- for the default 7-iron, carry is 96.96% of total. Roll is the small top-up on top: Flightglass's engine adds it as total = carry + carry x rollFrac, where rollFrac = clamp(0.04 - (landingAngle - 45) x 0.0015, 0.012, 0.055). The coded clamp reads 1.2%-5.5%, but the landing-angle model behind it saturates at 52.8 degrees, so the reachable roll fraction is only 2.83%-5.5% -- the 1.2% floor is dead code you can never hit. A shallow, driver-like landing angle rolls most; a steep, wedge-like landing angle rolls least, but never nothing. So total distance inherits everything the Carry lesson taught about ball speed, and adds exactly one new idea: the steepness of the landing determines how much extra ground the ball covers after it touches down.","components":[{"name":"Ball speed (via club speed x smash factor)","role":"The dominant input, inherited directly from Carry. Because roll never exceeds 5.5% of carry in this engine, whatever grows carry grows total by nearly the same absolute amount.","typicalRange":"7-iron ball ~95-163 mph across a 70-120 mph club-speed sweep at dl 30 / aa -3 (engine; smash held at 1.3618 by the fixed spin loft); tour driver ball ~167 mph; tour 7-iron ball ~120 mph"},{"name":"Carry","role":"The airborne leg and the vast majority of total distance -- the exact same carry the Carry lesson teaches, computed by the same solveFlight() ball-speed fit.","typicalRange":"app 7-iron ~125-259 yd across that club-speed sweep (engine); PGA Tour driver carry ~275 yd; PGA Tour 7-iron carry ~172 yd"},{"name":"Landing angle (via vertical spin loft)","role":"The one new lever for Total Distance: how steeply the ball is descending when it lands sets the roll fraction directly. Engine: landing = 52.8 - 41.5 x exp(-verticalSpinLoft / 10.9), then clamped to 32-60 degrees -- but the curve saturates at 52.8, so only the 32-degree floor can ever bind.","typicalRange":"driver-like ~32-43 deg (vertical spin loft ~6-16 deg); 7-iron-like ~50.2-51.6 deg (spin loft ~30-39 deg); wedge-like ~52.1-52.8 deg (spin loft 45 deg and up). Nothing in the engine lands steeper than 52.8 deg."},{"name":"Roll (roll-out)","role":"The small ground-distance top-up after the bounce. Engine: roll = carry x rollFrac, rollFrac = clamp(0.04-(landingAngle-45)x0.0015, 0.012, 0.055); reachable band 2.83%-5.5%.","typicalRange":"app default 7-iron 5.45 yd (3.13% of carry); app driver-regime (cs 113, dl 13, aa +4) 15.14 yd (the 5.5% ceiling); wedge-regime ~2.9 yd (2.83-2.9%, the practical floor); PGA Tour driver ~21-25 yd (~8-9% of total, above the app's ceiling)"},{"name":"Club / shot-type regime (driver vs iron vs wedge)","role":"The practical golfer-facing lever behind landing angle -- picking a club (and attack angle) sets the whole spin-loft-and-landing-angle regime at once.","typicalRange":"driver spin loft ~9-16 deg (rollFrac 5.5% down to 4.26%); 7-iron ~30-35 deg (3.23-3.08%); wedge ~45-55 deg (2.93-2.87%)"},{"name":"Face-to-path (open or closed face) -- costs total through speed, not roll","role":"Only the VERTICAL component of spin loft feeds the landing-angle model, so twisting the face open or shut leaves the roll fraction untouched while the wider 3D spin loft cuts smash and therefore carry. The whole loss shows up as lost carry.","typicalRange":"default 7-iron with path +10 / face -10: 3D spin loft 33.0 -> 38.1 deg, carry 174.00 -> 166.95 yd, total 179.45 -> 172.18 yd (-7.27), while landing angle stays 50.79 deg and rollFrac stays 0.03132 exactly"},{"name":"Environment (altitude / wind / temperature) -- carry-only in this app","role":"The EST post-solve air and wind layers scale the ESTIMATED carry (and apex) shown alongside the engine numbers. They deliberately do NOT rebuild Total: the Air Density lesson states the multiplier is 'applied equally to estimated Carry and Apex. Curve, Landing and Total remain unchanged', and the wind model returns only estimatedWindCarry. In the real world environment moves total through carry; in this app's readout it moves the carry estimate and leaves Total alone.","typicalRange":"EST layer: altitude ~+2.1% carry per 1000 ft; temperature ~+4 yd per +10 C on a 174 yd shot; headwind ~-1.1%/mph at 20 mph; tailwind ~+0.7%/mph"},{"name":"Turf firmness & moisture at landing -- not modeled","role":"Real-world roll depends heavily on how hard/dry the ground is; this app's roll term is turf-blind and always lands inside its reachable 2.83%-5.5% window regardless of course conditions -- a documented simplification, not a bug.","typicalRange":"firm/dry fairway or hardpan can push real roll well above the app's 5.5% ceiling; a wet fairway or a spin-back wedge shot can bring real roll to ~0% or negative, far below the app's 2.83% practical floor"}],"howTheyConnect":"Total distance is arithmetic layered on top of everything the Carry lesson already teaches: total = carry + roll, computed by the same solveFlight() call, not a separate model. Club speed times smash factor sets ball speed, and ball speed drives carry via the identical monotone fit used in Carry (0.9206 x ballSpeed + 0.004072 x ballSpeed^2) -- and because roll never exceeds 5.5% of carry in this engine, ball speed remains completely dominant for total too. The new piece unique to Total is roll: after the flight arc the ball lands at some landing angle, and that landing angle sets how much extra ground it covers. Geometrically this is trigonometry: at a shallow 32-degree landing angle the ball retains ~85% of its speed as a forward (horizontal) component (cos 32 = 0.848) and only ~28% of its kinetic energy is vertical (sin^2 32 = 0.281), so most of that speed keeps driving it along the ground after the bounce. At the engine's steepest reachable 52.8-degree landing only ~60% of the speed is forward (cos 52.8 = 0.605) and ~63% of the energy is vertical (sin^2 52.8 = 0.635), energy that gets absorbed or bounced up rather than out, so roll shrinks. Flightglass encodes this as rollFrac = clamp(0.04 - (landingAngle-45) x 0.0015, 0.012, 0.055): every degree the landing angle steepens past 45 trims the roll fraction by 0.15 percentage points, and every degree it flattens below 45 adds 0.15 points back. Two clamp facts matter and are easy to get wrong. First, the landing model is a saturating exponential, landing = 52.8 - 41.5 x exp(-verticalSpinLoft/10.9), whose ceiling is 52.8 degrees -- so the coded 60-degree landing clamp and the 1.2% roll floor are unreachable: the real bands are 32-52.8 degrees and 2.83%-5.5%. Second, only the 32-degree floor actually binds, and only below ~7.5 degrees of vertical spin loft (52.8 - 41.5 x exp(-7.53/10.9) = 32.00). So a very low-spin-loft driver does sit pinned at the 5.5% roll ceiling, but a 16-degree spin loft lands at 43.24 degrees and rolls 4.26% -- inside the band, not on it. Meanwhile a wedge's 45-55 degrees of spin loft lands 52.1-52.5 degrees and still rolls ~2.9%, roughly 1.9x less than the driver ceiling rather than the near-zero the clamp reading suggests. One more subtlety worth carrying: the landing model reads the VERTICAL spin loft only. Open the face relative to the path and the 3D spin loft grows, smash and carry drop, but the landing angle and roll fraction do not move at all -- a crooked strike costs total distance through ball speed, never through roll.","hierarchy":[{"driver":"Ball speed (via club speed x smash factor) -- inherited straight from Carry","weight":"dominant -- ~+25 to +31 yd of total per +10 mph of club speed for a 7-iron, and the steps GROW rather than saturate (engine, dl 30 / aa -3: cs 70/80/90/100/110/120 mph -> total 128.67/153.28/179.45/207.17/236.46/267.30 yd; steps 24.61, 26.17, 27.72, 29.29, 30.84; a 138.63 yd swing across 50 mph of club speed).","why":"Total = carry + roll, and roll never exceeds 5.5% of carry in this engine, so total tracks carry almost exactly. Carry itself rises faster than linearly with ball speed, which is why each extra 10 mph is worth more than the last rather than less."},{"driver":"Landing angle (via vertical spin loft = dynamic loft minus attack angle in the vertical plane)","weight":"secondary but real -- at a fixed ~175 yd carry, sweeping landing angle across its full reachable 32-52.8 degree range moves roll from 9.63 yd (5.5%) down to 4.95 yd (2.83%), a 4.67 yd swing -- an order of magnitude smaller than the ball-speed effect above.","why":"This is the one mechanism unique to Total Distance: rollFrac = clamp(0.04-(landingAngle-45)x0.0015, 0.012, 0.055). A shallow landing angle (driver-like, low spin loft) keeps more of the ball's speed moving forward after the bounce; a steep one (wedge-like, high spin loft) buries more of that speed vertically instead."},{"driver":"Club / shot-type selection (driver vs iron vs wedge)","weight":"Sets the whole landing-angle regime at once -- a driver's ~9-16 deg spin loft lands 34.6-43.2 deg and rolls 5.5% down to 4.26% (15.14 yd at tour speed); a 7-iron's ~30-35 deg lands 50.2-51.1 deg and rolls ~3.1-3.2%; a wedge's ~45-55 deg lands 52.1-52.5 deg and rolls ~2.9%.","why":"It is the practical lever a golfer actually pulls -- you don't dial 'landing angle' directly, you pick a club (and an attack angle, per the Backspin lesson) that puts you in a shallow or steep landing regime. Note the roll end is far more compressed than the landing end: whatever you do, the roll fraction stays inside 2.83-5.5%."},{"driver":"Environment (altitude, wind, temperature) -- carry-only in this app's readout","weight":"Largest real-world yardage mover, but NOT applied to Total here: Denver-altitude air (density proxy 0.842, ~16% thinner) raises the ESTIMATED carry by ~11% (+19.3 yd on a 174 yd shot) and a 20 mph headwind cuts it ~22% (-38.3 yd) -- both far larger than the 4.67 yd roll-fraction swing, yet the app deliberately leaves the engine's Total, Landing and Curve untouched.","why":"The EST air and wind layers are post-solve estimates on carry and apex only, by design (see the Air Density and Wind lessons). In reality environment moves total through carry; in Flightglass you must read that effect off the estimated-carry number, not off Total."},{"driver":"Turf firmness / moisture at landing -- not modeled by the engine","weight":"Potentially large in reality (firm, dry fairway or hardpan can double or triple real-world roll; a wet fairway or a spinny wedge shot can check the roll to zero or even negative/backward) but the app's roll term is turf-blind, always landing inside its reachable 2.83%-5.5% band regardless of ground conditions.","why":"Ranked last only because it isn't a modeled input at all -- it's a documented simplification worth knowing before trusting the app's roll number on a firm links course or a soggy winter fairway."}],"misconceptions":["\"Total distance is basically just carry.\" For a 7-iron that's nearly true (roll is 3.13% of carry; carry is 96.96% of total), but off the tee it matters more: PGA Tour drivers get 8-9% of their total from roll, and the app's own driver-regime roll fraction is about 1.9x an iron's (5.5% vs ~2.8-3.1%).","\"A bigger total-distance number always means a better/further shot.\" It hides the carry/roll split: a shot that carries 210 yd and rolls 10 (total 220) is a very different, more useful shot near a hazard than one that carries only 195 and rolls 25 on hardpan (also total 220) -- only the first one clears a 205-yd bunker.","\"More roll is always good.\" True off the tee (extra roll = extra total distance), false into greens -- there you want a steep landing angle and minimal roll so the ball checks up near the pin instead of releasing past it.","\"Add spin or loft if you want the ball to roll out more.\" Backwards: raising spin loft steepens the landing angle (per the Backspin lesson) and shrinks the roll fraction. The classic way to add roll off the tee is the opposite -- hit up on it with a flatter, lower-spin launch, the same low-spin driver recipe taught for backspin, now read for its effect on roll instead of height.","\"A steeper landing angle means a shorter shot.\" Not necessarily -- landing angle only controls the small roll top-up, not carry. A well-optimized steep landing (good spin/launch window) can carry just as far as a shallow one; it simply won't add much roll on top.","\"A wedge basically doesn't roll in this app.\" The formula's 1.2% floor invites that reading, but it is unreachable: the landing model saturates at 52.8 deg, so even the steepest shot the engine can produce still rolls 2.83% of its carry. A 100 yd engine wedge rolls ~2.9 yd, not ~0.","\"An open face costs me distance because the ball lands steeper and stops sooner.\" No -- the landing model reads only the vertical spin loft, so an open face leaves landing angle and roll fraction untouched. Path +10 / face -10 on the default 7-iron loses 7.27 yd of total, and every one of those yards is lost carry from a lower smash factor.","\"The app's roll number is what would really happen on any course.\" The engine's roll model is turf-blind -- it has no idea if the fairway is firm and dry (real roll can run well above the 5.5% ceiling) or wet and soft (real roll, or a spinny wedge's backward check, can fall far below the engine's 2.83% practical floor, even negative). Treat the app's roll number as illustrative, not a course-specific prediction."],"wolframChecks":["engine carry check: 0.9206 x 122.56 + 0.004072 x 122.56^2 = 173.99 yd -> reproduces solveFlight()'s carry for the app's default 7-iron (cs 90 mph, dl 30 deg, aa -3 deg; ball speed = 90 x 1.3618 smash = 122.56 mph), the carry term total is built on.","179.45 - 174.00 = 5.45 yd -> confirms total minus carry equals roll for that same default shot (the arithmetic identity behind total = carry + roll).","5.45 / 174.00 = 3.132% -> the default 7-iron's roll fraction, matching the engine's rollFrac 0.03132 and sitting inside the reachable 2.83%-5.5% band.","15.14 / 275.22 = 5.501% -> a driver-regime shot (cs 113, dl 13 deg, aa +4 deg; landing angle 34.63 deg) sits at the engine's 5.5% roll-fraction ceiling, its most roll-heavy case; total 290.35 yd.","52.8 - 41.5 x exp(-90/10.9) = 52.79 deg -> even a 90-degree vertical spin loft lands at 52.79 deg, so the engine's coded 60-degree landing clamp can never bind. The reachable landing band is 32-52.8 deg and the reachable roll band is 2.83%-5.5%, not 1.2%-5.5%.","52.8 - 41.5 x exp(-7.53/10.9) = 32.00 deg -> the 32-degree landing floor binds only below ~7.5 deg of vertical spin loft, which is why a 16-degree-spin-loft driver lands 43.24 deg and rolls 4.26%, not 5.5%.","cos(32 deg) = 0.848, cos(45 deg) = 0.707, cos(52.8 deg) = 0.605 -> the forward (horizontal) share of the ball's landing speed drops from ~85% to ~60% across the engine's full reachable landing range -- the geometric reason a shallow (driver) landing rolls out more than a steep (wedge) one.","sin^2(32 deg) = 0.281, sin^2(45 deg) = 0.500, sin^2(52.8 deg) = 0.635 -> the vertical (downward) share of kinetic energy at landing more than doubles over that same range, energy that gets absorbed or bounced rather than rolled forward.","tan(32 deg) = 0.625, tan(45 deg) = 1.000, tan(52.8 deg) = 1.318 -> the vertical-to-horizontal velocity ratio at landing roughly doubles from a 32-deg to a 52.8-deg descent, the same fact expressed as a slope.","175 x 0.055 = 9.63 yd vs 175 x 0.0283 = 4.95 yd, difference 4.67 yd -> at a fixed ~175 yd carry, sweeping landing angle across its full reachable 32-52.8 deg range moves roll by only ~4.7 yd -- real, but an order of magnitude below the ball-speed effect.","267.30 - 128.67 = 138.63 yd -> the app's own total-distance swing across a 70-120 mph club-speed sweep (7-iron, dl 30 / aa -3), with per-10-mph steps of 24.61, 26.17, 27.72, 29.29 and 30.84 yd: ball speed dominates total exactly as it does carry, and its effect accelerates instead of saturating.","179.45 - 172.18 = 7.27 yd -> the total lost by twisting path +10 / face -10 on that same default 7-iron. Landing angle stays 50.79 deg and rollFrac stays 0.03132 (the landing model reads only vertical spin loft); 3D spin loft rises 33.0 -> 38.1 deg, smash falls, and every lost yard is lost carry.","25 / 300 x 100 = 8.3% (24.8/299.8 = 8.272%, verified) -> published PGA Tour driver roll-as-share-of-total, noticeably above the app's engine ceiling of 5.5% of carry -- a documented gap between the app's deliberately 'small' roll model and real firm-fairway tour roll."],"quiz":[{"q":"In Flightglass's engine, Total Distance is defined as:","options":["Carry multiplied by launch angle","Carry plus roll, where roll is a small percentage of carry set by landing angle","Ball speed times smash factor","Apex height plus carry"],"answerIndex":1,"explanation":"total = carry + carry x rollFrac, and rollFrac = clamp(0.04-(landingAngle-45)x0.0015, 0.012, 0.055). The coded window reads 1.2%-5.5%, but because the landing model saturates at 52.8 deg the reachable window is 2.83%-5.5%. For the app's default 7-iron that's carry 174.00 yd + roll 5.45 yd (3.13%) = total 179.45 yd."},{"q":"Comparing a driver-regime shot (vertical spin loft ~9 deg, landing angle 34.6 deg) to a wedge-regime shot (vertical spin loft ~55 deg, landing angle 52.5 deg) at similar ball speed, which rolls out more, and why?","options":["The wedge, because more loft always means more spin and more roll","The driver, because its shallower landing angle keeps more of the ball's speed moving forward instead of down at the bounce","They roll the same amount because roll doesn't depend on landing angle","Neither one rolls; roll only happens on the putting green"],"answerIndex":1,"explanation":"At 34.6 deg the ball retains ~82% of its landing speed as a forward component (cos 34.6 = 0.823) versus ~61% at 52.5 deg (cos 52.5 = 0.609). In the app's own numbers that is a 5.5% roll fraction (the ceiling) for the driver regime versus ~2.87% for the wedge regime -- a factor of about 1.9, not the near-zero the formula's unreachable 1.2% floor suggests."},{"q":"You're hitting a wedge into a firm, fast green and want the ball to stop near the pin instead of releasing past it. What landing condition do you actually want?","options":["A shallow landing angle and lots of roll -- maximum total distance","A steep landing angle with plenty of backspin, so the ball checks up with minimal roll","It doesn't matter -- total distance is the only number that counts on approach shots","Zero backspin, so the ball skids to a stop"],"answerIndex":1,"explanation":"Into greens you want the opposite of the tee-shot goal: a steep landing angle (high spin loft, plenty of backspin, per the Backspin lesson) pushes the roll fraction down toward the engine's reachable 2.83% floor, so the ball checks up close to where it lands instead of running out. Note the engine's roll never reaches zero -- a real backspin check on a soft green can, which this model does not attempt to reproduce."},{"q":"PGA Tour drivers average roughly 275 yd of carry and 296-300 yd of total distance. What does that imply about their roll, and how does it compare to this app's engine?","options":["No roll at all -- tour pros carry the full distance in the air","Roughly 21-25 yd of roll, about 8-9% of total -- more roll (as a share) than the app's 5.5% ceiling models","Roughly 100 yd of roll","Negative roll, because backspin pulls the ball backward after it lands"],"answerIndex":1,"explanation":"25/300 = 8.3% (verified). That is meaningfully above the app's own 5.5%-of-carry roll ceiling: the engine's closest driver-regime shot (cs 113, dl 13, aa +4) carries 275.22 yd but rolls only 15.14 yd, for a 290.35 yd total. Real tour drives land on firm, mown fairways the turf-blind roll term knows nothing about."},{"q":"Two golfers both report a '220-yard drive' on a GPS watch. Golfer A carried 210 yd and rolled 10 yd; Golfer B carried only 195 yd but rolled 25 yd on a hard, dry fairway. Which statement is true?","options":["They hit an identical shot","Total distance hides the carry/roll split -- Golfer A's ball actually flew further in the air, which matters for clearing a hazard","Golfer B necessarily has more ball speed than Golfer A","Total distance always equals carry when the fairway is hard"],"answerIndex":1,"explanation":"Same total, very different shot shape: only Golfer A's 210 yd carry clears a bunker sitting 205 yd out. Golfer B's 25 yd of roll on 195 yd of carry is 12.8% -- far outside anything this engine can produce (its ceiling is 5.5%), so that extra roll came from firm ground the model does not simulate, not necessarily from more speed."}],"realWorld":{"tourBenchmarks":["PGA Tour driver averages (TrackMan/ShotLink, recent seasons): ~113 mph clubhead speed, ~167 mph ball speed, carry ~275 yd, total ~296-300 yd -> roll ~21-25 yd, about 8-9% of total (25/300 = 8.3%, verified) -- noticeably more roll than the app's own 5.5% ceiling. The engine's closest driver-regime shot (cs 113, dl 13, aa +4) lands at 34.63 deg and gives carry 275.22 / roll 15.14 / total 290.35 yd.","LPGA Tour driver averages: ~94 mph clubhead speed, ~140 mph ball speed, carry ~218 yd, total ~235 yd -> roll ~17 yd, about 7% of total.","PGA Tour 7-iron averages: carry ~172 yd, total ~176-180 yd -> roll only ~4-8 yd (2-4%) -- this is the one regime where the app's own default 7-iron (carry 174.00 yd, roll 5.45 yd = 3.13%, engine-verified) tracks real tour data closely, because approach-shot landing angles (the engine puts this shot at 50.79 deg) are exactly the steep, low-roll regime the app models well.","Recreational/amateur average driver (Arccos/Shot Scope aggregate GPS data, widely published): total distance averages roughly 214-220 yd across all handicaps -- about 80 yd short of the PGA Tour average, almost entirely a ball-speed gap (the same lesson as Carry), not a roll-percentage gap.","Amateur mid-handicap 7-iron: total distance averages roughly 135-145 yd, versus a solid-strike 179.45 yd default in this app -- again predominantly a club-speed/ball-speed shortfall, read off the total-distance number instead of carry."],"scenarios":["Off the tee on a firm, dry fairway: a low, flat 'stinger' and a high, spinny bomb can post total distances 15-20 yards apart. Be careful about the mechanism, though -- in this engine only ~4.7 yd of that (at a fixed carry) comes from the roll fraction; the rest comes from the flatter, lower-spin-loft strike also earning a higher smash factor and more carry (engine at 113 mph: dl 10 / aa +4 totals 293.56 yd versus 277.49 yd for dl 16 / aa 0). Real firm turf then adds roll the model does not simulate.","A par-3 into a firm, fast green: here you want the opposite of 'more total distance' -- a steep landing angle with plenty of spin so the ball checks up near the pin instead of releasing 20+ feet past it. Total distance is the wrong number to optimize on an approach shot.","A links course in Scotland or Ireland, baked out and downwind: pros deliberately flatten their launch off the tee to run the ball out, sometimes adding 20-30+ yards of roll that a soft, irrigated parkland course in the US would never give up for the same swing -- roll well past anything the app's 5.5%-of-carry ceiling will ever show you.","Two golfers both log a '220-yard drive' on a GPS watch -- one carried 210 yd with 10 yd of roll, the other carried only 195 yd but rolled 25 yd on a hard fairway. Same total, very different shot: only the first one carries a bunker sitting at 205 yd.","A junior golfer's clubhead speed climbs every season (more carry, per the Carry lesson), but their total-distance gains lag behind because they launch it high and spinny -- the fix (from the Backspin lesson: tee it higher, hit up on it) flattens the landing angle and lets the extra speed also cash out as roll, not just carry."],"whatItMeansForYou":"Chase ball speed first -- as in the Carry lesson, it's ~97% of the total-distance story for an iron (carry is 96.96% of the app's default total), and each extra 10 mph of club speed is worth MORE than the last, not less: +24.6 yd going from 70 to 80 mph, +30.8 yd going from 110 to 120. Once speed is dialed in, this lesson's one new lever is landing angle: off the tee, a flatter, lower-spin launch pins you at the engine's 5.5% roll ceiling instead of an iron's ~3%, and on real firm ground it buys considerably more than that -- tour drivers get 8-9% of their total from roll alone. But into greens the same lever works against you: you want a steep, spinny landing so the ball checks up instead of releasing past the flag. Two cautions. Twisting the face open won't change your roll at all -- it only costs you carry through a lower smash factor. And Total is a scorecard/GPS-watch number: when a hazard needs clearing, carry is what matters, and carry is also the only number this app's altitude and wind estimates actually move."}}
  </script>
  <script type="application/json" id="lesson-curve">{"parameter":"Curve","oneLiner":"Curve is the sideways bend a shot takes in flight — caused entirely by the gap between face angle and club path (the spin-axis tilt), and it grows faster than the square of how far the ball flies.","whatItIs":"Curve is the sideways bend a golf shot takes in the air — a completely separate thing from where it starts. A shot can start dead on the target line and still curve 30+ yards offline by the time it lands (a pure slice or hook), or it can start well off-line and then fly perfectly straight from there (a push or pull with zero curve). In Flightglass's engine, curve is driven entirely by the spin axis — how far the backspin's axis tilts sideways instead of staying level — and that tilt begins with the gap between where the clubface points and where the club is actually travelling (path) at impact. Zero gap, zero axis tilt, zero curve, no matter how extreme the face or path numbers are individually; the gap also decides which way the ball bends. How hard that same gap tilts the axis is then set by the club — loft and attack angle. And the bend keeps compounding for as long as the ball is airborne, because the sideways slice of the Magnus lift pushes for the whole flight — so a longer shot bends more than its extra distance alone would suggest. That's why the exact same swing flaw looks harmless on a wedge and disastrous on a driver.","components":[{"name":"Face-to-path gap (faceAngle − clubPath)","role":"The master lever. Curve is driven entirely by the mismatch between where the face points and where the club is travelling at impact — not by either number alone. Zero gap = zero curve no matter how extreme face or path are individually (e.g. +8° path with a +8° open face cancels to a straight shot). The engine reads this directly as the `faceToPath` field.","typicalRange":"tour player ≈0-4°; recreational slicer ≈5-12°+"},{"name":"Spin axis tilt","role":"The tilt of the ball's spin axis away from level — the engine takes it as the true 3-D angle of the (velocity × face-normal) axis from horizontal, with no fitted gain and no clamp. This is the one signed quantity upstream of the bend: its sign alone decides direction (right/left), and its size, compounded over the whole flight, decides magnitude.","typicalRange":"engine-measured: a 2° gap tilts a 7-iron 3.172° but a driver 11.158°; a 6° slice gap tilts the same driver 30.560°"},{"name":"Carry distance (club/shot length)","role":"The amplifier — and it amplifies harder than squaring. A longer flight spends more time under the sideways component of Magnus lift, so the same face-to-path fault compounds: at face +2 / path −5, a wedge bends 5.76 yd, a 7-iron 15.83 yd and a driver 51.04 yd — the driver curving about 3.2× the 7-iron and about 8.9× the wedge from one unchanged gap.","typicalRange":"driver ≈220-280 yd tour / 180-230 yd amateur; 7-iron ≈150-175 yd; wedge ≈80-120 yd"},{"name":"Start direction","role":"A separate quantity from curve (face-dominant blend, same mechanism as the start-direction lesson content). It combines with curve to form the total sideways miss: offline = carry·sin(startDirection) + curve. A pushed/pulled shot can miss badly with zero curve.","typicalRange":"±0-8° off the target line depending on the face/path mix"},{"name":"Air density / altitude","role":"An environment-tier modifier wired into the dependency graph (altitude→curve) but not yet a solveFlight() input — thinner air weakens every aerodynamic force on the ball, including the sideways Magnus force behind curve, so shots curve less at altitude (same reason they carry farther). Flagged EST/qualitative — not yet engine-true.","typicalRange":"sea level baseline; ~14% thinner air at Denver's ~1,600 m (per the Carry lesson's own grounded figure)"},{"name":"Strike location on the face / gear effect (driver only)","role":"A real, well-documented curve source that this engine cannot represent at all — it has no strike-location input. A toe or heel strike on a driver's curved, springy face imparts extra sideways spin independent of path or face angle. A genuine limitation to disclose, not an omission to hide.","typicalRange":"a 0.5-1 inch toe/heel miss on a driver can add meaningful extra side-spin, per TrackMan University teaching material"}],"howTheyConnect":"Contact lasts about half a millisecond, but in that instant two separate things get set: which way the ball starts (mostly the face angle, blended down by path — the same face-dominant blend used elsewhere in the engine) and which way it bends afterward (entirely the gap between face angle and club path). If face and path point the same direction — say both +8° in-to-out — the gap is zero and the ball flies dead straight down whatever line it started on, however far off that line was. It is the mismatch that creates sideways spin: the ball skids across the face at an angle instead of compressing straight back, and that skid rolls the backspin axis over sideways instead of leaving it level. The engine does not scale that with a fitted gain — it takes the true 3-D tilt of the (velocity × face-normal) axis away from horizontal, so the gap sets the direction of the tilt while the club's loft and attack angle set how strongly the same gap tilts it (curvature driven by face-to-path is TrackMan's well-established D-Plane finding). That is why the relationship is not a clean multiple: on a 7-iron, face-to-path gaps of 2°, 4°, 6° and 8° tilt the axis 3.172°, 6.322°, 9.428° and 12.471°. And it is why loft forgives — at an identical 6° gap, 90 mph and a −3° attack, a 50° wedge tilts only 4.803° while an 11° driver face tilts 22.974°, the same error producing about 4.8× the axis tilt, which is geometry rather than a fudge. That tilted axis then acts on the flight, and here the engine integrates rather than evaluating anything: there is no closed-form curve formula to quote, because curve is the accumulated sideways deflection under drag and Magnus lift. What can be taught is the behaviour, and the behaviour is stronger than the old 'longer flight, proportionally more bend' shorthand. Hold the axis tilt fixed at 10.958° and turn up only club speed: a 124.1-yd carry bends 6.98 yd while a 257.8-yd carry bends 37.06 yd — 2.08× the carry buying 5.31× the curve, where multiplying the carry ratio by itself would predict only 4.31×. The ball is airborne longer, and the sideways slice of the same Magnus lift that makes backspin hold the ball up has more time to push it off-line, so the deflection outruns the distance that produced it. In the bag a second effect stacks on top of that one: struck with the identical 6° face-to-path gap, a 7-iron tilts its axis 9.428° and bends 13.66 yd over 173.3 yd of carry, while a driver tilts 30.560° and bends 45.70 yd over 272.0 yd — 3.35× the curve, out of a harder tilt and a longer flight together rather than out of carry alone. That is why identical mis-hits look so different club to club: one face +2 / path −5 delivery bends a wedge 5.76 yd and a driver 51.04 yd. Finally, curve is not the same as the ball's total miss: offline = carry·sin(startDirection) + curve, so a pushed shot with zero curve can still finish well right of target, and a shot that starts dead on-line but curves hard finishes just as far off — two very different swing errors producing the same result on the scorecard.","hierarchy":[{"driver":"Spin axis tilt (from the face-to-path gap)","weight":"dominant and the only signed term — and there is no fixed gain: the gap sets the direction while loft sets how hard, so on a 113-mph driver gaps of 2°, 4°, 6° and 8° tilt the axis 11.158°, 21.513°, 30.560° and 38.160° and bend 17.22, 32.80, 45.70 and 55.66 yd (measured against the engine at a 270-274 yd carry throughout).","why":"The engine integrates curve out of the flight rather than evaluating a formula, and spin-axis tilt is the only signed quantity feeding it — its sign decides which way the ball bends, and its size, compounded over the whole flight, decides how much. Face angle and club path only matter through their difference; loft and attack then set how strongly that difference tilts the axis."},{"driver":"Carry distance / club length","weight":"flight-length multiplier — hold the axis tilt fixed at 10.958° and lengthen the flight with club speed alone: 124.1 yd of carry bends 6.98 yd, 173.1 yd bends 15.83 yd, 257.8 yd bends 37.06 yd, so 2.08× the carry buys 5.31× the curve, where multiplying the carry ratio by itself would predict only 4.31×. In the bag both effects stack: at the identical 6° gap a driver bends 45.70 yd (axis 30.560°) against a 7-iron's 13.66 yd (9.428°) and a 113.4-yd wedge's 4.96 yd (4.803°). All measured against solveFlight, which integrates the flight rather than evaluating any deflection law.","why":"Curve outruns the carry that produced it rather than tracking it. The engine integrates the flight rather than evaluating a deflection law, and the sideways slice of Magnus lift keeps pushing for as long as the ball is airborne, so extra hang time compounds one unchanged axis tilt: pinned at 10.958°, 2.08× the carry returned 5.31× the bend. Long clubs are airborne far longer, so an identical swing fault has far more time to push the ball off-line."},{"driver":"Face angle and club path individually (the two raw inputs)","weight":"Each contributes to the gap 1:1 in degrees, but face angle also drives ~60-88% of start direction on its own (a separate outcome, loft-dependent weight), while path drives the rest.","why":"Curve only cares about faceAngle − clubPath, never their individual values — a golfer swinging +8° in-to-out with a +8° open face (0° gap) hits it dead straight, while 0° path with a 4° open face (4° gap) produces a clear fade. This split — start is mostly the face, curve is entirely the face-to-path gap — is the core 'D-Plane' insight."},{"driver":"Altitude / air density","weight":"Second-order, and not yet numerically model
