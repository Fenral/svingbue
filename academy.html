b","Both drift identically — crosswind only cares about carry distance, not shot shape","The high, spinny wedge, because it spends more time exposed to the wind for the same carry distance","Neither drifts — a pure 90° crosswind never affects a shot"],"answerIndex":2,"explanation":"Crosswind drift accumulates over time in the air, not just distance covered. A high, slow-falling, spinny shot has more hang time per yard of carry than a low, piercing one, so it sits in the crosswind's path longer and drifts farther, even at the same carry distance and the same wind speed."},{"q":"Using the ≈1 ft of drift per 100 yd of carry per mph of crosswind rule of thumb, roughly how far offline does a 150-yard approach land in a 10 mph pure crosswind (90° to the target) if you aim straight at the pin?","options":["About 1 yard","About 5 yards","About 15 yards","About 30 yards"],"answerIndex":1,"explanation":"driftYd = crosswindMph × carryYd / 300 = 10 × 150 / 300 = 5 yards. On a 275-yard drive the same 10 mph crosswind would push the ball about 9 yards off line — proportionally more because it covers more distance while exposed to the same wind."}],"realWorld":{"tourBenchmarks":["Flightglass EST wind layer: headwind costs about 1%/mph of carry at modest speeds, rising to ≈22% total at 20 mph — more than double the 10 mph loss (≈10%); the penalty compounds, it doesn't just add.","Flightglass EST wind layer: tailwind gives back only about 0.7%/mph — ≈7% at 10 mph, ≈12% at 20 mph — meaning a 20 mph tailwind returns barely half of what an equal 20 mph headwind takes away (12% vs 22%).","Applied to a PGA Tour-average 275-yard driver carry: roughly -27.5 yd (10 mph head), -60.5 yd (20 mph head), +19.25 yd (10 mph tail), +33 yd (20 mph tail).","Applied to a 150-yard mid-iron: roughly -15 yd (10 mph head), -33 yd (20 mph head), +10.5 yd (10 mph tail), +18 yd (20 mph tail).","Caddie/instruction rule of thumb for crosswind: ≈1 foot of sideways drift per 100 yards of carry per mph of crosswind — a 10 mph full crosswind moves a 150-yd shot ≈5 yd off line and a 275-yd drive ≈9 yd off line.","PGA Tour driver averages (TrackMan, 2025 season): ≈113-116 mph clubhead speed, ≈167-171 mph ball speed, ≈10.4-10.9° launch angle, ≈275 yd carry / ≈296-300 yd total — the baseline shot the wind percentages above are applied to.","2015 Open Championship, St Andrews: play was suspended for about 10.5 hours after gusts exceeded 40 mph made resting golf balls move on the greens — an extreme, real instance of wind physically overpowering the game."],"scenarios":["Links courses on The Open Championship rota, where wind is part of the strategy on every hole rather than an occasional nuisance.","A 150-yd approach that normally lands pin-high coming up 15-33 yd short into a 10-20 mph headwind, forcing a 1-2 club jump that many amateurs under-estimate.","A tee shot next to trees or grandstands, where a visible crosswind means starting the ball well outside the flag on purpose and letting the wind bring it back to the target.","2015 Open Championship at St Andrews: gusts over 40 mph literally moved golf balls resting on the greens, forcing a 10.5-hour suspension of play.","An ordinary weekday round on a breezy 15 mph day where most amateurs under-club into the wind and over-club downwind, because the 1%/0.7% asymmetry between headwind and tailwind isn't intuitive."],"whatItMeansForYou":"Treat head/tailwind and crosswind as two separate problems solved from the same wind reading. Use the head/tail component (wind speed × cos of the angle off your target line) to pick a club — expect roughly one extra club per 10-15 mph into the wind and only about half a club less downwind, because a headwind always costs more than an equal tailwind gives back, and that gap widens the harder it blows. Use the crosswind component (wind speed × sin of that angle) to pick a target line — expect roughly a yard of drift for every ~30 yards of carry per 10 mph of crosswind, more if your shot flies high and spinny, less if you flight it down. When conditions get gusty or swirly, the single most reliable adjustment isn't a more precise number — it's a lower, quieter trajectory that takes wind out of the equation instead of trying to calculate it exactly."}}
  </script>
  <script type="application/json" id="lesson-temperature">
{"parameter":"Temperature","oneLiner":"Temperature changes how thick the air is: warm air is thinner and lets a struck ball carry a few extra yards, cold air is denser and holds it back — and, separately, a cold ball itself comes off the face a touch less lively.","whatItIs":"Temperature does not touch your swing at all — in the app's engine, ball speed, launch angle, spin loft and backspin are computed by solveFlight() from clubPath/faceAngle/attackAngle/dynamicLoft/clubSpeed alone, and none of those five inputs is temperature. What temperature changes is the air the ball flies through after it leaves the face. Air is a gas: by the ideal gas law, its density is proportional to 1/T (T in absolute/Kelvin terms) at constant pressure — warm air molecules spread out and get lighter per cubic metre, cold air molecules pack in and get heavier. Thinner (warm) air produces less aerodynamic drag, so the same strike coasts a bit farther before it runs out of speed; denser (cold) air produces more drag and pulls the ball up a little short. The app models this exactly the way it models altitude: as a documented estimate post-solve multiplier applied after the engine-true flight is solved. The live formula is fTemp = 288.15 / (273.15 + tempC) — a ratio against 15°C (288.15 K), the ISA sea-level reference temperature — which feeds the app’s two-factor densityRatio = fAltitude × fTemp and the carryEnvMult = 1 + 0.70×(1 − densityRatio) used across the whole Environment tier. There is a second, smaller mechanism that is real but not in the current engine: a cold golf ball's core is stiffer and less resilient (lower coefficient of restitution), so a chilled ball can come off the face a touch slower than a warm one at an identical club speed — documented by golf-equipment testing, but absent from solveFlight, so today it is text-only knowledge, not something either the Carry lesson's or this lesson's live diagram can show moving the numbers.","components":[{"name":"Absolute temperature (the actual physics driver)","role":"The ideal-gas law says density is proportional to 1/T with T in Kelvin, not Celsius or Fahrenheit — this is why the effect is nonlinear (bigger jumps near the cold end of a slider than the hot end) and why the app's formula anchors on 288.15 K (15°C) rather than 0.","typicalRange":"playable golf range roughly -5 to 40 degC (268 to 313 K)"},{"name":"Air density (kg/m3)","role":"The direct physical quantity temperature moves. Wolfram-checked dry-air density falls from 1.317 kg/m3 at -5 degC to 1.127 kg/m3 at 40 degC, a 14.4% drop across the app's full slider range.","typicalRange":"-5 degC: 1.317; 0 degC: 1.293; 15 degC (ISA ref): ~1.225; 30 degC: 1.165; 40 degC: 1.127 kg/m3"},{"name":"Drag on the ball","role":"Drag scales with air density times velocity squared. Thinner (warm) air means less drag, so the ball decelerates more slowly and carries farther for an identical launch; denser (cold) air brakes it sooner.","typicalRange":"drag force on a golf ball at typical flight speed ~1 N order of magnitude (2x+ the ball's own ~0.45 N weight)"},{"name":"Magnus lift (backspin's payoff)","role":"Lift from backspin also scales with air density, so thinner warm air gives the same spin rate less lift to hold the ball up. Drag falls with warmth, but so does lift — which is the physical reason a carry multiplier built on density change is damped below 1-for-1 rather than tracking the raw density drop.","typicalRange":"shared 0.70 coefficient in carryEnvMult damps the raw density swing before it reaches carry"},{"name":"Ball COR / \"liveliness\" (real, not modeled by the engine)","role":"A cold ball's core is stiffer and less resilient, giving a lower coefficient of restitution and slightly less ball speed at the same club speed. Golf-equipment testing documents this as a genuine, separate 'dead ball' effect. solveFlight() has no temperature input, so neither this lesson's diagram nor the Carry lesson's can show it moving — it is a text-only caveat, matching the graph's declared temperature-to-ball-speed edge that the current engine does not yet implement.","typicalRange":"reported by equipment testers as a modest few-yard effect, smaller than the air-density carry swing"},{"name":"Altitude (the other Environment layer)","role":"Temperature is one of only two multiplicative factors feeding densityRatio in the app: densityRatio = fAltitude × fTemp. There is no humidity factor anywhere in the code — humidity is held fixed and not modelled, exactly as the Air Density lesson states. A full -5..40 °C temperature run is a 14.4% density swing; the app’s altitude layer at Denver (5,280 ft) gives fAltitude = 1 - 0.03×(5280/1000) = 0.8416, i.e. ~15.8% thinner air, so a big elevation change still outweighs the whole temperature slider.","typicalRange":"densityRatio = fAltitude × fTemp, both factors exactly 1.0 at sea level and 15 °C"}],"howTheyConnect":"Contact between club and ball is over in half a millisecond — nothing about the day's temperature is in the room for that. All five of solveFlight()'s inputs (clubPath, faceAngle, attackAngle, dynamicLoft, clubSpeed) and everything they derive (ball speed, launch angle, spin loft, backspin, smash) are computed with zero knowledge of temperature; those numbers are identical on a freezing morning and a scorching afternoon for the same swing. What changes is everything that happens next, once the ball is airborne and pushing through a real fluid. By the ideal gas law, air density at a fixed pressure is proportional to 1 / T(Kelvin) — hotter air has the same molecules spread across more volume, so it weighs less per cubic metre. The app captures this with fTemp = 288.15 / (273.15 + tempC): at the 15°C reference fTemp = 1 (no change); at -5°C fTemp = 288.15/268.15 = 1.0746 (denser, ~7.5% above reference); at 40°C fTemp = 288.15/313.15 = 0.9202 (thinner, ~8.0% below reference) — Wolfram-verified, and matching measured air-density tables (1.317 -> 1.127 kg/m3 is a 14.4% real-world drop across the same span) almost exactly, which is why the simple 1/T approximation is trustworthy here. That fTemp multiplies into densityRatio = fAltitude x fTemp (the app has no humidity factor — humidity is held fixed, not modelled), and the same formula used for every Environment node then produces carryEnvMult = 1 + 0.70 x (1 - densityRatio): thinner air (densityRatio < 1) gives a multiplier above 1 (more carry), denser air gives one below 1 (less carry). The 0.70 coefficient is not arbitrary noise — it is the app's way of encoding the two-sided physics: thinner air cuts drag (which alone would push carry up by the full density change) but it also weakens the Magnus lift that backspin generates (which pulls the gain back down), so the net carry swing ends up damped to about 70% of the raw density change. Carry and apex are the only two engine outputs multiplied by this layer; ball speed, launch angle, spin loft and backspin come straight from the base model, unchanged. Separately — and this is not wired into carryEnvMult — a genuinely cold golf ball has a stiffer, less resilient core (lower coefficient of restitution), so in reality a chilled ball can leave the face a hair slower even at an identical club speed. The dependency graph's data literally encodes a temperature-to-ball-speed edge alongside temperature-to-carry, anticipating this mechanism, but solveFlight() has no temperature argument today, so that edge is aspirational: real, teachable, and worth knowing, but the live diagram can only show the air-density half of the story moving.","hierarchy":[{"driver":"Ball speed (club speed x smash) — untouched by temperature","weight":"still dominant for total distance (the engine’s 7-iron runs ~149 to ~229 yd carry from 80 to 110 mph club speed), but this lesson’s whole point is that temperature does not move this number at all in the engine","why":"solveFlight() takes clubPath/faceAngle/attackAngle/dynamicLoft/clubSpeed only — temperature is never an argument. Every yard temperature adds or removes comes entirely from rescaling the flight of an identical strike through different air, never from the strike itself."},{"driver":"Air density via temperature (the EST carry lever)","weight":"roughly +4.1 yd per +10 degC (about +2.3 yd per +10 degF) near the 15 degC / 174.0-yd engine baseline for the default 7-iron (122.6 mph ball speed), widening to -9.1 yd at -5 degC and +9.7 yd at 40 degC vs that baseline (measured) -- an ~18.8 yd swing across the app's full -5 to 40 degC slider on a 174-yard shot","why":"This is the mechanism the app actually implements: fTemp feeds densityRatio, which feeds carryEnvMult = 1 + 0.70x(1-densityRatio), applied to carry and apex only. It is the single lever this lesson's diagram can move live."},{"driver":"Temperature vs its Environment siblings (altitude, humidity)","weight":"a full -5..40 degC run is a 14.4% air-density swing -- large, but smaller than the ~15.8% thinning the app's altitude layer gives for a sea-level-to-Denver jump (5,280 ft, fAltitude 0.8416, ~+11% carry). Humidity is not a third layer: the app does not model it at all","why":"Temperature and altitude share one multiplicative densityRatio, so their yardage contributions are directly comparable: on an ordinary day temperature moves carry noticeably, but less than a serious elevation change. Humidity is held fixed in the model, so it contributes nothing here."},{"driver":"Ball COR / \"dead ball\" effect (real, not modeled)","weight":"documented by golf-equipment testing as a genuine but modest effect -- clearly smaller than the air-density swing above, and currently absent from the app's carry number entirely","why":"A cold ball's core resists compression less efficiently (lower COR), trimming ball speed slightly at an identical club speed. The dependency graph anticipates this (temperature -> ball-speed edge) but solveFlight() has no temperature input, so it cannot show up in either this lesson's or the Carry lesson's live numbers today."},{"driver":"Swing / body effects in the cold (real, not modeled, often the biggest practical effect)","weight":"not quantified anywhere in the app -- purely anecdotal/behavioral, but frequently the largest real-world distance loss on a genuinely cold tee box","why":"Stiff muscles, tighter grip from cold hands, and extra clothing layers can slow the actual clubhead speed a golfer produces. That is a human-performance effect entirely outside solveFlight() and outside the EST air layer -- it changes clubSpeed itself, the one input everything else is built on, rather than rescaling the flight afterward."}],"misconceptions":["\"Cold air is heavier, so surely it helps the ball fly farther the way thin mountain air does.\" Backwards: it is the thin, warm air that reduces drag and adds carry; dense, cold air does the opposite and costs distance. People conflate 'heavier air feels more substantial' with 'more support for the ball' -- the physics runs the other way.","\"Temperature changes your ball speed and spin the same way altitude and wind can shove a shot around.\" In this engine it does not -- solveFlight() has no temperature input at all, so ball speed, launch angle, spin loft and backspin are byte-identical on a freezing day and a hot one. Only carry and apex get rescaled, by a documented EST post-solve layer.","\"Warming your golf balls before a cold round is a superstition, it can't really do anything.\" It is a small but genuine effect -- a cold ball's core is stiffer and less resilient (lower COR), documented by independent equipment testing -- just much smaller than the air-density swing, and not something the app's own diagram can show since solveFlight() doesn't model it.","\"The temperature effect is basically the same size as altitude.\" They share the exact same densityRatio mechanism, but day-to-day temperature swings (maybe 20-30 degC in most climates) move carry less than a serious altitude jump: in the app's own model, sea level to Denver (5,280 ft) is ~15.8% thinner air and about +19 yd on the default 7-iron, while the entire -5..40 degC slider is ~18.8 yd end to end.","\"If it's cold, the ball comes up short because the air is thick -- that's the whole story.\" Air density is real and modeled, but on a genuinely cold tee box the biggest practical yardage loss is often the golfer's own stiff, cold-muscled, extra-clothed swing producing less club speed to begin with -- an effect entirely outside both the air-density layer and the engine's solve.","\"Since it isn't in the engine, the ball-COR effect must not be real.\" 'Not modeled by this app' and 'not real' are different claims -- the graph data even encodes a temperature-to-ball-speed dependency edge anticipating it; it just isn't wired into solveFlight() yet."],"wolframChecks":["Ideal-gas density ratio 288.15/268.15 = 1.0746 -> matches the app's fTemp formula at -5 degC (cold air ~7.5% denser than the 15 degC/288.15K ISA reference).","Ideal-gas density ratio 288.15/313.15 = 0.9202 -> at 40 degC, air is ~8.0% thinner than the 15 degC reference.","Measured dry-air density (1 atm): -5 degC -> 1.317 kg/m3, 0 degC -> 1.293, 10 degC -> 1.247, 20 degC -> 1.205, 30 degC -> 1.165, 40 degC -> 1.127 kg/m3; (1.317-1.127)/1.317 = 14.43% -> real measured density falls 14.4% across the app's full -5..40 degC slider, closely matching the pure 1/T prediction and validating the engine's simplification.","Engine carry for the default 7-iron (dynamic loft 30, attack -3, club speed 90 -> ball speed 122.56 mph): 0.9206*122.56 + 0.004072*122.56^2 = 174.0 yd -> this is the baseline the temperature layer scales. (The same formula at a round 120 mph would give 169.1 yd, but that is not the default 7-iron and is not what the layer scales.)","App's EST carry delta at the slider ends: 174.0*0.70*(1-1.07459) = -9.08 yd at -5 degC; 174.0*0.70*(1-0.92017) = +9.72 yd at 40 degC -> both vs the 15 degC baseline, an ~18.8 yd total swing on the 174-yard default 7-iron.","10 degF temperature difference = 5.556 degC -> converting the app's per-degC rate to the commonly-cited per-10-degF golf rule of thumb: raising 15 degC by 5.556 degC adds 2.30 yd of estimated carry, matching published club-fitting guidance of roughly 1-2 yd per 10 degF."],"quiz":[{"q":"In the app's engine, what does raising the Temperature slider actually change?","options":["Ball speed, launch angle and spin all increase together","Only carry and apex are rescaled by an EST air-density layer; ball speed, launch angle, spin loft and backspin stay exactly the same","Only spin loft changes","Nothing -- temperature has no effect anywhere in the app"],"answerIndex":1,"explanation":"solveFlight() takes clubPath, faceAngle, attackAngle, dynamicLoft and clubSpeed -- temperature is never an input. It only rescales carry and apex through the documented EST post-solve air layer (fTemp -> densityRatio -> carryEnvMult), exactly like altitude."},{"q":"Why does thinner, warmer air let the ball carry farther?","options":["Warm air pushes the ball upward directly","Air density is proportional to 1/absolute-temperature, so warm air is lighter and produces less drag on the ball","Warm air spins the ball faster","The ball itself gets lighter when warm"],"answerIndex":1,"explanation":"By the ideal gas law, density at constant pressure scales as 1/T (Kelvin). The app's fTemp = 288.15/(273.15+tempC) captures exactly this: at 40 degC, fTemp = 0.920 (Wolfram-checked), meaning the air is about 8% thinner than the 15 degC reference, which cuts drag and adds carry."},{"q":"Going from a chilly -5 degC morning to a hot 40 degC afternoon, roughly how much does the app say the default 174-yard 7-iron's carry changes (both vs the 15 degC baseline)?","options":["About 2 yards total -- barely noticeable","About 19 yards total (roughly -9 yd cold, +9.7 yd hot)","About 90 yards total -- nearly half the shot","It gets shorter in both directions"],"answerIndex":1,"explanation":"Measured against the engine baseline of 174.0 yd: 174.0 x 0.70 x (1-1.07459) = -9.08 yd at -5 degC and 174.0 x 0.70 x (1-0.92017) = +9.72 yd at 40 degC, both relative to the 15 degC baseline -- an ~18.8 yard total swing across the full slider on this shot, a meaningful but modest fraction of the total carry."},{"q":"Why doesn't the full air-density change translate one-for-one into carry gain (i.e. why is there a 0.70 factor, not 1.0)?","options":["It's an arbitrary safety cap with no physical meaning","Thinner air cuts drag (which alone would add the full density change) but also weakens the Magnus lift from backspin (which pulls some of that gain back), so the net effect is damped","Warm air increases spin, cancelling some of the gain","The app caps every environment multiplier at 0.70 to stop runaway numbers"],"answerIndex":1,"explanation":"Drag and Magnus lift both scale with air density. Warm, thin air reduces drag (more carry) but simultaneously gives the same backspin less air to grab for lift (less carry) -- two opposing effects on the same variable, so the net carry gain ends up damped to roughly 70% of the raw density swing rather than the full amount."},{"q":"A player blames a short cold-day drive entirely on 'thick air.' What is this lesson's caution about that explanation?","options":["Thick cold air has zero effect on carry, so the explanation is wrong","Air density is real and modeled, but a genuinely cold ball's stiffer core (lower COR) and the golfer's own stiff, cold-muscled swing are separate, real effects the app's engine does not model at all","Cold air only affects putting, not full swings","The engine already accounts for all cold-weather effects, so nothing else matters"],"answerIndex":1,"explanation":"The EST air-density layer is real and grounded (~9 yd lost at the app's coldest setting for a 7-iron), but it isn't the whole story: a cold ball's lower coefficient of restitution and a golfer's own reduced clubhead speed from cold, stiff muscles are genuine, documented effects that sit entirely outside solveFlight() and the EST air layer -- often the bigger practical loss on a truly freezing tee box."}],"realWorld":{"tourBenchmarks":["Wolfram-checked: dry-air density falls from 1.317 kg/m3 at -5 degC to 1.127 kg/m3 at 40 degC -- a 14.4% drop across the app's full temperature slider, and the ideal-gas ratio 288.15/268.15 = 1.0746 vs 288.15/313.15 = 0.9202 (a 14.4%-wide ratio spread) matches that measured drop almost exactly, validating the app's 1/T simplification.","Engine baseline, measured: the default 7-iron (dynamic loft 30, attack -3, club speed 90) solves to 122.56 mph ball speed and 0.9206 x 122.56 + 0.004072 x 122.56^2 = 174.0 yd carry. Applying the app's EST air layer: 174.0 x 0.70 x (1-1.07459) = -9.08 yd at -5 degC, and 174.0 x 0.70 x (1-0.92017) = +9.72 yd at 40 degC, both versus the 15 degC baseline -- about 18.8 total yards of swing from temperature alone on this one shot.","Near the 15 degC/59 degF reference this works out to roughly +4.1 yd of carry per +10 degC (measured: 15 -> 25 degC adds 4.09 yd), i.e. about +2.3 yd per +10 degF since 10 degF = 5.556 degC -- closely matching the club-fitting-industry rule of thumb (TrackMan University and most fitting literature teach roughly 1-2 extra yards of carry per 10 degF of warming).","Golf-equipment testing (cold-ball vs warm-ball comparisons run by independent labs and golf media) documents a real 'dead ball' effect: a chilled ball can leave the face a touch slower than a body-temperature one at an identical club speed, because its core is stiffer and less resilient (lower coefficient of restitution) when cold -- a genuine mechanism the app's engine does not currently implement."],"scenarios":["A frosty 7am tee time versus a 2pm round on the same course, same course same swing: the early ball sits in denser, colder air (and is itself colder), so it comes up shorter than the exact same strike hit after the day warms up.","Instructors and caddies routinely tell golfers to 'take one more club' in cold weather -- a rule of thumb that lines up with the app's own ~9-yard EST carry loss at the cold end of its slider for a mid-iron.","Tour pros and caddies on cold-weather tee times (early-morning coastal rounds, late-season cold snaps) are known to keep a spare ball in a jacket pocket to keep its core warm -- a direct, practical response to the documented cold-ball COR effect.","Winter 'flyer' complaints often get blamed entirely on temperature when club-face friction, wet turf, or a stiff cold grip are doing at least as much damage -- temperature is real but it is only one ingredient in a cold-weather short-shot.","A hot desert-swing afternoon versus a cool, breezy links morning: the warm-air carry gain modeled here is real, but on a links day it is easily swamped by the far bigger, separate wind effect -- a stiff headwind can cost a mid-iron carry on the same order as this entire temperature slider, and the app does not model wind at all."],"whatItMeansForYou":"Don't blame a whole club's worth of a bad swing on the thermometer: across the app's entire -5 to 40 degC range the pure air-density effect is only about an 18.8-yard swing on the default 174-yard 7-iron (roughly 5% each way), and your ball speed, spin and launch never actually change with temperature in this model. What you should expect: a few extra yards on a hot day, a few less on a cold one, growing faster as you get closer to freezing than as you get closer to summer heat -- measured on the app's own slider, -5 to +5 degC is worth 4.71 yd while 30 to 40 degC is worth only 3.70 yd, because density runs on 1/T, not a straight line -- and, separately, a genuinely cold ball in your bag is quietly working against you a little more on top of that, so keeping it warm on a freezing tee time is not superstition."}}
</script>
  <script type="application/json" id="lesson-low-point">
{"parameter":"Low Point","oneLiner":"Your swing is a circle, and every circle has a bottom. Where that bottom sits — behind the ball, at it, or ahead of it — is the single number that decides whether you strike down, level, or up.","whatItIs":"The low point is the lowest point of the arc your clubhead travels on. It is not a feeling and not a technique — it is a place, measured in centimetres along the target line, relative to the ball. In this app's geometry engine (swing-parameters-and-impact.js) it is literally the state variable lowPoint.x, and the whole strike story falls out of one line of trigonometry: theta = asin(−xLP / R) finds where on the circle the ball sits, and deriveImpact() converts that place into the attack angle. Put the bottom of the circle AHEAD of the ball (positive x, toward the target) and the club must still be descending when it arrives at the ball — a negative attack angle and, with turf, a divot that starts after the ball. Put the bottom BEHIND the ball and the club is already climbing — a positive attack angle, which is exactly what a teed driver wants and a grounded 7-iron does not. Engine-run: sliding the low point from 6 cm behind the ball to 15 cm ahead (plane 55°) sweeps attack angle from +2.35° to −5.88° — about 0.4° per centimetre, the famous \"one degree per inch of ball position\" from the range, computed instead of recited.","components":[{"name":"lowPoint.x — the place along the target line","role":"The master input. effectiveLpx() reads it (plus a swing-direction correction taught in lesson 3), thetaAtImpact() converts it to the ball's position on the circle, and deriveImpact() turns that into attack angle. Engine-run at plane 55°: x −6 cm → +2.35° up, x 0 → exactly 0.00°, x +10.5 cm → −4.11° down, x +15 → −5.88°.","typicalRange":"irons: low point 2–15 cm ahead of the ball (the engine's own 'Pure' window, ideal centre +10.5 cm); driver: at or behind the ball"},{"name":"The radius (R = 1.2 m)","role":"The circle's size sets how fast attack angle changes per centimetre of low point. theta = asin(−xLP/R): a bigger circle is flatter near its bottom, so the same offset produces a gentler angle.","typicalRange":"fixed at 1.2 m in the engine — roughly a mid-iron swing radius"},{"name":"Club path, riding along (G-3)","role":"The same geometry moves the head's horizontal direction: strike before the bottom and the head still travels slightly rightward/outward. Engine-run, swing direction held at 0: x +10.5 cm gives path +2.88°, x +15 gives +4.13°. Attack and path are two shadows of one place on the circle.","typicalRange":"≈ +0.28° of in-to-out path per cm of low point ahead (plane 55°)"},{"name":"What it is NOT: depth","role":"lowPoint.x says where along the line the bottom sits. How DEEP the bottom sits (lowPoint.z) is a different axis with a completely different job — the next lesson. Trailer, engine-run: attack angle at z −30 mm, 0 and +30 mm is −4.11°, −4.11°, −4.11°.","typicalRange":"see the Strike Depth lesson"}],"howTheyConnect":"Think of the swing as a wheel rolling through the hitting area, and the ball as a stone on the ground somewhere along its path. Nothing about the wheel changes — only where the stone sits. If the stone is before the wheel's lowest point, the rim is still travelling downward when it hits; past the lowest point, upward. That is the entire mechanism: attack angle is not a move you make at the ball, it is an address — where you placed the bottom of your circle. The engine says it in two lines: theta = asin(−xLP/R) (where is the ball on the circle?) and attackAngle = atan2(sinθ·sinφ, hypot(cosθ, −sinθ·cosφ)) (what direction is the rim moving there?). Two things follow that most golfers have backwards. First, the slope is gentle and linear-ish in the playable zone — about 0.4° per cm (engine-run: 5.1° of attack across the 13 cm from x +2 to x +15) — so small setup drifts make small, predictable attack changes; nobody 'suddenly' hits 5° steeper without the bottom of their circle moving a lot. Second, the far end bites in two separate stages, and they are not the same event. The band chip leaves Pure the instant the low point passes +15 cm — that is the window rule LP_AHEAD_MAX, not a blade: engine-run at x +15.01 the club is still only 7.7 mm up the ball (the ball is 42.6 mm tall), attack −5.88°. The actual blade comes much later: clubZ climbs with 1−cosθ, so it only reaches equator height (21.3 mm) at x ≈ +24.85 cm, attack −9.8°, and the club clears the ball entirely at +29.3 cm. So Thin covers a long stretch where the strike is merely shallow before it becomes a genuine top. Steep and thin are neighbours, which is why chasing an ever-more-forward low point without depth control tops the ball. The low point is the cause; attack angle, path nudge, contact height and the divot are all effects read off the same circle.","hierarchy":[{"driver":"Ball position / low-point offset (x)","weight":"dominant — ~0.39°/cm ≈ 1.0°/inch (engine-run: +2 cm → −0.78°, +15 cm → −5.88°, plane 55°)","why":"It is the direct argument of thetaAtImpact(). Nothing else in the geometry moves attack angle as much for a realistic change."},{"driver":"Swing plane angle (φ)","weight":"secondary multiplier — ~0.05° more downward attack per degree of plane (engine-run at x +10.5: plane 40° → −3.22°, 70° → −4.72°, i.e. −0.050°/°)","why":"vz = sinθ·sinφ — a steeper plane converts the same circle-position into more vertical motion. Taught fully in lesson 3."},{"driver":"Low-point depth (z)","weight":"ZERO — exactly 0.00° per mm (engine-run: −4.11° at z −30/0/+30 mm)","why":"deriveImpact() never reads lowPoint.z. Depth changes what the strike hits, never the angle it arrives at — the whole point of the next lesson."}],"realWorld":{"tourBenchmarks":["Launch monitors measure this directly: TrackMan's \"Low Point\" number reports cm ahead (A) or behind (B) the ball — tour iron strikes typically bottom out ~7–10 cm ahead, exactly the middle of this app's own Pure window (2–15 cm, ideal +10.5 cm)","Engine cross-check: the ideal +10.5 cm low point at the default 55° plane computes to −4.1° attack — landing on the tour mid-iron −4°..−5° benchmark from the Attack Angle lesson","Tour driver setups place the ball forward specifically to move the strike past the low point — the same single variable, used in the opposite direction"],"scenarios":["Ball creeping back in the stance during a range session — attack quietly steepens ~1° per inch until strikes feel \"trapped\"","The fairway-wood off a tight lie that only works when the low point is barely ahead — the geometry's narrow Pure window at small x, made visible","A \"steep\" swing diagnosed on video that is really a ball position problem — the circle is fine, the stone moved"],"whatItMeansForYou":"Stop thinking of attack angle as something your hands do at impact and start thinking of it as somewhere the bottom of your circle sits. With irons, that bottom belongs a hand-width ahead of the ball; move the ball, not your swing, and watch the attack readout follow at about a degree per inch. When a strike pattern changes overnight, ask \"where is my bottom?\" before asking \"what is wrong with my swing?\"."},"misconceptions":["\"Attack angle is created at impact with the hands.\" It is set by where the low point sits, decided at address and by the swing's overall shape — the engine computes it from lowPoint.x and plane alone; nothing hand-shaped is in the formula.","\"Hitting down means the low point is AT the ball.\" Backwards — hitting down means the low point is AHEAD of the ball; the club passes the ball on its way down to a bottom that comes later.","\"More forward low point is always better ball-striking.\" Only inside the window. At z = 0 the engine drops out of Pure the moment the low point passes +15 cm, and contact climbs past the ball's equator — a real blade — at ~+24.85 cm. Steep and thin are neighbours.","\"The low point is where the divot is deepest, so it's behind the ball on good strikes.\" On a good iron strike the low point (and the whole divot) is ahead of the ball — ball first, then turf.","\"A degree of attack angle needs a big swing change.\" ~1° per inch of ball position (engine-run 0.39°/cm) — it is one of the cheapest numbers in golf to move.","\"Low point and attack angle are the same thing.\" One is a place (cm), the other is a direction (degrees) read off that place; lesson 2 shows a third quantity (depth) that moves neither."],"wolframChecks":["thetaAtImpact/deriveImpact sweep, plane 55°, z 0: x −6 cm → attack +2.35°, x 0 → 0.00°, x +2 → −0.78°, x +10.5 → −4.11°, x +15 → −5.88°, x +25 → −9.83° (Thin, contact +0.3 mm above equator), x +30 → −11.82° (Whiff)","slope check: (−5.88 − (−0.78))/13 cm = 0.392°/cm ≈ 1.00°/inch — the range rule of thumb, derived","path coupling: same sweep, clubPath +0.55° (x +2) → +2.88° (x +10.5) → +4.13° (x +15) — deriveImpact's swingDirection term held at 0","band flips (strikeQuality, z=0, plane 55°, swept in 0.01 cm steps): x < 0 → Fat (low point behind) everywhere the instrument can go (slider stops at ±20 cm; the Fat label only lapses past −24.84 cm, off-slider), x 0 up to just under +2 → Thin (\"not far enough ahead\" — engine-run: Thin at exactly x 0), +2.00..+15.00 → Pure, +15.01..+29.33 → Thin, ≥ +29.34 → Whiff — the Pure edges are LP_AHEAD_MIN/MAX 0.02/0.15 exactly","sanity: arcPosition(thetaAtImpact(state), state) lands at the ball (x = y = 0.0 mm) for swing directions −6, 0, +5 — the address-compensated lpWorld() keeps impact at the ball, so every drawn number belongs to the same strike"],"quiz":[{"q":"In the engine, what single input does thetaAtImpact() use to locate the ball on the swing's circle?","options":["The golfer's grip pressure","The low point's position along the target line (lowPoint.x)","The club's loft","The depth of the divot"],"answerIndex":1,"explanation":"theta = asin(−effectiveLpx/R). Grip and loft never enter; depth (z) belongs to the next lesson and moves contact, not angle."},{"q":"A well-struck 7-iron hits down about 4°. Where is the low point?","options":["Exactly at the ball","About 10 cm ahead of the ball","About 10 cm behind the ball","Wherever the hands release"],"answerIndex":1,"explanation":"Engine-run: x +10.5 cm → −4.11° at the default 55° plane. Down means the bottom comes AFTER the ball."},{"q":"Roughly how much attack angle does one inch of ball position buy?","options":["~1°","~5°","~0.1°","It depends only on swing speed"],"answerIndex":0,"explanation":"0.39°/cm engine-run = ~1.0°/inch. Speed is nowhere in the geometry."},{"q":"You keep pushing the low point further and further ahead of the ball (depth unchanged). What does the engine eventually do?","options":["The strike gets purer forever","The ball is bladed — contact climbs to the equator and the band flips to Thin","The attack angle stops changing","The divot gets deeper"],"answerIndex":1,"explanation":"At x +25 cm (z = 0) contact height reaches +0.3 mm above the equator — Thin at −9.8° attack. Steep and thin are neighbours."},{"q":"Moving the low point ahead also nudges which other delivery number, according to the same circle geometry?","options":["Club path (slightly more in-to-out)","Clubhead speed","Face angle","Ball compression"],"answerIndex":0,"explanation":"Engine-run: path +0.55° → +4.13° as x goes +2 → +15 cm (swing direction fixed 0). Attack and path are two shadows of one place on the circle."}]}
  </script>
  <script type="application/json" id="lesson-strike-depth">
{"parameter":"Strike Depth","oneLiner":"Depth is the forgotten axis of the low point: how far below (or above) the turf the bottom of your circle sits. It decides what you hit — turf first, ball first, equator, or air — and it never changes your attack angle by even a tenth of a degree.","whatItIs":"Strike depth is lowPoint.z — the height of the arc's bottom relative to the ground. Where lesson 1's x-axis answered \"down or up?\", the z-axis answers \"how much ball, how much earth?\". The engine keeps the two jobs perfectly separate: deriveImpact() (attack angle) never reads z at all — engine-run, attack is −4.11° whether the bottom sits 30 mm below the turf or 30 mm above it — while clubBallContact() moves the contact point on the ball exactly one millimetre per millimetre of depth (clubZ = lowPoint.z + lift). Between the two extremes lives every strike you know: bottom far below turf = the club is underground at the ball (Fat, then Duff); bottom just below = ball first, then a divot ahead (Pure); bottom above the turf = a clean pick with no divot at all — which, and this is the part almost everyone has backwards, can still be a steeply descending blow. The divot is testimony about the arc's DEPTH; it says nothing about the arc's DIRECTION at the ball.","components":[{"name":"lowPoint.z — the depth dial","role":"Moves contact height 1:1: clubZ = z + lift(θ). Engine-run at x +10.5/plane 55: z −30 mm → Duff, −25..−4 → Fat, −2..+15 → Pure, +18..+25 → Thin, +30 → Whiff. Every band edge is just the contact tick crossing a line on the ball.","typicalRange":"playable window ≈ −8 mm (deepest ball-first, far-forward low point) to +15 mm (still Pure); the Geometry screen's depth control allows ±5 cm, this lesson's diagram ±3 cm"},{"name":"lift(θ) — how much the arc has climbed at the ball","role":"Because the ball sits BEFORE the bottom (lesson 1), the club is still above its own low point when it arrives: lift = R(1−cosθ)sinφ. Engine-run lift table (plane 55): low point +2 cm ahead → 0.1 mm of lift, +8 → 2.2 mm, +10.5 → 3.8 mm, +15 → 7.7 mm. Lift is the divot budget: it is exactly how deep the bottom may sit below turf while the BALL is still struck cleanly.","typicalRange":"0–8 mm across the Pure window"},{"name":"The divot pair (entry/exit)","role":"Where the arc crosses the turf: groundCrossingTheta0() gives ±θ₀; entry before the bottom, exit after. Engine-run: x +10.5, z −2 mm → divot starts +2.8 cm AFTER the ball, 15.3 cm long — the tour pattern; x +2, z −4 mm → starts 8.8 cm BEHIND the ball — the fat. Same depth axis, opposite stories, because x decides where the dip lands.","typicalRange":"good iron strike: entry 0–5 cm after the ball; model depths are mm-scale (see honesty note)"},{"name":"Contact height on the ball (the \"height\" of the title)","role":"clubBallContact().offset = clubZ − ball radius, the tick on the ball face. −21.3 mm = struck at the very bottom, 0 = equator (blade), above that Thin — and only past +8.5 mm (clubZ above 1.4 ball radii = 29.8 mm) does the club clear the ball entirely: Whiff. This — not divot depth — is what \"hitting down on the ball\" actually moves.","typicalRange":"Pure band: contact 2.5–19.5 mm below the equator (offset −19.5..−2.5 mm engine-run at x +10.5)"}],"howTheyConnect":"Hold the picture from lesson 1 — the wheel and the stone — and now raise or lower the whole wheel. Nothing about \"down or up at the stone\" changes: the rim arrives at the same angle whether the wheel's bottom hangs a centimetre into soft ground or floats a centimetre above it. The engine proves the separation exactly: attack angle at z −30, 0 and +30 mm is −4.11°, −4.11° and −4.11°. What DOES change is what the rim meets. Lower the wheel and the contact point slides down the ball millimetre for millimetre until the rim is below the grass at the ball — turf first, fat. Raise it and contact slides up the ball toward the equator — thin, then air. The two pearls of this chapter both live here. Pearl one: a DEEP bottom does not mean hitting far down ON the ball, because x sets how much of that depth has already been climbed away when the club reaches the ball. Engine-run: a −4 mm bottom at x +10.5 strikes at −0.2 mm (leading edge a hair under the grass), and a −6 mm bottom at x +13 strikes at the SAME −0.2 mm — half again more divot depth, identical height on the ball. Divot depth and strike height are different measurements of different things. Pearl two, the inverse: NO divot does not mean a shallow blow. Put the bottom 2 mm ABOVE the turf with the low point 15 cm ahead and the engine reports attack −5.88° — steeper than the tour 7-iron average — with zero turf contact and a Pure band. A clean picker can be the steepest hitter on the range; the grass just never got to testify. And the fat you feel when the bottom is barely ahead of the ball is the same geometry running backwards: at x +2 the divot budget is 0.1 mm — the club has essentially no lift left at the ball, so ANY depth at all digs in behind it (engine-run: z −4 at x +2 → entry 8.8 cm behind the ball). Depth chooses what you hit; x chooses where the dip lands; the angle was never up for negotiation.","hierarchy":[{"driver":"lowPoint.z","weight":"total control of contact height — 1.000 mm per mm (clubZ = z + lift, engine identity)","why":"It is an additive term. The band chip is a pure function of where the tick lands."},{"driver":"lowPoint.x (via the lift budget)","weight":"sets how much depth is survivable — budget 0.1 mm at x +2 cm up to 7.7 mm at x +15 (engine lift table)","why":"Ball-first requires clubZ ≥ 0 at the ball, i.e. z ≥ −lift(θ). Forward low point = bigger budget = deeper clean divots."},{"driver":"Attack angle","weight":"ZERO influence in either direction — depth does not move attack (−4.11° at any z) and attack does not require turf (Pure at z +5 mm)","why":"deriveImpact() and groundCrossingTheta0() share no variable except through x and plane. The divot and the angle are witnesses to different events."}],"realWorld":{"tourBenchmarks":["Tour iron divots start AFTER the ball — the model reproduces the pattern at x +10.5, z −2 mm: divot entry +2.8 cm past the ball, exit +18.2 cm (a bacon-strip ~15 cm long)","Plenty of elite players are \"pickers\" — clean, divotless iron strikes with completely normal descending attack angles; TrackMan classes them by low point ahead, not by turf taken","The engine's own Pure window tops out at a 7.7 mm model divot — real divots read deeper (1–2 cm) because a real sole passes below the ball while the FACE strikes it; the point-club model compresses that (honesty note G-1)"],"scenarios":["Range mats hiding a fat pattern: the mat pays the depth penalty the turf would — the bottom sits below \"grass\" but the club skids instead of digging. Same z, kinder surface","\"I took no divot so I must have picked it clean/shallow\" — the picker with a steep, perfectly fine strike (pearl b), and the scooper who ALSO takes no divot but with the bottom behind the ball: same missing divot, opposite geometry","Wet vs firm turf changing effective depth: soft ground effectively raises z's cost — the same swing that brushed dry turf digs on soggy ground"],"whatItMeansForYou":"Read your strikes as two separate dials. The divot (its start point and existence) reports your DEPTH and your x; the flight's steepness reports your x and plane. When contact is heavy, you don't necessarily \"swing too steep\" — your circle's bottom may simply sit too low, or not far enough ahead. And when you take no divot at all, don't assume shallow: check where the strike met the ball. Fixing the right dial is the difference between a setup adjustment and six months of rebuilding a swing that was never broken."},"misconceptions":["\"A deep divot means I hit steeply down on the ball.\" Divot depth is z; attack is x-and-plane. Engine: −4 mm and −6 mm bottoms both strike the ball at −0.2 mm when x compensates — more earth, same ball.","\"No divot = shallow attack angle.\" The engine's cleanest counterexample: bottom 2 mm above turf, low point 15 cm ahead → attack −5.88°, no turf, Pure. The divot testifies about depth, never direction.","\"Hitting down digs the club into the ground, so hitting down causes fat shots.\" Fat is depth-behind-the-ball. A steeper descending strike with the bottom well ahead takes turf AFTER the ball; the fat happens when the bottom (however shallow) sits barely ahead or behind.","\"The strike bands (Pure/Thin/Fat) are judgements about my swing.\" They are a ruler on the ball: the engine flips band exactly when the contact tick crosses a line (turf level, equator, 1.4 ball-radii). Move z one millimetre across an edge and the word changes.","\"To stop blading it, help the ball up.\" Thin contact = tick too high = bottom too high (or x too far forward). Raising the hands raises the bottom further. The fix is down and/or less far forward — the opposite instinct.","\"Divots should start at the ball.\" At the ball is the boundary case; the tour pattern starts 2–5 cm after it (engine: +2.8 cm at the ideal x, 2 mm depth). Starting AT or BEFORE the ball is the first warning of a depth/x budget problem."],"wolframChecks":["invariance: deriveImpact attack = −4.11° at lowPoint.z ∈ {−0.030, 0, +0.030} m (x +10.5 cm, plane 55°) — identical, structurally: deriveImpact() has no z term at all","contact 1:1: clubBallContact clubZ at z −10/0/+10 mm = −6.2/+3.8/+13.8 mm — slope exactly 1 mm/mm; offset vs ball equator −27.5/−17.5/−7.5 mm","band ladder at x +10.5: z −30 Duff · −25 Fat(edge) · −4 Fat (clubZ −0.2) · −2 Pure (divot +2.8..+18.2 cm) · +15 Pure (offset −2.5) · +18 Thin (offset +0.5) · +30 Whiff (clubZ 33.8 > 1.4·ball radius 29.8)","pearl (a) triple: (x+10.5, z−4) clubZ −0.2 mm & (x+13, z−6) clubZ −0.2 mm — deeper bottom, same strike height; (x+2, z−4) clubZ −3.9 mm, turf entry −8.8 cm (fat) — same depth, budget blown","pearl (b) triple: (x+15, z+2) attack −5.88°, groundCrossingTheta0 = null (no turf), band Pure 79; inverse (x+15, z−7.7) attack −5.88°, divot 0→+30 cm, 7.7 mm deep, Pure 70","lift budget table: deepest ball-first z = −0.1/−0.9/−2.2/−3.8/−5.8/−7.7 mm at x +2/+5/+8/+10.5/+13/+15 cm (clubZ(z=0) per x — engine-run)"],"quiz":[{"q":"In the engine, what happens to attack angle when you move the low point 3 cm deeper into the turf (x unchanged)?","options":["It gets ~3° steeper","Nothing — exactly 0.0° of change","It gets shallower as the club decelerates","It depends on club speed"],"answerIndex":1,"explanation":"deriveImpact() never reads lowPoint.z. Engine-run: −4.11° at z −30, 0 and +30 mm. Depth moves WHAT you hit, not the angle you arrive at."},{"q":"Player A's circle bottoms 4 mm under the turf, 10.5 cm ahead of the ball. Player B's bottoms 6 mm under, 13 cm ahead. Who strikes lower on the ball?","options":["B — deeper bottom means hitting further down on the ball","Neither — both strike at the same height (engine: −0.2 mm for both)","A — shallower divots always strike lower","Cannot be known without swing speed"],"answerIndex":1,"explanation":"clubZ = z + lift(x): B's extra 2 mm of depth is paid for by 2 mm more lift from the more-forward bottom. Divot depth and strike height are different measurements — the owner's pearl, computed."},{"q":"A golfer never takes a divot. What does that tell you about their attack angle?","options":["It must be shallow or level","It must be positive (hitting up)","Nothing — the engine shows −5.9° down with zero turf contact (bottom 2 mm above the grass, 15 cm ahead)","They must be topping the ball"],"answerIndex":2,"explanation":"The divot testifies about the arc's DEPTH, not its DIRECTION. A picked strike from a bottom just above the turf can be steeper than the tour average — Pure band, no grass harmed."},{"q":"Why does the tour divot start AFTER the ball?","options":["Because the club bounces off the ball first","Because the arc's bottom — and therefore its below-turf dip — sits ahead of the ball","Because tour players hit up on their irons","It doesn't — good divots start at or behind the ball"],"answerIndex":1,"explanation":"Engine-run: x +10.5, z −2 mm → turf entry +2.8 cm past the ball, exit +18.2 cm. Ball first at −4.1° down, then the dip."},{"q":"Same 4 mm depth, but the low point only 2 cm ahead of the ball. The engine says:","options":["Pure — depth is fine at any x","Fat — turf entry 8.8 cm BEHIND the ball, because the lift budget at x +2 is only 0.1 mm","Thin — less forward always thins it","Whiff"],"answerIndex":1,"explanation":"Ball-first needs z ≥ −lift(x). The budget grows with x: 0.1 mm at +2 cm, 3.8 mm at +10.5, 7.7 mm at +15. Depth is only survivable when the bottom is far enough ahead."}]}
  </script>
  <script type="application/json" id="lesson-plane-coupling">
{"parameter":"Plane Coupling","oneLiner":"Plane, swing direction and low point are not three settings — they are one linked system. Turn any one of them and the engine moves your real, effective low point for you, whether you meant it or not.","whatItIs":"The x-axis low point you learned in lesson 1 is where the bottom sits if you swing straight down the line. Rotate the swing direction and the whole tilted circle rotates with it — and because the circle is tilted (the plane), rotating it slides the bottom along the target line. The engine does this bookkeeping in one line, effectiveLpx(): xLP(effective) = lowPoint.x − swingDirection · R·cos(plane)·π/180. The coupling constant R·cos(plane) is the part worth tattooing somewhere: it says the FLATTER your plane, the more every degree of swing direction drags your low point around — engine-run: 1.48 cm per degree at a 45° plane, 1.20 at 55°, only 0.72 at 70°. Plane also has the direct effect from lesson 1 (steeper plane = more attack per cm, ~+0.05°/° of plane) and it sets the lift budget from lesson 2. Which is why the chapter ends here: x, z and plane are not tuned separately. A change of swing direction that means nothing on a steep plane can silently move a flat-plane player's bottom from \"hand-width ahead\" to \"behind the ball\" — same ball position, same feel, completely different strike.","components":[{"name":"The coupling constant R·cos(plane)","role":"How many cm of low point one degree of swing direction is worth. Engine-run: 1.481 cm/° (plane 45), 1.201 (55), 0.716 (70). Flat planes pay the steepest exchange rate.","typicalRange":"0.7–1.5 cm per degree over the instrument's 45–70° plane range"},{"name":"Swing direction (dir)","role":"Positive = in-to-out. It shifts the effective bottom BACKWARD (a positive dir subtracts from xLP): swing out to right field and your bottom arrives earlier. Engine-run at plane 45, x +10.5: dir +8 → effective x −1.3 cm (behind the ball!), attack +0.46°, Fat. The same +8 at plane 70 keeps +4.8 cm, −2.14°, Pure.","typicalRange":"±8° on the instrument; ±4° covers most real patterns"},{"name":"Out-to-in, the other direction","role":"Negative dir ADDS effective low point and steepens everything: plane 45, dir −8 → effective x 22.3 cm, attack −7.57°, band Thin (contact riding up the ball). The classic over-the-top strike — steep, forward-bottomed, prone to thin/heel — emerges from pure geometry with no \"swing flaw\" narrative needed.","typicalRange":"each −1° of direction ≈ +0.7..1.5 cm of effective low point, by plane"},{"name":"Plane's own two dials (recap)","role":"Direct: same x reads steeper on a steeper plane (engine-run at x +10.5: −3.22° at 40°... −4.72° at 70°, ~+0.05°/°). Budget: steeper plane lifts the club more at the ball (clubZ 3.0 → 4.3 mm across 40→70°), slightly widening the clean-divot window. Plane is a multiplier on both earlier lessons.","typicalRange":"45–70° on the instrument; engine default 55°"}],"howTheyConnect":"Picture the tilted hula-hoop of your swing lying at its plane angle, its lowest point marked with chalk. Now rotate the whole hoop a few degrees to the right, as an in-to-out swinger does. The chalk mark doesn't stay put — it slides around the hoop, and because the hoop is tilted, \"around the hoop\" has a component ALONG the target line. That slide is the coupling, and its size is R·cos(plane): a flat hoop's bottom lives far from the pivot horizontally, so rotation swings it a long way (1.48 cm/°); a steep hoop's bottom sits nearly under the pivot, so the same rotation barely moves it (0.72 cm/°). Everything the chapter taught now runs through this one line. The engine's own numbers, low point held at +10.5 cm and depth z = 0 — the arc's bottom exactly at the turf surface, so every band change below comes from the coupling and nothing else: a flat-plane player (45°) who starts swinging +8° in-to-out watches the effective bottom move to 1.3 cm BEHIND the ball — attack flips to +0.5°, the divot jumps behind the ball, the band reads Fat — while nothing about their ball position or depth changed. The steep-plane player (70°) making the identical direction change keeps the bottom 4.8 cm ahead and stays Pure. Read that Pure carefully: it survives on 0.9 mm of club height, so a real 1–2 mm turf brush (z = −0.002) tips it to Fat as well (engine: clubZ −1.11 mm). What the steep plane actually protects is the LOW POINT — +4.8 cm ahead versus −1.3 cm behind — and that number does not depend on depth at all. Run it the other way and the over-the-top move (−8° at 45°) piles up 22.3 cm of effective low point: attack −7.6°, contact climbing the ball, Thin. This is what \"must cohere\" means: x, z, plane and direction are four inputs to ONE circle, and the strike bands only reward combinations that agree. It is also why the same swing-direction tip helps one golfer and wrecks another — the exchange rate depends on the plane they brought with them.","hierarchy":[{"driver":"Swing direction × the coupling (dir · R·cos φ)","weight":"dominant mover of the EFFECTIVE low point — up to ±12 cm across the ±8° slider on a flat plane (engine-run: effLpx 22.3 → −1.3 cm at plane 45)","why":"It is the only term in effectiveLpx() besides x itself. On flat planes it can outmuscle deliberate ball-position changes."},{"driver":"Plane angle (as the exchange-rate setter)","weight":"halves the coupling across the slider range (1.48 → 0.72 cm/° from 45° to 70°)","why":"cos(plane) — the flat plane's bottom sits far from the pivot horizontally; rotation moves it more."},{"driver":"Plane angle (direct steepness)","weight":"secondary — ~+0.05° attack per degree of plane at fixed x (−3.55° → −4.72° across 45–70°)","why":"vz = sinθ·sinφ, the lesson-1 multiplier — real, but small per unit: 1° of plane buys the same attack change as 0.13 cm of ball position (0.050 vs 0.392 ° per unit, engine-run at plane 55). It is roughly a third of the ball-position lever only when you compare full ranges: the whole 45→70° plane sweep moves attack 1.17°, a hand-width (8 cm) of ball position moves it 3.14°."}],"realWorld":{"tourBenchmarks":["TrackMan's classic pairing: out-to-in swings measure steeper attack, in-to-out swings shallower — the engine derives it (dir −8 → −7.6°, dir +8 → +0.5°, plane 45, same ball position) rather than asserting it","Flat-plane \"rotary\" players are famously sensitive to start-direction changes turning into contact changes; upright players get away with more — the cos(plane) exchange rate, named","The fitter's cross-check: a player who \"suddenly hits it fat\" after learning to draw the ball (in-to-out shift) hasn't lost their swing — their effective low point moved back ~1–1.5 cm per degree of direction change"],"scenarios":["The draw project that turned into fat shots: +4° of new in-to-out at a 45° plane = the bottom ~6 cm earlier. From a +7 cm setup that lands the effective bottom at +1.1 cm with 0.03 mm of club height (engine: attack −0.36°, band Thin — and Fat the instant the club brushes any turf). The fix is a ball-position/x compensation, not abandoning the draw","The over-the-top slicer's deep, ball-side divots and occasional thins: −6° direction at a 45° plane piles ~9 cm ONTO the effective low point — steep AND thin-prone at once (engine: effLpx 19.4 cm, attack −6.56°, band Thin)","Why one range tip (\"swing more right\") fixes a steep friend and buries yours: different planes, different exchange rates"],"whatItMeansForYou":"When you change one of the three — plane, direction, or low point — assume the other two moved and go look. The instrument's Geometry screen shows all four numbers live; the cheapest habit in this chapter is checking the EFFECTIVE low point readout after any direction change. If you swing in-to-out on a flatter plane, your real bottom lives closer to the ball than your setup says — budget for it with ball position before you blame your contact."},"misconceptions":["\"Swing direction only changes where the ball starts, not how I strike it.\" Direction moves your effective low point 0.7–1.5 cm per degree (plane-dependent). At a flat plane, +8° in-to-out relocates the bottom behind the ball — a Fat, from a direction change alone.","\"Steep plane = steep attack = digging.\" Partly true (−0.05°/° direct effect) but the steep plane is the STABLE one under direction changes (0.72 vs 1.48 cm/°) and carries a bigger lift budget at the ball. Steepness where it matters is mostly x, not plane.","\"In-to-out is the shallow, safe pattern.\" Shallower in angle, yes (engine: +8° dir at plane 45 → attack +0.46°) — but it drags the bottom BACK, which is the fat direction. Safe only if ball position compensates.","\"Over-the-top means fat shots.\" Usually the opposite: out-to-in ADDS effective low point ahead (engine: 22.3 cm at −8°/plane 45) — steep contact climbing the ball: thin, not fat, is its signature miss.","\"These are three independent sliders.\" One formula binds them: xLP_eff = x − dir·R·cos(plane)·π/180. The chapter exists because they must cohere.","\"The coupling is a quirk of this app.\" It is rigid-circle trigonometry — any tilted circle's bottom slides along the line when the circle rotates. The engine just makes the constant visible."],"wolframChecks":["effectiveLpx coupling per +1° of swing direction: −1.481 cm (plane 45), −1.201 (55), −0.716 (70) — engine-run finite difference, matches R·cos(φ)·π/180 with R = 1.2 m","flat-plane flip: x +10.5, plane 45: dir +8 → effLpx −1.3 cm, attack +0.46°, band Fat; dir −8 → effLpx 22.3 cm, attack −7.57°, band Thin — full Fat↔Thin traverse from direction alone","steep-plane stability: x +10.5, plane 70: dir +8 → effLpx +4.8 cm, attack −2.14°, Pure; dir −8 → 16.2 cm, −7.30°, Thin — half the excursion","plane direct effect at fixed x +10.5, dir 0: attack −3.22/−3.55/−4.11/−4.72° at plane 40/45/55/70 (≈ +0.05°/°); lift 3.0/3.3/3.8/4.3 mm","address-compensation sanity under coupling: arcPosition(thetaAtImpact) = (0.0, 0.0) mm at dir −6/0/+5 — lpWorld()'s stance shift keeps impact at the ball, so the coupling numbers are strike-for-strike comparable","depth convention: every band and lift figure in this lesson is engine-run at lowPoint.z = 0 (arc bottom at the turf surface). effLpx, attack and clubPath are z-independent; clubZ shifts 1:1 with z, so a 2 mm turf brush subtracts 2.0 mm from every lift figure — which flips plane 70/dir +8 from Pure (clubZ 0.89 mm) to Fat (−1.11 mm)","draw-project case: x +7 cm, plane 45, dir 0 → effLpx 7.00 cm, attack −2.36°, Pure; dir +4 → effLpx 1.08 cm, attack −0.36°, clubZ 0.03 mm, band Thin — ball position untouched, direction alone"],"quiz":[{"q":"The engine computes your EFFECTIVE low point as lowPoint.x − dir·R·cos(plane)·π/180. What does swinging more in-to-out (positive dir) do?","options":["Moves the effective bottom backward, toward/behind the ball","Moves it further ahead","Nothing until dir exceeds 8°","Changes depth (z)"],"answerIndex":0,"explanation":"Positive dir subtracts. Engine-run at plane 45: +8° moves a +10.5 cm bottom to −1.3 cm — behind the ball."},{"q":"Who feels a 3° swing-direction change more in their strike?","options":["A flat-plane (45°) swinger — ~1.5 cm of low point per degree","A steep-plane (70°) swinger — ~0.7 cm per degree","Both the same — direction is direction","Neither — direction never affects strike"],"answerIndex":0,"explanation":"The exchange rate is R·cos(plane): 1.48 vs 0.72 cm/°. Flat planes pay double."},{"q":"An over-the-top (out-to-in) move at a flattish plane most characteristically produces:","options":["Fat shots — it digs behind the ball","A steeper attack AND thin-prone contact — the effective bottom piles up far ahead","A shallower attack","No strike change, only a pull"],"answerIndex":1,"explanation":"Engine-run: dir −8, plane 45 → effLpx 22.3 cm, attack −7.6°, band Thin. Steep and thin arrive together — lesson 1's neighbours, delivered by direction."},{"q":"You've been learning a draw (+4° in-to-out, plane ~45°) and suddenly hit it heavy. The chapter's diagnosis?","options":["You lost your swing — rebuild it","Your effective low point moved ~6 cm back with the new direction; compensate with ball position/x","You're now too steep","Your depth (z) changed on its own"],"answerIndex":1,"explanation":"4° × 1.48 cm/° ≈ 5.9 cm of effective low point, gone backward. Engine-run from a +7 cm setup: the bottom lands at +1.1 cm with 0.03 mm of clearance — turf-first on any real brush. Same swing, same depth — the coupling moved the bottom."},{"q":"Why does the same \"swing more right\" tip fix one golfer's strike and ruin another's?","options":["Golf tips are random","Their planes differ, so the cm-per-degree exchange rate differs — the coupling is plane-dependent","One of them has a faster swing","Direction only matters for lefties"],"answerIndex":1,"explanation":"R·cos(plane): the tip moves a 70°-plane bottom 0.72 cm/° but a 45°-plane bottom 1.48 cm/°. Same advice, double the dose."}]}
  </script>

  // Long-form authored CONTENT lives in <script type="application/json"> blocks

    backspin: JSON.parse(document.getElementById('lesson-backspin').textContent),
    carry:    JSON.parse(document.getElementById('lesson-carry').textContent),

    apex:              JSON.parse(document.getElementById('lesson-apex').textContent),
    'landing-angle':   JSON.parse(document.getElementById('lesson-landing-angle').textContent),
    total:             JSON.parse(document.getElementById('lesson-total').textContent),
    curve:             JSON.parse(document.getElementById('lesson-curve').textContent),
    offline:           JSON.parse(document.getElementById('lesson-offline').textContent),
    altitude:          JSON.parse(document.getElementById('lesson-altitude').textContent),
    wind:              JSON.parse(document.getElementById('lesson-wind').textContent),
    temperature:       JSON.parse(document.getElementById('lesson-temperature').textContent),
    'low-point':       JSON.parse(document.getElementById('lesson-low-point').textContent),
    'strike-depth':    JSON.parse(document.getElementById('lesson-strike-depth').textContent),
    'plane-coupling':  JSON.parse(document.getElementById('lesson-plane-coupling').textContent),
  };

  /* ── THE LESSONS REGISTRY — single source of truth ─────────────────────────
     renderLesson() renders EVERY lesson from one of these entries; there is no
     per-lesson rendering code. Adding a lesson =
       (1) author a CONTENT JSON block above, and
       (2) add ONE entry here: content (spread) + routing meta + a diagramArchetype
           name + its diagramConfig. The quiz rides inside CONTENT.

  function seed(){

    return normalizeAcademyStore({ version:1, xp:0, lessons, unlocked:[], badges:[], lastOpened:null });
  }
  let storeDiagnostic = null;

  function load(){
    try {
      const raw = localStorage.getItem(STORE_KEY);
      if (!raw) return seed();

      if (!p || p.version !== 1 || !p.lessons) {
        storeDiagnostic = { code:'invalid-shape', message:'Saved Academy progress could not be read. The original value has not been overwritten.' };
        return seed();
      }
      const base = seed();
      // Preserve every historical/future lesson while filling known records.
      const lessons = { ...p.lessons };
      for (const id of LESSON_IDS) {
        const savedLesson = p.lessons[id] || {};
        lessons[id] = { ...base.lessons[id], ...savedLesson,
          journey:mergeLessonJourney(savedLesson.journey)
        };
      }
      return normalizeAcademyStore({ ...base, ...p, lessons,
        unlocked: Array.isArray(p.unlocked)?p.unlocked:base.unlocked, badges: Array.isArray(p.badges)?p.badges:[] });

  function getJourney(id){

  function updateJourney(id, patch, { immediate=false } = {}){
    const lesson = store.lessons[id];
    if (!lesson) return freshLessonJourney();
    const current = getJourney(id);
    const nextPatch = patch && typeof patch === 'object' ? patch : {};
    const myths = Array.isArray(nextPatch.myths)
      ? current.myths.map((value, index) => nextPatch.myths[index] === undefined
        ? value
        : Boolean(nextPatch.myths[index]))
      : current.myths;
    lesson.journey = mergeLessonJourney({
      ...current,
      ...nextPatch,
      mission:nextPatch.mission
        ? { ...current.mission, ...nextPatch.mission }
        : current.mission,
      myths
    });
    if (immediate) saveNow(); else save();
    return lesson.journey;
  }

  function recomputeUnlocks(){
    if (SLICE_MODE){
      // Dependency-graph progression, restricted to AUTHORED modules: the five
      // Fundamentals are graph ROOTS (no predecessors) → available from the start;
      // any authored module whose AUTHORED predecessors are all complete also unlocks.
      // Predecessors are filtered to AUTHORED and to NON-environment tiers: the three
      // Environment nodes are graph SOURCES that modify the Outcomes, so they must never
      // gate an Outcome/Derived module — they unlock as their own capstone chain below.
      for (const n of GRAPH.nodes){
        if (!AUTHORED[n.id]) continue;
        if (NODE[n.id].tier === 'environment') continue;   // Environment handled by the chain below
        const preds = GRAPH.edges.filter(e => e.to === n.id).map(e => e.from).filter(p => AUTHORED[p] && NODE[p].tier !== 'environment');
        const ready = preds.length === 0 || preds.every(p => store.lessons[p] && store.lessons[p].completed);
        if (ready && !store.unlocked.includes(n.id)) store.unlocked.push(n.id);
      }
      // Backspin & Carry ship pre-unlocked as demo modules (their derived predecessors
      // aren't authored in this slice), preserving the original slice behaviour.
      for (const id of ['backspin','carry']) if (!store.unlocked.includes(id)) store.unlocked.push(id);
      // Environment capstone chain: this tier modifies the Outcomes, so it opens once
      // Carry (the central outcome it rescales) is mastered, then unlocks node-by-node —
      // altitude → wind → temperature — mirroring "complete a lesson, unlock the next".
      let envGate = !!(store.lessons.carry && store.lessons.carry.completed);
      for (const id of ['altitude','wind','temperature']){
        if (envGate && !store.unlocked.includes(id)) store.unlocked.push(id);
        envGate = envGate && store.lessons[id] && store.lessons[id].completed;
      }
      return;
    }
    for (const n of GRAPH.nodes){
      const preds = GRAPH.edges.filter(e => e.to === n.id).map(e => e.from);
      const ok = preds.length === 0 || preds.every(p => store.lessons[p] && store.lessons[p].completed);
      if (ok && !store.unlocked.includes(n.id)) store.unlocked.push(n.id);
    }
  }
  function nodeState(id){
    const l = store.lessons[id];
    if (l && l.completed) return 'completed';
    if (AUTHORED[id] && store.unlocked.includes(id)) return 'available';
    return 'locked';
  }

  function nextNodeId(){

    if (store.lastOpened){

  const NUDGE_KEY = 'strikearc.academy.nudge';

  // All haptics route through sa-haptics.js (path-06 / module-anatomy §9): the shared
  // singleton handles the native Capacitor bridge AND the non-native no-op log, so
  // geometry.html / impact.html / academy stay on one contract. Kinds → table:
  //   select = slider detent / relation-select (tick) · light = card tap / verdict ·
  //   medium = tier complete · success = unlock / mastery notify · error = warning.
  function haptic(k){
    try{
      if(k==='select') saHaptics.selectionChanged();
      else if(k==='light') saHaptics.impact('light');
      else if(k==='medium') saHaptics.impact('medium');
      else if(k==='success') saHaptics.notify('success');
      else if(k==='error') saHaptics.notify('warning');
    }catch(e){}
  }

  function fmt(v, dp, commas){
    let n = dp>0 ? Number(v).toFixed(dp) : String(Math.round(v));
    if (commas) n = Number(n).toLocaleString('en-US', { minimumFractionDigits:dp||0, maximumFractionDigits:dp||0 });
    return n;
  }
  // THE signed-minus grammar for every rendered datum: '+' only when signed & positive,
  // U+2212 (never ASCII hyphen) when negative, nothing at zero.
  function signStr(v, signed){ return v<0 ? '−' : (signed && v>0 ? '+' : ''); }
  function setNum(el, to, opts){
    opts = opts || {};
    const dp = opts.dp||0, suffix = opts.suffix||'', prefix = opts.prefix||'', commas = !!opts.commas, signed = !!opts.signed;
    const from = parseFloat(el.dataset.v || '0');
    el.dataset.v = to;
    const render = v => { let core = fmt(Math.abs(v), dp, commas); return prefix + signStr(v, signed) + core + suffix; };
    if (reduced() || Math.abs(to-from) < 0.5 || isNaN(from)){ el.textContent = render(to); return; }
    if (el._raf) cancelAnimationFrame(el._raf);
    const t0 = performance.now(), dur = 180;
    const step = t => { const k = clamp((t-t0)/dur,0,1); const e = 1-Math.pow(1-k,3); const v = from+(to-from)*e; el.textContent = render(v); if (k<1) el._raf = requestAnimationFrame(step); };
    el._raf = requestAnimationFrame(step);
  }

  /* ══ BOTTOM SHEET (spec §3.2 preview / §4 node preview) — replaces the hover tooltip ══ */
  const sheetEl = $('#sheet'), scrimEl = $('#sheet-scrim');
  let sheetTrigger = null, sheetKey = null, sheetOnClose = null, sheetTimer = null;
  const sheetFocusable = () => Array.from(sheetEl.querySelectorAll('button,[href],input,[tabindex]:not([tabindex="-1"])')).filter(e => !e.disabled && e.offsetParent !== null);
  function openSheet(html, opts){
    opts = opts || {};
    /* A close scheduled <240ms ago is still pending. Left running it would blank
       the sheet we are about to fill, fire the PREVIOUS onClose, and steal focus
       back to the previous trigger. Invisible under reduced-motion, where close
       is synchronous. */
    if (sheetTimer){ clearTimeout(sheetTimer); sheetTimer = null; }
    if (sheetKey){ document.removeEventListener('keydown', sheetKey); sheetKey = null; }   // no listener leak on re-open
    /* Truthy, not !== undefined: an explicit null must fall through to the
       activeElement fallback rather than disabling focus return for good. */
    if (opts.trigger) sheetTrigger = opts.trigger;
    else if (sheetEl.hidden) sheetTrigger = (document.activeElement && document.activeElement !== document.body ? document.activeElement : null);
    sheetOnClose = opts.onClose || null;
    sheetEl.innerHTML = html;
    sheetEl.setAttribute('aria-modal', opts.modal ? 'true' : 'false');
    if (opts.labelId) sheetEl.setAttribute('aria-labelledby', opts.labelId);
    sheetEl.hidden = false;
    /* Focus moves in the same frame the sheet starts sliding up, not before it:
       set synchronously the ring sits off-screen at translateY(102%) for the
       whole transition. #sheet carries tabindex="-1" so an empty template still
       lands the user inside the dialog instead of silently leaving them out. */
    requestAnimationFrame(() => {
      if (sheetEl.hidden) return;
      sheetEl.classList.add('open'); if (opts.modal) scrimEl.classList.add('open');
      const foc = sheetEl.querySelector('[data-autofocus]') || sheetFocusable()[0];
      (foc || sheetEl).focus({ preventScroll:true });
    });
    sheetKey = e => {
      if (e.key === 'Escape'){ e.preventDefault(); closeSheet(); return; }
      if (opts.modal && e.key === 'Tab'){ const f = sheetFocusable(); if (!f.length) return; const a = f[0], z = f[f.length-1];
        if (e.shiftKey && document.activeElement === a){ e.preventDefault(); z.focus(); }
        else if (!e.shiftKey && document.activeElement === z){ e.preventDefault(); a.focus(); } }
    };
    document.addEventListener('keydown', sheetKey);
  }
  function closeSheet(restoreFocus, immediate){
    if (sheetEl.hidden) return;
    sheetEl.classList.remove('open'); scrimEl.classList.remove('open');
    if (sheetKey){ document.removeEventListener('keydown', sheetKey); sheetKey = null; }
    const cb = sheetOnClose, t = sheetTrigger; sheetOnClose = null; sheetTrigger = null;
    const finish = () => { sheetEl.hidden = true; sheetEl.innerHTML = ''; if (cb) cb(); if (restoreFocus !== false && t && document.contains(t)) t.focus({ preventScroll:true }); };
    if (immediate || reduced()) finish(); else sheetTimer = setTimeout(finish, 240);
  }
  scrimEl.addEventListener('click', () => closeSheet());

  /* ══ ARCHETYPE GALLERY (dev-only, #/proto) ══
     A hidden preview of every reusable diagram archetype with a demo config, so a
     build agent can see each one live before wiring a lesson to it. Not linked in
     the mastery path. The live carry/backspin lessons reuse their real configs. */
  const PROTO_CONFIGS = {

        {key:'cs', label:'Club speed', min:70, max:130, step:1, value:90, bind:'clubSpeed', unit:' mph', unitSpoken:'miles per hour'},

        {key:'dl', label:'Dynamic loft', min:10, max:55, step:1, value:30, bind:'dynamicLoft', unit:'°', unitSpoken:'degrees'},
        {key:'aa', label:'Attack angle', min:-8, max:8, step:1, value:-3, bind:'attackAngle', unit:'°', unitSpoken:'degrees', signed:true},
      ],

        {name:'Ball speed', est:true, unit:'rpm', value:f=>f.totalSpinRpm*0.4, why:'Real but secondary: over the same sweep ball speed only moves 126.7 → 113.0 mph. This bar is a display share, not an engine split — the engine never separates the two.'},

  function renderProto(){

      body.appendChild(sec);
      try { ARCHETYPES[name]($('#proto-'+name), { config: PROTO_CONFIGS[name], lessonId:null, onTouch:()=>{} }); }
