  <script type="application/json" id="lesson-backspin">{"parameter":"Backspin","oneLiner":"Backspin is the ball's backward rotation — the top spinning back toward you — that generates aerodynamic lift and holds the shot in the air.","whatItIs":"Every well-struck golf shot leaves the face spinning backwards: the top of the ball rotates back toward you at thousands of RPM. That spin drags air faster over the top of the ball than underneath, creating an upward force (the Magnus effect) that fights gravity and keeps the ball climbing long after it \"should\" have fallen. Amounts are big — at 90 mph the engine's 7-iron (30° dynamic loft, -3° attack, so 33° of spin loft) makes 6,623 rpm, a 10°-lofted strike at the same delivery only 2,200, and a full wedge (80 mph, 50° dynamic loft, -3° attack, so 53° of spin loft) is pinned at the engine's 9,000 rpm ceiling — its raw, unclamped value is 9,683. Crucially, backspin is not something you \"add\" with a scoop or a flick of the wrists — it is a by-product of how glancing the strike is (spin loft) and how fast the ball is leaving. The app's engine encodes exactly this: it solves impact for the spin the ball keeps once it stops skidding and starts rolling on the face, out of club speed and true three-dimensional spin loft — with a square face, just dynamic loft − attack angle. No floor underneath it: take spin loft to zero and the engine returns exactly 0 rpm.","components":[{"name":"Spin loft","role":"The master lever. The angle between where the club is travelling and where the face points at impact (dynamic loft minus attack angle). The bigger this gap, the more glancing the blow and the more backspin. It is the only geometric input to the spin magnitude: at 90 mph the engine runs from 1,530 rpm at 9° of spin loft up to the 9,000 rpm ceiling past 41.5°.","typicalRange":"iron ~30-35°, driver ~9-15°, wedge ~40-50°"},{"name":"Dynamic loft","role":"The effective loft actually delivered at impact (not the number stamped on the club). It is the larger half of spin loft and also sets launch height. At 113 mph with a +4° attack, walking dynamic loft 10° → 13° → 16° → 19° walks engine spin 1,283 → 1,920 → 2,552 → 3,178 rpm.","typicalRange":"7-iron ~28-32°, driver ~12-15°"},{"name":"Attack angle","role":"The up/down direction the club is moving through impact. It subtracts from dynamic loft to set spin loft, so hitting down (negative) raises spin loft and spin, hitting up (positive) lowers both. Measured on the engine's driver (113 mph, 13° dynamic loft): -4° attack → 3,590 rpm, 0° → 2,762, +4° → 1,920.","typicalRange":"iron -4 to -2° (down), driver 0 to +5° (up)"},{"name":"Ball speed (via club speed)","role":"An exactly linear multiplier on spin. Hold spin loft and the engine returns the same rpm-per-mph every time: at 33° of spin loft it is 54.04 rpm for each mph of ball speed, so 108.94 mph → 5,887 rpm and 136.18 mph → 7,359 rpm. Double the ball speed, double the spin.","typicalRange":"7-iron ball ~110-125 mph, driver ~165-172 mph"},{"name":"Friction / strike quality","role":"The on/off gate — and the one component the five-input engine does not model. Grooves, ball cover (urethane vs surlyn), a clean dry face, the lie, and moisture decide whether the glancing blow can actually grip. Grass or water between ball and face makes it slide instead of spin (a 'flyer'). The engine assumes clean contact, so a flyer is a real-world subtraction from the number it shows.","typicalRange":"clean dry urethane = full spin; flyer/wet can cut 20-50% (2,000+ rpm off a wedge)"},{"name":"Air & conditions","role":"Does not change spin at the face, but re-shapes what that spin does in flight. Denser air (cold, sea level) gives the spin more lift but shorter carry; thin air (altitude, heat) carries farther but the spin lifts less.","typicalRange":"Denver air ~14% thinner than sea level; 0 C air ~10% denser than 30 C"}],"howTheyConnect":"Contact between clubface and ball lasts about half a millisecond. In that instant the ball is compressed against the face, and because the face is not pointing exactly where the club is travelling, the ball skids up the face. Friction resists that skid and rolls the ball backwards — the larger the mismatch (spin loft), the more glancing the blow and the more skid there is to convert into spin. The engine models that ending rather than fitting a curve to it: it solves for the spin the ball carries away at the moment skidding turns into rolling on the face, set by ball speed and true three-dimensional spin loft. Only spin loft and speed enter it. Two shots with the same spin loft built completely differently come out identical: at 90 mph, a -6° attack with 27° of dynamic loft and a level 0° attack with 33° of dynamic loft both read 33° of spin loft, both leave at 122.56 mph, and both spin exactly 6,623 rpm — the divot has no vote. At 90 mph with a square face the ladder runs 2,200 rpm at 13° of spin loft, 3,843 at 23°, 6,623 at 33° and 8,711 at 40°; run spin loft the other way and spin falls continuously to nothing — 682 rpm at 4°, 341 at 2°, and exactly 0 at 0°. That ladder is not a straight line. The engine scales its rolling-spin solution by a calibration that climbs from 0.81 to about 1.13 across a narrow band centred on 32° of vertical spin loft, so the curve has a knee right in the iron window: about 164 rpm per degree between 13° and 23°, peaking near 406 rpm per degree across 32-34°, then flattening again. The 9,000 rpm figure is a hard clamp on the engine's output, not just a display limit — the underlying model keeps climbing (13,821 rpm raw at 110 mph with 48° of loft and an 8° downward attack), but the returned number stops at 9,000, which at 90 mph first happens at 41.5° of spin loft. That is why hitting down (more negative attack) and holding loft both raise spin, and why teeing a driver up (positive attack, low loft) is the classic low-spin recipe. There is a self-limiter: a bigger spin loft is also a more glancing, less efficient strike, so the engine lowers the smash factor as spin loft climbs, and it falls away faster the higher spin loft goes, trimming ball speed as spin loft climbs — 134.02 mph at 13° against 115.08 mph at 43° off the same 90 mph swing — but spin still rises strongly overall, because the spin-loft gain beats the speed loss. Friction is the gate over all of this, outside the engine's five inputs: if grass, water, or a slick cover intrudes, the skid can't grip and real-world spin collapses regardless of a perfect spin loft. Once airborne, that backspin generates Magnus lift that holds the ball up against gravity through most of the flight and then decays slowly, while thin or warm air lets the ball carry farther but gives the spin less air to grab.","hierarchy":[{"driver":"Spin loft (dynamic loft minus attack angle)","weight":"dominant — the only geometric input to spin magnitude; sets the whole range from 1,920 rpm (engine driver) to the 9,000 rpm ceiling (wedge)","why":"It is the single geometric quantity that governs how glancing the blow is, and how you assemble it is irrelevant: -6° attack with 27° loft and 0° attack with 33° loft both return 6,623 rpm at 90 mph. Spin rises with it from nothing — there is no floor, and at 0° of spin loft the output is exactly 0 rpm. At a fixed 90 mph, moving from 23° to 40° of spin loft shifts spin from 3,843 to 8,711 rpm. Everything else is a modifier on top of this."},{"driver":"Ball speed (from club speed)","weight":"exactly linear — 54.04 rpm per mph of ball speed at 33° spin loft; 2x ball speed = 2x spin, with no offset","why":"For a fixed spin loft the engine's spin is strictly proportional to ball speed. Club speeds of 80/90/100 mph at 33° of spin loft give 108.94/122.56/136.18 mph of ball speed and 5,887/6,623/7,359 rpm — every one of those is 54.04 rpm per mph. It is why a low-loft driver at 170.4 mph still makes 1,920 rpm despite only 9° of spin loft."},{"driver":"Friction / strike quality (grooves, ball, lie, moisture)","weight":"large but conditional, and not modelled — a flyer lie or wet face can strip 20-50% (2,000+ rpm off a wedge) below whatever the engine shows","why":"Friction is the gate that lets the glancing blow become spin. The engine assumes it, so its numbers are clean-contact numbers. When friction is present the top two levers rule; when grass or water intrudes it can dominate everything by killing grip. Ranked below the always-on levers because most of the time (clean, dry) it is near-maxed and invisible."},{"driver":"Dynamic loft","weight":"feeds spin loft one-for-one; at 90 mph, locally ~406 rpm per degree through the 32-34° iron window, ~164 rpm per degree down at 13-23°","why":"It is the bigger, more adjustable half of spin loft — you change it with club selection and shaft lean across a huge range. Each degree adds spin through the same channel as spin loft, and it doubles as the main control of how high the ball launches, so practically it is the knob a golfer turns most."},{"driver":"Attack angle","weight":"identical per-degree weight to dynamic loft within one delivery (spinLoft = DL − AA); narrower usable range","why":"Within a single club the two terms are interchangeable — swapping 3° of attack for 3° of loft leaves spin loft, ball speed and spin bit-identical in the engine. What differs is how much a degree is worth club to club: ±1° of attack moves the engine's 113 mph driver (13° dynamic loft, level attack) about 209 rpm, but an 80 mph part-wedge held at 40° of spin loft only about 184, because spin scales with ball speed and with where you sit on the calibration knee. Push that wedge to a full delivery and the number stops moving altogether: at 80 mph with 50° of dynamic loft and a -3° attack the raw spin is 9,683 rpm, so the readout is pinned at the 9,000 clamp and attack angle is worth exactly 0 rpm per degree there. A golfer's usable attack range is also smaller (roughly -6 to +5°), so it moves the total less than loft does. It is still the cleanest way to lower driver spin: hit up."},{"driver":"Air & conditions (altitude, temperature, wind)","weight":"second-order — does not change face spin; ~14% thinner air (Denver) or ~10% lighter warm air only reshapes the flight","why":"None of this alters the rpm coming off the face; it changes how much lift that spin produces and how far the ball carries. Real, but a layer removed from the backspin number — grounded by air density falling ~14% at Denver and ~10% from 0 C to 30 C."}],"realWorld":{"tourBenchmarks":["PGA Tour driver (commonly published TrackMan tour-average table): dynamic loft ~10.9°, attack ~-1.3°, backspin ~2,686 rpm. Engine check on that exact delivery at 113 mph club speed: 12.2° spin loft, 2,594 rpm, 168.73 mph ball speed, 266.5 yd carry — spin within about 3% of the tour figure.","PGA Tour 7-iron (same table): dynamic loft ~24.2°, attack ~-4.3°, backspin ~7,097 rpm. Engine check at 90 mph on that delivery reads only 4,968 rpm (28.5° spin loft, 179.8 yd) — markedly under the tour number. The engine’s own 7-iron delivery (30° dynamic loft, -3° attack, 33° spin loft) reads 6,623 rpm and 174.0 yd, much closer. Treat the engine’s iron rpm as directionally right rather than calibrated to tour averages.","PGA Tour pitching wedge (same table): dynamic loft ~32.6°, attack ~-4.5°, backspin ~9,304 rpm. Engine check at 90 mph: 37.1° spin loft, 8,033 rpm — still under the readout clamp, so this one you can actually read.","Where the 9,000 rpm clamp bites: a full wedge at 85 mph with 46° of dynamic loft and a -5° attack (51° spin loft) has a raw engine spin of 10,011 rpm and displays 9,000. Tour full-wedge spin genuinely lives at and above that level, so the clamp lands exactly where real spin is highest — the readout goes flat before the physics does."],"scenarios":["A driver that spins too much and climbs: same club at 113 mph with 13° of dynamic loft, only the attack angle changed. At -4° the engine gives 3,590 rpm, 165.86 mph ball speed, 254.2 yd of carry and a 44.1° landing angle; at +4° it gives 1,920 rpm, 170.44 mph, 275.2 yd and 34.6°. Twenty-one yards, bought entirely by shrinking spin loft from 17° to 9°.","Why a full wedge never shows you the spin you just added: at 85 mph with a 46° wedge, a -5° strike is already raw 10,011 rpm and reads 9,000 — steepen or shallow it and the number does not move. Take the same wedge to a 60 mph partial and the lever reappears: -5° attack reads 7,067 rpm and 87.6 yd, -1° reads 6,649 rpm and 91.2 yd. On full wedges judge spin by landing angle and carry instead of rpm.","Two 7-irons built completely differently, same result: at 90 mph, a -6° attack with 27° of dynamic loft and a level 0° attack with 33° of dynamic loft both read 33° of spin loft, 122.56 mph of ball speed, 6,623 rpm and 174.00 yd of carry. Identical to the last decimal — the divot has no vote in this engine.","A flyer lie is invisible to the engine. It has no input for lie, moisture, grooves or ball cover, so it always returns the clean-contact number. A clean 8-iron (85 mph, 26° dynamic loft, -4° attack) reads 5,135 rpm; a wedge that reads a clamped 9,000 from a wet, grassy lie can lose enough grip in the real world to land under that. When the number and the ball disagree on a flyer, the lie is the missing variable, not the model.","Swinging harder does not fix a spin problem. Hold 33° of spin loft and take club speed 80 → 90 → 100 mph: ball speed 108.94 → 122.56 → 136.18 mph and spin 5,887 → 6,623 → 7,359 rpm — exactly 54.04 rpm per mph of ball speed at every point. Speed scales spin up in lockstep; only geometry and friction can bring it down."],"whatItMeansForYou":"Backspin has exactly two handles in this engine: spin loft and ball speed. If the driver spins too much, take the spin loft out with attack angle rather than by de-lofting the face — measured, that swing from -4° to +4° is worth 3,590 → 1,920 rpm and +21 yd of carry. If wedges are not stopping, more spin will usually not show up on the readout at all, because a full wedge is already pinned at the 9,000 rpm clamp (raw 10,011 at 85 mph with 46° and a -5° attack); read landing angle instead, and use partial wedges if you want to see the lever move. And treat every rpm the engine shows as a clean-contact number: it has no friction input, so lie, moisture, grooves and ball cover are all subtractions from it that you have to add back by eye."},"misconceptions":["\"You create backspin by hitting down and 'pinching' the ball.\" The engine settles this: at 90 mph, a -6° attack with 27° of dynamic loft and a level 0° attack with 33° of dynamic loft both give 33° of spin loft and both return exactly 6,623 rpm. Attack angle only ever reaches spin through spin loft. Hitting down helps in the real world because it keeps spin loft up and ensures clean ball-first contact; the divot itself adds nothing.","\"More loft always means more backspin.\" It is spin loft (dynamic loft minus attack angle), not loft alone. Adding 3° of loft while also swinging 3° more upward leaves spin loft — and therefore engine spin — unchanged. And a high wedge from a flyer lie can spin less than a clean 8-iron because grass kills the friction the engine assumes.","\"Backspin makes the ball fly higher and farther, so more is always better.\" The engine's carry is a function of ball speed and launch only — spin never appears in it, so you cannot read a ballooning penalty off the carry number. What it does show is the real cost: spin is bought with a more glancing strike. At 113 mph, going from 16° to 19° of dynamic loft raises spin 2,552 → 3,178 rpm while ball speed drops 168.84 → 167.10 mph and carry drops 271.5 → 267.5 yd. You paid speed for spin. (True aerodynamic ballooning is real out on the course; it lives beyond this engine's carry fit.)","\"Backspin is what curves the ball right or left.\" Pure backspin (a level spin axis) only lifts. Sideways curve comes from the spin axis tilting, driven by the face-to-path difference — in the engine that is spinAxis, a completely separate quantity from backspin.","\"New wedge grooves add loads of spin on every shot.\" On a clean, dry fairway lie the face grips almost fully with or without fresh grooves; the difference is small. Grooves earn their keep in rough and wet, channelling grass and water away so friction survives. Their job is protecting spin, not manufacturing it.","\"A softer ball spins more with every club.\" Cover friction dominates only on high-spin-loft short shots (wedges), where soft urethane grips more. Off the driver (low spin loft) premium balls are engineered to spin less. Ball choice is shot-dependent, not a blanket 'soft = more spin'."],"wolframChecks":["air density at 15 C sea level -> 1.225 kg/m^3 (ISA reference), anchoring the sea-level baseline for lift/drag claims.","air density at 1600 m (Denver) -> ~1.05 kg/m^3; 1.225 / 1.048 = 1.169, so sea-level air is ~17% denser / Denver air ~14% thinner — grounds the altitude carry effect.","density of dry air 0 C -> ~1.29 kg/m^3 vs 30 C -> 1.165 kg/m^3; (1.293-1.165)/1.293 = 9.9% -> cold air ~10% denser than warm, grounding the temperature effect on flight.","engine 7-iron spin 6,623 rpm -> 6623 x 2pi / 60 = 693.6 rad/s; 693.6 x 0.0213 m (ball radius) = 14.77 m/s -> the ball's surface tangential speed at 7-iron spin.","spin ratio S = 14.77 / 54.79 m/s (the engine's 122.56 mph ball speed) = 0.270 -> the dimensionless spin parameter (surface speed / ball speed), typical of iron flight, but above the engine's own declared coefficient-validity band for the spin parameter (0.08-0.2), which is why solveFlight reports spinParameterRangeObserved [0.270, 0.578] with extrapolated: true.","Magnus lift 0.5 x rho x v^2 x A x C_L = 0.5 x 1.225 x 54.79^2 x pi x 0.0213^2 x 0.25 = 0.655 N; ball weight = 0.04593 kg x 9.81 = 0.4506 N; 0.655 / 0.4506 = 1.45 -> at 7-iron speed the Magnus lift already exceeds the ball's own weight by ~45% (why a spinning shot climbs).","engine backspin check (7-iron, 90 mph, square face): spin loft 33° -> 6,623 rpm, 40° -> 8,711, so (8711-6623)/7 = 298 rpm per degree there; the slope is not constant — 32° -> 6,209 and 34° -> 7,022 gives 406 rpm/deg at the knee, while near the origin 4° -> 682 gives 170.5 rpm/deg and 0° -> 0 rpm exactly.","engine smash check: smashEff = 1.544034 - 0.0033788 x sl - 0.000064966 x sl^2; at sl = 33 that is 1.3618, so 90 mph club -> 122.56 mph ball, matching the engine's own output to 2 decimals.","engine carry curve 0.9206 x ballSpeed + 0.004072 x ballSpeed^2: 120 mph -> 169.1 yd, 140 mph -> 208.7 yd (accelerating, +23% carry for +17% ball speed); at 122.56 mph it gives 173.99 yd, which is the engine's 174.0 yd 7-iron carry — no spin term appears anywhere in it.","spin decay exp(-0.04 x 5.79) = 0.793 -> at the engine's 4%-per-second decay a ball still carries ~79% of its launch spin at the end of the 7-iron's 5.79-second flight (backspin decays slowly, so launch spin dominates)."],"quiz":[{"q":"Spin loft is defined as:","options":["Dynamic loft plus attack angle","Dynamic loft minus attack angle","Club speed times face angle","The loft number stamped on the club"],"answerIndex":1,"explanation":"Spin loft = dynamic loft minus attack angle — the angle between where the face points and where the club is travelling. It is the single biggest driver of backspin. A 30° dynamic loft with a -3° (downward) attack gives 33° of spin loft, which at 90 mph of club speed produces 6,623 rpm in the app's engine."},{"q":"A player's driver is ballooning and losing distance from too much spin. Which change lowers spin the most?","options":["Swing faster with the same delivery","Hit up on the ball (more positive attack) with the same low loft","Add loft and hit down","Switch to an older, more worn ball"],"answerIndex":1,"explanation":"Spin loft = dynamic loft minus attack angle, so hitting up shrinks spin loft and cuts spin — the classic low-spin driver recipe. On the engine's 113 mph driver at 13° of dynamic loft, attack -4° gives 3,590 rpm, 0° gives 2,762 and +4° gives 1,920. Swinging faster raises ball speed and, since spin is strictly proportional to it, raises spin. Adding loft and hitting down both raise spin loft, making the balloon worse."},{"q":"Two 7-irons are struck with an identical 33° spin loft, but one ball leaves at 110 mph and the other at 125 mph. What happens to backspin?","options":["It is the same — spin loft is identical","The faster ball spins meaningfully more","The faster ball spins less","Spin depends only on the grooves"],"answerIndex":1,"explanation":"For a fixed spin loft the engine's spin is exactly proportional to ball speed. Spin loft alone fixes smash (1.544034 − 0.0033788 x 33 − 0.000064966 x 33² = 1.3618), so ball speed rises in step and spin tracks it at 54.04 rpm per mph. Measured on the engine: 110 mph of ball speed at 33° of spin loft = 5,944 rpm, 125 mph = 6,755 rpm. Same geometry, faster skid, more spin."},{"q":"From a wet, grassy 'flyer' lie a wedge often comes out lower-spinning than from a clean fairway. Why?","options":["The extra grass increases friction","Water and grass get between ball and face, cutting friction so the ball can't grip","Spin loft becomes negative","The ball speed drops to zero"],"answerIndex":1,"explanation":"Backspin needs friction to turn the glancing blow into spin. Grass and moisture form a slick film between ball and face, so the ball slides instead of gripping — spin can fall 20-50%. That is the 'flyer'. The app's engine assumes clean contact, so a flyer reads as a real-world subtraction from its number; grooves exist mainly to channel that debris away and protect spin, not to create it."},{"q":"Once the ball is in the air, what does backspin mainly do?","options":["Curves the ball sideways","Creates upward Magnus lift that keeps the ball airborne","Speeds the ball up","Nothing until it lands"],"answerIndex":1,"explanation":"Backspin drags air faster over the top of the ball, producing an upward Magnus force. Even at 7-iron speed that lift already beats gravity: ~0.655 N of lift against the ball's ~0.451 N of weight in our grounded check, about 1.45x. That is why a spinning shot climbs and hangs. Sideways curve is a separate effect, caused by the spin axis tilting — not by backspin itself."}]}</script>
  <script type="application/json" id="lesson-carry">{"parameter":"Carry","oneLiner":"Carry is how far the ball flies before its first bounce. In Flightglass it is almost entirely ball speed, with one cliff: a launch angle under about 10 degrees scales the whole distance down.","whatItIs":"Carry is the airborne distance of the shot, measured from impact to where the ball first lands — separate from roll, the part it bounces and rolls afterward. Flightglass builds it in two steps. First, ball speed = club speed x smash factor, and smash is set entirely by spin loft (dynamic loft minus attack angle): smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, clamped to [1.15, 1.52]. Second, carry = (0.92059 x ballSpeed + 0.0040723 x ballSpeed^2) x launchEfficiency, where launchEfficiency = sqrt(launch / 10) below 10 degrees of launch — a steep early rise, not a straight line — and stays pinned at 1 above. That is the whole model. Backspin never enters the carry equation, and above 10 degrees neither does launch angle — so in the engine, spin loft is a pure tax on ball speed and ball speed is carry. Real golf has more going on: air density, wind and an actual too-much-spin ceiling. Flightglass has no air, wind or temperature input at all, so treat the weather section below as course physics you should know, not as engine output.","components":[{"name":"Ball speed","role":"The engine of carry, and in Flightglass almost the whole of it. carry = (0.92059 x ball + 0.0040723 x ball^2) x launchEfficiency. Equals club speed x smash factor.","typicalRange":"7-iron 102-129 mph (75-95 mph club speed at 33 deg spin loft); driver 151-181 mph (100-120 mph club speed)"},{"name":"Club speed","role":"The raw input you control with the swing — the single biggest lever on ball speed. Because carry carries a positive second-order ball-speed coefficient, each extra mph is worth more than the last.","typicalRange":"7-iron 75-95 mph; driver 100-120 mph"},{"name":"Smash factor","role":"Ball speed / club speed. In Flightglass it is a pure function of spin loft: 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, clamped to [1.15, 1.52]. The 1.52 ceiling binds below 6.34 deg of spin loft; the 1.15 floor only at 56.10 deg.","typicalRange":"engine: 1.3618 at a 7-iron's 33 deg spin loft, 1.5084 at a driver's 9 deg. Note the driver figure sits above the 1.48-1.50 the tour actually measures."},{"name":"Launch angle","role":"Vertical take-off angle, and the only place launch touches carry: below 10 deg it scales carry down hard, at or above 10 deg it stops mattering. Engine: 10.3919 - 0.16938 x dynamicLoft + 0.012025 x dynamicLoft^2 + 0.25 x attackAngle (the intercept fades toward zero below 10 deg of loft).","typicalRange":"7-iron 15.4 deg (30 deg loft, -3 attack); driver 11.2 deg (13 deg loft, +4 attack) — both already past the 10 deg cliff"},{"name":"Backspin","role":"On a real ball, backspin makes the Magnus lift that keeps it airborne. In Flightglass carry does not read backspin at all — it is solved at impact from club speed and 3-D spin loft, capped at 9,000 rpm, and used for apex, landing angle and roll, not for carry distance.","typicalRange":"7-iron 5,437-7,716 rpm (30-36 deg spin loft at 90 mph); driver 1,699-3,375 rpm (9-15 deg spin loft at 100-120 mph)"},{"name":"Spin loft","role":"Dynamic loft minus attack angle, and the only carry lever besides club speed. It cannot be traded against anything: raising it lowers smash, which lowers ball speed, which lowers carry. Each degree costs more than the last (smash loses 0.0045 per deg at a driver's 9 deg, 0.0077 at a 7-iron's 33 deg).","typicalRange":"7-iron 30-36 deg; driver 9-15 deg"},{"name":"Air density / altitude","role":"Real-course physics, not modelled by Flightglass. Thinner air (higher altitude) means less drag, so more carry. Density drops ~3% per 1000 ft.","typicalRange":"Sea level 1.225 kg/m3; Denver 5280 ft ~1.05 kg/m3"},{"name":"Wind (head / tail)","role":"Real-course physics, not modelled by Flightglass. Wind changes the ball's airspeed; headwind adds drag and balloons the flight. Asymmetric — headwind hurts more than tailwind helps.","typicalRange":"headwind ~ -1%/mph; tailwind ~ +0.5%/mph"},{"name":"Temperature","role":"Real-course physics, not modelled by Flightglass. Warmer air is thinner (density is proportional to 1/absolute-temperature), so the ball flies slightly farther on a hot day.","typicalRange":"~3.3% density change per 10 C; ~+2 yd per +10 C"},{"name":"Humidity","role":"Real-course physics, not modelled by Flightglass. Humid air is slightly lighter than dry air (water vapour is lighter than nitrogen/oxygen), so muggy air adds a tiny bit of carry — the opposite of the common myth.","typicalRange":"<1% density change; ~1-2 yd at most"}],"howTheyConnect":"Flightglass computes carry as a short chain with only two live inputs. Step one: club speed x smash factor = ball speed, and smash is a pure function of spin loft (1.544034 - 0.0033788 x sl - 0.000064966 x sl^2, clamped to [1.15, 1.52]) — 1.3618 at a 7-iron's 33 deg, 1.5084 at a driver's 9 deg. Step two: carry = (0.92059 x ballSpeed + 0.0040723 x ballSpeed^2) x launchEfficiency, with launchEfficiency = sqrt(launch / 10) across the first 10 deg of launch and flat at 1 above it. Three measurable consequences follow. (1) Above 10 deg, launch angle stops changing carry: hold spin loft at 33 deg and 122.56 mph of ball speed, and launching at 11.0 deg (24 deg loft, -9 attack) or 24.6 deg (40 deg loft, +7 attack) both carry exactly 174.0 yd. (2) Backspin never enters carry: the same 122.56 mph carries 174.0 yd at 6,623 rpm (33 deg spin loft, 90 mph) and 174.0 yd at 3,144 rpm (20 deg spin loft, 84.5 mph). (3) Because the ball-speed term is second-order with a positive coefficient, yards per mph keep growing rather than tapering — 80/90/100/110 mph of club speed carry 148.6 / 174.0 / 200.9 / 229.3 yd, gains of +25.4, +26.9, +28.4. Below 10 deg of launch the picture flips and launch becomes brutal: at essentially the same ball speed (~136 mph), a 4.65 deg launch carries 137.8 yd while a 9.90 deg launch carries 198.2 yd. So the engine's advice is simple — get launch clear of the 10 deg cliff, then spend everything on ball speed, which means club speed up and spin loft down. Two honest caveats. Spin loft is a tax, not a trade: from 25 to 40 deg at 90 mph, ball speed falls 127.71 to 117.44 mph and carry falls 184.0 to 164.3 yd with no compensating gain anywhere in carry. And a real ball does have an upper spin limit where the flight balloons and carry falls off — that mechanism, along with altitude, wind and temperature, is not in this engine, so do not read Flightglass carry as a weather-corrected number.","hierarchy":[{"driver":"Ball speed (club speed x smash factor)","weight":"dominant — 80/90/100/110 mph of club speed give 148.6 / 174.0 / 200.9 / 229.3 yd for a 7-iron, +25.4 / +26.9 / +28.4 per 10 mph. About +2.7 yd per mph of club speed, and rising, not tapering.","why":"Measured in the engine at 33 deg spin loft. Carry is 0.92059 x ball + 0.0040723 x ball^2, a second-order fit with a positive coefficient, so the yards per mph grow with speed instead of flattening."},{"driver":"Spin loft (through smash factor only)","weight":"25 to 40 deg of spin loft at 90 mph: smash 1.4190 to 1.3049, ball speed 127.71 to 117.44 mph, carry 184.0 to 164.3 yd — about -1.3 yd per degree, steepening.","why":"Measured. Spin loft's only route to carry is smash: it cuts ball speed and carry follows. The second-order smash term means each added degree costs more than the last (-0.0045 smash/deg at 9 deg, -0.0077 at 33 deg, -0.0086 at 40 deg)."},{"driver":"Launch angle — but only below 10 degrees","weight":"A cliff, then nothing. At ~136 mph ball speed: 2.72 deg launch carries 105.4 yd, 4.65 deg 137.8 yd, 6.68 deg 164.8 yd, 9.90 deg 198.2 yd. Above 10 deg the effect is exactly zero.","why":"Measured. launchEfficiency is sqrt(launch / 10) over the first 10 deg of launch and clamps at 1 afterwards, so 122.56 mph of ball speed carries 174.0 yd at both 11.0 deg and 24.6 deg of launch. Normal full shots (7-iron ~15 deg, driver ~11 deg) already sit past the cliff — this matters for thin, de-lofted and punch shots."},{"driver":"Backspin","weight":"Zero effect on carry in Flightglass. 122.56 mph of ball speed carries 174.0 yd at 6,623 rpm and at 3,144 rpm.","why":"Measured directly by matching ball speed across two different spin lofts (33 deg at 90 mph vs 20 deg at 84.5 mph). Backspin is solved at impact and drives apex, landing angle and roll, but the carry expression does not reference it. On a real ball backspin generates the Magnus lift that holds the flight up (~0.77 N at 60 m/s vs the ball's 0.45 N weight) — real, but not in this model."},{"driver":"Altitude / air density (not modelled)","weight":"~+2% carry per 1000 ft on a real course (raw density drop is ~3%/1000 ft; lift-loss offsets about a third). Denver 5280 ft ~ +10%. Flightglass returns the same number at any elevation.","why":"Air density falls from 1.225 kg/m3 at sea level to 1.056 at 5000 ft. Less dense air means less drag but also less backspin lift, so carry gains less than density falls. The engine has no elevation or density input, so this correction is on you."},{"driver":"Wind (not modelled)","weight":"Headwind ~ -1% carry per mph; tailwind ~ +0.5% per mph. A 10 mph headwind ~ -10 to -18 yd on a mid-iron. In strong gusts this outranks altitude on a real course.","why":"Drag scales with airspeed squared, so at 45 m/s a 10 mph headwind adds ~21% drag while the same tailwind removes only ~19%, and the headwind also keeps the ball in the air longer. No wind input exists in the engine."},{"driver":"Temperature and humidity (not modelled)","weight":"Temperature ~3.3% density change per 10 C (~+2 yd per +10 C). Humidity <1%, worth ~1-2 yd, and in the direction most players guess wrong.","why":"Density is proportional to 1/absolute-temperature (1.247 kg/m3 at 10 C vs 1.165 at 30 C), and water vapour at 18.0 g/mol is lighter than dry air at 28.96 g/mol, so muggy air is thinner. Both are small, and both are outside the engine."}],"misconceptions":["'More loft = more carry.' False as soon as launch is clear of the 10 deg cliff — which is every normal full shot. Above the cliff, extra loft only raises spin loft, which lowers smash, which lowers ball speed: 25 to 40 deg of spin loft at 90 mph drops smash 1.4190 to 1.3049 and carry 184.0 to 164.3 yd, with no launch or spin benefit to offset it. Below the cliff the opposite is true, because there loft buys launch: at 90 mph and 0 attack, dynamic loft 3 / 5 / 7 / 10 deg carries 105.4 / 137.8 / 164.8 / 198.2 yd. Carry peaks right at the cliff (loft ~10-11, launch ~9.9-10.0, 198.2 yd) and loft is a pure tax from there up.","'You need the right amount of backspin for maximum carry.' True on a real ball, false in this engine — carry does not read backspin at all. 122.56 mph of ball speed carries 174.0 yd whether the engine solved 6,623 rpm or 3,144 rpm. Do not read Flightglass carry as a spin-window verdict.","'Launch angle is a distance dial.' Only under 10 degrees. Below that it scales carry down hard (4.65 deg launch: 137.8 yd; 9.90 deg: 198.2 yd at the same ball speed); above it, 11 deg and 25 deg of launch carry identically. Thin and punched shots live on the cliff; full shots do not.","'Swing down harder to hit it farther.' Attack angle reaches carry only by changing spin loft. Hold dynamic loft at 30 deg and steepen attack from 0 to -6 and carry falls 177.9 to 169.9 yd — but hold spin loft at 33 deg and swing anywhere from -9 to +7 attack and carry is 174.0 yd every time. The lever is spin loft, not attack.","'Thick, humid air kills distance.' Backwards — humid air is lighter than dry air (water vapour 18.0 g/mol vs dry air 28.96 g/mol), so muggy conditions add a yard or two on a real course. Flightglass models none of it.","'At altitude the ball goes as much farther as the air is thinner.' No — real carry gains only ~2% per 1000 ft even though density drops ~3%, because the same thin air weakens the lift holding the ball up.","'A headwind and a tailwind cancel out.' They don't — a headwind hurts about twice as much as an equal tailwind helps, because drag grows with airspeed squared."],"wolframChecks":["engine carry at club speeds 80/90/100/110 mph, 33 deg spin loft (ball 108.9/122.6/136.2/149.8) -> 148.6 / 174.0 / 200.9 / 229.3 yd, gains +25.4, +26.9, +28.4 -> INCREASING, no taper","engine driver (13 deg loft, +4 attack) at ball speed 150.0 vs 170.0 mph -> carry 229.7 vs 274.2 yd, +19.4%: carry does NOT saturate at the top end","engine carry fit: 0.92059*122.56 + 0.0040723*122.56^2 = 174.00 yd, matches solveFlight carry exactly at 90 mph / 33 deg spin loft (launchEfficiency = 1 above 10 deg launch)","engine smashEff = 1.544034 - 0.0033788*sl - 0.000064966*sl^2 at spin loft 25/33/40 -> 1.4190 / 1.3618 / 1.3049, x 90 mph = ball 127.71 / 122.56 / 117.44 mph -> carry 184.0 / 174.0 / 164.3 yd: spin loft is a pure ball-speed tax","engine backspin isolation: ball speed 122.56 mph reached two ways — 90 mph at 33 deg spin loft (6,623 rpm) and 84.50 mph at 20 deg spin loft (3,144 rpm) -> carry 174.00 yd in both. Backspin does not enter carry","engine launch isolation at 33 deg spin loft: 24 deg loft / -9 attack (launch 11.00 deg) vs 40 deg loft / +7 attack (launch 24.61 deg) -> carry 174.0 yd in both. Above 10 deg, launch angle does not change carry","engine launch cliff at ~136 mph ball speed: launch 2.72 / 4.65 / 6.68 / 9.90 deg -> carry 105.4 / 137.8 / 164.8 / 198.2 yd (launchEfficiency 0.521 / 0.682 / 0.817 / 0.995)","engine attack-angle isolation: dynamic loft fixed at 30 deg, attack -6/-3/0/+3 -> carry 169.9 / 174.0 / 177.9 / 181.6 yd; spin loft fixed at 33 deg, attack -9 to +7 -> carry 174.0 yd throughout. Attack reaches carry only via spin loft","engine backspin cap: 43/45/51 deg spin loft at 90 mph all return 9,000 rpm (maxTotalSpinRpm = 9000)","air density at sea level standard atmosphere 15 C -> 1.226 kg/m3 (ISA reference 1.225)","air density at 1000 ft ISA -> 1.19 kg/m3 (0.97x sea level = ~3% thinner per 1000 ft)","air density at 5000 ft ISA -> 1.056 kg/m3 (0.86x); at 5280 ft (Denver) -> 1.047 kg/m3 (0.855x, ~14% thinner)","density of dry air at 30 C 1 atm -> 1.165 kg/m3 (0.95x); at 10 C -> 1.247 kg/m3 (1.02x): ~3.3% per 10 C","molar mass water vapour 18.015 g/mol vs dry air 28.96 g/mol -> humid air is lighter (moist air 20 C/50% -> 1.199 kg/m3)","Magnus lift 0.5*1.2*0.25*(pi/4*0.0427^2)*60^2 = 0.773 N at 60 m/s -> ~1.7x the ball's 0.45 N weight: why backspin extends carry on a real ball, though not in this engine","wind drag asymmetry (49.47^2-45^2)/45^2 = +0.209 headwind vs (40.53^2-45^2)/45^2 = -0.189 tailwind at 45 m/s +/-10 mph -> headwind adds ~21% drag, tailwind removes ~19%"],"quiz":[{"q":"What is the single biggest driver of how far a shot carries?","options":["Backspin rate","Ball speed (club speed x smash factor)","Air temperature","Dynamic loft"],"answerIndex":1,"explanation":"Ball speed dominates. In Flightglass, going from 80 to 110 mph of club speed lifts a 7-iron's carry from 148.6 to 229.3 yards — and the gains grow (+25.4, +26.9, +28.4 per 10 mph) because the engine grows carry with a positive second-order ball-speed term instead of saturating."},{"q":"Two Flightglass shots come out at exactly the same 122.56 mph ball speed, but one spins 6,623 rpm and the other 3,144 rpm. What happens to carry?","options":["The low-spin one carries much farther","The high-spin one carries farther — more lift","Both carry 174.0 yards — the engine's carry does not read backspin","The high-spin one balloons and carries 15 yards shorter"],"answerIndex":2,"explanation":"Measured: 90 mph at 33 deg spin loft and 84.5 mph at 20 deg spin loft both reach 122.56 mph of ball speed, and both carry 174.0 yd. Flightglass computes carry from ball speed and launch angle only. Real balls do have a spin window — this engine does not model it, so never read its carry number as a spin verdict."},{"q":"You hold spin loft at 33 degrees and change dynamic loft and attack together so launch goes from 11 to 25 degrees. What happens to carry?","options":["It grows — higher launch, more hang time","It falls — steep launch wastes forward speed","Nothing — it stays 174.0 yards","It peaks somewhere in the middle"],"answerIndex":2,"explanation":"Above 10 degrees of launch the engine's launchEfficiency is pinned at 1, so launch angle drops out of carry entirely. It only bites below 10 degrees, where it is savage: at the same ~136 mph ball speed, a 4.65 deg launch carries 137.8 yd against 198.2 yd at 9.90 deg. That is the thin-shot and punch-shot regime, not the full-swing one."},{"q":"You play the same 7-iron shot in Denver (~5,280 ft) instead of at sea level. Roughly what happens on the course — and what does Flightglass report?","options":["~10% longer on the course; Flightglass reports the same number either way","~10% shorter on the course; Flightglass adjusts automatically","~25% longer; Flightglass adjusts automatically","No change either way"],"answerIndex":0,"explanation":"Thinner air means less drag. Density falls ~14% from sea level to Denver, but real carry gains only about +2% per 1,000 ft (~+10%, roughly +15 yd on a 175-yd shot) because the same thin air also weakens the backspin lift. Flightglass has no elevation, wind or temperature input, so that correction is yours to make."},{"q":"Compare a 10 mph headwind to a 10 mph tailwind on a real course. Which is true?","options":["They cancel out — wind is symmetric","The headwind costs more than the tailwind gives back","The tailwind helps more than the headwind hurts","Wind changes direction but not carry"],"answerIndex":1,"explanation":"Drag grows with airspeed squared, so a headwind adds more drag (~21% at a typical mid-flight speed) than a tailwind removes (~19%), and it keeps the ball airborne longer. Rule of thumb: a headwind costs ~1% carry per mph, a tailwind gives back only ~0.5% per mph."},{"q":"On a hot, humid, muggy day, the ball tends to carry...","options":["Noticeably shorter — humid air is heavy and thick","Slightly farther — humid air is actually lighter than dry air","Exactly the same — water vapour has no effect","Shorter, because the ball absorbs moisture"],"answerIndex":1,"explanation":"Water vapour (18.0 g/mol) is lighter than the nitrogen and oxygen it displaces (dry air 28.96 g/mol), so humid air is less dense. With the heat thinning the air too, the ball flies a touch farther — the opposite of the 'thick air' myth, though it is only a yard or two."},{"q":"You add a lot of dynamic loft at the same club speed. Backspin and launch jump, but carry drops. Why?","options":["More loft always means more carry — something else went wrong","Extra spin loft lowers smash factor, so ball speed falls, and carry follows ball speed","Loft has no effect on carry","The extra backspin balloons the flight and costs the yards"],"answerIndex":1,"explanation":"Spin loft's only route to carry is smash. From 25 to 40 degrees at 90 mph, smash goes 1.4190 to 1.3049, ball speed 127.71 to 117.44 mph, and carry 184.0 to 164.3 yd. The extra backspin is not what costs you — the engine's carry never reads it. Ballooning is real on a golf course; it is not in this model."}]}</script>

  <script type="application/json" id="lesson-club-speed">
{"parameter":"Club Speed","oneLiner":"Club speed is how fast the clubhead is moving, in mph, at the instant it reaches the ball — the raw power number every other outcome in the swing is built on top of.","whatItIs":"Club speed is exactly what it sounds like: the clubhead's speed, in miles per hour, at one single instant — the moment it meets the ball. It carries no directional information (that's club path and face angle, separate parameters) and no loft/spin information — it is a pure scalar magnitude, and it is usually the very first number a launch monitor (TrackMan, Foresight, etc.) reports after a shot. In Flightglass's dependency graph, club speed sits in the Fundamentals tier as a true root input: nothing else in the model feeds into it — the engine takes it directly as a slider value, not something computed from other parameters — and it has exactly one child in the graph: ball speed. That is the whole physics job of club speed: it is the raw energy that gets converted, through the strike, into ball speed, which is what actually determines flight. Two things are worth flagging about how the engine handles it. First, Flightglass ties smash factor to spin loft alone through a single curved, non-linear falloff, with no separate per-club model (the 'club' field is echoed back but never used in the smash calculation) and no off-centre-strike input at all — a toe hit and a flush hit at the same spin loft return the same smash. Second, that falloff runs slightly hot at the top: measured with solveFlight(), a driver-shaped strike (dynamic loft 13°, attack +4°, giving spin loft 9°) returns smashEff 1.5084 — above the ~1.48-1.50 that real tour players post, and above the 1.488 theoretical ceiling implied by the legal 0.830 clubface COR limit. So read the engine's driver ball speed as a touch optimistic. The core relationship — faster club speed, proportionally faster ball speed, more carry — is engine-true and is exactly proportional: doubling club speed doubles ball speed, because smashEff does not depend on club speed at all.","components":[{"name":"Club speed (the raw input)","role":"The swing's power number, measured in mph at the clubhead at the instant of impact. It is the root of the dependency graph — nothing upstream computes it, and it feeds exactly one thing downstream: ball speed.","typicalRange":"recreational driver ~85-95 mph; PGA Tour driver ~113-115 mph; LPGA Tour driver ~94 mph; World Long Drive ~145-155+ mph"},{"name":"Smash factor (strike efficiency)","role":"The multiplier that turns club speed into ball speed: ballSpeed = clubSpeed x smashEff. In the engine it is driven entirely by spin loft through a curved, non-linear falloff (smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, clamped to 1.15-1.52) — a flush, low-spin-loft strike sits near the ceiling; a glancing, high-spin-loft strike sits well below it. The 1.52 ceiling only bites below 6.34° of spin loft and the 1.15 floor needs 56.1°, so in practice every normal shot sits on the curve, not on a clamp.","typicalRange":"driver ~1.45-1.50 in the real world, and the engine reads slightly hot at 1.5084 (measured at 9° spin loft); 7-iron ~1.30-1.38 real, engine 1.3618 at 33°; wedge ~1.20-1.25 real, engine 1.2027 at 51°"},{"name":"Kinematic sequence (ground -> hips -> torso -> arms -> club)","role":"The biomechanical engine that actually generates clubhead speed — not modeled inside solveFlight, but the real-world cause behind whatever number ends up on the club-speed slider. Proximal-to-distal sequencing (each body segment handing off speed to the next, like cracking a whip) is the single biggest lever golfers and coaches actually train.","typicalRange":"poor vs. good sequencing at equal physical effort: commonly a 10-20+ mph gap (illustrative, biomechanics/TPI literature)"},{"name":"Swing radius & release timing (\"lag\")","role":"Clubhead speed is approximately angular velocity times effective radius. Holding the wrist-cock angle and releasing it late (rather than 'casting' it away early) keeps that radius working through the fastest part of the downswing, multiplying tip speed in the final instants before impact.","typicalRange":"well-timed vs. early release at equal body-rotation speed: commonly cited 10-15 mph difference (illustrative)"},{"name":"Physical training (speed work)","role":"A trainable athletic quality layered on top of technique. Overspeed-training protocols (lighter/heavier training clubs, explosive rotational drills) specifically target the neuromuscular sequencing above, independent of a golfer's starting size or strength.","typicalRange":"documented average gains ~3-5 mph over 6-8 weeks; dedicated programs report up to 8-10 mph"},{"name":"Equipment fit (shaft weight/flex, clubhead COR)","role":"Tunes how efficiently body-generated energy reaches the ball. A properly fit shaft is worth a few mph at most — and the clubface's spring-like effect (COR) is legally capped, which is the physical reason smash factor has a hard real-world ceiling regardless of swing. The engine encodes a ceiling of its own (SMASH_MAX = 1.52) but places it slightly above the physical one.","typicalRange":"shaft-fit gain ~1-3 mph; legal COR limit 0.830 (USGA/R&A) -> theoretical smash-factor ceiling ~1.49; engine clamp 1.52"}],"howTheyConnect":"Club speed is captured at one instant — the moment the clubhead reaches the ball, measured by a launch monitor's radar or camera system in the last few milliseconds of the downswing. Getting there fast is a kinetic-chain problem: the body builds speed proximally (ground force through the legs and hips) and hands it distally to the torso, arms, and finally the club, like cracking a whip — each link moving faster than the one before it, provided the timing (sequencing) is right and the wrist-cock angle ('lag') is held and released late rather than thrown away early ('casting'). None of that biomechanics lives inside Flightglass's impact-flight engine — clubSpeed arrives as a single raw mph number, the one parameter in the dependency graph with no upstream cause. What the engine does model is what happens the instant club speed meets the ball: ballSpeed = clubSpeed x smashEff, where smashEff depends on spin loft through a curved, non-linear falloff (smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, clamped to 1.15-1.52) — one formula shared by every club, with no separate driver/iron model. That single line is the whole story of why identical club speed can produce very different ball speeds: a driver-shaped strike (dynamic loft 13°, attack +4°, spin loft 9°) measures smashEff 1.5084, while a wedge-shaped strike at 51° spin loft measures 1.2027, and a 7-iron-shaped strike at 33° measures 1.3618. Note what the formula does NOT contain: club speed. Sweeping the driver preset from 70 to 130 mph returns smashEff 1.5084 at every single speed — so in this model a faster swing is never, by itself, a more efficient one. Ball speed is therefore exactly proportional to club speed for a fixed delivery: 70/90/110/113/120/130 mph -> 105.59/135.75/165.92/170.44/181.00/196.09 mph of ball speed. From there ball speed cascades: it is the only club-delivery number left in the carry fit — though carry is then scaled by a launch-efficiency factor below 10° of launch, and apex carries its own explicit launch term — and it drives the backspin magnitude alongside spin loft (the same driver sweep gives 1190/1530/1869/1920/2039/2209 rpm of backspin — spin rises with speed at fixed geometry, it does not stay put). Sweeping club speed on 7-iron-shaped geometry (30° dynamic loft, -3° attack, spin loft 33°) through the engine shows the payoff concretely: 60/70/80/90/100/110 mph produces carries of 102.4/124.8/148.6/174.0/200.9/229.3 yd. Read the deltas carefully, because this is where a common piece of golf folklore and this engine part ways: the carry gained per +10 mph is +22.4, +23.9, +25.4, +26.9, +28.4 yd — it GROWS with speed, it does not shrink. Flightglass's carry fit is a plain parabola in ball speed (0.9206 x ballSpeed + 0.004072 x ballSpeed^2) with no drag-saturation term whatsoever, so it is strictly increasing and strictly accelerating at every ball speed, including extreme ones: pushing the driver preset from 120 to 130 mph goes 300.0 -> 337.1 yd and keeps climbing. Real ball flight does eventually flatten out as drag grows with speed; this model does not reproduce that, and the honest way to read the top of its carry range is 'unbounded because the fit is a parabola', not 'physics says so'.","hierarchy":[{"driver":"Kinematic sequence (hips -> torso -> arms -> club, \"the whip\")","weight":"dominant — proper proximal-to-distal sequencing and ground-force use is the single biggest source of clubhead speed; poor sequencing ('casting', releasing the wrist-cock too early) can cost 10-20+ mph versus a well-timed swing at the same physical effort","why":"Clubhead speed isn't generated by the arms alone — it's the last link in a kinetic chain (ground -> hips -> torso -> arms -> club) where each segment hands off speed to the next, amplified by properly-timed release. This is why smaller/lighter golfers with excellent sequencing regularly out-swing bigger, stronger golfers with poor technique, and why biomechanics research (e.g. TPI-style analysis) treats sequencing as the #1 speed lever, ahead of raw strength."},{"driver":"Swing radius & release timing (lag)","weight":"large — clubhead speed is approximately angular velocity times effective radius, and a late release multiplies tip speed sharply in the final ~50ms before impact; this alone can separate a 90 mph swing from a 100 mph swing at the same rotational effort","why":"The club is a lever on the end of a double pendulum (arms, then club). Holding the wrist-cock angle longer keeps the radius effectively 'folded' until the last instant, then unleashes it right at the ball — this is the 'whip' or 'lag' every fast swinger shares, from tour pros to World Long Drive competitors."},{"driver":"Physical power / speed training","weight":"moderate, trainable — documented overspeed-training protocols add roughly +3 to +5 mph of clubhead speed on average over 6-8 weeks (dedicated programs report up to +8-10 mph), independent of a golfer's starting size","why":"Speed is a trainable athletic quality, not just a byproduct of playing golf. Programs built around overspeed swings (lighter/heavier training clubs, explosive rotational work) specifically target the neuromuscular sequencing above, which is why gains show up even in golfers who don't get objectively 'stronger' in the gym."},{"driver":"Equipment fit (shaft weight/flex, clubhead design)","weight":"small — proper shaft weight/flex/length fitting is typically worth only ~1-3 mph versus a mismatched setup, and can just as easily cost speed or smash factor if it's wrong for the swing","why":"Equipment tunes how efficiently a golfer's own generated energy reaches the clubhead — it doesn't manufacture new speed from nothing. A shaft too heavy or stiff for the swing damps speed; one that's too light can be gained on paper but lost in strike quality (smash factor), which is why 'fastest shaft' marketing rarely delivers the mph it promises on its own."},{"driver":"Physical attributes (age, strength, flexibility, sex)","weight":"background factor — average clubhead speeds differ meaningfully across these groups (commonly cited: ~90-93 mph male recreational average vs ~70-75 mph female recreational average; speed trends down with age past the 50s in aggregate data), but they set a population baseline, not a ceiling any individual is locked into","why":"These are the broad demographic patterns behind published averages, useful for context on why 'the average golfer' number varies by source/sample — but sequencing, lag, and training above are the levers an individual golfer actually pulls, and they can move a person well outside their demographic average."}],"realWorld":{"tourBenchmarks":["PGA Tour driver averages (TrackMan tour-average table): clubhead speed ~113 mph, ball speed ~167 mph, smash factor ~1.48, carry ~275 yd, total driving distance commonly reported in the high-290s to ~300 yd in recent seasons.","LPGA Tour driver averages: clubhead speed ~94 mph, ball speed ~135 mph, smash factor ~1.44, carry ~218 yd.","PGA Tour 7-iron averages: clubhead speed ~90 mph, ball speed ~120 mph, smash factor ~1.33, carry ~172 yd. Flightglass at the same delivery (90 mph, 30° dynamic loft, -3° attack, so 33° spin loft) measures ball speed 122.56 mph, smashEff 1.3618 and carry 174.00 yd — carry within about 2 yd of the tour average, with the engine's smash running roughly 0.03 hot, which is the same upward bias it shows on the driver.","Recreational golfer benchmarks (commonly cited launch-monitor aggregates): men ~90-93 mph, women ~70-75 mph driver clubhead speed — roughly 20% slower than the PGA Tour average (Wolfram-verified: (113-93)/93 = 21.5%).","World Long Drive competitors: clubhead speeds of 145-155+ mph, with recorded peaks over 150 mph (e.g. Kyle Berkshire) and ball speeds over 220 mph.","Physics ceiling: the legal clubface coefficient-of-restitution limit (USGA/R&A, 0.830) combined with a ~200g driver head and a 45.93g ball (USGA max) caps theoretical smash factor around 1.49 ((1+0.83)/(1+0.04593/0.200) = 1.488) — Tour pros' ~1.48 average is already right up against that wall. Flightglass's measured driver smash of 1.5084 sits just outside it: a known, small optimism in the model rather than a physical claim."],"scenarios":["Two golfers deliver the club identically (same dynamic loft and attack angle, so the same smash factor) but one swings 90 mph and the other 113 mph. Measured on the driver preset, ball speed goes 135.75 -> 170.44 mph: a 23 mph club-speed gap becomes a 34.7 mph ball-speed gap, because the smash factor multiplies the gap rather than widening it on its own (1.5084 at both speeds).","A golfer buys a driver marketed for 'more clubhead speed' and gains 3 mph on the radar — but starts delivering the face with more loft relative to the attack angle. In the engine that shows up as spin loft, and spin loft is the only thing that can lower smash: 3 more mph is worth about +10.5 yd on the driver preset (113 -> 116 mph, 275.2 -> 285.7 yd), and it takes roughly 7-8° more spin loft to give it all back (measured break-even: 16.7° spin loft at 116 mph carries 275.2 yd again).","A player does a 6-8 week overspeed-training block and adds ~4 mph of 7-iron clubhead speed with no other swing changes — the engine shows what that alone is worth: 90 -> 94 mph at 33° spin loft moves carry from 174.00 to 184.57 yd, +10.6 yards.","A player swings 5 mph harder with a 7-iron but delivers a sloppier, more glancing strike. Measured break-even: 90 mph at 33° spin loft carries 174.0 yd, and 95 mph at 42° spin loft carries 173.5 yd — so in this model +5 mph is exactly cancelled by about +9° of spin loft. Below that, the extra speed still wins.","Long-drive territory shows the model's blind spot honestly: 150 mph at 30° spin loft still carries 366.7 yd against 337.1 yd for a flush 130 mph strike — the engine has no off-centre-strike input at all (only five inputs, none of them impact location), so 'speed without a centered strike is wasted' is a real-world truth this engine cannot express. Only spin loft can cost you smash here, and it takes 39.7° of it before a 150 mph swing loses to a flush 130 mph one — both land on 337.1 yd at that point. Past it the faster swing carries less, because smash has fallen to 1.307 while the flush strike keeps 1.508.","A junior or senior golfer with modest physical strength but excellent sequencing and lag can out-swing a bigger, stronger golfer with poor kinematic timing — clubhead speed is a technique number as much as a strength number. None of that biomechanics is modeled inside the engine; it only sets the number that arrives on the slider."],"whatItMeansForYou":"Club speed is the lever with the most raw headroom for distance — but it only becomes distance through the strike, and in this engine the strike is spin loft. For most recreational golfers, a realistic, well-earned gain is a handful of mph (3-5) from better sequencing/technique or a structured speed-training block — not the ~20 mph gap to Tour pros, and the engine says a 7-iron gain of 4 mph is worth about +10.6 yd of carry. Chase speed, but chase delivery alongside it: +5 mph on a 7-iron is fully cancelled by about +9° more spin loft (174.0 yd vs 173.5 yd, measured). And do not read the top end of the engine's carry curve as a physical statement — the carry fit is a parabola with no drag saturation, so it keeps accelerating forever; real flight does not."},"misconceptions":["\"Swinging as hard/fast as possible always means more distance.\" Half right in this model, and the half that is wrong matters. Flightglass's carry curve never tapers and never dips — it is a convex quadratic in ball speed (driver preset: 120 mph -> 300.0 yd, 130 mph -> 337.1 yd, with the yards-per-10-mph actually growing from 35.2 to 37.0) — so raw speed alone always pays here. What kills the max-effort swing is delivery, not speed: 90 mph at 33° spin loft carries 174.0 yd and 95 mph at 42° spin loft carries 173.5 yd. Swing harder if the delivery survives it.","\"Club speed and ball speed are basically the same number.\" False — ball speed is club speed multiplied by smash factor (roughly 1.20-1.51 in this engine depending on spin loft). But note what does not happen: the multiplier does not improve with speed. Sweeping the driver preset 70 -> 130 mph leaves smashEff at 1.5084 throughout, so the ball-speed gap between two swings is exactly the club-speed gap times a shared multiplier (23 mph of club speed -> 34.7 mph of ball speed), nothing more.","\"A slower swing off the tee is always more accurate.\" Not from the speed number alone — dispersion is governed mainly by face angle and club path, different nodes in the graph entirely, and club speed does not enter the start-direction calculation at all. Curvature is a different story: the same face-to-path gap curves far more at speed, because the ball is in the air longer under the same sideways force — on the driver preset with a 7° face-to-path gap, the engine curves the ball 17.7 yd at 80 mph against 101.2 yd at 140 mph. Tour pros swinging 113+ mph are also extremely accurate; dispersion tends to rise mainly when someone swings beyond their own repeatable technical limit.","\"Only strength/size determines swing speed.\" Sequencing and release timing (lag) matter enormously — lighter, smaller golfers with excellent kinematic sequencing regularly out-swing bigger, stronger golfers with poor sequencing. Documented speed-training gains (+3-5 mph typical) also show trainable improvement independent of raw muscle mass. This is biomechanics literature, not engine output: the engine takes club speed as a given and models nothing upstream of it.","\"Faster equipment (longer/lighter shafts) is a free speed upgrade.\" Shaft and clubhead tuning yields a modest few mph at best (~1-3 mph) and can cost control and delivery quality if mismatched. In the engine, the only way equipment can cost you ball speed is by changing dynamic loft relative to attack angle — spin loft is the single input smash factor reads.","\"There's no physical ceiling on smash factor if you strike it perfectly.\" False in the real world — the clubface's coefficient of restitution is legally capped at 0.830 by the USGA/R&A, which combined with the ball-to-clubhead mass ratio gives ((1+0.83)/(1+0.04593/0.200)) = 1.488, so ~1.49 for a driver. Worth knowing: Flightglass's own numbers sit just above that. Its clamp is 1.52 and its measured driver strike is 1.5084 at 9° spin loft, so if you use the engine to reason about elite ball speed, subtract a little."],"wolframChecks":["113 mph -> 50.52 m/s; 90 mph -> 40.23 m/s; 167 mph -> 74.66 m/s; 120 mph -> 53.64 m/s — unit conversions anchoring every mph benchmark quoted.","(113/90)^2 = 157.6% -> a 25.6% clubhead-speed gap (90->113 mph) becomes a 57.6% kinetic-energy gap; KE = 0.5x0.2kgx50.5155^2 = 255.18 J vs 0.5x0.2kgx40.2336^2 = 161.87 J, ratio 1.5764 — confirms energy scales with speed squared even though ball speed scales exactly linearly with club speed in this engine (the smash multiplier is speed-independent).","Smash-factor physics ceiling: (1+COR)/(1+m_ball/m_club) = (1+0.83)/(1+0.04593/0.200) = 1.488 — the USGA/R&A legal COR limit (0.830) with a ~200g driver head and a 45.93g ball puts the real ceiling near 1.49, matching PGA Tour driver smash (~1.48). The engine's measured driver smash of 1.5084 is ABOVE this ceiling — the model is slightly optimistic, and the earlier claim that it 'lands inside the 1.48-1.50 tour range' was wrong.","Engine cross-check: 113 mph x 1.48 = 167.24 mph -> matches the commonly cited PGA Tour driver ball-speed average (~167 mph). Flightglass at 113 mph on the driver preset returns 170.44 mph, about 3 mph hot for exactly the smash reason above.","94 mph x 1.44 = 135.36 mph -> matches the commonly cited LPGA Tour driver ball-speed average (~135 mph).","PGA Tour 7-iron average is ~90 mph -> ~120 mph ball speed (smash ~1.33). Flightglass at 90 mph, dynamic loft 30°, attack -3° (spin loft 33°) measures ballSpeed 122.56 mph, smashEff 1.3618 and carry 174.00 yd against the ~172 yd tour average — carry within ~2 yd, smash ~0.03 hot.","(113-93)/93 = 21.51% -> PGA Tour pros swing the driver roughly 20% faster than commonly cited recreational-golfer averages (~93 mph).","Engine sweep (driver preset, dynamic loft 13°, attack +4°, spin loft 9°, measured with solveFlight()): club speed 70/90/110/113/120/130 mph -> smashEff 1.5084 at EVERY speed -> ball speed 105.59/135.75/165.92/170.44/181.00/196.09 mph -> carry 142.6/200.0/264.9/275.2/300.0/337.1 yd -> backspin 1190/1530/1869/1920/2039/2209 rpm. Carry never peaks and never declines: the fit (0.9206 x ballSpeed + 0.004072 x ballSpeed^2) is a convex quadratic with no drag term, so it is strictly increasing at every ball speed.","Engine sweep (7-iron preset, dynamic loft 30°, attack -3°, spin loft 33°, smashEff 1.3618): club speed 60->110 mph in 10 mph steps -> carry 102.4/124.8/148.6/174.0/200.9/229.3 yd, deltas +22.4, +23.9, +25.4, +26.9, +28.4 yd per +10 mph. The marginal yards per mph GROW with speed in this model — the opposite of the drag-saturation story often told about real flight, and a direct consequence of the parabolic carry fit.","Formula check: smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, clamped to 1.15-1.52 depends only on spin loft — not on club speed and not on which club preset is selected (the 'club' field is echoed back but never used). Confirmed two ways: by reading impact-flight.js, and by the constant 1.5084 across the whole 70-130 mph driver sweep above. The 1.52 ceiling is only reached below 6.34° of spin loft and the 1.15 floor needs 56.1°.","Delivery break-even, measured: 90 mph at 33° spin loft carries 174.00 yd; 95 mph at 42° spin loft carries 173.53 yd. +5 mph of club speed is cancelled by about +9° of spin loft."],"quiz":[{"q":"In Flightglass's engine, what is club speed's one direct output in the dependency graph?","options":["Backspin, directly","Ball speed, via the smash factor (ballSpeed = clubSpeed x smashEff)","Carry, directly","Launch angle"],"answerIndex":1,"explanation":"Club speed has a single outgoing edge in the app's dependency graph: club-speed -> ball-speed. The engine formula is literal: ballSpeed = clubSpeed x smashEff. Everything else you feel downstream (backspin, carry, apex...) is built on ball speed, not on club speed directly."},{"q":"A golfer raises clubhead speed from 90 to 113 mph — a ~25.6% increase. What happens to the kinetic energy in the clubhead at impact?","options":["Also rises about 25% (linear)","Rises about 58%, because kinetic energy scales with speed squared","Stays the same — smash factor cancels it out","Falls, because faster swings are less efficient"],"answerIndex":1,"explanation":"Energy = 1/2 m v^2, so it scales with the square of speed. Wolfram-verified: 0.5 x 0.2kg x 50.5155^2 m/s = 255.18 J at 113 mph vs 0.5 x 0.2kg x 40.2336^2 m/s = 161.87 J at 90 mph — a 57.6% jump in energy from a 25.6% jump in speed, matching (113/90)^2 = 157.6%. This is why 'a little more speed' is disproportionately hard to add, and why realistic training targets are a few mph, not tens of mph."},{"q":"Real PGA Tour average driver numbers are roughly clubhead speed 113 mph and ball speed 167 mph. What smash factor does that imply, and what caps it physically?","options":["~1.48, capped near there by the legal clubface COR limit (0.830) and the ball-to-clubhead mass ratio","~2.0, capped by ball dimples","~1.0, capped by club length","~3.5, uncapped"],"answerIndex":0,"explanation":"167.24 / 113 = 1.48. That's close to the physics ceiling: with the USGA/R&A's legal coefficient-of-restitution limit (0.830) and a ~200g driver head against a 45.93g ball, the formula (1+COR)/(1+m_ball/m_club) gives a theoretical max smash factor around 1.49 — Tour pros are already swinging right up against that legal/physical wall."},{"q":"In Flightglass's engine, sweeping club speed from 120 to 130 mph on a driver-shaped strike (spin loft 9°) moves carry from 300.0 to 337.1 yd — and the previous 10 mph step was worth only 35.2 yd. Why does each extra 10 mph buy MORE yards, not fewer?","options":["Because smash factor improves as the swing gets faster","Because the carry fit is a parabola in ball speed (0.9206 x ballSpeed + 0.004072 x ballSpeed^2) with no drag-saturation term at all","Because backspin drops to zero at high speed","Because attack angle changes with club speed"],"answerIndex":1,"explanation":"The carry formula is a parabola through the origin, so its slope grows with ball speed forever: the yards per +10 mph go 31.5 / 33.3 / 35.2 / 37.0 across the 90-130 mph driver sweep. It is not smash factor — the sweep returns smashEff 1.5084 at every one of those speeds, because spin loft is the only input smash reads. Real ball flight does flatten out as drag grows; this fit does not model that, so treat the far end of the curve as an artifact of the model rather than a physical claim."},{"q":"Why is a driver's smash factor (~1.48) so much higher than a wedge's (~1.20-1.25)?","options":["Drivers are swung faster, and faster swings always have higher smash factor","Spin loft — the driver's low spin loft (~9-15°) makes for a flush, minimally-glancing strike near the physics ceiling; the wedge's high spin loft (~45-51°) is inherently more glancing, which the engine models directly as smashEff falling with spin loft","The wedge's ball is heavier","Smash factor is not related to club type"],"answerIndex":1,"explanation":"The engine states this directly: smashEff = 1.544034 - 0.0033788 x spinLoft - 0.000064966 x spinLoft^2, clamped to 1.15-1.52. A driver's low spin loft keeps the strike close to flush (measured 1.5084 at 9° spin loft — in fact a shade above the ~1.49 real physics ceiling, so the engine is slightly generous here); a wedge's high spin loft is a much more glancing blow (measured 1.2027 at 51°), which the formula — and real launch-monitor data — shows as a lower smash factor. It's about strike geometry, not swing speed: the same formula returns the same 1.5084 whether the driver swings 70 mph or 130 mph."}]}

  <script type="application/json" id="lesson-dynamic-loft">{"parameter":"Dynamic Loft","oneLiner":"Dynamic loft is the loft the clubface actually delivers at the instant of impact — not the number stamped on the sole — and in this engine it feeds two channels at once: how high the ball launches, and how much spin loft (and therefore backspin, and therefore lost ball speed) the strike carries.","whatItIs":"Every club has a static loft milled into its face — 10.5° on a driver, 34° on a 7-iron, 58° on a lob wedge. Dynamic loft is different: it's what the face is actually doing in the roughly half-millisecond it touches the ball, after shaft lean and wrist condition have had their say. Lean the shaft forward (hands ahead at impact) and the whole clubhead — face included — rotates forward too, subtracting loft; lean it back and loft comes back. Bow or flatten the lead wrist and the face rotates down (de-lofts) even with a neutral shaft; cup or extend it and loft is added back. So the same 7-iron, swung by two different players, can deliver two genuinely different dynamic lofts — and a launch monitor measures this delivered number, not the one on the spec sheet. In the app, dynamic loft is one of five true 'Fundamentals' — a root input the golfer sets directly, with no upstream formula feeding it — and it does two big jobs downstream: it feeds launch angle through a curved fit — it carries a loft² term — whose steepness depends on how much loft you already have, and, paired with attack angle, it sets the vertical half of spin loft, the engine's master lever for backspin.","components":[{"name":"Static loft (the number on the sole)","role":"The baseline every other lever adjusts. Fixed the moment a club is picked — driver, iron or wedge — and by far the biggest single swing available across a bag.","typicalRange":"driver ~9-13°, mid-iron (7i) ~28-34°, pitching wedge ~44-48°, lob wedge ~58-60°"},{"name":"Shaft lean (forward press / hand position at impact)","role":"Leaning the shaft toward the target rotates the whole clubhead — face included — forward, subtracting from static loft; leaning it back gives loft back. The main lever a coach or fitter is watching when they talk about 'delofting'.","typicalRange":"tour irons commonly deliver several degrees less than stamped loft; club-fitting rule of thumb ~3-4° deloft per inch of forward hand shift on a full iron shot (industry estimate)"},{"name":"Wrist condition (bowed/flat vs cupped/extended lead wrist)","role":"Independent of shaft lean: a bowed/flexed lead wrist rotates the face down (de-lofts) even with a neutral shaft; a cupped/extended wrist adds loft back. The mechanical difference between a compressed 'pro' strike and a scoopy amateur miss.","typicalRange":"a few degrees either way; extreme cupping can add 5°+ of unwanted loft (and spin) versus a flat-wrist strike"},{"name":"Attack angle (its constant companion, not a source of it)","role":"Does not change dynamic loft at all — they are independent engine inputs — but combines with it downstream: on a square strike spin loft is dynamicLoft − attackAngle, and a face-to-path gap adds to it. Reading this as subtraction, not addition, is the key to the whole engine.","typicalRange":"iron -6° to -2° (down), driver -2° to +5° (up)"},{"name":"Smash factor / ball speed (what raising it costs)","role":"Not a source of dynamic loft, but the price of raising it: more dynamic loft raises spin loft, and the engine's smash factor falls as spin loft rises through a curved, non-linear falloff (smashEff = 1.544034 − 0.0033788·spinLoft − 0.000064966·spinLoft², held inside a 1.15-1.52 band), quietly trimming ball speed.","typicalRange":"measured in the engine: smash 1.4190 at 25° of spin loft, 1.3618 at 33°, 1.3049 at 40°. The 1.52 ceiling only bites below 6.34° of spin loft (driver territory) and the 1.15 floor needs 56.1°, so a full iron never sits on either limit."},{"name":"Strike location / face curvature (vertical gear effect, mainly drivers)","role":"A driver face is curved top-to-bottom ('roll'); a strike high or low on the face meets a slightly different loft than a center strike, on top of the usual smash-factor penalty of an off-center hit.","typicalRange":"roughly ±1-3° of effective loft shift high-face vs low-face on a driver, EST/illustrative"}],"howTheyConnect":"Dynamic loft is set once, in the roughly half-millisecond of contact, by three things stacking together: the club's static (stamped) loft, how far forward or back the shaft leans through the ball, and whether the lead wrist is flexed (bowed/flat — rotates the face down, reduces loft) or extended (cupped — rotates it up, adds loft). Nothing in the engine derives dynamic loft from anything else — it is one of five true 'Fundamentals' inputs (with club speed, attack angle, face angle and club path) the golfer delivers directly; everything downstream is computed from it. Two channels matter most. First, launch angle: launchAngle = 10.3919·min(dynamicLoft/10, 1) − 0.16938·dynamicLoft + 0.012025·dynamicLoft² + 0.25·attackAngle. That loft term is a CURVE, not a straight line, and the curvature is the whole story — the engine's own presets read 11.22° of launch for the Driver preset (13°/+4°), 15.38° for the 7-iron preset (30°/−3°) and 26.79° for the Wedge preset (46°/−5°). Because the loft term carries that loft² piece, one extra degree of loft is worth very different amounts depending on where you already are: measured by stepping the engine one degree at a time at −3° attack, +1° of dynamic loft adds only 0.11° of launch at 11°, 0.16° at 13°, 0.56° at 30° and 0.95° at 46°. Attack angle's weight, by contrast, is a flat 0.25° per degree at every loft — measured identical at 9°, 30° and 46°. So the two levers cross near 17.4° of dynamic loft: below that a degree of attack angle moves launch more than a degree of loft; above it loft takes over and keeps pulling away. This is a statement about the marginal degree only — attack angle's own effect never changes size. Second, dynamic loft is the larger contributor to spin loft — the three-dimensional angle between where the face points and where the club is travelling, which with a square face is exactly dynamicLoft − attackAngle, and which a face-to-path gap widens a little further. Because attack angle never changes dynamic loft itself (they are independent, sibling inputs), raising loft always raises spin loft degree-for-degree, which raises backspin and quietly trims ball speed through the spin-loft-responsive smash factor. That trade-off is why adding loft doesn't reliably add carry: at a 90 mph 7-iron swing (attack −3°), moving dynamic loft from 25° to 33° raises backspin from 4,835 to 7,716 rpm, but smash falls from 1.3985 to 1.3382, ball speed from 125.86 to 120.44 mph, and carry actually drops from 180.4 to 169.9 yd in the engine — loft bought a taller shot (apex 29.38 → 32.18 yd), not a longer one. Push on to 40° and it keeps going the wrong way: 9,000 rpm (the readout ceiling), 115.08 mph, 159.9 yd. There is a turning point, though, and it sits low: sweeping loft at that same 90 mph / −3° delivery, carry peaks at about 16° of dynamic loft (190.6 yd) and falls on both sides — 177.2 yd at 9°, 190.6 at 16°, 174.0 at 30°. Extra club speed does not rescue high loft either: holding the 7-iron delivery at 30°/−3° and raising club speed, carry runs 174.0 yd at 90 mph, 200.9 at 100, 229.3 at 110 and 259.2 at 120 — each extra 10 mph buys slightly MORE than the last (26.9, then 28.4, then 29.9 yd), so there is no drag saturation flattening the top end in this engine. There is a third, smaller channel: dynamic loft also tilts the loft-dependent face-weight taper that blends start direction (startFaceW = clamp(0.90 − 0.005·dynamicLoft, 0.60, 0.88)) — a low-lofted driver lets face angle govern start line more, a high-lofted wedge lets path govern more, which is part of why 'start line' coaching cues differ so much between driver and wedge. You can read that weight straight off the engine: at 30° of dynamic loft it is 0.75, and sure enough a 2° open face on a 0° path starts the ball 1.50° right — exactly 0.75 x 2 — while the same 2° open face at 46° of loft starts it only 1.34° right.","hierarchy":[{"driver":"Club selection / static (stamped) loft","weight":"Dominant — a ~50° range across a full bag (driver ~9-13° to a lob wedge ~58-60°) that swamps every other lever. Swapping the app's Driver preset (13°/+4°) for its Wedge preset (46°/-5°) alone moves engine launch from 11.22° to 26.79°.","why":"This one-time choice sets the baseline every other lever only nudges by a handful of degrees. No amount of hand position or wrist condition turns a driver into a wedge."},{"driver":"Shaft lean at impact (hands ahead of the ball / forward press)","weight":"Large within one club — commonly several degrees of deloft on a full shot; club-fitting rules of thumb put it near ~3-4° of loft reduction per inch of forward hand shift (industry estimate, not lab-measured here).","why":"This is the main thing a coach or fitter is watching when they say a player 'delofts' the club. It's the biggest lever actively trained within one club, and why identical clubs in different hands deliver different dynamic lofts."},{"driver":"Wrist condition at impact (bowed/flat vs cupped/extended lead wrist)","weight":"Secondary but real — a few degrees either way; extreme cupping can add 5°+ of loft (and, through spin loft, real backspin) versus a flat or bowed strike.","why":"Independent of shaft lean: a bowed wrist de-lofts even with a neutral shaft, while a cupped wrist adds loft back. It's why a 'compressed' tour strike and a 'scoopy' amateur strike can share a setup but deliver very different dynamic loft."},{"driver":"Strike location / face curvature (vertical gear effect, mainly drivers)","weight":"Smallest of the four — roughly ±1-3° of effective loft shift high-face vs low-face on a driver (EST/illustrative), on top of the usual smash-factor penalty o
