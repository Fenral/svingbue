# Codemagic iOS workflow for Flightglass — NATIVE (svingbue) build.
#
# Wraps the static web app (index/geometry/impact + geo3d/vendor/assets)
# in a Capacitor 7 iOS shell, landscape-locked, and ships it to TestFlight
# on the existing App Store record (ASC Apple ID 6768449250, bundle
# no.strikearc.app, team PL9G26C26C). This build supersedes the React/Vite
# strikearc-3.0 build on TestFlight — chosen by Sivert 2026-07-03.
#
# Signing — PINNED IDENTITY (changed 2026-08-10, see incident note below):
#   ios_signing below references two NAMED Codemagic code-signing
#   identities instead of the old "regenerate + revoke everything + create"
#   flow. Both must exist in Codemagic → Team settings → Code signing
#   identities (iOS certificates / iOS provisioning profiles) BEFORE this
#   workflow can build:
#     - certificate:         flightglass_distribution_20260810
#     - provisioning profile: flightglass_appstore_20260810
#   Uploading/creating those is an owner-only, 2FA-gated step (Apple
#   Developer + Codemagic dashboard) — not something CI or an agent can do.
#
#   INCIDENT NOTE (2026-08-10): the previous version of this workflow
#   generated a brand-new local private key on every single build, then
#   force-revoked ALL Distribution certs on the team (via
#   `app-store-connect certificates delete`) before creating a fresh one
#   (`fetch-signing-files --create`). Apple's Distribution-certificate quota
#   (max 2) is TEAM-WIDE, not per-app — so every svingbue/Flightglass build
#   was silently revoking whichever certs currently occupied those 2 slots,
#   including ones belonging to OTHER apps under team PL9G26C26C (e.g.
#   babyora_distribution, used by the unrelated Babyora app). That's the
#   most likely explanation for babyora_distribution showing as
#   invalid/revoked, and for intermittent "already have a current
#   Distribution certificate or a pending certificate request" failures
#   here (the revoke step and Apple's create-cert call can race, or a
#   half-finished CSR can leave the account looking "full"). Because the
#   key was generated fresh inside an ephemeral Codemagic build VM and
#   never persisted anywhere, neither of the two certs Apple currently
#   shows as active has a recoverable private key — they cannot be reused,
#   only replaced. Pinning to a named, Codemagic-persisted identity (this
#   change) stops future builds from touching the shared team-wide cert
#   pool at all.
#
# Setup status:
#   1. ASC API key integration `ryddy-asc-key` (Key JQVPW4D944) — ✅ reused
#      (still used for the TestFlight publish step + build-number lookup).
#   2. GitHub repo Fenral/svingbue connected as iOS app — ✅ done.
#   3. App record no.strikearc.app (Apple ID 6768449250) — ✅ already exists.
#   4. flightglass_distribution_20260810 / flightglass_appstore_20260810
#      code-signing identities in Codemagic — ⏳ owner must create/upload
#      (see incident note above). Until then this workflow will fail fast
#      at the signing step instead of silently touching other apps' certs.

definitions:
  bundle_id: &bundle_id no.strikearc.app
  team_id: &team_id PL9G26C26C

workflows:
  ios-testflight:
    name: Flightglass — iOS TestFlight (native)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Reuses the existing team-level App Store Connect API key
      # `ryddy-asc-key` (Key ID JQVPW4D944) — same key that already signs +
      # publishes strikearc, strikearc-3.0, wool-app and ryddy for team
      # PL9G26C26C. Used here for the TestFlight publish step and the
      # latest-build-number lookup (NOT for cert creation any more).
      app_store_connect: ryddy-asc-key

    environment:
      # ios_signing lives here, nested under environment — Codemagic's
      # schema rejects it as a top-level workflow key ("extra fields not
      # permitted"). Verified live against Codemagic's own validator
      # 2026-08-10 after the first push failed silently (no build queued).
      ios_signing:
        certificates:
          - flightglass_distribution_20260810
        provisioning_profiles:
          - flightglass_appstore_20260810
      vars:
        BUNDLE_ID: *bundle_id
        APP_STORE_APPLE_ID: 6768449250   # existing ASC app id; do not migrate
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20
      xcode: latest
      cocoapods: default

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Assemble www/ from web source (denylist mocks/tooling)
        script: |
          npm run copy-web

      # ios/ is never committed (Windows dev machine can't generate it —
      # needs Xcode/CocoaPods), so every CI run creates it fresh here.
      - name: Add the iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync web assets + plugins into the iOS project
        script: |
          npx cap sync ios

      - name: Patch Info.plist for portrait-default orientation + display name
        script: |
          # Must run AFTER cap sync (cap add/sync own Info.plist). Idempotent.
          node scripts/ios-landscape.mjs

      - name: Inject Info.plist export-compliance answer
        script: |
          # Auto-answer Apple's "Missing Compliance" question. Flightglass only
          # uses HTTPS via system APIs + Web Audio, which are exempt per
          # 740.17(b)(1) of the US Export Administration Regulations. ios/ is
          # gitignore'd + regenerated each run, so the injection lives here.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          echo "✓ ITSAppUsesNonExemptEncryption=false injected."

      - name: Generate app icons/splash from resources/
        script: |
          # resources/icon.png (1024²) + resources/splash.png (2732²) are the
          # sources — capacitor-assets fans them out to every iOS size after
          # the platform exists.
          npx capacitor-assets generate --ios --iconBackgroundColor "#07060C"

      - name: CocoaPods install
        script: |
          # Capacitor 7 iOS uses CocoaPods; the build targets the WORKSPACE.
          # cap sync already runs pod install, but do it explicitly for safety.
          cd ios/App && pod install

      - name: Set marketing version from package.json
        script: |
          cd ios/App
          VERSION=$(node -p "require('../../package.json').version")
          echo "Setting marketing version to $VERSION"
          agvtool new-marketing-version "$VERSION"

      - name: Set build number (one above latest TestFlight build)
        script: |
          # This Codemagic app's build counter is independent of strikearc-3.0's,
          # so a fixed offset can't guarantee we beat the existing highest
          # CFBundleVersion on no.strikearc.app. Query ASC for the latest and
          # add 1 — bulletproof regardless of which pipeline built last.
          set +e
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null)
          set -e
          if ! printf '%s' "$LATEST" | grep -Eq '^[0-9]+$'; then
            echo "Could not read latest build number (got '$LATEST') — falling back to 0."
            LATEST=0
          fi
          NEXT=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST → setting CFBundleVersion=$NEXT"
          cd ios/App
          agvtool new-version -all "$NEXT"

      # NOTE: no manual "Initialize keychain" / "Generate certificate private
      # key" / "Revoke old Distribution certs" / "Fetch signing files" / "Add
      # certificates to keychain" steps any more — the `ios_signing:` block
      # above makes Codemagic install the named certificate + profile into
      # the build keychain automatically, before scripts run, without
      # touching any other cert on the team.

      - name: Use profiles in Xcode project
        script: |
          # Limit signing mutation to the generated app project. Without an
          # explicit project, Codemagic recursively scans the checkout and can
          # apply profiles to dependency projects under node_modules instead.
          # (carried over from agent/revenuecat-499 commit c4e79c1, 2026-08-10)
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build .ipa
        script: |
          # Keep the full archive output as an artifact and surface the first
          # actionable Xcode errors directly in the Codemagic build log.
          # (carried over from agent/revenuecat-499 commit c4e79c1, 2026-08-10)
          set -o pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            2>&1 | tee /tmp/xcodebuild_logs/build-ipa-console.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo "--- actionable Xcode errors ---"
            grep -inE '(^|[^a-z])(error:|failed:|provisioning profile|signing certificate|code signing)' \
              /tmp/xcodebuild_logs/*.log 2>/dev/null || true
            echo "--- end actionable Xcode errors ---"
            exit "$build_status"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM.zip

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add a beta group name here once one exists in App Store Connect:
        # beta_groups:
        #   - "Internal Testers"
        expire_build_submitted_for_review: false
