# Codemagic iOS workflow for Flightglass — NATIVE (svingbue) build.
#
# Wraps the v1 Home/Range/Studio/Guide package in a Capacitor 7 iOS shell
# and ships a manually triggered, verified build to TestFlight
# on the existing App Store record (ASC Apple ID 6768449250, bundle
# no.strikearc.app, team PL9G26C26C). This build supersedes the React/Vite
# strikearc-3.0 build on TestFlight — chosen by Sivert 2026-07-03.
#
# Signing/publish machinery mirrors the proven strikearc-3.0 pipeline
# (same app record, same ryddy-asc-key), adapted for the static-web +
# landscape + CocoaPods (Capacitor 7 → .xcworkspace) shape of svingbue.
#
# Setup status:
#   1. ASC API key integration `ryddy-asc-key` (Key JQVPW4D944) — ✅ reused.
#   2. GitHub repo Fenral/svingbue connected as iOS app — ✅ done.
#   3. App record no.strikearc.app (Apple ID 6768449250) — ✅ already exists.
#   4. RevenueCat public key + store offering — required before this workflow.
#   → Manual-only; the workflow fails closed when billing is not configured.

definitions:
  bundle_id: &bundle_id no.strikearc.app
  team_id: &team_id PL9G26C26C

workflows:
  ios-testflight:
    name: Flightglass — iOS TestFlight (native)
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      # Reuses the existing team-level App Store Connect API key
      # `ryddy-asc-key` (Key ID JQVPW4D944) — same key that already signs +
      # publishes strikearc, strikearc-3.0, wool-app and ryddy for team
      # PL9G26C26C. Codemagic injects key/issuer/key-id for both signing
      # and the TestFlight publish step; no secrets live in this file.
      app_store_connect: ryddy-asc-key

    environment:
      # Fetch one persistent, uploaded Apple Distribution certificate and its
      # matching App Store profile. The workflow never creates or revokes team
      # certificates during a build.
      ios_signing:
        distribution_type: app_store
        bundle_identifier: *bundle_id
      groups:
        # Create this Codemagic group with the public
        # REVENUECAT_IOS_PUBLIC_SDK_KEY value from Flightglass in RevenueCat.
        - revenuecat-flightglass
      vars:
        BUNDLE_ID: *bundle_id
        APP_STORE_APPLE_ID: 6768449250   # existing ASC app id; do not migrate
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 24
      # Apple requires the iOS 26 SDK for uploads after 28 April 2026. Pin the
      # accepted toolchain so a release cannot silently change under us.
      xcode: 26.6
      cocoapods: default

    scripts:
      - name: Install npm dependencies
        script: |
          npm ci

      - name: Verify shipping source and native release contracts
        script: |
          npm run verify:v1:source

      - name: Assemble www/ from web source (denylist mocks/tooling)
        script: |
          npm run copy-web

      - name: Inject and verify the RevenueCat iOS public key
        script: |
          npm run configure:iap:ios
          npm run verify:iap:ios

      # ios/ is never committed (Windows dev machine can't generate it —
      # needs Xcode/CocoaPods), so every CI run creates it fresh here.
      - name: Add the iOS platform
        script: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Sync web assets + plugins into the iOS project
        script: |
          npx cap sync ios

      - name: Patch iOS orientation, display name, and minimum OS
        script: |
          # Must run AFTER cap sync (cap add/sync own Info.plist). Idempotent.
          node scripts/ios-landscape.mjs

      - name: Inject Info.plist export-compliance answer
        script: |
          # Auto-answer Apple's "Missing Compliance" question. Flightglass only
          # uses HTTPS via system APIs + Web Audio, which are exempt per
          # 740.17(b)(1) of the US Export Administration Regulations. ios/ is
          # gitignore'd + regenerated each run, so the injection lives here.
          PLIST="ios/App/App/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSAppUsesNonExemptEncryption" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST"
          echo "✓ ITSAppUsesNonExemptEncryption=false injected."

      - name: Generate app icons/splash from resources/
        script: |
          # resources/icon.png (1024²) + resources/splash.png (2732²) are the
          # only sources. The project-owned generator writes the universal iOS
          # catalogs after the platform exists and then verifies their pixels.
          node scripts/generate-ios-assets.mjs

      - name: Verify generated app icons/splash
        script: |
          node scripts/verify-generated-ios-assets.mjs

      - name: CocoaPods install
        script: |
          # Capacitor 7 iOS uses CocoaPods; the build targets the WORKSPACE.
          # cap sync already runs pod install, but do it explicitly for safety.
          cd ios/App && pod install

      - name: Set marketing version from package.json
        script: |
          cd ios/App
          VERSION=$(node -p "require('../../package.json').version")
          echo "Setting marketing version to $VERSION"
          agvtool new-marketing-version "$VERSION"

      - name: Set build number (one above latest TestFlight build)
        script: |
          # This Codemagic app's build counter is independent of strikearc-3.0's,
          # so a fixed offset can't guarantee we beat the existing highest
          # CFBundleVersion on no.strikearc.app. Query ASC for the latest and
          # add 1 — bulletproof regardless of which pipeline built last.
          LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID")
          if ! printf '%s' "$LATEST" | grep -Eq '^[0-9]+$'; then
            echo "Could not read a numeric latest TestFlight build number; refusing an ambiguous upload."
            exit 1
          fi
          NEXT=$((LATEST + 1))
          echo "Latest TestFlight build: $LATEST → setting CFBundleVersion=$NEXT"
          cd ios/App
          agvtool new-version -all "$NEXT"

      - name: Initialize keychain
        script: |
          keychain initialize

      - name: Add certificates to keychain
        script: |
          keychain add-certificates

      - name: Use profiles in Xcode project
        script: |
          # Limit signing mutation to the generated app project. Without an
          # explicit project, Codemagic recursively scans the checkout and can
          # apply profiles to dependency projects under node_modules instead.
          xcode-project use-profiles --project ios/App/App.xcodeproj

      - name: Build .ipa
        script: |
          # Keep the full archive output as an artifact and surface the first
          # actionable Xcode errors directly in the Codemagic build log.
          # `xcode-project` also writes its own detailed logs under /tmp.
          set -o pipefail
          mkdir -p /tmp/xcodebuild_logs
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME" \
            2>&1 | tee /tmp/xcodebuild_logs/build-ipa-console.log
          build_status=${PIPESTATUS[0]}
          if [ "$build_status" -ne 0 ]; then
            echo "--- actionable Xcode errors ---"
            grep -inE '(^|[^a-z])(error:|failed:|provisioning profile|signing certificate|code signing)' \
              /tmp/xcodebuild_logs/*.log 2>/dev/null || true
            echo "--- end actionable Xcode errors ---"
            exit "$build_status"
          fi

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM.zip

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        # Add a beta group name here once one exists in App Store Connect:
        # beta_groups:
        #   - "Internal Testers"
        expire_build_submitted_for_review: false
